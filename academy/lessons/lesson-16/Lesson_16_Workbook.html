<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 16 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 16 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Sustainable Change System</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Define the desired change</strong><small>What behavior or rhythm does the client want, and why does it matter now?</small><textarea id="change" rows="4"></textarea></label><label><strong>2. Map the complete loop</strong><small>Record cue, interpretation, emotion or body state, response, immediate reward, and long-term cost.</small><textarea id="loop" rows="4"></textarea></label><label><strong>3. Remove identity judgment</strong><small>Rewrite labels and absolutes as observable facts, frequency, context, and impact.</small><textarea id="observation" rows="4"></textarea></label><label><strong>4. Need and strategy</strong><small>Name the valid need and at least three possible strategies for meeting it.</small><textarea id="need" rows="4"></textarea></label><label><strong>5. Choice-point practice</strong><small>Create a brief pause, grounding option, and prepared next response.</small><textarea id="pause" rows="4"></textarea></label><label><strong>6. Environment design</strong><small>Reduce two points of friction and add one ethical decision point to the old pattern.</small><textarea id="environment" rows="4"></textarea></label><label><strong>7. Minimum, standard, and stretch</strong><small>Define three capacity-sensitive versions without punishment or compensation.</small><textarea id="versions" rows="4"></textarea></label><label><strong>8. Support architecture</strong><small>Identify encouragement, practical help, expertise, and consent-based accountability.</small><textarea id="support" rows="4"></textarea></label><label><strong>9. Setback review</strong><small>Use facts, function, friction, and forward choice to review a recent lapse.</small><textarea id="setback" rows="4"></textarea></label><label><strong>10. Recovery plan</strong><small>Write the exact minimum return, cue reset, support contact, and review threshold.</small><textarea id="return" rows="4"></textarea></label><label><strong>11. Monica case consultation</strong><small>Map her loop and redesign her routine, environment, measures, and return plan.</small><textarea id="monica" rows="4"></textarea></label><label><strong>12. Referral screen</strong><small>Identify safety, clinical, medical, addiction, eating, trauma, or impairment red flags and next steps.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
