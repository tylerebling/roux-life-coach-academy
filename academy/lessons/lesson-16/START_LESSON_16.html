const scenes=[{"kind": "teaching", "title": "Change that survives real life", "kicker": "ROUX LIFE ACADEMY · LESSON 16", "body": ["Behavior is shaped by context", "Small repetitions build evidence", "Setbacks provide information", "Returning is a trainable skill"], "narration": "Sustainable change is not flawless performance. It is a system the client can use in ordinary life, difficult weeks, and changing seasons. The coach helps the client observe behavior, understand context, design a realistic experiment, and learn how to return after disruption without turning one event into an identity verdict.", "lenses": [{"insight": "Behavior is shaped by context", "prompt": "What can the coach observe without judgment?"}, {"insight": "Small repetitions build evidence", "prompt": "What condition is shaping this pattern?"}, {"insight": "Setbacks provide information", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Returning is a trainable skill", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Understand behavior loops", "Design supportive conditions", "Coach setbacks without shame", "Build sustainable rhythm and review"], "narration": "We begin with how habits actually work. Then we examine cues, rewards, emotional regulation, environment, capacity, identity, and support. We will practice compassionate setback review, create recovery plans, distinguish coaching from treatment, and apply the complete Roux Life process to Monica's case.", "lenses": [{"insight": "Understand behavior loops", "prompt": "What can the coach observe without judgment?"}, {"insight": "Design supportive conditions", "prompt": "What condition is shaping this pattern?"}, {"insight": "Coach setbacks without shame", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Build sustainable rhythm and review", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "A habit is more than repeated action", "kicker": "BEHAVIOR INSIDE A SYSTEM", "body": ["A cue starts the sequence", "Meaning and emotion shape urgency", "A response produces a consequence", "Repetition makes the path easier to enter"], "narration": "A habit is a learned pattern that becomes easier to repeat under familiar conditions. It is not proof of virtue or defect. The same client may act differently across time, location, energy, relationship, and emotional state. Coaches look for the system surrounding behavior rather than reducing the person to discipline.", "lenses": [{"insight": "A cue starts the sequence", "prompt": "What can the coach observe without judgment?"}, {"insight": "Meaning and emotion shape urgency", "prompt": "What condition is shaping this pattern?"}, {"insight": "A response produces a consequence", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Repetition makes the path easier to enter", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Map the complete behavior loop", "kicker": "CUE · INTERPRETATION · STATE · RESPONSE · REWARD", "body": ["What happened immediately before?", "What did the client tell themselves?", "What feeling or body state appeared?", "What relief or reward followed?"], "narration": "A useful loop includes the external or internal cue, the client's interpretation, the emotional and physical state, the response, and the immediate reward. The long-term cost may be serious, yet the short-term reward explains why the behavior repeats. Understanding function is not the same as approving harm.", "lenses": [{"insight": "What happened immediately before?", "prompt": "What can the coach observe without judgment?"}, {"insight": "What did the client tell themselves?", "prompt": "What condition is shaping this pattern?"}, {"insight": "What feeling or body state appeared?", "prompt": "What client-owned experiment could create learning?"}, {"insight": "What relief or reward followed?", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Observation replaces character judgment", "kicker": "FROM ‘I AM’ TO ‘I NOTICE’", "body": ["Name the visible behavior", "Describe frequency and conditions", "Identify impact", "Leave room for another choice"], "narration": "Statements such as I am lazy, weak, or broken collapse behavior into identity. A coach helps the client say what actually happened: on three evenings after late meetings, I ordered food and skipped the walk I planned. Specific observation creates design possibilities. Shame usually narrows them.", "lenses": [{"insight": "Name the visible behavior", "prompt": "What can the coach observe without judgment?"}, {"insight": "Describe frequency and conditions", "prompt": "What condition is shaping this pattern?"}, {"insight": "Identify impact", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Leave room for another choice", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Describe the pattern", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement gives the coach the most useful information?", "options": ["I have no self-control", "After tense calls, I scroll for about forty minutes because it quickly reduces the pressure", "I always ruin everything"], "correct": 1, "feedback": ["A label hides the conditions and function.", "Correct. It identifies cue, behavior, duration, and immediate reward.", "An absolute judgment does not show what happened."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement gives the coach the most useful information?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Find the cue—not just the behavior", "kicker": "EXTERNAL AND INTERNAL STARTING POINTS", "body": ["Time, place, people, and objects", "Thoughts, memories, and anticipation", "Hunger, fatigue, pain, and activation", "Transitions and unfinished tasks"], "narration": "Cues can be obvious, such as entering the kitchen, or subtle, such as uncertainty before sending an email. Transitions are especially powerful: waking, arriving home, ending a call, or preparing for bed. Coaches ask what reliably comes before the pattern and avoid claiming certainty from one example.", "lenses": [{"insight": "Time, place, people, and objects", "prompt": "What can the coach observe without judgment?"}, {"insight": "Thoughts, memories, and anticipation", "prompt": "What condition is shaping this pattern?"}, {"insight": "Hunger, fatigue, pain, and activation", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Transitions and unfinished tasks", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Identify the immediate reward", "kicker": "WHAT DOES THE PATTERN DO RIGHT NOW?", "body": ["Relief from discomfort", "Connection or stimulation", "Certainty or control", "Escape from effort or exposure"], "narration": "A repeated behavior persists because something becomes easier, safer, calmer, more connected, or more stimulating in the short term. The reward may be emotional relief rather than pleasure. Coaches use curiosity: what does this give you in the moment? They do not shame the need underneath the strategy.", "lenses": [{"insight": "Relief from discomfort", "prompt": "What can the coach observe without judgment?"}, {"insight": "Connection or stimulation", "prompt": "What condition is shaping this pattern?"}, {"insight": "Certainty or control", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Escape from effort or exposure", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Distinguish need from strategy", "kicker": "HONOR THE NEED · EXPAND THE OPTIONS", "body": ["Rest is a need", "Avoiding every conversation is a strategy", "Connection is a need", "Constant availability is a strategy"], "narration": "Clients often confuse a legitimate need with the only strategy they know. Rest may be needed, while abandoning every commitment is one possible response. Safety may matter, while never expressing a preference is one strategy. Coaching helps clients honor the need and broaden available choices.", "lenses": [{"insight": "Rest is a need", "prompt": "What can the coach observe without judgment?"}, {"insight": "Avoiding every conversation is a strategy", "prompt": "What condition is shaping this pattern?"}, {"insight": "Connection is a need", "prompt": "What client-owned experiment could create learning?"}, {"insight": "Constant availability is a strategy", "prompt": "What would support a compassionate return?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Regulate before redesigning", "kicker": "STATE SHAPES CHOICE", "body": ["Pause and orient", "Name present sensation and emotion", "Use an appropriate grounding practice", "Choose when enough capacity returns"], "narration": "When activation is high, the client may have less access to flexible thinking. Within scope, a coach can invite a pause, slower breathing, contact with the room, or another client-approved grounding practice. Coaching is not trauma treatment. Severe symptoms, dissociation, crisis, or impaired functioning require qualified care.", "lenses": [{"i const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 16</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 16</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Habits, Setbacks, and Sustainable Change';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson16PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
</script><script src="../../academy/lesson-bridge.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/cloud.js"></script>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script>
  <script src="../../academy/guard.js"></script>
</body></html>
