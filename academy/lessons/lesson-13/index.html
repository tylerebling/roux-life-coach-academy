<script>
const scenes=[{"kind": "teaching", "title": "Transition asks for honesty before certainty", "kicker": "ROUX LIFE ACADEMY · LESSON 13", "body": ["Something has changed", "Something may be grieved", "Identity may feel unfinished", "A next step is still possible"], "narration": "Change interrupts the familiar. It can bring possibility, loss, relief, fear, freedom, or all of them together. Coaching does not remove uncertainty or hurry a client into a bright-side story. It helps the client recognize reality, honor meaning, uncover what matters now, and execute a proportionate next step while the larger chapter remains unfinished.", "lenses": [{"insight": "Begin with observable evidence of something has changed before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for something may be grieved without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect identity may feel unfinished to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate a next step is still possible into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Understand change and transition", "Honor grief and mixed emotion", "Tolerate uncertainty", "Rebuild identity through action"], "narration": "This lesson distinguishes the external event of change from the internal process of transition. We will explore visible and invisible loss, ambiguous endings, identity disruption, uncertainty, control, self-validation, values, support, routines, experimentation, setbacks, referral, and a complete case consultation.", "lenses": [{"insight": "Begin with observable evidence of understand change and transition before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for honor grief and mixed emotion without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect tolerate uncertainty to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate rebuild identity through action into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Change is an event; transition is a process", "kicker": "THE OUTSIDE AND THE INSIDE", "body": ["A role ends or begins", "Daily life reorganizes", "Meaning must be updated", "Adaptation unfolds over time"], "narration": "A move, promotion, breakup, graduation, diagnosis, retirement, or child leaving home can happen on a date. The internal transition rarely does. Habits, relationships, identity, expectations, and belonging must reorganize. Clients often judge themselves because the calendar changed faster than their inner world. Coaching normalizes process without diagnosing distress.", "lenses": [{"insight": "Begin with observable evidence of a role ends or begins before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for daily life reorganizes without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect meaning must be updated to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate adaptation unfolds over time into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Chosen change can still contain grief", "kicker": "GAIN AND LOSS CAN COEXIST", "body": ["Opportunity may be real", "Familiarity may be gone", "Gratitude may coexist with sadness", "No emotion cancels another"], "narration": "Clients may feel ashamed to grieve a promotion, marriage, desired pregnancy, relocation, or successful business growth. Every new chapter closes or changes something: routines, freedom, identity, community, competence, or predictability. Gratitude does not eliminate loss. Coaching helps clients hold a fuller truth rather than choosing one approved emotion.", "lenses": [{"insight": "Begin with observable evidence of opportunity may be real before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for familiarity may be gone without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect gratitude may coexist with sadness to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate no emotion cancels another into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Unwanted change can contain more than pain", "kicker": "DO NOT FORCE THE SILVER LINING", "body": ["Loss deserves respect", "Relief may also appear", "New capacity may emerge", "Meaning cannot be demanded"], "narration": "A layoff, divorce, health change, or estrangement may be deeply painful and may also create relief, clarity, or possibility. The coach does not search prematurely for a lesson. Meaning developed by the client can be valuable; meaning imposed by the coach can feel like dismissal. Begin with what is true today.", "lenses": [{"insight": "Begin with observable evidence of loss deserves respect before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for relief may also appear without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect new capacity may emerge to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate meaning cannot be demanded into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Hold both truths", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I wanted this promotion, so I should not feel sad.’ What is the strongest coaching response?", "options": ["Focus only on gratitude", "Explore what the opportunity gives and what the transition asks her to leave behind", "Tell her the sadness means the choice was wrong"], "correct": 1, "feedback": ["Forced gratitude can invalidate real loss.", "Correct. Gain and grief can coexist without canceling each other.", "Emotion alone does not determine whether a decision was wrong."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I wanted this promotion, so I should not feel sad.’ What is the strongest coaching response?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Create a four-part change inventory", "kicker": "ENDED · BEGAN · REMAINED · UNKNOWN", "body": ["Name what ended", "Identify what began", "Find what remains", "List what is still unknown"], "narration": "A transition becomes more workable when the client sorts reality into four categories. What ended? What began? What remains reliable? What is still unknown? This inventory prevents uncertainty from swallowing everything. It also reveals overlooked continuity—skills, values, relationships, routines, and choices that still belong to the client.", "lenses": [{"insight": "Begin with observable evidence of name what ended before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for identify what began without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect find what remains to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate list what is still unknown into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Loss includes more than people", "kicker": "VISIBLE AND INVISIBLE GRIEF", "body": ["Role and status", "Routine and place", "Future imagined", "Version of self"], "narration": "Clients can grieve a role, home, team, body capacity, expectation, future image, sense of safety, or version of themselves. Invisible losses are often difficult because others may not recognize them. Coaches can invite language and ritual, but they do not diagnose or clinically treat prolonged, traumatic, or severely impairing grief.", "lenses": [{"insight": "Begin with observable evidence of role and status before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for routine and place without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect future imagined to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate version of self into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Ambiguous loss has no clean edge", "kicker": "WHEN THE ENDING IS UNCLEAR", "body": ["A relationship changed but remains", "An answer may never come", "Hope and acceptance compete", "Closure cannot be manufactured"], "narration": "Some losses have no final moment: a friendship fades, a parent changes through illness, an opportunity remains uncertain, or a relationship exists without emotional availability. Clients may cycle between hope and acceptance. Coaching supports decisions in the present. It should not demand closure or claim to resolve complex grief.", "lenses": [{"insight": "Begin with observable evidence of a relationship changed but remains before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for an answer may never come without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect hope and acceptance compete to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate closure cannot be manufactured into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Identity disruption is part of transition", "kicker": "WHO AM I NOW?", "body": ["Old labels no longer fit", "Competence feels less certain", "Belonging may shift", "New identity needs lived evidence"], "narration": "Roles answer many identity questions: partner, leader, caregiver, athlete, employee, local, expert. When a role changes, the client may feel unrecognizable even when their deeper values remain. The coach separates role from whole person and helps the client generate new evidence through small, chosen behavior.", "lenses": [{"insight": "Begin with observable evidence of old labels no longer fit before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for competence feels less certain without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect belonging may shift to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate new identity needs lived evidence into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Honor what the old identity protected", "kicker": "RELEASE WITHOUT CONTEMPT", "body": ["It created belonging", "It organized responsibility", "It may have supported survival", "It may no longer fit"], "narration": "Clients sometimes try to move forward by shaming who they used to be. A more durable transition recognizes what the old identity made possible. The overachiever may have built security. The caretaker may have protected connection. Appreciation does not require permanent loyalty. The client can thank an old strategy and choose a new one.", "lenses": [{"insight": "Begin with observable evidence of it created belonging before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for it organized responsibility without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect it may have supported survival to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate it may no longer fit into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Recognize invisible loss", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which response best supports a client grieving a move she chose?", "options": ["You chose it, so focus on the benefits", "What routines, relationships, places, or parts of yourself feel absent now?", "Your grief means you should move back"], "correct": 1, "feedback": ["Choice does not erase loss.", "Correct. It invites the client to name invisible grief without prescribing an outcome.", "Grief does not automatically decide the next move."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which response best supports a client grieving a move she chose?", "audio": "audio_scene_12.mp3", "image": "assets_scene_12.webp"}, {"kind": "teaching", "title": "Transition is rarely linear", "kicker": "EXPECT WAVES, NOT STAGES TO COMPLETE", "body": ["Relief may come first", "Sadness may return", "Confidence may fluctuate", "Progress can include revisiting"], "narration": "Clients may expect a smooth sequence from shock to acceptance. Real transition often moves in waves. An anniversary, task, song, success, or quiet evening can reactivate emotion. Returning emotion does not automatically mean regression. The coach tracks functioning, choice, learning, and support rather than demanding a tidy emotional timeline.", "lenses": [{"insight": "Begin with observable evidence of relief may come first before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for sadness may return without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect confidence may fluctuate to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate progress can include revisiting into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_13.mp3", "ima OES THIS WEEK REQUIRE?", "body": ["Reduce the time frame", "Name today's priority", "Delay decisions that are not ripe", "Schedule a review point"], "narration": "When clients try to solve the next five years during one uncertain week, every decision becomes overwhelming. A shorter horizon asks what today, this week, or this month requires. Some choices can be made now; others need information. A review date prevents indefinite avoidance while respecting what is not yet knowable.", "lenses": [{"insight": "Begin with observable evidence of reduce the time frame before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for name today's priority without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect delay decisions that are not ripe to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate schedule a review point into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "Self-validation steadies the middle", "kicker": "MAKE SENSE WITHOUT MAKING PERMANENT", "body": ["This is unfamiliar", "My emotion has context", "I do not need to solve everything", "I can choose one next step"], "narration": "Self-validation might sound like: ‘Of course I feel disoriented; several anchors changed at once. This feeling is real, and it does not define the whole future. I can care for myself and choose one next step.’ Validation reduces the second layer of shame without turning every feeling into a command.", "lenses": [{"insight": "Begin with observable evidence of this is unfamiliar before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for my emotion has context without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect i do not need to solve everything to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate i can choose one next step into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.webp"}, {"kind": "teaching", "title": "Values become portable anchors", "kicker": "WHAT TRAVELS WITH THE CLIENT", "body": ["Courage", "Connection", "Integrity", "Learning and care"], "narration": "Roles and locations can change while values remain portable. A client who lost a leadership title can still practice contribution and integrity. A person new to a city can still practice connection. Values do not eliminate grief; they offer direction when the old map no longer works.", "lenses": [{"insight": "Begin with observable evidence of courage before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for connection without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect integrity to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate learning and care into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "teaching", "title": "Find continuity inside change", "kicker": "WHAT IS STILL YOURS?", "body": ["Skills and wisdom", "Relationships and support", "Rituals and practices", "Choice and personal standards"], "narration": "Change-focused thinking can make life appear completely erased. Continuity questions identify what remains: skills, humor, faith, creativity, trusted relatio ep—not the whole future?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.webp"}, {"kind": "teaching", "title": "Expect setbacks and threshold moments", "kicker": "NEW CHAPTERS HAVE OLD ECHOES", "body": ["First holidays", "Anniversaries", "Unexpected reminders", "New demands on old coping"], "narration": "Threshold moments can intensify emotion. The first holiday after a loss, first conflict in a new role, or first visit home after moving may revive uncertainty. The client can anticipate support, reduce overload, and decide what traditions to keep or change. A hard day does not invalidate months of adaptation.", "lenses": [{"insight": "Begin with observable evidence of first holidays before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for anniversaries without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect unexpected reminders to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate new demands on old coping into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "teaching", "title": "Notice the small griefs inside ordinary tasks", "kicker": "TRANSITION APPEARS IN DAILY LIFE", "body": ["A contact no longer called", "A route no longer traveled", "A skill not yet fluent", "A ritual that no longer fits"], "narration": "Transition often arrives through ordinary moments rather than dramatic reflection. The client reaches for an old contact, drives toward a former workplace, struggles with a once-easy task, or notices an empty chair. Naming these microgriefs makes the experience less confusing. The coach listens without turning every reminder into a problem to solve.", "lenses": [{"insight": "Begin with observable evidence of heckpoints instead of daily verdicts", "kicker": "REVIEW, DO NOT RELITIGATE", "body": ["Choose meaningful measures", "Collect evidence over time", "Set a review date", "Decide with current information"], "narration": "Uncertain clients may re-decide the whole future every difficult morning. A checkpoint contains the question. The client chooses measures such as health, values alignment, support, learning, financial reality, or belonging, then gathers evidence until a review date. New safety or urgent information can change the plan sooner.", "lenses": [{"insight": "Begin with observable evidence of choose meaningful measures before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for collect evidence over time without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect set a review date to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate decide with current information into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.webp"}, {"kind": "question", "title": "Checkpoint 5 · Choose the next step", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which action best fits a client overwhelmed by relocation?", "options": ["Design her entire five-year life plan", "Choose one daily anchor, one support contact, and one small belonging experiment", "Tell her to wait until she feels certain"], "correct": 1, "feedback": ["A distant horizon can increase overload.", "Correct. Small structure and evidence support the unfinished middle.", "Certainty often follows action rather than preceding it."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which action best fits a client overwhelmed by re sitivity dismisses the full transition.", "Correct. The plan honors emotion while restoring agency and evidence.", "The coach should not make the career decision."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which response best supports Elena without rushing or directing her?", "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Review transition through more than mood", "kicker": "FUNCTION · ALIGNMENT · SUPPORT · LEARNING", "body": ["What is becoming more workable?", "What remains costly?", "Which values are visible?", "What support or decision is needed next?"], "narration": "Mood matters, but it is not the only measure. Review functioning, values alignment, support, learning, health, relationships, and available choices. A client may still feel sad while functioning with integrity and building belonging. Or they may appear productive while deteriorating. Coaches observe, ask, document appropriately, and refer when needs exceed scope.", "lenses": [{"insight": "Begin with observable evidence of what is becoming more workable? before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for what remains costly? without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect which values are visible? to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate what support or decision is needed next? into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "The Roux Life transition standard", "kicker": "HONOR THE LOSS · KEEP THE AGENCY", "body": ["Reality is named", "Mixed emotion is welcome", "Uncertainty is organized", "Values become action"], "narration": "Roux Life coaching does not demand a silver lining or borrow another teacher's branded curriculum. We use original practices informed by broad themes of courage, empathy, values, belonging, boundaries, and resilience. We honor loss, protect client ownership, organize uncertainty, build portable anchors, and translate clarity into proportionate action—while referring grief, trauma, crisis, or impairment beyond coaching scope.", "lenses": [{"insight": "Begin with observable evidence of reality is named before explaining what the transition means.", "prompt": "What has actually changed?"}, {"insight": "Make room for mixed emotion is welcome without rushing the client toward positivity or closure.", "prompt": "What deserves acknowledgment?"}, {"insight": "Connect uncertainty is organized to identity, values, capacity, and available support.", "prompt": "What still matters and remains available?"}, {"insight": "Translate values become action into one proportionate client-owned experiment.", "prompt": "What is the next honest step—not the whole future?"}], "audio": "audio_scene_40.mp3", "image": "assets_scene_40.webp"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;
const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 13</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 13</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Navigating Change, Grief, and Uncertainty';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson13PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
