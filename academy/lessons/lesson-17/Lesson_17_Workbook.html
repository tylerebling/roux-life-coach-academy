<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 17 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 17 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Practice the Roux Life Coaching Conversation</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Presence self-audit</strong><small>Identify attention habits, internal noise, triggers, and a pre-session arrival practice.</small><textarea id="presence" rows="4"></textarea></label><label><strong>2. Session focus</strong><small>Write three ways to clarify topic, importance, and useful outcome.</small><textarea id="focus" rows="4"></textarea></label><label><strong>3. Four levels of listening</strong><small>Record content, emotion or energy, meaning or values, and patterns from a practice story.</small><textarea id="levels" rows="4"></textarea></label><label><strong>4. Observation versus interpretation</strong><small>Rewrite ten interpretations as specific, tentative observations.</small><textarea id="observation" rows="4"></textarea></label><label><strong>5. Reflection practice</strong><small>Write content, feeling, meaning, strength, and pattern reflections.</small><textarea id="reflection" rows="4"></textarea></label><label><strong>6. Summary practice</strong><small>Create a concise summary using past, present, tension, and direction.</small><textarea id="summary" rows="4"></textarea></label><label><strong>7. Question quality review</strong><small>Rewrite leading, stacked, vague, shaming, and advice-disguised questions.</small><textarea id="questions" rows="4"></textarea></label><label><strong>8. Silence and pacing</strong><small>Plan how you will pause, observe consent, and re-enter gently.</small><textarea id="silence" rows="4"></textarea></label><label><strong>9. Permission-based challenge</strong><small>Write three observations that name discrepancy without diagnosis.</small><textarea id="challenge" rows="4"></textarea></label><label><strong>10. ROUX question sequence</strong><small>Create Recognize, Open, Uncover, and Execute questions for one case.</small><textarea id="sequence" rows="4"></textarea></label><label><strong>11. Alicia case consultation</strong><small>Draft reflections, questions, challenge, action, and closing summary.</small><textarea id="alicia" rows="4"></textarea></label><label><strong>12. Safety and referral screen</strong><small>Identify when curiosity must stop and the exact next professional step.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
