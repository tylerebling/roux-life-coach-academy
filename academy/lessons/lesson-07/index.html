<script>
const scenes=[{"kind": "teaching", "title": "Shame, Guilt, and the Inner Critic", "kicker": "ROUX LIFE ACADEMY · LESSON 7", "body": ["Behavior is not identity", "Accountability needs specificity", "Compassion supports responsibility", "Scope protects the client"], "narration": "Welcome to Lesson Seven: Shame, Guilt, and the Inner Critic. Clients often enter coaching after a mistake, rejection, conflict, or failure. They may begin with a specific event and quickly arrive at a global conclusion: I am a failure. A coach should not erase responsibility or reinforce humiliation. We help the client describe what happened, recognize the identity verdict, understand what the inner critic is attempting to prevent, repair what can be repaired, and choose a values-aligned next step.", "lenses": [{"insight": "Dignity and accountability are not opposites; each becomes stronger when behavior is named clearly.", "prompt": "What happened—and what identity conclusion did the client attach to it?"}, {"insight": "Dignity and accountability are not opposites; each becomes stronger when behavior is named clearly.", "prompt": "What happened—and what identity conclusion did the client attach to it?"}, {"insight": "Dignity and accountability are not opposites; each becomes stronger when behavior is named clearly.", "prompt": "What happened—and what identity conclusion did the client attach to it?"}, {"insight": "Dignity and accountability are not opposites; each becomes stronger when behavior is named clearly.", "prompt": "What happened—and what identity conclusion did the client attach to it?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Distinguish shame from guilt", "Map critic patterns", "Practice compassionate accountability", "Repair and refer responsibly"], "narration": "We will begin with plain-language distinctions among shame, guilt, embarrassment, regret, and responsibility. Then we will examine how an inner critic uses prediction, comparison, perfection, and punishment to create the illusion of safety. You will practice behavior-specific language, self-compassion, empathy, repair, and evidence review. Six interactive coaching decisions, Maya's complete case, a guided workbook, practical assignments, and a graded assessment will turn the concepts into usable coaching skill.", "lenses": [{"insight": "A roadmap keeps emotionally meaningful work practical and within coaching scope.", "prompt": "Which distinction would help this client regain choice?"}, {"insight": "A roadmap keeps emotionally meaningful work practical and within coaching scope.", "prompt": "Which distinction would help this client regain choice?"}, {"insight": "A roadmap keeps emotionally meaningful work practical and within coaching scope.", "prompt": "Which distinction would help this client regain choice?"}, {"insight": "A roadmap keeps emotionally meaningful work practical and within coaching scope.", "prompt": "Which distinction would help this client regain choice?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Shame targets identity", "kicker": "I AM THE PROBLEM", "body": ["Global verdict", "Fixed identity", "Threat to belonging", "Urge to hide or attack"], "narration": "Shame is the painful experience that something about the whole self is defective, unworthy, or unacceptable. In everyday coaching language, listen for I am the problem, no one could respect me if they knew, or this proves who I really am. Do not diagnose the client or assume the origin of the feeling. Reflect the language and its effect. Shame often narrows attention, threatens belonging, and creates urges to hide, please, attack, perfect, or disappear.", "lenses": [{"insight": "Name the identity verdict without confirming it as truth.", "prompt": "What does this event seem to prove about you in this moment?"}, {"insight": "Name the identity verdict without confirming it as truth.", "prompt": "What does this event seem to prove about you in this moment?"}, {"insight": "Name the identity verdict without confirming it as truth.", "prompt": "What does this event seem to prove about you in this moment?"}, {"insight": "Name the identity verdict without confirming it as truth.", "prompt": "What does this event seem to prove about you in this moment?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Guilt focuses on behavior and impact", "kicker": "I DID SOMETHING I REGRET", "body": ["Specific action", "Recognizable impact", "Responsibility remains possible", "Repair can be considered"], "narration": "Guilt focuses more specifically on behavior: I did something that violated my values or affected another person. Guilt can be painful, but its specificity may support responsibility and repair. A coach should not label all guilt healthy or tell a client what she should feel. Explore whether the concern is based on observable behavior, realistic responsibility, and values—or whether the client is assuming responsibility for another adult's emotions, choices, or expectations.", "lenses": [{"insight": "Specific responsibility creates more choice than global self-condemnation.", "prompt": "What action do you regret, and what part of its impact is actually yours to address?"}, {"insight": "Specific responsibility creates more choice than global self-condemnation.", "prompt": "What action do you regret, and what part of its impact is actually yours to address?"}, {"insight": "Specific responsibility creates more choice than global self-condemnation.", "prompt": "What action do you regret, and what part of its impact is actually yours to address?"}, {"insight": "Specific responsibility creates more choice than global self-condemnation.", "prompt": "What action do you regret, and what part of its impact is actually yours to address?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "question", "title": "Checkpoint 1 · Identity or behavior?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, “I missed the deadline, so I am completely unreliable.” Which response is strongest?", "options": ["You are right; reliable people never miss deadlines", "Let us separate the missed deadline from the conclusion about your entire identity. What happened, what was the impact, and what responsibility is yours?", "Do not feel guilty; it was probably not your fault"], "correct": 1, "feedback": ["One event should not become a total identity verdict.", "Correct. The response protects dignity while preserving responsibility.", "Premature reassurance may minimize real impact and block learning."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, “I missed the deadline, so I am completely unreliable.” Which response is strongest?", "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "teaching", "title": "Embarrassment, regret, and remorse are distinct", "kicker": "USE PRECISE EMOTIONAL LANGUAGE", "body": ["Embarrassment involves exposure", "Regret wishes for a different choice", "Remorse includes concern for harm", "Shame condemns the self"], "narration": "Clients may use shame as a general word for several experiences. Embarrassment can involve awkward exposure. Regret recognizes a choice the client wishes had been different. Remorse includes concern about harm and a desire to respond responsibly. Shame turns the event into a verdict on worth. Precise language helps the coach ask better questions. Do not force a category; offer distinctions and let the client decide what fits.", "lenses": [{"insight": "Accuracy creates options that a vague emotional label cannot.", "prompt": "Which word most accurately describes the experience—and what does that word ask you to do?"}, {"insight": "Accuracy creates options that a vague emotional label cannot.", "prompt": "Which word most accurately describes the experience—and what does that word ask you to do?"}, {"insight": "Accuracy creates options that a vague emotional label cannot.", "prompt": "Which word most accurately describes the experience—and what does that word ask you to do?"}, {"insight": "Accuracy creates options that a vague emotional label cannot.", "prompt": "Which word most accurately describes the experience—and what does that word ask you to do?"}], "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Use the Shame-to-Responsibility Map", "kicker": "EVENT → STORY → RESPONSE → IMPACT → RESPONSIBILITY", "body": ["What occurred?", "What identity story appeared?", "What did the client do next?", "What repair or action is possible?"], "narration": "The Roux Life Shame-to-Responsibility Map begins with the event: observable facts and context. Next comes the story: the identity verdict or prediction. Then identify the response—hiding, apologizing repeatedly, blaming, perfecting, withdrawing, or overworking. Examine the short- and long-term impact. Finally, define realistic responsibility: repair, learning, boundary, request, system change, or self-forgiveness. The map keeps coaching present-focused and avoids searching for a clinical cause the coach is not qualified to treat.", "lenses": [{"insight": "Map sequence and consequence before trying to silence the critic.", "prompt": "Where does a specific event become a global judgment in this sequence?"}, {"insight": "Map sequence and consequence before trying to silence the critic.", "prompt": "Where does a specific event become a global judgment in this sequence?"}, {"insight": "Map sequence and consequence before trying to silence the critic.", "prompt": "Where does a specific event become a global judgment in this sequence?"}, {"insight": "Map sequence and consequence before trying to silence the critic.", "prompt": "Where does a specific event become a global judgment in this sequence?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "The inner critic is a strategy, not a trusted narrator", "kicker": "PUNISHMENT PROMISES PROTECTION", "body": ["Prevent future mistakes", "Avoid outside judgment", "Maintain control", "Demand belonging through performance"], "narration": "The inner critic often claims that harshness prevents failure: If I attack myself first, I will never make that mistake again. If I expect rejection, I will not be surprised. If I perform perfectly, I will remain accepted. Treat the critic as a learned strategy, not an identity or diagnosis. Explore what it promises, what it produces immediately, and what it costs over time. Chronic self-attack may reduce experimentation, honest feedback, recovery, and sustainable responsibility.", "lenses": [{"insight": "Understanding function does not require obeying the message.", "prompt": "What does the critic promise will happen if it is harsh enough?"}, {"insight": "Understanding function does not require obeying the message.", "prompt": "What does the critic promise will happen if it is harsh enough?"}, {"insight": "Understanding function does not require obeying the message.", "prompt": "What does the critic promise will happen if it is harsh enough?"}, {"insight": "Understanding function does not require obeying the message.", "prompt": "What does the critic promise will happen if it is harsh enough?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Recognize common critic voices", "kicker": "THE PROSECUTOR · THE PERFECTIONIST · THE COMPARATOR · THE CATASTROPHIZER", "body": ["You always fail", "Anything imperfect is unacceptable", "Everyone is ahead", "One mistake will ruin everything"], "narration": "Critic messages often follow recognizable patterns. The prosecutor collects evidence for a guilty verdict. The perfectionist treats an imperfect result as unacceptable. The comparator measures private struggle against another person's visible success. The catastrophizer predicts that one mistake will destroy reputation, belonging, or the future. These are coaching descriptions, not clinical types. Naming the pattern can create distance and help the client test the message against evidence.", "lenses": [{"insight": "A familiar pattern becomes easier to question without becoming another label.", "prompt": "Which critic pattern is organizing the client's next choice?"}, {"insight": "A familiar pattern becomes easier to question without becoming another label.", "prompt": "Which critic pattern is organizing the client's next choice?"}, {"insight": "A familiar pattern becomes easier to question without becoming another label.", "prompt": "Which critic pattern is organizing the client's next choice?"}, {"insight": "A familiar pattern becomes easier to question without becoming another label.", "prompt": "Which critic pattern is organizing the client's next choice?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Listen for absolute language", "kicker": "ALWAYS · NEVER · EVERYONE · NO ONE", "body": ["Global conclusions", "Missing context", "Selective evidence", "Identity collapse"], "narration": "Words such as always, never, everyone, no one, ruined, and impossible can signal that emotion has narrowed the client's view. Do not police language or argue about grammar. Slow down and examine the claim. Always means every time—what evidence supports that? What exceptions exist? What context matters? A client may still discover a serious repeated pattern, but the conclusion should come from evidence rather than the intensity of the critic.", "lenses": [{"insight": "Specific language makes responsibility more accurate and less humiliating.", "prompt": "What is the smallest statement that is completely true?"}, {"insight": "Specific language makes responsibility more accurate and less humiliating.", "prompt": "What is the smallest statement that is completely true?"}, {"insight": "Specific language makes responsibility more accurate and less humiliating.", "prompt": "What is the smallest statement that is completely true?"}, {"insight": "Specific language makes responsibility more accurate and less humiliating.", "prompt": "What is the smallest statement that is completely true?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "question", "title": "Checkpoint 2 · Meet the critic with curiosity", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, “If I stop criticizing myself, I will become lazy.” What should the coach explore first?", "options": ["Why she is addicted to shame", "What the criticism promises, what it produces, and whether another form of accountability could work", "How to criticize herself more efficiently"], "correct": 1, "feedback": ["This uses a diagnosis-like accusation and increases shame.", "Correct. Function, evidence, cost, and alternatives preserve curiosity and responsibility.", "More efficient self-attack does not build compassionate accountability."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, “If I stop criticizing myself, I will become lazy.” What should the coach explore first?", "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "teaching", "title": "Triggers activate the critic quickly", "kicker": "MISTAKE · FEEDBACK · VISIBILITY · REJECTION · REST", "body": ["A cue occurs", "Meaning is assigned", "The body reacts", "A protective response follows"], "narration": "Critic activation may follow a mistake, feedback, visibility, rejection, comparison, conflict, or even rest. The cue is not the whole pattern. Help the client notice the meaning assigned to it. Feedback becomes proof of incompetence. A delayed reply becomes proof of rejection. Rest becomes evidence of laziness. Then identify the physical and behavioral response. This trigger map supports awareness without diagnosing trauma or treating severe symptoms.", "lenses": [{"insight": "The space between cue and conclusion is where coaching choice can grow.", "prompt": "What did this moment come to mean before you had time to examine it?"}, {"insight": "The space between cue and conclusion is where coaching choice can grow.", "prompt": "What did this moment come to mean before you had time to examine it?"}, {"insight": "The space between cue and conclusion is where coaching choice can grow.", "prompt": "What did this moment come to mean before you had time to examine it?"}, {"insight": "The space between cue and conclusion is where coaching choice can grow.", "prompt": "What did this moment come to mean before you had time to examine it?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.webp"}, {"kind": "teaching", "title": "Shame changes behavior", "kicker": "HIDE · PLEASE · PERFECT · BLAME · WITHDRAW", "body": ["Hide the evidence", "Earn belonging", "Eliminate criticism", "Move fault outward", "Leave before rejection"], "narration": "Shame is not only an internal feeling; it can organize behavior. A client may hide information, apologize repeatedly, overwork, people-please, blame others, become defensive, or withdraw before repair. Describe the action and sequence rather than calling the client a shame-based person. Ask what the response protected in the moment and what it cost later. The goal is behavioral flexibility, not moral judgment about the protective strategy.", "lenses": [{"insight": "Behavior can be understood compassionately and still be changed responsibly.", "prompt": "What did you do next, and what did that action make temporarily safer?"}, {"insight": "Behavior can be understood compassionately and still be changed responsibly.", "prompt": "What did you do next, and what did that action make temporarily safer?"}, {"insight": "Behavior can be understood compassionately and still be changed responsibly.", "prompt": "What did you do next, and what did that action make temporarily safer?"}, {"insight": "Behavior can be understood compassionately and still be changed responsibly.", "prompt": "What did you do next, and what did that action make temporarily safer?"}, {"insight": "Behavior can be understood compassionately and still be changed responsibly.", "prompt": "What did you do next, and what did that action make temporarily safer?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.webp"}, {"kind": "teaching", "title": "Perfectionism converts worth into performance", "kicker": "IF THE WORK IS FLAWLESS, I MAY BE SAFE", "body": ["Standards become identity tests", "Feedback becomes threat", "Completion becomes difficult", "Rest feels undeserved"], "narration": "Perfectionism may make achievement the entrance fee for worth and belonging. The client delays, overchecks, avoids early feedback, or treats correction as humiliation. Do not tell her to lower every standard. Distinguish excellent work from using flawlessness to prevent exposure. A practical experiment may include defining a quality threshold, showing a draft, setting a review limit, or completing a task before emotional certainty arrives.", "lenses": [{"insight": "Flexible excellence can support values without turning every result into an identity test.", "prompt": "What standard serves the work, and what standard is trying to protect your worth?"}, {"insight": "Flexible excellence can support values without turning every result into an identity test.", "prompt": "What standard serves the work, and what standard is trying to protect your worth?"}, {"insight": "Flexible excellence can support values without turning every result into an identity test.", "prompt": "What standard serves the work, and what standard is trying to protect your worth?"}, {"insight": "Flexible excellence can support values without turning every result into an identity test.", "prompt": "What standard serves the work, and what standard is trying to protect your worth?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.webp"}, {"kind": "teaching", "title": "Comparison edits the evidence", "kicker": "THEIR OUTSIDE · MY INSIDE", "body": ["Visible success", "Invisible context", "Selective attention", "Borrowed standards"], "narration": "Comparison often places another person's visible outcome beside the client's private fear and unfinished process. Social media, professional environments, family expectations, and cultural messages can intensify the distortion. Help the client identify what is actually known, what is assumed, and whether the standard reflects her own values. The goal is not to ban comparison. It is to use information without turning someone else's timeline into proof of personal defectiveness.", "lenses": [{"insight": "Comparison becomes useful only when context, values, and evidence return.", "prompt": "What are you assuming about their life—and what standard do you want to choose for yours?"}, {"insight": "Comparison becomes useful only when context, values, and evidence return.", "prompt": "What are you assuming about their life—and what standard do you want to choose for yours?"}, {"insight": "Comparison becomes useful only when context, values, and evidence return.", "prompt": "What are you assuming about their life—and what standard do you want to choose for yours?"}, {"insight": "Comparison becomes useful only when context, values, and evidence return.", "prompt": "What are you assuming about their life—and what standard do you want to choose for yours?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.webp"}, {"kind": "teaching", "title": "Not every guilty feeling proves responsibility", "kicker": "BORROWED RESPONSIBILITY", "body": ["Another person is disappointed", "A boundary creates discomfort", "The client cannot control every outcome", "Responsibility must follow authority and action"], "narration": "Some clients feel guilty whenever another person is disappointed, especially when they set a boundary, stop overfunctioning, or decline an unreasonable request. The feeling deserves attention, but it does not automatically prove wrongdoing. Ask what the client did, what agreement existed, what authority she had, and what impact was reasonably foreseeable. She may discover a repair is needed, or she may discover that discomfort is the cost of allowing another adult to carry responsibility.", "lenses": [{"insight": "A guilty feeling is information to examine, not automatic evidence of guilt.", "prompt": "What did you actually do—and which part of this outcome was never yours to control?"}, {"insight": "A guilty feeling is information to examine, not automatic evidence of guilt.", "prompt": "What did you actually do—and which part of this outcome was never yours to control?"}, {"insight": "A guilty feeling is information to examine, not automatic evidence of guilt.", "prompt": "What did you actually do—and which part of this outcome was never yours to control?"}, {"insight": "A guilty feeling is information to examine, not automatic evidence of guilt.", "prompt": "What did you actually do—and which part of this outcome was never yours to control?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.webp"}, {"kind": "teaching", "title": "Blame can protect against shame", "kicker": "IF IT IS ALL THEIR FAULT, I DO NOT HAVE TO FEEL DEFECTIVE", "body": ["Responsibility feels threatening", "Intent replaces evidence", "Repair becomes impossible", "Conflict escalates"], "narration": "Some clients respond to shame by moving all responsibility outward. Blame may protect against an unbearable identity verdict: If I admit one mistake, I become completely bad. A coach can hold both dignity and accountability. What did the other person do? What did the client do? What impact followed? What remains uncertain? Shared complexity is not false equivalence. It is a careful effort to locate responsibility without collapsing into total innocence or total defectiveness.", "lenses": [{"insight": "Accurate responsibility is more useful than all-or-nothing innocence.", "prompt": "What portion belongs to you, what belongs to them, and what remains unclear?"}, {"insight": "Accurate responsibility is more useful than all-or-nothing innocence.", "prompt": "What portion belongs to you, what belongs to them, and what remains unclear?"}, {"insight": "Accurate responsibility is more useful than all-or-nothing innocence.", "prompt": "What portion belongs to you, what belongs to them, and what remains unclear?"}, {"insight": "Accurate responsibility is more useful than all-or-nothing innocence.", "prompt": "What portion belongs to you, what belongs to them, and what remains unclear?"}], "audio": "audio_scene_17.mp3", "image": "assets_scene_17.webp"}, {"kind": "question", "title": "Checkpoint 3 · Accountability without collapse", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client caused real harm and now says, “I am a terrible person.” What is the strongest response?", "options": ["Agree so she takes responsibility", "Name the harmful behavior and impact specifically, then explore responsibility, repair, and values without defining her entire identity", "Tell her the harm does not matter"], "correct": 1, "feedback": ["Humiliation is not the same as accountability.", "Correct. Specificity preserves responsibility and the possibility of ethical action.", "Minimizing harm prevents learning and repair."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client caused real harm and now says, “I am a terrible person.” What is the strongest response?", "audio": "audio_scene_18.mp3", "image": "assets_scene_18.webp"}, {"kind": "teaching", "title": "Self-compassion is not self-excusing", "kicker": "WARMTH · COMMON HUMANITY · RESPONSIBLE ACTION", "body": ["Notice suffering", "Respond without contempt", "Remember imperfection is human", "Choose what responsibility requires"], "narration": "Self-compassion means responding to difficulty without contempt while remaining connected to responsibility. It does not mean declaring every choice acceptable. A client can say: I am disappointed in how I responded. This mistake does not make me beyond repair. I can acknowledge the impact and choose a better action. Compassion may reduce defensiveness enough for honest accountability. If the coach presents compassion as a reward earned only after perfection, the critic remains in charge.", "lenses": [{"insight": "Compassion creates the steadiness needed to face reality more honestly.", "prompt": "What would a truthful and non-humiliating response sound like?"}, {"insight": "Compassion creates the steadiness needed to face reality more honestly.", "prompt": "What would a truthful and non-humiliating response sound like?"}, {"insight": "Compassion creates the steadiness needed to face reality more honestly.", "prompt": "What would a truthful and non-humiliating response sound like?"}, {"insight": "Compassion creates the steadiness needed to face reality more honestly.", "prompt": "What would a truthful and non-humiliating response sound like?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "Use the Compassionate Accountability Statement", "kicker": "FACT · IMPACT · HUMANITY · RESPONSIBILITY · NEXT STEP", "body": ["State what happened", "Acknowledge the effect", "Refuse identity contempt", "Choose repair or learning"], "narration": "A Compassionate Accountability Statement integrates five elements. State the fact. Name the impact. Recognize that making a mistake is part of being human without using humanity as an excuse. Identify realistic responsibility. Choose a next step. For example: I interrupted her repeatedly and the conversation became unsafe for honesty. I am capable of responding differently. I will apologize without defending myself and practice pausing before I reply.", "lenses": [{"insight": "The statement is complete only when compassion and action remain together.", "prompt": "What sentence tells the truth without becoming a sentence against the self?"}, {"insight": "The statement is complete only when compassion and action remain together.", "prompt": "What sentence tells the truth without becoming a sentence against the self?"}, {"insight": "The statement is complete only when compassion and action remain together.", "prompt": "What sentence tells the truth without becoming a sentence against the self?"}, {"insight": "The statement is complete only when compassion and action remain together.", "prompt": "What sentence tells the truth without becoming a sentence against the self?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.webp"}, {"kind": "teaching", "title": "Self-validation can interrupt reassurance dependence", "kicker": "MY EXPERIENCE CAN BE REAL BEFORE APPROVAL", "body": ["Name the feeling", "Name why it makes sense", "Return to facts", "Choose the next action"], "narration": "A shame-activated client may ask the coach to guarantee that she is good, lovable, or forgiven. Reassurance can soothe briefly but become a cycle that requires constant renewal. Self-validation helps the client acknowledge the feeling and its meaning, return to evidence, and choose action. I feel exposed because belonging matters. The mistake is real, and it is not the whole of me. I can repair what is mine and tolerate uncertainty about another person's response.", "lenses": [{"insight": "Validation supports steadiness; it cannot guarantee forgiveness or belonging.", "prompt": "What can you recognize before asking someone else to remove all uncertainty?"}, {"insight": "Validation supports steadiness; it cannot guarantee forgiveness or belonging.", "prompt": "What can you recognize before asking someone else to remove all uncertainty?"}, {"insight": "Validation supports steadiness; it cannot guarantee forgiveness or belonging.", "prompt": "What can you recognize before asking someone else to remove all uncertainty?"}, {"insight": "Validation supports steadiness; it cannot guarantee forgiveness or belonging.", "prompt": "What can you recognize before asking someone else to remove all uncertainty?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "teaching", "title": "Empathy reduces isolation without erasing impact", "kicker": "UNDERSTAND · DO NOT RESCUE", "body": ["Listen for meaning", "Reflect emotion", "Preserve complexity", "Return agency"], "narration": "Empathy communicates that the client's experience is understandable and that she does not have to face it alone. It does not require agreeing with every interpretation or removing consequences. A coach might say: You are carrying regret and fear that this changed how people see you. What feels hardest to face? Then return agency: What responsibility do you want to take? Empathy becomes rescuing when the coach minimizes impact, attacks other people, or takes over repair.", "lenses": [{"insight": "The client can be understood deeply and still be invited into responsible action.", "prompt": "How can you reflect the pain without deciding the meaning or outcome?"}, {"insight": "The client can be understood deeply and still be invited into responsible action.", "prompt": "How can you reflect the pain without deciding the meaning or outcome?"}, {"insight": "The client can be understood deeply and still be invited into responsible action.", "prompt": "How can you reflect the pain without deciding the meaning or outcome?"}, {"insight": "The client can be understood deeply and still be invited into responsible action.", "prompt": "How can you reflect the pain without deciding the meaning or outcome?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.webp"}, {"kind": "teaching", "title": "Secrecy gives shame room to expand", "kicker": "DISCERNED CONNECTION, NOT FORCED DISCLOSURE", "body": ["Isolation increases distortion", "Trust must be earned", "Disclosure should be relevant", "Privacy remains a right"], "narration": "Shame often grows in isolation because the client's harshest story receives no compassionate reality check. Yet disclosure is not automatically safe or useful. Help the client assess the person, purpose, timing, capacity, and possible consequence. A trusted friend, mentor, support group, or licensed professional may be appropriate. The coach should never pressure confession or imply that privacy is dishonest. Discerned connection is different from maximum exposure.", "lenses": [{"insight": "The question is not whether to tell everything; it is where honest support has been earned.", "prompt": "Who has demonstrated the capacity to respond with respect and appropriate boundaries?"}, {"insight": "The question is not whether to tell everything; it is where honest support has been earned.", "prompt": "Who has demonstrated the capacity to respond with respect and appropriate boundaries?"}, {"insight": "The question is not whether to tell everything; it is where honest support has been earned.", "prompt": "Who has demonstrated the capacity to respond with respect and appropriate boundaries?"}, {"insight": "The question is not whether to tell everything; it is where honest support has been earned.", "prompt": "Who has demonstrated the capacity to respond with respect and appropriate boundaries?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.webp"}, {"kind": "question", "title": "Checkpoint 4 · Empathy or rescue?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client feels ashamed after hurting a colleague. Which response best combines empathy and responsibility?", "options": ["You are not a bad person, so forget it", "It makes sense that this feels painful. Let us identify what happened, what repair is possible, and what you need to learn", "Your colleague should understand your intention"], "correct": 1, "feedback": ["Reassurance alone may minimize impact and bypass responsibility.", "Correct. The response validates pain while keeping behavior, repair, and learning visible.", "The coach cannot decide what the colleague should feel."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client feels ashamed after hurting a colleague. Which response best combines empathy and responsibility?", "audio": "audio_scene_24.mp3", "image": "assets_scene_24.webp"}, {"kind": "teaching", "title": "Apology is an action, not a demand for relief", "kicker": "ACKNOWLEDGE · OWN · REPAIR · RELEASE CONTROL", "body": ["Name the behavior", "Name the impact", "Avoid defensive explanation", "Offer repair without demanding forgiveness"], "narration": "An accountable apology identifies the behavior and impact, owns the relevant part, and offers repair. It does not use the other person's forgiveness to regulate the client's shame. I am sorry if you felt hurt shifts responsibility. I am sorry, but I was stressed asks the harmed person to erase impact. A stronger form is: I shared information that was not mine to share. That violated your privacy. I am sorry. I will correct the record and will not repeat it.", "lenses": [{"insight": "The client can control accountability, not the timing or availability of forgiveness.", "prompt": "What needs to be owned even if reassurance never arrives?"}, {"insight": "The client can control accountability, not the timing or availability of forgiveness.", "prompt": "What needs to be owned even if reassurance never arrives?"}, {"insight": "The client can control accountability, not the timing or availability of forgiveness.", "prompt": "What needs to be owned even if reassurance never arrives?"}, {"insight": "The client can control accountability, not the timing or availability of forgiveness.", "prompt": "What needs to be owned even if reassurance never arrives?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.webp"}, {"kind": "teaching", "title": "Maya's case: the missed deadline", "kicker": "REALISTIC COACHING SCENARIO", "body": ["A deadline was missed", "The client was affected", "A remedy was offered", "Identity collapse continues"], "narration": "Maya missed an important deadline during a difficult family week. The client had to delay a launch. Maya apologized, refunded part of the fee, and created a revised delivery plan. Yet she now says: I ruin everything. I am not built for leadership. The coach begins by separating facts from verdicts. What happened? What was the impact? What repair has occurred? What remains unresolved? What does Maya believe this event proves about her identity?", "lenses": [{"insight": "The work is not to declare Maya innocent; it is to restore accurate responsibility and choice.", "prompt": "Which part of Maya's concern is behavior, and which part is shame's global story?"}, {"insight": "The work is not to declare Maya innocent; it is to restore accurate responsibility and choice.", "prompt": "Which part of Maya's concern is behavior, and which part is shame's global story?"}, {"insight": "The work is not to declare Maya innocent; it is to restore accurate responsibility and choice.", "prompt": "Which part of Maya's concern is behavior, and which part is shame's global story?"}, {"insight": "The work is not to declare Maya innocent; it is to restore accurate responsibility and choice.", "prompt": "Which part of Maya's concern is behavior, and which part is shame's global story?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.webp"}, {"kind": "teaching", "title": "Maya's critic map", "kicker": "TRIGGER → MESSAGE → PROMISE → RESPONSE → COST", "body": ["Client disappointment", "You always fail", "Punishment will prevent repetition", "Overwork and avoidance"], "narration": "Maya's trigger was the client's disappointed email. The critic message was absolute: You always let people down. The promised protection was relentless work and permanent vigilance. Her response was to work late, avoid new proposals, and reread the email. The immediate effect was a sense of control. The longer-term cost was exhaustion, reduced confidence, and less honest evaluation of the business system that failed. The coach helps Maya see the strategy without shaming it.", "lenses": [{"insight": "A critic may create urgency while blocking the practical learning it claims to protect.", "prompt": "What problem does Maya's punishment fail to solve?"}, {"insight": "A critic may create urgency while blocking the practical learning it claims to protect.", "prompt": "What problem does Maya's punishment fail to solve?"}, {"insight": "A critic may create urgency while blocking the practical learning it claims to protect.", "prompt": "What problem does Maya's punishment fail to solve?"}, {"insight": "A critic may create urgency while blocking the practical learning it claims to protect.", "prompt": "What problem does Maya's punishment fail to solve?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.webp"}, {"kind": "teaching", "title": "Maya's responsibility plan", "kicker": "REPAIR · SYSTEM CHANGE · COMMUNICATION · RECOVERY", "body": ["Confirm the remedy", "Change capacity planning", "Communicate earlier", "Return to sustainable work"], "narration": "Maya determines that the apology and financial remedy were appropriate. She also identifies a system responsibility: projects had no capacity buffer and she waited too long to communicate. Her next actions are to add milestone reviews, define a family-emergency communication plan, and limit simultaneous launches. She will send one concise update rather than another apology seeking reassurance. Finally, she will return to a sustainable schedule. Punishment is replaced by repair, learning, and structure.", "lenses": [{"insight": "Responsibility becomes credible when it changes behavior and systems.", "prompt": "What would Maya do differently if learning—not humiliation—were the goal?"}, {"insight": "Responsibility becomes credible when it changes behavior and systems.", "prompt": "What would Maya do differently if learning—not humiliation—were the goal?"}, {"insight": "Responsibility becomes credible when it changes behavior and systems.", "prompt": "What would Maya do differently if learning—not humiliation—were the goal?"}, {"insight": "Responsibility becomes credible when it changes behavior and systems.", "prompt": "What would Maya do differently if learning—not humiliation—were the goal?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.webp"}, {"kind": "teaching", "title": "Maya practices identity-accurate language", "kicker": "ONE EVENT IS DATA, NOT A TOTAL DEFINITION", "body": ["I missed this deadline", "The impact was real", "I have repaired part of it", "I am changing the system"], "narration": "Maya rewrites the critic's verdict: I missed this deadline and the delay affected my client. I apologized, offered a remedy, and identified a weak capacity system. This event is serious information, not proof that I ruin everything. I can decide whether leadership is right for me using a broader body of evidence. The coach does not write the sentence for Maya; she helps test each claim for accuracy, dignity, and responsibility.", "lenses": [{"insight": "Identity-accurate language is neither inflated praise nor self-condemnation.", "prompt": "Which sentence is specific enough to guide the next responsible choice?"}, {"insight": "Identity-accurate language is neither inflated praise nor self-condemnation.", "prompt": "Which sentence is specific enough to guide the next responsible choice?"}, {"insight": "Identity-accurate language is neither inflated praise nor self-condemnation.", "prompt": "Which sentence is specific enough to guide the next responsible choice?"}, {"insight": "Identity-accurate language is neither inflated praise nor self-condemnation.", "prompt": "Which sentence is specific enough to guide the next responsible choice?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "teaching", "title": "Maya reviews broader evidence", "kicker": "PATTERN · CONTEXT · EXCEPTIONS · TREND", "body": ["Is this repeated?", "What context mattered?", "What evidence complicates the verdict?", "What is changing?"], "narration": "One mistake may reveal a pattern, or it may be an exception. Maya reviews three years of delivery data, prior client feedback, workload, and family context. She finds strong performance alongside a recent overcapacity pattern. The evidence neither excuses the missed deadline nor supports the conclusion that she always fails. Coaching helps her make a proportionate judgment and track whether the new system changes results.", "lenses": [{"insight": "A fair conclusion uses the whole relevant record, not only the most painful moment.", "prompt": "What pattern does the evidence actually support?"}, {"insight": "A fair conclusion uses the whole relevant record, not only the most painful moment.", "prompt": "What pattern does the evidence actually support?"}, {"insight": "A fair conclusion uses the whole relevant record, not only the most painful moment.", "prompt": "What pattern does the evidence actually support?"}, {"insight": "A fair conclusion uses the whole relevant record, not only the most painful moment.", "prompt": "What pattern does the evidence actually support?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.webp"}, {"kind": "question", "title": "Checkpoint 5 · Maya's next step", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "What is the strongest coaching outcome for Maya?", "options": ["Convince her the missed deadline did not matter", "Help her hold impact, repair, system learning, self-respect, and a client-owned next action together", "Keep apologizing until the client reassures her"], "correct": 1, "feedback": ["Minimizing the impact prevents honest accountability.", "Correct. Compassionate accountability integrates dignity, evidence, repair, and action.", "Repeated apology can become reassurance seeking rather than useful repair."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. What is the strongest coaching outcome for Maya?", "audio": "audio_scene_31.mp3", "image": "assets_scene_31.webp"}, {"kind": "teaching", "title": "Receiving another person's disappointment", "kicker": "IMPACT WITHOUT IDENTITY COLLAPSE", "body": ["Listen", "Clarify", "Own what is accurate", "Set limits on contempt"], "narration": "The client may need to hear that another person remains disappointed. Help her listen, ask for specifics, own accurate impact, and decide what action is possible. She does not have to accept insults, threats, or a total verdict on her worth. A boundary may be needed around contemptuous delivery. The challenge is to stay open to useful feedback without making the other person's emotion the sole authority on identity.", "lenses": [{"insight": "Accountability includes receiving impact; dignity includes boundaries around dehumanization.", "prompt": "What information can you hear, and what treatment will you not accept?"}, {"insight": "Accountability includes receiving impact; dignity includes boundaries around dehumanization.", "prompt": "What information can you hear, and what treatment will you not accept?"}, {"insight": "Accountability includes receiving impact; dignity includes boundaries around dehumanization.", "prompt": "What information can you hear, and what treatment will you not accept?"}, {"insight": "Accountability includes receiving impact; dignity includes boundaries around dehumanization.", "prompt": "What information can you hear, and what treatment will you not accept?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.webp"}, {"kind": "teaching", "title": "Forgiving oneself is not forgetting", "kicker": "REMEMBER · LEARN · REPAIR · RELEASE PUNISHMENT", "body": ["Keep the lesson", "Complete realistic repair", "Accept limits", "Stop using pain as proof of goodness"], "narration": "Some clients believe continuing to suffer proves that they care. Self-forgiveness does not erase the record or require immediate emotional relief. It means the client remembers accurately, learns, repairs what is realistically possible, accepts what cannot be controlled, and stops using endless punishment as evidence of morality. This process may be gradual. Persistent, severe shame connected to trauma, abuse, depression, or other clinical concerns may require licensed care.", "lenses": [{"insight": "A lesson can remain after punishment is no longer useful.", "prompt": "What responsibility remains—and what suffering is no longer serving repair?"}, {"insight": "A lesson can remain after punishment is no longer useful.", "prompt": "What responsibility remains—and what suffering is no longer serving repair?"}, {"insight": "A lesson can remain after punishment is no longer useful.", "prompt": "What responsibility remains—and what suffering is no longer serving repair?"}, {"insight": "A lesson can remain after punishment is no longer useful.", "prompt": "What responsibility remains—and what suffering is no longer serving repair?"}], "audio": "audio_scene_33.mp3", "image": "assets_scene_33.webp"}, {"kind": "teaching", "title": "The coach must notice shame in the room", "kicker": "TONE · SPEED · RESCUE · SUPERIORITY", "body": ["Correcting too quickly", "Praising dramatically", "Sounding morally superior", "Avoiding honest impact"], "narration": "Coaches can unintentionally increase shame through a sharp tone, moral superiority, excessive praise, forced positivity, or rapid correction. Rescue can also communicate that the client is too fragile to face reality. Slow down. Ask permission before challenge. Use specific observations. If the coach misses the mark, repair it: I moved too quickly and my wording sounded judgmental. I am sorry. What would be more useful now? The process should model accountable dignity.", "lenses": [{"insight": "The coach's manner teaches as much as the question.", "prompt": "What might this client hear beneath my tone?"}, {"insight": "The coach's manner teaches as much as the question.", "prompt": "What might this client hear beneath my tone?"}, {"insight": "The coach's manner teaches as much as the question.", "prompt": "What might this client hear beneath my tone?"}, {"insight": "The coach's manner teaches as much as the question.", "prompt": "What might this client hear beneath my tone?"}], "audio": "audio_scene_34.mp3", "image": "assets_scene_34.webp"}, {"kind": "teaching", "title": "Use boundaries when shame is projected", "kicker": "COMPASSION DOES NOT REQUIRE ACCEPTING HARM", "body": ["Name the behavior", "Protect the session", "Return choice", "End or refer when necessary"], "narration": "A shame-activated client may insult the coach, attack others, or demand repeated reassurance. Compassion does not require accepting harmful behavior. The coach can name the observation and boundary: I want to support this conversation, and I will not continue while being insulted. We can pause or return when we can work respectfully. Follow policies, document appropriately, and seek supervision or referral when the relationship is no longer safe or useful.", "lenses": [{"insight": "A clear boundary can protect both dignity and the integrity of coaching.", "prompt": "What limit allows compassion to remain structured?"}, {"insight": "A clear boundary can protect both dignity and the integrity of coaching.", "prompt": "What limit allows compassion to remain structured?"}, {"insight": "A clear boundary can protect both dignity and the integrity of coaching.", "prompt": "What limit allows compassion to remain structured?"}, {"insight": "A clear boundary can protect both dignity and the integrity of coaching.", "prompt": "What limit allows compassion to remain structured?"}], "audio": "audio_scene_35.mp3", "image": "assets_scene_35.webp"}, {"kind": "teaching", "title": "Referral red flags", "kicker": "WHEN COACHING ALONE IS NOT ENOUGH", "body": ["Self-harm or suicide concern", "Severe or persistent impairment", "Trauma symptoms requiring treatment", "Abuse, addiction, eating, or psychiatric concerns"], "narration": "Refer or escalate when shame is connected to self-harm or suicide concerns, severe depression, significant impairment, trauma symptoms, abuse, addiction, eating-disorder concerns, psychosis, or other needs beyond competence. Do not diagnose. Take direct safety statements seriously and follow applicable emergency policies. Coaching may sometimes continue alongside licensed care when appropriate, but the client should not be asked to use coaching as a substitute for treatment.", "lenses": [{"insight": "Referral is responsible scope, not rejection.", "prompt": "What information tells you this client needs a different or additional level of care?"}, {"insight": "Referral is responsible scope, not rejection.", "prompt": "What information tells you this client needs a different or additional level of care?"}, {"insight": "Referral is responsible scope, not rejection.", "prompt": "What information tells you this client needs a different or additional level of care?"}, {"insight": "Referral is responsible scope, not rejection.", "prompt": "What information tells you this client needs a different or additional level of care?"}], "audio": "audio_scene_36.mp3", "image": "assets_scene_36.webp"}, {"kind": "question", "title": "Checkpoint 6 · Scope and safety", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, “Everyone would be better off without me,” and describes a plan to harm herself. What should the coach do?", "options": ["Use a confidence exercise", "Take the statement seriously and follow appropriate emergency and safety procedures", "Promise secrecy and continue coaching"], "correct": 1, "feedback": ["Ordinary coaching is not an adequate response to an immediate safety concern.", "Correct. Safety procedures and qualified emergency support take priority.", "A coach should not promise confidentiality beyond safety and legal limits."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, “Everyone would be better off without me,” and describes a plan to harm herself. What should the coach do?", "audio": "audio_scene_37.mp3", "image": "assets_scene_37.webp"}, {"kind": "teaching", "title": "The Compassionate Responsibility Loop", "kicker": "NOTICE → SEPARATE → UNDERSTAND → REPAIR → PRACTICE", "body": ["Notice the trigger and verdict", "Separate identity from behavior", "Understand function and impact", "Repair and practice"], "narration": "Bring the lesson together with the Compassionate Responsibility Loop. Notice the event, critic message, feeling, and response. Separate identity from behavior using accurate language. Understand what the critic attempts to protect and what the behavior affected. Repair what is realistically repairable. Practice a new response, boundary, system, or communication. Then review evidence. The loop can repeat without demanding that shame vanish before responsible action begins.", "lenses": [{"insight": "The goal is not perfect self-esteem; it is greater honesty, dignity, and choice.", "prompt": "Which stage would help this client move from verdict to action?"}, {"insight": "The goal is not perfect self-esteem; it is greater honesty, dignity, and choice.", "prompt": "Which stage would help this client move from verdict to action?"}, {"insight": "The goal is not perfect self-esteem; it is greater honesty, dignity, and choice.", "prompt": "Which stage would help this client move from verdict to action?"}, {"insight": "The goal is not perfect self-esteem; it is greater honesty, dignity, and choice.", "prompt": "Which stage would help this client move from verdict to action?"}], "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Final reflection", "kicker": "FROM SELF-CONDEMNATION TO RESPONSIBLE CHOICE", "body": ["Name one event", "Identify the identity verdict", "Define realistic responsibility", "Write the next compassionate action"], "narration": "Choose a manageable, nonclinical mistake or regret. Write only the observable facts. Record the identity verdict that appeared. Identify the critic's promised protection and actual cost. Name the behavior's impact and your realistic responsibility. Then write a Compassionate Accountability Statement and one next action. If the example involves trauma, severe impairment, self-harm, abuse, addiction, or another clinical concern, choose a different practice and identify the appropriate qualified support.", "lenses": [{"insight": "Specific truth is more transformative than either denial or humiliation.", "prompt": "What becomes possible when responsibility no longer requires self-contempt?"}, {"insight": "Specific truth is more transformative than either denial or humiliation.", "prompt": "What becomes possible when responsibility no longer requires self-contempt?"}, {"insight": "Specific truth is more transformative than either denial or humiliation.", "prompt": "What becomes possible when responsibility no longer requires self-contempt?"}, {"insight": "Specific truth is more transformative than either denial or humiliation.", "prompt": "What becomes possible when responsibility no longer requires self-contempt?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "Lesson 7 recap", "kicker": "THE ROUX LIFE STANDARD", "body": ["Specificity over global shame", "Compassion with accountability", "Repair without control", "Referral when scope is exceeded"], "narration": "Shame targets identity; guilt and remorse can focus attention on behavior and function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 7</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}

function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}

function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
