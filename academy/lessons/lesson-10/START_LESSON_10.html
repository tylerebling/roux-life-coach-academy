:hover{background:rgba(39,70,48,.96);transform:translateY(-2px)}

<body><main class="app"><section class="stage" id="stage"><div class="start" id="start"><div class="start-photo"></div><div class="start-vignette"></div><div class="start-card"><img class="intro-logo" src="assets_roux_life_logo.webp" alt="Roux Life Coaching"><div class="intro-line"></div><div class="intro-copy"><h1>Emotional Connection and Healthy Communication</h1><p>A practical Roux Life masterclass in listening beneath words, naming needs, reducing defensiveness, making clear requests, repairing disconnection, and preserving coaching scope.</p></div><button id="begin">Enter Lesson 10</button></div></div><div class="caption" id="caption"></div></section>

<script>
const scenes=[{"kind": "teaching", "title": "Connection is built in moments", "kicker": "ROUX LIFE ACADEMY · LESSON 10", "body": ["Listen beyond the words", "Name needs without demanding", "Protect dignity during conflict", "Repair with changed behavior"], "narration": "Emotional connection is not constant agreement or uninterrupted closeness. It is the experience of being met with attention, honesty, respect, and enough safety to stay present. In coaching, we help clients notice how connection is invited, interrupted, repaired, and sometimes responsibly limited. The goal is not perfect communication. The goal is clearer choices and more trustworthy behavior.", "lenses": [{"insight": "Connection begins with accurate attention, not advice.", "prompt": "What is the client hoping another person will understand?"}, {"insight": "A need can be named without controlling another adult.", "prompt": "What request would make the need observable?"}, {"insight": "Conflict can reveal values, fears, and relationship standards.", "prompt": "What matters beneath the disagreement?"}, {"insight": "Repair is proven through behavior over time.", "prompt": "What would changed behavior look like?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Hear five layers", "Map the protection cycle", "Communicate clearly", "Practice repair and boundaries"], "narration": "We will begin with the anatomy of listening, then examine emotional bids, defensiveness, and the protective cycle that turns ordinary tension into disconnection. You will learn language for needs, requests, feedback, and boundaries. Finally, you will coach a realistic case and identify when communication coaching must pause for clinical, legal, abuse, or emergency support.", "lenses": [{"insight": "Listening is a trainable sequence.", "prompt": "Which listening habit needs the most practice?"}, {"insight": "Protection is understandable and still accountable.", "prompt": "What does the reaction protect?"}, {"insight": "Clear communication reduces guessing.", "prompt": "What needs to become specific?"}, {"insight": "Scope protects everyone involved.", "prompt": "What concern requires qualified support?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Why clients struggle to feel heard", "kicker": "THE COMMUNICATION GAP", "body": ["Words are only one layer", "Emotion changes interpretation", "Unspoken needs drive positions", "History shapes expectations"], "narration": "Two people can hear the same sentence and experience different messages. One hears a request; the other hears criticism. One offers a solution; the other experiences dismissal. Coaches help clients slow the exchange and distinguish the actual words from the emotion, meaning, need, and history attached to them. This creates options without pretending the coach knows another person's mind.", "lenses": [{"insight": "Words and meaning are not identical.", "prompt": "What meaning did the client assign?"}, {"insight": "Emotion influences what the nervous system notices.", "prompt": "What changed in the client's body?"}, {"insight": "Positions often conceal legitimate needs.", "prompt": "What need sits beneath the demand?"}, {"insight": "History informs expectations but does not prove the present.", "prompt": "What evidence belongs to this interaction?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "The five-layer listening map", "kicker": "WORDS · EMOTION · MEANING · NEED · REQUEST", "body": ["What was said", "What was felt", "What it meant", "What is needed next"], "narration": "A strong coach listens on five layers. First, the words: what was actually said. Second, emotion: what feeling is present. Third, meaning: what the client believes the moment says about self, other, or relationship. Fourth, need or value: what matters underneath. Fifth, request: what observable response could support movement. This map prevents premature advice and makes empathy more precise.", "lenses": [{"insight": "Capture the sentence before interpreting it.", "prompt": "What are the camera-level facts?"}, {"insight": "Name emotion tentatively, not as certainty.", "prompt": "Would a feeling reflection help?"}, {"insight": "Meaning reveals the story under the event.", "prompt": "What did this moment seem to say?"}, {"insight": "A request translates insight into behavior.", "prompt": "What could the client ask for?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Presence before technique", "kicker": "THE COACH'S FIRST INSTRUMENT", "body": ["Slow your own urgency", "Follow the client's meaning", "Notice without diagnosing", "Let silence do useful work"], "narration": "Clients can feel when a coach is waiting to speak. Presence means releasing the pressure to perform, rescue, or produce a breakthrough. The coach follows the client's language, notices changes in energy, and allows enough silence for thought to develop. Presence is not passivity. It is disciplined attention that makes the next question more accurate.", "lenses": [{"insight": "The coach regulates the pace before guiding it.", "prompt": "Are you listening or preparing?"}, {"insight": "Meaning belongs to the client.", "prompt": "Which word deserves reflection?"}, {"insight": "Observations invite; interpretations impose.", "prompt": "Can you describe what you noticed neutrally?"}, {"insight": "Silence can support ownership.", "prompt": "What happens if you wait three seconds?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Listen beneath the sentence", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘Fine. I just won't ask for help anymore.’ What is the strongest first response?", "options": ["Good, independence is healthy", "I hear resignation beneath that sentence. What happened just before you decided not to ask?", "Your partner is emotionally unavailable"], "correct": 1, "feedback": ["This misses the emotional meaning.", "Correct. It reflects tentatively and returns to the client's experience.", "This diagnoses an absent person without evidence."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘Fine. I just won't ask for help anymore.’ What is the strongest first response?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Reflect content and emotion", "kicker": "LISTENING SKILL · REFLECTION", "body": ["Content: the event", "Emotion: the felt experience", "Meaning: why it matters", "Check accuracy"], "narration": "Reflection is more than repeating words. A useful reflection condenses the event and offers a tentative emotional meaning: ‘You prepared carefully, and being interrupted left you feeling unimportant.’ Then the coach checks accuracy. The phrase ‘Did I get that?’ protects the client from being defined by the coach's interpretation.", "lenses": [{"insight": "Condense rather than echo.", "prompt": "What is the central event?"}, {"insight": "Use tentative emotional language.", "prompt": "Does ‘disappointed’ fit better than ‘angry’?"}, {"insight": "Connect feeling to meaning.", "prompt": "Why did this moment matter?"}, {"insight": "Invite correction.", "prompt": "What did the coach miss?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Clarify before solving", "kicker": "LISTENING SKILL · CLARIFICATION", "body": ["Define vague words", "Separate events", "Locate the key moment", "Confirm the desired focus"], "narration": "Words such as ignored, unsupported, toxic, selfish, and unsafe can carry many meanings. Clarification asks what the word looks like in behavior. It separates a week of events from the one moment that matters most and asks what would be useful today. This gives the session direction without dismissing the wider story.", "lenses": [{"insight": "Vague language hides actionable detail.", "prompt": "What did ‘ignored’ look like?"}, {"insight": "Separate the sequence.", "prompt": "Which event came first?"}, {"insight": "Find the turning point.", "prompt": "When did the conversation change?"}, {"insight": "Choose a session outcome.", "prompt": "What would be useful before we finish?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Summaries create a shared map", "kicker": "LISTENING SKILL · SYNTHESIS", "body": ["Name the pattern", "Hold both truths", "Identify the tension", "Return ownership"], "narration": "A summary gathers what has emerged without turning it into a verdict. The coach might say: ‘You want closeness, and you also pull away when conflict feels unpredictable. You are trying to protect peace, but the silence leaves you disconnected.’ A strong summary makes complexity visible and ends with an invitation: ‘What feels most important in that?’", "lenses": [{"insight": "Patterns are offered as hypotheses.", "prompt": "Does the client recognize it?"}, {"insight": "Both truths reduce false choices.", "prompt": "What two needs coexist?"}, {"insight": "Tension often points to the work.", "prompt": "What price does protection create?"}, {"insight": "The client chooses the meaning.", "prompt": "What stands out to them?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Emotional bids: small reaches for connection", "kicker": "NOTICE THE INVITATION", "body": ["Sharing a detail", "Asking for attention", "Offering affection", "Requesting reassurance or help"], "narration": "Connection is often built through small bids rather than dramatic conversations. A bid may sound like ‘Look at this,’ ‘Can I tell you about my day?’ or ‘Will you sit with me?’ Clients may miss bids because they are distracted, guarded, or expecting a different form of care. Coaching helps them identify the bid, the response, and the meaning they assigned—without creating a scorecard of perfection.", "lenses": [{"insight": "Bids can be subtle.", "prompt": "What invitation was hidden in the sentence?"}, {"insight": "Attention is a relational behavior.", "prompt": "How was the bid answered?"}, {"insight": "Care may be offered in different forms.", "prompt": "What response was expected?"}, {"insight": "Patterns matter more than one miss.", "prompt": "What happens over time?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Turning toward, away, or against", "kicker": "RESPONSES TO CONNECTION", "body": ["Toward: engage", "Away: miss or avoid", "Against: reject or attack", "Repair: return and reconnect"], "narration": "When a bid appears, the response can move toward it, away from it, or against it. Turning toward may be brief: eye contact and ‘Tell me more.’ Turning away may be distraction or avoidance. Turning against adds criticism or contempt. No relationship responds perfectly. The useful questions are whether the pattern is acknowledged, whether repair is possible, and whether both people retain dignity and safety.", "lenses": [{"insight": "Engagement can be small and sincere.", "prompt": "What response would communicate presence?"}, {"insight": "A missed bid can be named without accusation.", "prompt": "What was the impact?"}, {"insight": "Contempt is different from ordinary distraction.", "prompt": "Is there a harmful pattern?"}, {"insight": "Return matters.", "prompt": "What repair is possible now?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Identify the bid", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is most clearly a bid for connection?", "options": ["You never care about anything", "Would you sit with me for ten minutes while I tell you what happened?", "If you loved me, you would already know"], "correct": 1, "feedback": ["This is a global accusation, not a clear bid.", "Correct. It names a specific, doable invitation.", "This requires mind reading and uses pressure."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement is most clearly a bid for connection?", "audio": "audio_scene_12.mp3", "image": "assets_scene_12.webp"}, {"kind": "teaching", "title": "Needs are human; strategies are negotiable", "kicker": "SEPARATE WHAT MATTERS FROM HOW", "body": ["Need: connection", "Strategy: immediate reply", "Need: respect", "Strategy: agreement"], "narration": "A need names a human value such as respect, rest, clarity, belonging, autonomy, support, or reliability. A strategy is one way to meet it. Conflict intensifies when a strategy is treated as the only proof of care. Coaching helps the client honor the need while expanding possible strategies. This preserves self-respect without demanding that another adult comply with one exact solution.", "lenses": [{"insight": "The need deserves acknowledgment.", "prompt": "What human value is present?"}, {"insight": "A strategy is only one route.", "prompt": "What other actions could support the need?"}, {"insight": "Agreement is not the same as respect.", "prompt": "What behavior would show respect?"}, {"insight": "Choice reduces coercion.", "prompt": "Which options remain acceptable?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.webp"}, {"kind": "teaching", "title": "Name emotion with precision", "kicker": "EMOTIONAL LITERACY", "body": ["Angry may include hurt", "Anxious may include uncertainty", "Numb may include overwhelm", "Jealous may include fear or longing"], "narration": "Precise emotional language creates better choices. ‘Upset’ can conceal disappointment, embarrassment, loneliness, fear, or grief. The coach offers language gently and lets the client correct it. Emotional literacy is not diagnosis. It is a way to connect inner experience with values, needs, and action.", "lenses": [{"insight": "Broad labels can be refined.", "prompt": "What feeling is closest?"}, {"insight": "Feelings provide information, not commands.", "prompt": "What does the emotion point toward?"}, {"insight": "Numbness may protect from overload.", "prompt": "What pace feels workable?"}, {"insight": "The client owns the word.", "prompt": "What description fits their experience?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.webp"}, {"kind": "teaching", "title": "Self-validation before communication", "kicker": "STAY WITH YOURSELF FIRST", "body": ["This feeling makes sense", "The feeling is not the whole story", "My need deserves language", "I can choose my response"], "narration": "Self-validation means acknowledging the understandable experience without declaring every interpretation true. A client can say, ‘It makes sense that I feel hurt after being excluded. I do not yet know why it happened. I can ask for information and decide what I need.’ This combines compassion, reality, and agency.", "lenses": [{"insight": "Validation reduces internal conflict.", "prompt": "Why does the feeling make sense?"}, {"insight": "Reality checking prevents certainty from fear.", "prompt": "What remains unknown?"}, {"insight": "Needs can be named without shame.", "prompt": "What matters here?"}, {"insight": "Agency returns through choice.", "prompt": "What response fits the client's values?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.webp"}, {"kind": "teaching", "title": "The anatomy of defensiveness", "kicker": "PROTECTION UNDER PRESSURE", "body": ["Perceived accusation", "Threat to identity", "Protective reaction", "Lost information and connection"], "narration": "Defensiveness often begins when feedback feels like a verdict about character. The listener explains, counterattacks, minimizes, or withdraws to protect identity. The reaction may be understandable and still prevent learning. Coaches help clients slow the moment, separate behavior from worth, and search for the useful information inside imperfect feedback.", "lenses": [{"insight": "A threat response can begin before reflection.", "prompt": "What accusation did the client hear?"}, {"insight": "Identity and behavior are different.", "prompt": "Can one action be examined without global shame?"}, {"insight": "Protection has a short-term payoff.", "prompt": "What did defensiveness prevent?"}, {"insight": "Lost information can be recovered.", "prompt": "What part of the feedback may be useful?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.webp"}, {"kind": "teaching", "title": "Four common defensive moves", "kicker": "NOTICE WITHOUT SHAMING", "body": ["Explaining before listening", "Counter-complaining", "Minimizing impact", "Shutting down or leaving"], "narration": "Clients may defend by explaining intent before hearing impact, introducing the other person's failures, minimizing the event, or ending the exchange. The coach names the sequence neutrally. ‘When you heard criticism, you explained. When that did not work, you countered. What were you hoping to protect?’ Curiosity creates accountability without humiliation.", "lenses": [{"insight": "Explanation can arrive too early.", "prompt": "Has impact been heard first?"}, {"insight": "Counter-complaints change the subject.", "prompt": "Can issues be handled one at a time?"}, {"insight": "Minimizing blocks repair.", "prompt": "What impact needs acknowledgment?"}, {"insight": "A pause needs a return plan.", "prompt": "When will the conversation resume?"}], "audio": "audio_scene_17.mp3", "image": "assets_scene_17.webp"}, {"kind": "question", "title": "Checkpoint 3 · Respond to defensiveness", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I only interrupted because she took forever to get to the point.’ What is the strongest coaching response?", "options": ["She probably was talking too long", "Before we examine her delivery, what impact might repeated interruption have had?", "You are a bad listener"], "correct": 1, "feedback": ["This joins the defense and skips impact.", "Correct. It examines behavior without attacking identity.", "Global shame is not useful accountability."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I only interrupted because she took forever to get to the point.’ What is the strongest coaching response?", "audio": "audio_scene_18.mp3", "image": "assets_scene_18.webp"}, {"kind": "teaching", "title": "Regulate the conversation, not the person", "kicker": "PACE CREATES CHOICE", "body": ["Pause escalation", "Orient to the present", "Lower speed and volume", "Choose a time-bound return"], "narration": "Coaches can help clients prepare for difficult conversations by planning how they will notice activation and pause. Regulation does not mean suppressing emotion or managing another person. It means staying connected to enough choice to speak clearly. If a pause is needed, name the purpose and a realistic return time rather than disappearing.", "lenses": [{"insight": "A pause interrupts automatic escalation.", "prompt": "What signal means it is time to pause?"}, {"insight": "Present orientation reduces tunnel vision.", "prompt": "What is true right now?"}, {"insight": "Slower delivery improves comprehension.", "prompt": "What sentence matters most?"}, {"insight": "Return protects trust.", "prompt": "When can the client re-engage?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "From accusation to observation", "kicker": "DESCRIBE WITHOUT A VERDICT", "body": ["Not: You never listen", "Try: I was interrupted three times", "Not: You do not care", "Try: You did not respond to my request"], "narration": "Global statements invite argument because they combine behavior, motive, and character. Observation names what a camera or message record could show. It is not emotionless or weak. It creates a shared starting point. The client can then name the personal impact without presenting that impact as proof of another person's intent.", "lenses": [{"insight": "Specific events are easier to discuss.", "prompt": "What happened, when, and how often?"}, {"insight": "Avoid mind reading.", "prompt": "What motive is being assumed?"}, {"insight": "Impact still deserves language.", "prompt": "How did the event affect the client?"}, {"insight": "Patterns require evidence over time.", "prompt": "Is this isolated or repeated?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.webp"}, {"kind": "teaching", "title": "The Roux clear-conversation sequence", "kicker": "OBSERVATION · EXPERIENCE · VALUE · REQUEST", "body": ["When this happened…", "I felt and experienced…", "Because this matters…", "Would you be willing to…"], "narration": "The Roux sequence begins with an observable event, moves to the client's experience, names the value or need underneath, and ends with one specific request. For example: ‘When our plans changed and I did not hear from you, I felt unimportant and had to rearrange my evening. Reliability matters to me. Would you send a short message when plans change?’ The request is clear and still allows choice.", "lenses": [{"insight": "Observation grounds the conversation.", "prompt": "What can both people recognize?"}, {"insight": "Experience uses ownership language.", "prompt": "What happened inside the client?"}, {"insight": "Value reveals why it matters.", "prompt": "Which standard is present?"}, {"insight": "A request makes success visible.", "prompt": "Is it specific and doable?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "teaching", "title": "Requests are not demands", "kicker": "CLARITY WITH AUTONOMY", "body": ["Specific and present", "Allows a real no", "Invites discussion", "Does not threaten worth or belonging"], "narration": "A request becomes a demand when refusal is punished through threats, contempt, withdrawal of basic respect, or manipulation. A healthy request is specific, connected to a need, and open to dialogue. The other person may decline. The client then decides what that response means for compatibility, participation, and boundaries.", "lenses": [{"insight": "Specificity reduces guessing.", "prompt": "What exact behavior is requested?"}, {"insight": "Autonomy includes the possibility of refusal.", "prompt": "Can the other person answer honestly?"}, {"insight": "Dialogue may produce another strategy.", "prompt": "What alternatives could meet the need?"}, {"insight": "The client retains choice after the answer.", "prompt": "What will they decide?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.webp"}, {"kind": "teaching", "title": "Boundaries complete the communication", "kicker": "WHAT I WILL DO", "body": ["Name the condition", "State your action", "Keep it proportionate", "Follow through without punishment"], "narration": "A boundary is not a rule imposed on another adult. It describes how the client will participate. ‘If voices become insulting, I will pause the conversation and revisit it tomorrow.’ ‘If plans continue changing without communication, I will stop holding the evening open.’ Boundaries protect dignity when requests are not honored or a situation remains harmful.", "lenses": [{"insight": "Conditions should be observable.", "prompt": "What behavior activates the boundary?"}, {"insight": "The action belongs to the client.", "prompt": "Can they carry it out?"}, {"insight": "Proportion protects credibility.", "prompt": "Does the response fit the situation?"}, {"insight": "Follow-through is not revenge.", "prompt": "How can it remain calm and clear?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.webp"}, {"kind": "question", "title": "Checkpoint 4 · Request or boundary?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is a self-owned boundary?", "options": ["You must stop raising your voice", "If the conversation becomes insulting, I will pause and return tomorrow", "You are not allowed to disagree"], "correct": 1, "feedback": ["This directs another adult rather than naming the client's action.", "Correct. The condition and self-owned action are clear.", "A boundary does not erase disagreement."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement is a self-owned boundary?", "audio": "audio_scene_24.mp3", "image": "assets_scene_24.webp"}, {"kind": "teaching", "title": "Receive feedback without collapsing", "kicker": "ACCOUNTABILITY WITHOUT SHAME", "body": ["Listen for impact", "Ask one clarifying question", "Own the accurate part", "Choose a repair or change"], "narration": "Receiving feedback requires enough self-worth to examine behavior without becoming globally bad. The client can breathe, summarize what they heard, ask for one example, and own the part that is accurate. They do not need to agree with every interpretation. Accountability is strongest when it is specific and connected to future behavior.", "lenses": [{"insight": "Impact can be heard before intent is explained.", "prompt": "What did the other person experience?"}, {"insight": "One example creates clarity.", "prompt": "What behavior is being discussed?"}, {"insight": "Partial ownership is still meaningful.", "prompt": "What can the client honestly own?"}, {"insight": "Change makes accountability credible.", "prompt": "What will be different next time?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.webp"}, {"kind": "teaching", "title": "Give feedback with dignity", "kicker": "BEHAVIOR · IMPACT · NEED · INVITATION", "body": ["Describe one behavior", "Name the impact", "Avoid character verdicts", "Invite response and next steps"], "narration": "Effective feedback is narrow enough to use. It describes a behavior, explains its impact, names what matters, and invites response. ‘When you checked your phone while I was presenting, I lost my place and felt dismissed. Attention matters in these meetings. Can we agree on how phones will be handled?’ This is stronger than collecting months of resentment into one overwhelming indictment.", "lenses": [{"insight": "One behavior keeps the conversation workable.", "prompt": "What is the clearest example?"}, {"insight": "Impact explains significance.", "prompt": "What consequence followed?"}, {"insight": "Character attacks trigger defense.", "prompt": "Can the label be removed?"}, {"insight": "Invitation supports collaboration.", "prompt": "What agreement is needed?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.webp"}, {"kind": "teaching", "title": "Repair is more than an apology", "kicker": "ACKNOWLEDGE · OWN · REPAIR · CHANGE", "body": ["Name what happened", "Own your part without excuses", "Ask what repair would help", "Demonstrate change over time"], "narration": "An apology can open repair, but trust returns through congruent behavior. A useful repair names the event and impact, owns the relevant part without a disguised excuse, asks what would help, and follows through. The harmed person retains the right to need time, decline immediate closeness, or decide the pattern is no longer acceptable.", "lenses": [{"insight": "Specific acknowledgment shows understanding.", "prompt": "What exactly is being repaired?"}, {"insight": "Ownership avoids ‘but.’", "prompt": "Can intent wait until impact is heard?"}, {"insight": "Repair is collaborative, not owed forgiveness.", "prompt": "What support is requested?"}, {"insight": "Consistency rebuilds evidence.", "prompt": "What behavior must change?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.webp"}, {"kind": "teaching", "title": "When repair does not happen", "kicker": "DISCERNMENT, NOT ENDLESS EXPLAINING", "body": ["Repeated dismissal", "Promises without change", "Punishment for speaking", "Increasing fear or self-erasure"], "narration": "Some clients assume that better wording will make every relationship responsive. Communication skill cannot create mutuality by itself. If reasonable requests are repeatedly mocked, ignored, punished, or used against the client, the coaching focus shifts from perfect phrasing to evidence, standards, support, safety, and choice. Regulation should never train someone to tolerate chronic harm.", "lenses": [{"insight": "Repeated behavior is important evidence.", "prompt": "What pattern is documented?"}, {"insight": "Words and actions must align.", "prompt": "What changed after the promise?"}, {"insight": "Punishment changes the safety assessment.", "prompt": "Can the client speak freely?"}, {"insight": "Self-respect may require distance.", "prompt": "What choice protects dignity?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.webp"}, {"kind": "teaching", "title": "Prepare for a difficult conversation", "kicker": "BEFORE · DURING · AFTER", "body": ["Choose one purpose", "Plan a regulated opening", "Listen and request", "Review behavior, not fantasy"], "narration": "Preparation reduces the temptation to say everything at once. The client chooses one purpose, a workable time and place, a concise opening, and a pause plan. During the conversation, they listen for the other person's perspective without surrendering their own. Afterward, they review what was said, what was done, and whether the exchange supports trust.", "lenses": [{"insight": "One purpose prevents overload.", "prompt": "What must this conversation accomplish?"}, {"insight": "Timing affects capacity.", "prompt": "When can both people participate?"}, {"insight": "Listening and self-respect coexist.", "prompt": "What needs to be understood on both sides?"}, {"insight": "Evidence guides the next choice.", "prompt": "What happened after the conversation?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "teaching", "title": "Case study: Elena", "kicker": "LISTEN BEFORE YOU SCRIPT", "body": ["Long explanations", "Sister becomes defensive", "Elena feels abandoned", "Need: acknowledgment and respectful turn-taking"], "narration": "Elena says she has explained the issue many times, yet every conversation ends with her sister defending herself or leaving. Elena prepares even longer speeches because she is desperate to be understood. Begin by validating the loneliness without assuming the sister's motive. Then map the cycle: Elena overexplains, her sister feels accused, defense rises, and Elena experiences the withdrawal as proof that her needs do not matter.", "lenses": [{"insight": "The presenting problem is not only wording.", "prompt": "What cycle repeats?"}, {"insight": "Defensiveness may protect identity.", "prompt": "What accusation might the sister hear?"}, {"insight": "Elena's pain deserves language.", "prompt": "What does withdrawal mean to her?"}, {"insight": "A need can become a request.", "prompt": "What behavior would feel respectful?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.webp"}, {"kind": "teaching", "title": "Coach Elena's next ten minutes", "kicker": "REGULATE · CLARIFY · CHOOSE", "body": ["Slow the urgency to explain", "Name the central experience", "Create one request", "Prepare a boundary and review point"], "narration": "Help Elena reduce the conversation to one event, one impact, one value, and one request. She might say: ‘When I am interrupted before finishing, I feel dismissed. I want both of us to have a full turn. Would you listen for two minutes, then I will reflect your response before I answer?’ Elena also decides what she will do if the conversation becomes insulting or repeatedly ends without repair.", "lenses": [{"insight": "Less content can create more contact.", "prompt": "What is the essential sentence?"}, {"insight": "Impact is not a verdict about motive.", "prompt": "How can Elena own her experience?"}, {"insight": "The request is observable and reciprocal.", "prompt": "Can both people participate?"}, {"insight": "A boundary protects Elena's participation.", "prompt": "What will she do if respect disappears?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.webp"}, {"kind": "teaching", "title": "What the coach must not promise", "kicker": "COMMUNICATION HAS LIMITS", "body": ["No perfect script", "No control over response", "No guaranteed repair", "No obligation to remain"], "narration": "The coach cannot promise that calm words will produce empathy, reconciliation, or change. The client controls preparation, honesty, listening, requests, and boundaries—not another person's response. A successful coaching outcome may be clearer communication, clearer evidence, or a clearer decision. It is not necessarily preservation of the relationship.", "lenses": [{"insight": "Scripts support preparation, not control.", "prompt": "What can the client own?"}, {"insight": "Responses provide information.", "prompt": "What did the other person choose?"}, {"insight": "Repair requires participation from both people.", "prompt": "Is mutuality present?"}, {"insight": "Leaving may be a responsible choice.", "prompt": "What standard guides the client?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.webp"}, {"kind": "question", "title": "Checkpoint 5 · Coach Elena", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which plan best supports Elena?", "options": ["Give her a longer speech", "Clarify one event, impact, value, request, and self-owned boundary", "Diagnose her sister as avoidant"], "correct": 1, "feedback": ["More explanation may repeat the existing cycle.", "Correct. The plan is clear, reciprocal, and grounded in Elena's agency.", "Diagnosis is outside scope and does not solve the interaction."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which plan best supports Elena?", "audio": "audio_scene_33.mp3", "image": "assets_scene_33.webp"}, {"kind": "teaching", "title": "Communication across different styles", "kicker": "ADAPT WITHOUT SELF-ERASURE", "body": ["Direct or reflective", "Fast or deliberate", "Verbal or written", "Connection and autonomy needs"], "narration": "People differ in processing speed, directness, emotional vocabulary, culture, disability, and preferred channel. Adaptation can support understanding: allowing preparation time, using writing, asking one question at a time, or scheduling a return. Adaptation should not require either person to abandon dignity, consent, accessibility, or essential standards.", "lenses": [{"insight": "Style differences are not moral failures.", "prompt": "What format supports comprehension?"}, {"insight": "Processing time can be negotiated.", "prompt": "What return time is realistic?"}, {"insight": "Accessibility may require accommodation.", "prompt": "What barrier can be reduced?"}, {"insight": "Adaptation has limits.", "prompt": "What standard cannot be surrendered?"}], "audio": "audio_scene_34.mp3", "image": "assets_scene_34.webp"}, {"kind": "teaching", "title": "Coaching women who feel emotionally abandoned", "kicker": "VALIDATE · VERIFY · STRENGTHEN", "body": ["Honor the loneliness", "Examine repeated evidence", "Name needs and standards", "Build support, request, boundary, and choice"], "narration": "Do not tell a woman to become less sensitive before examining the relationship. Validate the impact, clarify the repeated behavior, and distinguish a trigger from a genuine pattern of unavailability or dismissal. Help her strengthen support, name what partnership means to her, make a direct request, and decide what she will do if the pattern continues. Regulation supports discernment; it does not excuse neglect.", "lenses": [{"insight": "Loneliness deserves acknowledgment.", "prompt": "What has she been carrying alone?"}, {"insight": "Evidence prevents both minimization and certainty.", "prompt": "What pattern exists over time?"}, {"insight": "Standards make needs actionable.", "prompt": "What does partnership require?"}, {"insight": "Choice reduces helplessness.", "prompt": "What will she do with the evidence?"}], "audio": "audio_scene_35.mp3", "image": "assets_scene_35.webp"}, {"kind": "teaching", "title": "Communication and attachment patterns", "kicker": "USE A LENS, NOT A LABEL", "body": ["Anxiety may pursue", "Avoidance may withdraw", "Fear may alternate", "Security can be practiced"], "narration": "Attachment patterns can help explain why one person pursues while another withdraws, but the language must remain tentative and non-diagnostic. The coach works with observable behavior: repeated messages, silence, escalation, time-bound pauses, repair, and responsiveness. Pattern language should increase compassion and choice—not excuse harm or assign permanent identities.", "lenses": [{"insight": "Pursuit may protect connection.", "prompt": "What relief does it promise?"}, {"insight": "Withdrawal may protect from overwhelm.", "prompt": "Is there a clear return?"}, {"insight": "Alternation can create instability.", "prompt": "What sequence repeats?"}, {"insight": "Security is behavioral practice.", "prompt": "What action supports both connection and autonomy?"}], "audio": "audio_scene_36.mp3", "image": "assets_scene_36.webp"}, {"kind": "teaching", "title": "When coaching is not enough", "kicker": "REFERRAL AND SAFETY RED FLAGS", "body": ["Threats, stalking, or coercive control", "Self-harm, suicide, or immediate danger", "Severe impairment, panic, dissociation, or trauma symptoms", "Addiction, legal, medical, or clinical treatment needs"], "narration": "Communication tools are not the intervention for abuse, crisis, or serious clinical impairment. If a client reports threats, stalking, coercive control, immediate danger, self-harm, severe symptoms, or inability to function, prioritize safety and appropriate qualified support. Do not use couples-style communication exercises where disclosure may increase danger. Follow applicable laws, emergency procedures, and professional guidance.", "lenses": [{"insight": "Abuse is not a communication mismatch.", "prompt": "What safety concern is present?"}, {"insight": "Immediate danger requires immediate support.", "prompt": "What emergency resource applies?"}, {"insight": "Clinical symptoms need licensed care.", "prompt": "Should coaching pause or coordinate?"}, {"insight": "Scope is an ethical strength.", "prompt": "What referral is appropriate?"}], "audio": "audio_scene_37.mp3", "image": "assets_scene_37.webp"}, {"kind": "question", "title": "Checkpoint 6 · Safety before communication", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says her partner monitors her phone and threatens her when she asks for privacy. What is the strongest response?", "options": ["Teach her a softer opening", "Prioritize safety and connect her with appropriate qualified or emergency support", "Ask both partners to compromise"], "correct": 1, "feedback": ["Softer wording is not a safety intervention.", "Correct. Coercive control requires safety-focused, qualified support.", "Compromise is not appropriate framing for abuse."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says her partner monitors her phone and threatens her when she asks for privacy. What is the strongest response?", "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Guided practice plan", "kicker": "USE THE WORKBOOK", "body": ["Map five listening layers", "Rewrite accusation as observation", "Create request and boundary", "Plan repair and referral threshold"], "narration": "Choose one manageable conversation rather than the most dangerous or traumatic event in your life. Map the words, emotion, meaning, need, and request. Identify your protective move and its cost. Write a concise opening, a specific request, and a boundary you own. If the situation includes abuse, crisis, severe impairment, or clinical symptoms, do not use the exercise as a substitute for qualified support.", "lenses": [{"insight": "Practice should be appropriately challenging.", "prompt": "Is this safe for self-directed work?"}, {"insight": "Specificity makes learning transferable.", "prompt": "What exact event will be used?"}, {"insight": "Requests and boundaries serve different roles.", "prompt": "Has each been written correctly?"}, {"insight": "Scope belongs in every plan.", "prompt": "What would stop the exercise?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "The Roux Life communication standard", "kicker": "CLARITY WITHOUT CONTROL", "body": ["Listen for the whole meaning", "Speak with ownership", "Request without coercion", "Repair, set boundaries, and refer responsibly"], "narration": "Healthy communication does not guarantee agreement. It creates the best available conditions for truth, dignity, responsibility, and informed choice. Roux Life coaches listen beneath positions, help clients name emotions and needs, translate insight into clear requests, and preserve boundaries when reciprocity is absent. We do not diagnose, rescue, force repair, or ask communication skills to solve unsafe situations.", "lenses": [{"insight": "Listening protects complexity.", "prompt": "What remains unheard?"}, {"insight": "Ownership reduces blame.", "prompt": "What belongs to the client?"}, {"insight": "Requests preserve autonomy.", "prompt": "Is a real choice possible?"}, {"insight": "Boundaries and referral protect dignity.", "prompt": "What is the responsible next step?"}], "audio": "audio_scene_40.mp3", "image": "assets_scene_40.webp"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;
const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 10</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 10</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Emotional Connection and Healthy Communication';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson10PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
