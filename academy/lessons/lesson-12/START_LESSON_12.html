ht": "Gather observable evidence related to understand conflict before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how prepare the message shapes the client's interpretation without treating the interpretation as fact.", "prompt": "What meaning did the client makeâ€”and what else may be possible?"}, {"insight": "Translate navigate response into a value, need, or request the client can communicate cleanly.", "prompt": "What matters enough to name directly?"}, {"insight": "Turn repair and follow through into one client-owned behavior that preserves dignity and choice.", "prompt": "What can the client say or do next?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.png"}, {"kind": "teaching", "title": "Conflict reveals a difference that matters", "kicker": "A USEFUL REFRAME", "body": ["Two realities are present", "Expectations may differ", "A value or need is activated", "A decision requires attention"], "narration": "Conflict appears when differences in perception, expectation, priority, value, need, boundary, or impact become important. It is not automatically hostility. Avoiding every difference can create distance and resentment, while aggressive confrontation can create fear. Coaching helps clients approach conflict as information that requires clarity and choice.", "lenses": [{"insight": "Gather observable evidence related to two realities are present before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how expectations may differ shapes the client's interpretation without treating the interpretation as fact.", "prompt": "What meaning did the client makeâ€”and what else may be possible?"}, {"insight": "Translate a value or need is activated into a value, need, or request the client can communicate cleanly.", "prompt": "What matters enough to name directly?"}, {"insight": "Turn a decision requires attention into one client-owned behavior that preserves dignity and choice.", "prompt": "What can the client say or do next?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.png"}, {"kind": "teaching", "title": "The goal is not to win", "kicker": "CLARITY OVER VICTORY", "body": ["Understand before persuading", "Represent yourself honestly", "Protect the other person's agency", "Choose the next responsible step"], "narration": "A winning mindset turns conversation into a courtroom. The client gathers evidence only for their side and listens for weakness. A coaching mindset asks a different question: what needs to become clearer so I can act with integrity? The client can advocate firmly without requiring the other person to surrender their perspective.", "lenses": [{"insight": "Gather observable evidence related to understand before persuading before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how represent yourself honestly shapes the client's interpretation without treating the interpretation as fact.", "prompt": "What meaning did the client makeâ€”and what else may be possible?"}, {"insight": "Translate protect the other person's agency into a value, need, or request the client can communicate cleanly.", "prompt": "What matters enough to name directly?"}, {"insight": "Turn choose the next responsible step into one client-owned behavior that preserves dignity and choice.", "prompt": "What can the client say or do next?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.png"}, {"kind": "teaching", "title": "Five common conflict patterns", "kicker": "NOTICE THE DEFAULT", "body": ["Avoid and accommodate", "Attack and blame", "Overexplain and persuade", "Withdraw and punish"], "narration": "Clients often protect themselves through avoidance, accommodation, attack, excessive explanation, or punishing withdrawal. A fifth pattern is false resolution: agreeing publicly while resisting privately. These strategies may provide short-term relief, but often increase confusion. The coach names observable patterns without labeling the client or diagnosing attachment or personality.", "lenses": [{"insight": "Gather observable evidence related to avoid and accommodate before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how attack and blame shapes the client's interpretation without treating the interpretation as fact.", "prompt": "What meaning did the client makeâ€”and what else may be possible?"}, {"insight": "Translate overexplain and persuade into a value, need, or request the client can communicate cleanly.", "prompt": "What matters enough to name directly?"}, {"insight": "Turn withdraw and punish into one client-owned behavior that preserves dignity and choice.", "prompt": "What can the client say or do next?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.png"}, {"kind": "question", "title": "Checkpoint 1 Â· Reframe the goal", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "What is the strongest goal for a difficult conversation?", "options": ["Make the other person admit fault", "Create clarity, communicate honestly, preserve agency, and choose a next step", "Avoid all discomfort"], "correct": 1, "feedback": ["Forced admission is control, not shared clarity.", "Correct. The process can succeed even without agreement.", "Discomfort may be part of responsible honesty."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. What is the strongest goal for a difficult conversation?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.png"}, {"kind": "teaching", "title": "Map the conflict before scripting it", "kicker": "FACT Â· STORY Â· FEELING Â· NEED Â· REQUEST", "body": ["Record observable facts", "Identify the story added", "Name feeling and impact", "Choose a request and next action"], "narration": "The Roux conflict map separates five layers that commonly become tangled. Facts are observable. Story is the meaning the client added. Feeling names emotional experience. Need or value explains what matters. Request asks for a concrete response. The client then chooses their own next action. Separation makes the conversation clearer and less accusatory.", "lenses": [{"insight": "Gather observable evidence related to record observable facts before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how identify the story added shapes the client's interpretation without treating the interpretation as fact.", "prompt": "What meaning did the client makeâ€”and what else may be possible?"}, {"insight": "Translate name feeling and impact into a value, need, or request the client can communicate cleanly.", "prompt": "What matters enough to name directly?"}, {"insight": "Turn choose a request and next action into one client-owned behavior that preserves dignity and choice.", "prompt": "What can the client say or do next?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.png"}, {"kind": "teaching", "title": "Facts keep the door open", "kicker": "OBSERVATION WITHOUT VERDICT", "body": ["Quote words accurately", "Name dates and behavior", "Avoid always and never", "Leave motive unassigned"], "narration": "Compare: â€˜You do not respect meâ€™ with â€˜The last three schedule changes were made after I had already arranged childcare.â€™ The second statement is specific and discussable. Facts do not erase emotional meaning; they create a shared starting point. The coach helps the client remove exaggeration, character judgment, and mind reading.", "lenses": [{"insight": "Gather observable evidence related to quote words accurately before deciding what the conflict means.", "prompt": "What was seen, heard, promised, or left undone?"}, {"insight": "Explore how name dates and behavior shapes the clien
