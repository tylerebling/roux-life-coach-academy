const scenes=[{"type": "hero", "title": "The ROUX Coaching Method", "kicker": "ROUX LIFE ACADEMY • LESSON 2", "body": ["Recognize.", "Open.", "Uncover.", "Execute."], "narration": "Welcome to the ROUX Coaching Method: Recognize, Open, Uncover, and Execute. This lesson gives beginning coaches a practical structure for guiding conversations without turning coaching into a rigid script. We will study each stage, watch the stages work together, practice choosing useful questions, and learn how to move toward action while preserving the client’s ownership.", "kind": "legacy", "source_slide": 1, "audio": "audio_scene_01.mp3", "image": "assets_cinematic_studio_opening.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"type": "roadmap", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Why a framework matters", "The four ROUX stages", "Questions for each stage", "A complete client conversation", "Common mistakes and ethical limits"], "narration": "We will begin by exploring why coaches need a framework. Then we will examine Recognize, Open, Uncover, and Execute one stage at a time. You will learn sample questions, observe a complete coaching conversation, and practice identifying what a client may need next. We will finish with common mistakes, ethical limits, and an application plan.", "kind": "legacy", "source_slide": 2, "audio": "audio_scene_02.mp3", "image": "assets_client_choice_path.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"kind": "teaching", "title": "Courage begins with not knowing", "kicker": "FROM EXPERT PERFORMANCE TO GROUNDED CURIOSITY", "body": ["Release the pressure to perform certainty", "Stay present when the answer is not obvious", "Let curiosity create the next useful question"], "narration": "Many beginning coaches believe confidence means knowing exactly what to say. In practice, the need to appear certain can become armor. It narrows listening and tempts the coach to solve the client too quickly. Courageous coaching often begins with a quieter sentence inside the coach: I do not know yet, and I am willing to stay curious. That stance is not incompetence. It is disciplined humility. The ROUX Method gives curiosity a reliable path so the coach can remain useful without pretending to possess the client’s answer.", "visual": "courageous_curiosity.webp", "layout": "steps", "audio": "audio_scene_03.mp3", "image": "assets_courageous_curiosity.webp", "lenses": [{"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"kind": "teaching", "title": "Vulnerability is not unlimited disclosure", "kicker": "APPROPRIATE EMOTIONAL COURAGE", "body": ["Vulnerability includes uncertainty, emotional exposure, and risk", "Professional courage is honest and boundaried", "The client—not the coach—remains the center", "Safety and consent shape how deeply the conversation goes"], "narration": "In this course, vulnerability means the willingness to face uncertainty, emotional exposure, or interpersonal risk in service of something meaningful. It does not mean telling everyone everything. It does not require the coach to share personal stories, and it never cancels professional boundaries. A coach may model honesty by saying, I want to slow down because I may be making an assumption. That is appropriate vulnerability: truthful, brief, and in service of the client. The purpose is not emotional display. The purpose is to protect trust and make honest exploration possible.", "visual": "values_in_action.webp", "layout": "contrast", "audio": "audio_scene_04.mp3", "image": "assets_values_in_action.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"kind": "question", "title": "Checkpoint 1 · Courageous coaching", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client asks, “Just tell me what to do.” Which response is strongest?", "options": ["I know this is hard, so I will choose the safest option for you.", "Before I offer any perspective, what feels most important for you to protect in this decision?", "I went through the same thing, and here is exactly what worked for me."], "correct": 1, "feedback": ["This takes ownership of the decision and assumes the coach can define safety for the client.", "Correct. It acknowledges the pressure while returning the conversation to the client’s values and ownership.", "Personal experience may be relevant later, with permission, but leading with it can replace the client’s context with the coach’s story."], "visual": "courageous_curiosity.webp", "narration": "Pause here and choose the response you believe best protects client ownership. A client asks, “Just tell me what to do.” Which response is strongest?", "audio": "audio_scene_05.mp3", "image": "assets_courageous_curiosity.webp"}, {"type": "content", "title": "Why beginning coaches need structure", "kicker": "CONFIDENCE WITHOUT CONTROL", "visual": "coaching_conversation.jpg", "body": ["Reduces pressure to have the answer", "Keeps the conversation purposeful", "Helps the coach listen for what matters", "Creates a reliable path toward action"], "narration": "Beginning coaches often believe they need a brilliant question every few seconds. That pressure makes genuine listening difficult. A framework reduces the need to perform. It gives the coach a reliable path while leaving room for the client’s story. Structure should make the coach more present, not more mechanical.", "kind": "legacy", "source_slide": 3, "audio": "audio_scene_06.mp3", "image": "assets_slide03_beginning_coach_structure_unique.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"type": "myth", "title": "A framework is not a script", "kicker": "IMPORTANT DISTINCTION", "body": ["A script tells you exactly what to say.", "A framework helps you understand what the conversation needs.", "The client determines the pace and depth.", "The coach remains responsive."], "narration": "A script can cause the coach to follow prepared words instead of the client. The ROUX Method works differently. It helps the coach notice what kind of work may be useful next. The stages can overlap, repeat, or occur in a different rhythm. The client’s readiness, consent, and needs remain more important than completing a sequence.", "kind": "legacy", "source_slide": 4, "audio": "audio_scene_07.mp3", "image": "assets_client_choice_path.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"type": "diagram", "title": "The four-stage pathway", "kicker": "THE ROUX MAP", "body": ["R — Recognize what is present", "O — Open honest exploration", "U — Uncover what matters beneath the surface", "X — Execute a meaningful next step"], "narration": "The method contains four stages. Recognize establishes the current reality. Open creates enough curiosity and emotional permission for honest exploration. Uncover identifies the values, beliefs, needs, fears, patterns, and practical conditions shaping the issue. Execute converts useful insight into a client-owned next step.", "kind": "legacy", "source_slide": 5, "audio": "audio_scene_08.mp3", "image": "assets_execute_doorway.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"type": "contrast", "title": "The coach owns the process—not the answer", "kicker": "CLIENT OWNERSHIP", "visual": "client_choice_path.jpg", "body": ["Coach: presence, questions, reflection, structure", "Client: truth, values, choices, action, responsibility"], "narration": "The coach is responsible for the integrity of the process. The client remains responsible for their truth, values, decisions, and actions. This division protects autonomy. A strong framework does not give the coach greater control over the client. It helps the coach offer a more disciplined form of support.", "kind": "legacy", "source_slide": 6, "audio": "audio_scene_09.mp3", "image": "assets_client_choice_path.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"kind": "teaching", "title": "Recognize facts, stories, and feelings", "kicker": "THREE LENSES FOR THE CURRENT REALITY", "body": ["FACT · What could a camera or calendar confirm?", "STORY · What meaning is the client assigning?", "FEELING · What emotional information is present?"], "narration": "Recognition becomes clearer when the coach helps separate facts, stories, and feelings. The fact might be, My manager did not invite me to two meetings. The story might be, My manager no longer respects me. The feeling might be embarrassment, anger, or fear. All three matter, but they are not interchangeable. If the coach treats the story as a verified fact, the session may move in the wrong direction. A precise recognition question is: What happened, what did you make it mean, and what feeling came with that meaning?", "visual": "belief_testing_evidence.webp", "layout": "three", "audio": "audio_scene_10.mp3", "image": "assets_belief_testing_evidence.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}]}, {"kind": "teaching", "title": "Name emotion without diagnosing", "kicker": "OBSERVATION BEFORE INTERPRETATION", "body": ["“Your voice became quieter.”", "“You paused before answering.”", "“I heard both relief and hesitation.”", "Then ask: “What is happening for you?”"], "narration": "Emotion belongs in coaching, but diagnosis does not. The coach can name observable changes in tone, pace, energy, or language without declaring what those changes mean. Compare two statements. You are afraid of success is an interpretation. I noticed you became quieter when you described success is an observation. The observation creates room for the client to confirm, correct, or deepen the meaning. This protects autonomy and reduces the risk that the coach’s confidence will overpower the client’s reality.", "visual": "courageous_curiosity.webp", "layout": "quote", "audio": "audio_scene_11.mp3", "image": "assets_courageous_curiosity.webp", "lenses": [{"insight": "Responsible referral protects the client. The coach names the limit without diagnosing, abandoning, or minimizing.", "prompt": "What support is this client asking coaching to provide that requires a licensed or emergency professional?"}, {"insight": "Responsible referral protects the client. The coach names the limit without diagnosing, abandoning, or minimizing.", "prompt": "What support is this client asking coaching to provide that requires a licensed or emergency professional?"}, {"insight": "Responsible referral protects the client. The coach names the limit without diagnosing, abandoning, or minimizing.", "prompt": "What support is this client asking coaching to provide that requires a licensed or emergency professional?"}, {"insight": "Responsible referral protects the client. The coach names the limit without diagnosing, abandoning, or minimizing.", "prompt": "What support is this client asking coaching to provide that requires a licensed or emergency professional?"}]}, {"kind": "question", "title": "Checkpoint 2 · Clean recognition", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is an observation rather than an interpretation?", "options": ["You are afraid of commitment.", "You always sabotage yourself when progress becomes real.", "You paused for several seconds before describing the promotion."], "correct": 2, "feedback": ["This assigns an internal cause that the client has not confirmed.", "This labels the client and turns a pattern into a fixed identity.", "Correct. It names something observable and leaves the meaning open for the client to explore."], "visual": "belief_testing_evidence.webp", "narration": "Pause here and choose the response you believe best protects client ownership. Which statement is an observation rather than an interpretation?", "audio": "audio_scene_12.mp3", "image": "assets_belief_testing_evidence.webp"}, {"type": "profile", "title": "R — Recognize", "kicker": "STAGE 1", "body": ["What happened?", "What is the client experiencing?", "What feels most important now?", "What outcome would make this conversation useful?"], "narration": "Recognize means understanding what is present before trying to improve it. Listen for the observable event, the client’s interpretation, emotional experience, repeated pattern, and immediate priority. The coach is not diagnosing the cause. The coach is helping the client describe the current reality clearly enough to choose a useful focus.", "kind": "legacy", "source_slide": 7, "audio": "audio_scene_13.mp3", "image": "assets_session_goal_objects.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}]}, {"type": "content", "title": "Separate event, meaning, and emotion", "kicker": "THREE DIFFERENT LAYERS", "body": ["Event: what could be observed", "Meaning: what the client believes it says", "Emotion: what the client feels in response"], "narration": "Clients often blend event, meaning, and emotion into one conclusion. A manager did not invite the client to a meeting. The client believes this proves they are not respected. They feel embarrassed and angry. All three layers matter, but they are not identical. Separating them creates more options for exploration.", "kind": "legacy", "source_slide": 8, "audio": "audio_scene_14.mp3", "image": "assets_belief_testing_evidence.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"type": "content", "title": "Recognize the session goal", "kicker": "WHAT WOULD BE USEFUL TODAY?", "body": ["Clarity", "A decision", "Preparation", "A boundary", "An experiment", "Accountability"], "narration": "A broad life concern is rarely a workable session goal. Ask what would make today’s conversation useful. The client may want clarity, a decision, preparation for a conversation, a boundary, a small experiment, or accountability. A clear session goal prevents the conversation from becoming an endless review of everything that is wrong.", "kind": "legacy", "source_slide": 9, "audio": "audio_scene_15.mp3", "image": "assets_session_goal_objects.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}]}, {"type": "checkpoint", "title": "Checkpoint: what belongs in Recognize?", "kicker": "PAUSE AND CHOOSE", "body": ["A. Tell the client what the problem really is", "B. Clarify the event, experience, and desired focus", "C. Require an action commitment immediately"], "narration": "Which response belongs in Recognize? The strongest answer is B: clarify the event, experience, and desired focus. Telling the client what the problem really is imposes the coach’s conclusion. Requiring immediate action moves too quickly. Recognition creates a shared understanding of where the conversation is beginning.", "kind": "legacy", "source_slide": 10, "audio": "audio_scene_16.mp3", "image": "assets_session_goal_objects.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}]}, {"kind": "teaching", "title": "Empathy is presence, not rescue", "kicker": "OPEN WITHOUT TAKING OVER", "body": ["Listen for the experience beneath the words", "Communicate: “You do not have to earn dignity here”", "Avoid minimizing, fixing, comparing, or forced optimism", "Return choice to the client"], "narration": "Empathy is the disciplined practice of trying to understand another person’s experience without making it about ourselves. In coaching, empathy does not mean agreeing with every conclusion or removing every discomfort. It means the client does not have to defend their humanity before they can examine their behavior. Rescue says, Let me make this feeling disappear. Empathy says, I can stay present while we understand what this feeling is asking you to notice. That difference allows challenge and accountability to occur without humiliation.", "visual": "courageous_curiosity.webp", "layout": "contrast", "audio": "audio_scene_17.mp3", "image": "assets_courageous_curiosity.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"kind": "teaching", "title": "The four moves that close a conversation", "kicker": "WHAT TO AVOID IN THE OPEN STAGE", "body": ["MINIMIZING · “It is not that bad.”", "FIXING · “Here is what you should do.”", "COMPARING · “At least you are not…”", "INTERROGATING · Rapid questions without emotional room"], "narration": "A conversation often closes when the coach rushes to minimize, fix, compare, or interrogate. Each move may come from good intentions, yet each communicates that the client’s actual experience is too uncomfortable to stay with. A better response combines acknowledgment and choice: This sounds important. Would it be more useful to understand what happened, explore what it brought up, or focus on what you want to do next? The coach remains purposeful while giving the client a meaningful say in the direction.", "visual": "curiosity_vs_interrogation.webp", "layout": "four", "audio": "audio_scene_18.mp3", "image": "assets_curiosity_vs_interrogation.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"kind": "question", "title": "Checkpoint 3 · Empathy without rescue", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, “I feel foolish for trusting them.” What is the best first response?", "options": ["You should not feel foolish. Anyone could have made that mistake.", "What did trusting them represent to you, and what feels most painful now?", "The important thing is to stop dwelling on it and create a new plan."], "correct": 1, "feedback": ["Reassurance can unintentionally argue with the client’s emotion before understanding it.", "Correct. It communicates respect, explores meaning, and does not reinforce the client’s self-judgment.", "Action may matter later, but moving there immediately bypasses the experience that needs recognition."], "visual": "courageous_curiosity.webp", "narration": "Pause here and choose the response you believe best protects client ownership. A client says, “I feel foolish for trusting them.” What is the best first response?", "audio": "audio_scene_19.mp3", "image": "assets_courageous_curiosity.webp"}, {"type": "profile", "title": "O — Open", "kicker": "STAGE 2", "body": ["Curiosity before correction", "Permission before depth", "Pace before pressure", "Listening before advice"], "narration": "Open means creating conditions where the client can examine the issue honestly. This requires more than asking questions. Tone, pace, silence, nonjudgment, and permission all matter. The coach does not force vulnerability. The coach invites exploration and respects the client’s right to choose how deeply to engage.", "kind": "legacy", "source_slide": 11, "audio": "audio_scene_20.mp3", "image": "assets_coaching_conversation.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"type": "content", "title": "Questions that open thinking", "kicker": "EXPAND THE VIEW", "body": ["What feels hardest to name?", "What might you be assuming?", "What else could be true?", "What have you not yet allowed yourself to consider?", "Where would you like to begin?"], "narration": "Opening questions expand rather than corner. They help the client consider what has been ignored, assumed, or avoided. Use one question at a time. Allow silence. Do not stack five questions together. A thoughtful pause often gives the client more room than another clever prompt.", "kind": "legacy", "source_slide": 12, "audio": "audio_scene_21.mp3", "image": "assets_coaching_conversation.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"type": "contrast", "title": "Curiosity versus interrogation", "kicker": "THE CLIENT SHOULD NOT FEEL ON TRIAL", "body": ["Curiosity: spacious, respectful, responsive", "Interrogation: rapid, leading, agenda-driven", "Curiosity follows meaning.", "Interrogation chases information."], "narration": "Curiosity feels different from interrogation. Curious coaching is spacious and responsive. Interrogation is rapid, leading, and driven by the coach’s agenda. If the client begins giving short defensive answers, the coach should slow down, acknowledge the pace, and ask what would help the conversation feel more useful.", "kind": "legacy", "source_slide": 13, "audio": "audio_scene_22.mp3", "image": "assets_curiosity_vs_interrogation.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"type": "practice", "title": "Use reflections—not only questions", "kicker": "HELP THE CLIENT HEAR THEMSELVES", "body": ["“You want change, and part of you is protecting the familiar.”", "“You sound relieved and disappointed at the same time.”", "“Freedom matters, but so does stability.”"], "narration": "Coaching is not a continuous interview. Reflections help clients hear their own complexity. A coach may reflect a tension, a value, an emotion, or a repeated phrase. The reflection should remain tentative. Say, I wonder if, or, It sounds as though, rather than declaring that you know the client better than they know themselves.", "kind": "legacy", "source_slide": 14, "audio": "audio_scene_23.mp3", "image": "assets_coaching_conversation.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"type": "checkpoint", "title": "Checkpoint: which response opens?", "kicker": "CLIENT SAYS: “I JUST HATE CONFLICT.”", "body": ["A. “You need to become comfortable with conflict.”", "B. “What happens inside you when disagreement begins?”", "C. “Start with the easiest person.”"], "narration": "The strongest opening response is B: what happens inside you when disagreement begins? It invites awareness without prescribing a solution. Option A judges and directs. Option C may eventually become a useful experiment, but it comes before the coach understands what conflict represents to the client.", "kind": "legacy", "source_slide": 15, "audio": "audio_scene_24.mp3", "image": "assets_curiosity_vs_interrogation.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"kind": "teaching", "title": "Shame turns behavior into identity", "kicker": "UNCOVER WITHOUT LABELING THE PERSON", "body": ["Behavior: “I avoided the conversation.”", "Identity verdict: “I am weak.”", "Coaching question: “What were you protecting?”", "Next question: “What response would better match your values?”"], "narration": "Shame collapses the difference between something a person did and who that person believes they are. A client may move from, I avoided the conversation, to, I am weak. The coach should not intensify that verdict. Instead, separate identity from behavior. The behavior can be examined honestly. Its impact can be acknowledged. Repair can be planned. The client’s whole worth does not need to be put on trial. A useful uncovering question is: What did avoidance protect in the short term, and what did it cost over time?", "visual": "accountability_repair.webp", "layout": "flow", "audio": "audio_scene_25.mp3", "image": "assets_accountability_repair.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"kind": "teaching", "title": "Accountability without humiliation", "kicker": "CLEAR-EYED, COMPASSIONATE REVIEW", "body": ["Name what happened accurately", "Acknowledge impact without exaggeration", "Identify choice and responsibility", "Design repair or a different practice"], "narration": "Compassion and accountability are not opposites. Compassion creates enough steadiness to tell the truth, while accountability converts truth into responsibility. The coach can help a client say, I missed the commitment, I understand the effect, and I am willing to learn from it. Humiliation says, This failure proves something defective about you. Shame-free accountability says, This result contains information. What will you own, repair, or change? Roux Life coaching is neither permissive nor punitive. It is honest, boundaried, and oriented toward useful action.", "visual": "accountability_repair.webp", "layout": "steps", "audio": "audio_scene_26.mp3", "image": "assets_accountability_repair.webp", "lenses": [{"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"kind": "question", "title": "Checkpoint 4 · Shame-aware accountability", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client missed a commitment for the third time. Which response is strongest?", "options": ["You clearly do not want this badly enough.", "It is completely fine; let us forget the commitment.", "The pattern matters. What are you willing to own, and what does the plan need to account for?"], "correct": 2, "feedback": ["This turns a behavioral pattern into a judgment about character and motivation.", "This removes accountability and loses the information contained in the repeated miss.", "Correct. It names the pattern, protects dignity, and invites ownership and a better-designed action."], "visual": "accountability_repair.webp", "narration": "Pause here and choose the response you believe best protects client ownership. A client missed a commitment for the third time. Which response is strongest?", "audio": "audio_scene_27.mp3", "image": "assets_accountability_repair.webp"}, {"type": "profile", "title": "U — Uncover", "kicker": "STAGE 3", "body": ["Values", "Beliefs", "Needs", "Fears", "Protective patterns", "Consequences and practical realities"], "narration": "Uncover is where the client identifies what is shaping the issue beneath the first description. This may include values, beliefs, needs, fears, protective patterns, consequences, resources, or real-world constraints. Uncovering is not searching for hidden trauma. It is identifying what is relevant to the client’s present choice.", "kind": "legacy", "source_slide": 16, "audio": "audio_scene_28.mp3", "image": "assets_uncover_layers.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"type": "diagram", "title": "The visible problem and the deeper drivers", "kicker": "LOOK BENEATH THE SURFACE", "body": ["Visible: “I need better time management.”", "Possible drivers: perfectionism, unclear priorities, exhaustion, fear of judgment, too many commitments"], "narration": "A client may ask for better time management, yet another planner may not solve the actual problem. The pattern may be driven by perfectionism, unclear priorities, exhaustion, fear of judgment, or commitments the client does not want. The coach remains open to practical and emotional explanations rather than assuming one hidden cause.", "kind": "legacy", "source_slide": 17, "audio": "audio_scene_29.mp3", "image": "assets_uncover_layers.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"type": "content", "title": "Questions that uncover meaning", "kicker": "GO DEEPER WITHOUT DIAGNOSING", "body": ["What are you protecting?", "What do you fear this decision may say about you?", "Which value feels threatened?", "What cost are you already paying?", "What need have you not acknowledged?"], "narration": "Uncovering questions explore meaning while staying within coaching scope. Ask what the client may be protecting, which value feels threatened, what cost is already being paid, or what need has not been acknowledged. Avoid labeling the client with a disorder, attachment style, or trauma response without appropriate clinical qualifications.", "kind": "legacy", "source_slide": 18, "audio": "audio_scene_30.mp3", "image": "assets_belief_testing_evidence.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"type": "content", "title": "Listen for competing commitments", "kicker": "TWO IMPORTANT THINGS CAN COLLIDE", "body": ["Success and privacy", "Connection and independence", "Security and freedom", "Honesty and belonging", "Rest and achievement"], "narration": "Clients are not always blocked by a lack of motivation. They may be committed to two important things that conflict. A client wants success and fears visibility. Another wants connection and protects independence. Naming both commitments reduces shame and helps the client design a response that respects more of what matters.", "kind": "legacy", "source_slide": 19, "audio": "audio_scene_31.mp3", "image": "assets_competing_commitments.webp", "lenses": [{"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"type": "formula", "title": "The belief-testing sequence", "kicker": "FROM CERTAINTY TO EXAMINATION", "body": ["What is the belief?", "What evidence supports it?", "What evidence complicates it?", "What does believing it make you do?", "What more useful belief could you test?"], "narration": "Belief testing does not require replacing every difficult thought with a positive statement. Begin by naming the belief. Examine supporting and complicating evidence. Identify what the belief causes the client to do. Then develop a more useful belief to test through behavior. The replacement should be credible, not artificially cheerful.", "kind": "legacy", "source_slide": 20, "audio": "audio_scene_32.mp3", "image": "assets_belief_testing_evidence.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"kind": "teaching", "title": "Values must become observable", "kicker": "FROM BEAUTIFUL WORDS TO BEHAVIOR", "body": ["VALUE · Courage", "BEHAVIOR · Make one clear request", "EVIDENCE · Request is made by Thursday", "SUPPORT · Rehearse the opening sentence"], "narration": "Values are not decorative words. A value becomes useful when it can guide observable behavior. If a client chooses courage, ask what courage would look like on an ordinary Tuesday. It might mean making one clear request, telling the truth without attacking, or declining a commitment that creates resentment. Then define evidence. How will the client know the value was practiced? Finally, identify support. The goal is not dramatic performance. The goal is repeated alignment between what matters and what the client actually does.", "visual": "values_in_action.webp", "layout": "ladder", "audio": "audio_scene_33.mp3", "image": "assets_values_in_action.webp", "lenses": [{"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "Emotional safety comes from pace, permission, and nonjudgment—not from avoiding a purposeful conversation.", "prompt": "Would it be useful to understand this more deeply before deciding what comes next?"}]}, {"kind": "teaching", "title": "Courage includes uncertainty", "kicker": "ACTION WITHOUT A GUARANTEED OUTCOME", "body": ["Control the preparation, not the response", "Choose behavior aligned with values", "Make room for discomfort", "Define success by integrity, not approval"], "narration": "A client can prepare carefully and still receive an uncertain response. Courage is not a guarantee of acceptance. It is the willingness to choose an aligned action while the outcome remains partly outside our control. The coach can help separate process success from outcome success. Process success might be speaking clearly, listening respectfully, and holding a boundary. Outcome success depends on other people and conditions. This distinction reduces the temptation to wait for perfect certainty before taking a meaningful step.", "visual": "values_in_action.webp", "layout": "compass", "audio": "audio_scene_34.mp3", "image": "assets_values_in_action.webp", "lenses": [{"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}, {"insight": "A value becomes useful when the client can translate it into a choice they can practice and review.", "prompt": "What would living this value look like in one observable action this week?"}]}, {"kind": "question", "title": "Checkpoint 5 · Values in action", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which action best translates the value of honesty into observable behavior?", "options": ["I will be a more honest person.", "I will tell my colleague by Thursday that I cannot complete both priorities and ask which one should come first.", "I will hope the situation becomes easier to discuss."], "correct": 1, "feedback": ["This is an aspiration, but it does not define observable behavior.", "Correct. It is specific, time-bound, respectful, and connected to a real decision.", "Hope may be present, but it does not create evidence that the value was practiced."], "visual": "values_in_action.webp", "narration": "Pause here and choose the response you believe best protects client ownership. Which action best translates the value of honesty into observable behavior?", "audio": "audio_scene_35.mp3", "image": "assets_values_in_action.webp"}, {"type": "scenario", "title": "Scenario: Elena wants to start a business", "kicker": "CLIENT CASE", "visual": "elena_business_scenario.jpg", "body": ["She makes progress, then stops.", "She calls herself undisciplined.", "Success would increase visibility.", "Her family criticizes risk."], "narration": "Elena wants to start a consulting business. She makes progress and stops whenever the work becomes visible. She describes herself as undisciplined. A productivity plan may help later, but first the coach should explore what progress means. Success could bring judgment, family conflict, new responsibility, or an identity change that feels risky.", "kind": "legacy", "source_slide": 21, "audio": "audio_scene_36.mp3", "image": "assets_elena_business_scenario.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"type": "checkpoint", "title": "Choose the strongest uncovering question", "kicker": "COACH ELENA", "body": ["A. “Which productivity app will you use?”", "B. “What becomes possible if the business succeeds—and what becomes uncomfortable?”", "C. “How many hours will you promise?”"], "narration": "The strongest response is B. It explores desire and resistance together. The other questions belong closer to execution. If the coach moves into scheduling too soon, Elena may create another plan without understanding why previous plans became difficult at the moment progress felt real.", "kind": "legacy", "source_slide": 22, "audio": "audio_scene_37.mp3", "image": "assets_elena_business_scenario.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"type": "profile", "title": "X — Execute", "kicker": "STAGE 4", "body": ["Turn insight into behavior", "Choose a meaningful next step", "Prepare for interference", "Define accountability", "Keep ownership with the client"], "narration": "Execute turns useful awareness into behavior. The next step may be an action, conversation, boundary, decision, experiment, information-gathering task, or referral. Execution should not be rushed. An impressive plan the client does not own is less valuable than a modest step the client is genuinely prepared to take.", "kind": "legacy", "source_slide": 23, "audio": "audio_scene_38.mp3", "image": "assets_execute_doorway.webp", "lenses": [{"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"type": "formula", "title": "An action step that can survive real life", "kicker": "THE FIVE-POINT TEST", "body": ["Specific", "Realistic", "Meaningful", "Client-owned", "Connected to the insight"], "narration": "Use five tests for an action step. Is it specific enough to understand? Realistic within the client’s current life? Meaningful rather than busywork? Chosen by the client? Connected to what the conversation revealed? A vague promise such as communicate better becomes more useful when converted into a particular conversation, time, request, and preparation plan.", "kind": "legacy", "source_slide": 24, "audio": "audio_scene_39.mp3", "image": "assets_action_planning_workbook.webp", "lenses": [{"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}, {"insight": "Action becomes coaching when it is specific, realistic, connected to insight, and genuinely owned by the client.", "prompt": "What will you do, by when, and how will you respond if the predictable obstacle appears?"}]}, {"type": "content", "title": "Prepare for interference", "kicker": "DO NOT PLAN ONLY FOR THE IDEAL DAY", "body": ["What could get in the way?", "What will you notice first?", "How will you respond?", "What support or reminder will help?", "What is the smallest viable version?"], "narration": "A plan is incomplete until the client considers interference. Ask what could get in the way, what early signal they will notice, and how they want to respond. Identify support and a smaller viable version. This turns accountability into preparation instead of punishment after the fact.", "kind": "legacy", "source_slide": 25, "audio": "audio_scene_40.mp3", "image": "assets_action_planning_workbook.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"kind": "teaching", "title": "Trust grows in small, consistent moments", "kicker": "BOUNDARIES ARE PART OF TRUST", "body": ["Do what you said you would do", "Tell the truth about limits", "Protect confidentiality", "Repair missteps directly", "Avoid promising outcomes you cannot control"], "narration": "Trust is rarely created by one dramatic promise. It grows through small moments of reliability, clarity, and repair. In coaching, boundaries are not barriers to connection. They tell the client what the relationship can safely hold. A coach builds trust by beginning and ending on time, protecting confidentiality, communicating limits, and addressing mistakes without defensiveness. Saying, I cannot provide clinical treatment, but I can help you identify appropriate support, is not abandonment. It is truthful care within the coach’s role.", "visual": "trust_boundaries.webp", "layout": "stack", "audio": "audio_scene_41.mp3", "image": "assets_trust_boundaries.webp", "lenses": [{"insight": "Trust grows through clear expectations, kept agreements, honest repair, and respect for the client’s right to choose.", "prompt": "What agreement or boundary would make this relationship clearer and safer?"}, {"insight": "Trust grows through clear expectations, kept agreements, honest repair, and respect for the client’s right to choose.", "prompt": "What agreement or boundary would make this relationship clearer and safer?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "Trust grows through clear expectations, kept agreements, honest repair, and respect for the client’s right to choose.", "prompt": "What agreement or boundary would make this relationship clearer and safer?"}, {"insight": "Trust grows through clear expectations, kept agreements, honest repair, and respect for the client’s right to choose.", "prompt": "What agreement or boundary would make this relationship clearer and safer?"}]}, {"kind": "teaching", "title": "A boundaried coach can still be warm", "kicker": "CLARITY WITHOUT WITHDRAWAL", "body": ["Acknowledge the importance of the concern", "State the coaching limit plainly", "Offer an appropriate next step", "Clarify whether coaching pauses or continues"], "narration": "Some coaches avoid boundaries because they fear sounding cold. The alternative is not vagueness. Warm boundaries combine humanity with clarity. The coach might say: What you are describing matters, and I want you to receive the right support. This appears to extend beyond what coaching should address. I recommend speaking with a licensed mental-health professional, and we can decide whether coaching should pause or continue alongside that care. The client is neither diagnosed nor emotionally abandoned.", "visual": "trust_boundaries.webp", "layout": "steps", "audio": "audio_scene_42.mp3", "image": "assets_trust_boundaries.webp", "lenses": [{"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"kind": "question", "title": "Checkpoint 6 · Scope and referral", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client reports severe impairment and says they see no reason to keep going. What should the coach do?", "options": ["Use the ROUX Method to create a small goal for the week.", "Diagnose depression so the client understands the seriousness.", "Pause ordinary coaching, take the statement seriously, and follow appropriate safety and referral procedures."], "correct": 2, "feedback": ["Ordinary goal setting is not an adequate response to a possible safety concern.", "A coach does not diagnose. Naming a condition without qualification exceeds scope.", "Correct. Safety takes priority. The coach remains calm, follows applicable procedures, and connects the client with appropriate licensed or emergency support."], "visual": "trust_boundaries.webp", "narration": "Pause here and choose the response you believe best protects client ownership. A client reports severe impairment and says they see no reason to keep going. What should the coach do?", "audio": "audio_scene_43.mp3", "image": "assets_trust_boundaries.webp"}, {"type": "contrast", "title": "Accountability without shame", "kicker": "REVIEW • LEARN • ADJUST", "body": ["Shame: “Why didn’t you do it?”", "Coaching: “What happened, and what can we learn?”", "A missed action is information—not a verdict."], "narration": "When an action is missed, remain curious. The plan may have been too large, the obstacle underestimated, the goal unimportant, or fear activated. Accountability reviews what happened, extracts learning, and adjusts. It does not make the coach a disappointed parent or the client a failing student.", "kind": "legacy", "source_slide": 26, "audio": "audio_scene_44.mp3", "image": "assets_accountability_without_shame.webp", "lenses": [{"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}, {"insight": "What looks like resistance may be protecting belonging, identity, certainty, or emotional safety.", "prompt": "What are you protecting by keeping this pattern in place—and what is it costing you?"}]}, {"type": "diagram", "title": "ROUX is a loop—not a straight line", "kicker": "FLEXIBLE MOVEMENT", "body": ["Recognize → Open → Uncover → Execute", "New information may return the conversation to any earlier stage."], "narration": "Real coaching rarely moves in a perfect line. During action planning, a new fear may appear. Return to Recognize or Uncover. If the client feels rushed, reopen the conversation. The framework supports intentional movement, but presence determines when to advance, pause, or return.", "kind": "legacy", "source_slide": 27, "audio": "audio_scene_45.mp3", "image": "assets_client_choice_path.webp", "lenses": [{"insight": "Separate observable reality from the meaning attached to it. Precision keeps an assumption from becoming evidence.", "prompt": "What happened, what did you make it mean, and what feeling came with that meaning?"}, {"insight": "Listen beneath the statement for the value, need, assumption, or choice that gives this idea practical meaning.", "prompt": "What makes this important now, and what would become possible if it changed?"}]}, {"type": "scenario", "title": "A complete ROUX conversation", "kicker": "FROM CONFUSION TO CHOICE", "body": ["Recognize: “You feel resentful carrying the responsibility.”", "Open: “What feels difficult about naming that?”", "Uncover: “What do you fear will happen if you ask for help?”", "Execute: “What clear request will you make this week?”"], "narration": "Here is the framework in motion. Recognize reflects the client’s current experience. Open invi function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 2</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 2</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}

function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'The ROUX Coaching Method';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson2PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
