<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 4 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 4 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build your Alignment Map</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Life area</strong><small>Choose one manageable area where alignment matters.</small><textarea id="area" rows="4"></textarea></label><label><strong>2. Roles involved</strong><small>Which responsibilities, titles, and relationships shape the situation?</small><textarea id="roles" rows="4"></textarea></label><label><strong>3. Values in tension</strong><small>Name both or all values without deciding too quickly.</small><textarea id="values" rows="4"></textarea></label><label><strong>4. The should statement</strong><small>What expectation or rule do you hear?</small><textarea id="should" rows="4"></textarea></label><label><strong>5. Source and original benefit</strong><small>Where did it come from, and what has it protected or provided?</small><textarea id="source" rows="4"></textarea></label><label><strong>6. Current behavioral evidence</strong><small>What would a camera, calendar, or neutral observer see?</small><textarea id="behavior" rows="4"></textarea></label><label><strong>7. Alignment gap</strong><small>Where is behavior not expressing the value you want to lead?</small><textarea id="gap" rows="4"></textarea></label><label><strong>8. Personal truth</strong><small>What do you need to acknowledge, including facts and responsibility?</small><textarea id="truth" rows="4"></textarea></label><label><strong>9. Clean language</strong><small>Write the preference, need, request, or boundary precisely.</small><textarea id="language" rows="4"></textarea></label><label><strong>10. Alignment experiment</strong><small>Choose one proportionate, client-owned action.</small><textarea id="experiment" rows="4"></textarea></label><label><strong>11. Review plan</strong><small>When will you examine impact, feedback, and learning?</small><textarea id="review" rows="4"></textarea></label><label><strong>12. Scope check</strong><small>What would indicate a need for clinical, medical, legal, crisis, or other specialized support?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
