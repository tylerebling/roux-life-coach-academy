const scenes=[{"kind": "teaching", "title": "Values, Identity, and Personal Truth", "kicker": "ROUX LIFE ACADEMY Â· LESSON 4", "body": ["Values reveal what matters", "Roles describe responsibilities", "Identity is larger than performance", "Truth becomes visible through action"], "narration": "Welcome to Lesson Four: Values, Identity, and Personal Truth. Clients often arrive saying, I do not feel like myself, or I have built a life that looks good but does not feel like mine. A coach should not hand them a new identity. The work is to help them hear what matters beneath roles, expectations, and performance, then turn that clarity into honest, responsible action.", "lenses": [{"insight": "Coming home to yourself is not a slogan. It is the repeated practice of noticing what matters and living it with integrity.", "prompt": "Where does your life currently feel most like youâ€”and least like you?"}, {"insight": "Coming home to yourself is not a slogan. It is the repeated practice of noticing what matters and living it with integrity.", "prompt": "Where does your life currently feel most like youâ€”and least like you?"}, {"insight": "Coming home to yourself is not a slogan. It is the repeated practice of noticing what matters and living it with integrity.", "prompt": "Where does your life currently feel most like youâ€”and least like you?"}, {"insight": "Coming home to yourself is not a slogan. It is the repeated practice of noticing what matters and living it with integrity.", "prompt": "Where does your life currently feel most like youâ€”and least like you?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.png"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Discover usable values", "Separate identity from roles", "Name inherited expectations", "Translate truth into behavior"], "narration": "We will begin by making values practical rather than decorative. Then we will distinguish identity from roles, labels, achievements, and other people's expectations. You will learn to recognize alignment gaps, coach a client through competing values, and help personal truth become a measured action instead of an impulsive declaration. Six decisions, a complete client case, workbook practice, and a graded assessment will help you apply the material.", "lenses": [{"insight": "A roadmap gives beginning coaches a dependable sequence without turning the conversation into a script.", "prompt": "Which part of this journey does your client need first?"}, {"insight": "A roadmap gives beginning coaches a dependable sequence without turning the conversation into a script.", "prompt": "Which part of this journey does your client need first?"}, {"insight": "A roadmap gives beginning coaches a dependable sequence without turning the conversation into a script.", "prompt": "Which part of this journey does your client need first?"}, {"insight": "A roadmap gives beginning coaches a dependable sequence without turning the conversation into a script.", "prompt": "Which part of this journey does your client need first?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.png"}, {"kind": "teaching", "title": "Values are qualities of living", "kicker": "MORE THAN IMPORTANT WORDS", "body": ["Not goals", "Not rules", "Not personality traits", "A chosen way of showing up"], "narration": "A value is a quality a person wants to express through choices. Honesty, care, courage, stability, creativity, faith, justice, belonging, and freedom are examples. A goal can be completed. A value keeps guiding how the goal is pursued. A client may reach a promotion and still want to lead with fairness. She may end a relationship and still want to communicate with dignity. Values are directions for living, not trophies to collect.", "lenses": [{"insight": "If a value cannot influence a choice, it remains an admired word rather than a working guide.", "prompt": "What would this value ask of you in an ordinary Tuesday?"}, {"insight": "If a value cannot influence a choice, it remains an admired word rather than a working guide.", "prompt": "What would this value ask of you in an ordinary Tuesday?"}, {"insight": "If a value cannot influence a choice, it remains an admired word rather than a working guide.", "prompt": "What would this value ask of you in an ordinary Tuesday?"}, {"insight": "If a value cannot influence a choice, it remains an admired word rather than a working guide.", "prompt": "What would this value ask of you in an ordinary Tuesday?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.png"}, {"kind": "teaching", "title": "Why generic value lists fall short", "kicker": "THE DIFFERENCE BETWEEN ADMIRATION AND OWNERSHIP", "body": ["We admire many values", "We inherit respectable words", "We choose under pressure", "Behavior reveals priority"], "narration": "A client can circle twenty beautiful words and learn very little. Some words describe what she admires in other people. Others reflect family, religious, cultural, or professional expectations. The most useful values become clearer when a real tradeoff appears. When time, approval, money, or comfort is limited, what does the client protect? Coaching moves from a word list to lived evidence, without treating one imperfect choice as proof of character.", "lenses": [{"insight": "Pressure reveals priorities, but one decision should be explored in context rather than used as a verdict.", "prompt": "Which value becomes hardest to practice when approval is at risk?"}, {"insight": "Pressure reveals priorities, but one decision should be explored in context rather than used as a verdict.", "prompt": "Which value becomes hardest to practice when approval is at risk?"}, {"insight": "Pressure reveals priorities, but one decision should be explored in context rather than used as a verdict.", "prompt": "Which value becomes hardest to practice when approval is at risk?"}, {"insight": "Pressure reveals priorities, but one decision should be explored in context rather than used as a verdict.", "prompt": "Which value becomes hardest to practice when approval is at risk?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.png"}, {"kind": "question", "title": "Checkpoint 1 Â· Value or goal?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, â€œMy value is to earn a promotion by December.â€ What is the strongest coaching response?", "options": ["Confirm that promotion is her core value", "Ask what quality she wants to embody while pursuing the promotion", "Tell her ambition is unhealthy"], "correct": 1, "feedback": ["A promotion is an outcome; treating it as a value hides the quality that should guide the pursuit.", "Correct. The outcome may matter, while leadership, growth, service, stability, or courage may be the value.", "The coach should explore meaning rather than judge ambition."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, â€œMy value is to earn a promotion by December.â€ What is the strongest coaching response?", "audio": "audio_scene_05.mp3", "image": "assets_scene_05.png"}, {"kind": "teaching", "title": "The Values Evidence Test", "kicker": "WORD â†’ BEHAVIOR â†’ COST â†’ CHOICE", "body": ["What does it look like?", "What supports it?", "What does it sometimes cost?", "What choice expresses it now?"], "narration": "Use the Values Evidence Test to move from aspiration to practice. Ask what the value looks like in observable behavior. Identify habits and relationships that support it. Explore the healthy cost the client is willing to carry, such as discomfort, time, or disappointing someone. Then identify one current choice that could express the value. This prevents values from becoming vague promises and helps clients recognize that integrity sometimes includes a real tradeoff.", "lenses": [{"insight": "A value becomes credible through repeated evidence, not dramatic language.", "prompt": "What behavior would let someone see this value without hearing its name?"}, {"insight": "A value becomes credible through repeated evidence, not dramatic language.", "prompt": "What behavior would let someone see this value without hearing its name?"}, {"insight": "A value becomes credible through repeated evidence, not dramatic language.", "prompt": "What behavior would let someone see this value without hearing its name?"}, {"insight": "A value becomes credible through repeated evidence, not dramatic language.", "prompt": "What behavior would let someone see this value without hearing its name?"}], "audio": "audio_scene_06.mp3", "image": "assets_scene_06.png"}, {"kind": "teaching", "title": "Values can compete without one being wrong", "kicker": "THE BOTH-AND TENSION", "body": ["Freedom and security", "Honesty and kindness", "Achievement and rest", "Belonging and individuality"], "narration": "Many difficult decisions are not value against bad behavior. They are value against value. Freedom may compete with security. Honesty may feel in tension with kindness. Achievement may collide with rest. Belonging may conflict with individuality. The coach should not declare the superior value. Help the client name both, assess the context, and decide which expression creates the greatest integrity now while honoring the other as responsibly as possible.", "lenses": [{"insight": "Mature values work holds tension instead of demanding a clean answer where none exists.", "prompt": "What would it look like to honor both values, even if one must lead?"}, {"insight": "Mature values work holds tension instead of demanding a clean answer where none exists.", "prompt": "What would it look like to honor both values, even if one must lead?"}, {"insight": "Mature values work holds tension instead of demanding a clean answer where none exists.", "prompt": "What would it look like to honor both values, even if one must lead?"}, {"insight": "Mature values work holds tension instead of demanding a clean answer where none exists.", "prompt": "What would it look like to honor both values, even if one must lead?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.png"}, {"kind": "teaching", "title": "A values hierarchy is contextual", "kicker": "PRIORITIES CHANGE WITH THE DECISION", "body": ["Core values remain meaningful", "Context changes urgency", "Season changes capacity", "Priority guides the next move"], "narration": "Clients sometimes believe their values must stay in one permanent ranking. In reality, context matters. Health may need to lead during recovery. Stability may lead during a financial emergency. Creativity may move forward after years of neglect. This does not mean values are random. It means the client makes a conscious priority for a particular season and decision. Ask what must lead now, what must not be abandoned, and when the priority should be reviewed.", "lenses": [{"insight": "Contextual priority creates flexibility without turning values into convenience.", "prompt": "Which value needs to lead in this season, and which value still needs protection?"}, {"insight": "Contextual priority creates flexibility without turning values into convenience.", "prompt": "Which value needs to lead in this season, and which value still needs protection?"}, {"insight": "Contextual priority creates flexibility without turning values into convenience.", "prompt": "Which value needs to lead in this season, and which value still needs protection?"}, {"insight": "Contextual priority creates flexibility without turning values into convenience.", "prompt": "Which value needs to lead in this season, and which value still needs protection?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.png"}, {"kind": "teaching", "title": "Roles are realâ€”but they are not the whole self", "kicker": "IDENTITY BEYOND RESPONSIBILITY", "body": ["Parent", "Partner", "Professional", "Caregiver"], "narration": "Roles organize responsibility and belonging. They can be deeply meaningful. Trouble begins when a role becomes the only permitted answer to who am I. A parent may forget desire outside caregiving. A leader may confuse worth with performance. A partner may shrink preferences to preserve harmony. Coaching helps the client honor her roles while recovering the values, capacities, interests, and voice that exist within and beyond them.", "lenses": [{"insight": "The goal is not to reject roles. It is to prevent one role from consuming the person's entire identity.", "prompt": "Who are you while fulfilling this roleâ€”and who are you beyond it?"}, {"insight": "The goal is not to reject roles. It is to prevent one role from consuming the person's entire identity.", "prompt": "Who are you while fulfilling this roleâ€”and who are you beyond it?"}, {"insight": "The goal is not to reject roles. It is to prevent one role from consuming the person's entire identity.", "prompt": "Who are you while fulfilling this roleâ€”and who are you beyond it?"}, {"insight": "The goal is not to reject roles. It is to prevent one role from consuming the person's entire identity.", "prompt": "Who are you while fulfilling this roleâ€”and who are you beyond it?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.png"}, {"kind": "question", "title": "Checkpoint 2 Â· Identity or advice?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, â€œWithout my career, I do not know who I am.â€ What should the coach do first?", "options": ["Recommend a new career immediately", "Explore what the career has represented and what qualities remain without the title", "Assure her that work never matters"], "correct": 1, "feedback": ["A new job may reproduce the same identity dependence before it is understood.", "Correct. Explore meaning, values, strengths, relationships, and lived qualities that are larger than the title.", "This dismisses the client's experience and replaces it with the coach's belief."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, â€œWithout my career, I do not know who I am.â€ What should the coach do first?", "audio": "audio_scene_10.mp3", "image": "assets_scene_10.png"}, {"kind": "teaching", "title": "The Identity Constellation", "kicker": "A WHOLE PERSON, NOT A SINGLE LABEL", "body": ["Roles and relationships", "Values and commitments", "Strengths and capacities", "Interests, history, and hopes"], "narration": "Invite the client to build an Identity Constellation. Map roles and relationships, values and commitments, strengths and capacities, interests and curiosities, formative experiences, communities, and hopes. No single point defines the whole person. The map becomes especially useful during divorce, retirement, empty nesting, career transition, caregiving, or relocation, when one visible role changes and the client fears that the self has disappeared with it.", "lenses": [{"insight": "A constellation holds many true points at once and reduces the pressure to find one perfect identity label.", "prompt": "Which part of you has had too little room lately?"}, {"insight": "A constellation holds many true points at once and reduces the pressure to find one perfect identity label.", "prompt": "Which part of you has had too little room lately?"}, {"insight": "A constellation holds many true points at once and reduces the pressure to find one perfect identity label.", "prompt": "Which part of you has had too little room lately?"}, {"insight": "A constellation holds many true points at once and reduces the pressure to find one perfect identity label.", "prompt": "Which part of you has had too little room lately?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.png"}, {"kind": "teaching", "title": "Identity statements can openâ€”or closeâ€”the future", "kicker": "FROM VERDICT TO PRACTICE", "body": ["â€œI am bad at conflictâ€", "â€œI am learning direct communicationâ€", "â€œI am the responsible oneâ€", "â€œI can share responsibilityâ€"], "narration": "Identity language can sound permanent. I am bad at conflict. I am the responsible one. I am not creative. A coach can respectfully move from verdict to practice: what happens in conflict now, what are you learning, and what would one different behavior look like? This is not positive thinking. The client keeps an honest account of current patterns while making room for development. Identity becomes a living practice rather than a locked sentence.", "lenses": [{"insight": "Specific language returns choice; global identity verdicts often hide the behavior that could be practiced.", "prompt": "How could you describe this as a current pattern rather than a permanent self?"}, {"insight": "Specific language returns choice; global identity verdicts often hide the behavior that could be practiced.", "prompt": "How could you describe this as a current pattern rather than a permanent self?"}, {"insight": "Specific language returns choice; global identity verdicts often hide the behavior that could be practiced.", "prompt": "How could you describe this as a current pattern rather than a permanent self?"}, {"insight": "Specific language returns choice; global identity verdicts often hide the behavior that could be practiced.", "prompt": "How could you describe this as a current pattern rather than a permanent self?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.png"}, {"kind": "teaching", "title": "Inherited expectations shape identity", "kicker": "THE VOICES WE LEARNED TO OBEY", "body": ["Family expectations", "Cultural messages", "Faith and community", "Gender and professional norms"], "narration": "Clients develop inside families, cultures, faith communities, schools, workplaces, and gender expectations. These influences may offer wisdom, belonging, pressure, or all three. The coach should not mock tradition or assume independence is always the healthiest answer. Ask what message the client received, what it protected or made possible, what cost it now creates, and which parts she consciously chooses to carry forward.", "lenses": [{"insight": "Respect context while helping the client distinguish chosen commitment from automatic compliance.", "prompt": "Whose voice do you hear when you imagine disappointing someone?"}, {"insight": "Respect context while helping the client distinguish chosen commitment from automatic compliance.", "prompt": "Whose voice do you hear when you imagine disappointing someone?"}, {"insight": "Respect context while helping the client distinguish chosen commitment from automatic compliance.", "prompt": "Whose voice do you hear when you imagine disappointing someone?"}, {"insight": "Respect context while helping the client distinguish chosen commitment from automatic compliance.", "prompt": "Whose voice do you hear when you imagine disappointing someone?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.png"}, {"kind": "teaching", "title": "The Should Audit", "kicker": "EXPECTATION â†’ SOURCE â†’ BENEFIT â†’ COST â†’ CHOICE", "body": ["Name the should", "Locate its source", "Honor its original function", "Choose, revise, or release"], "narration": "The Roux Life Should Audit turns vague pressure into something the client can examine. Write the sentence beginning with I should. Identify where it came from. Explore how following it has helped, protected, or connected the client. Name the present cost. Then decide whether to choose it freely, revise it for the current season, or release it. The coach does not command rebellion. The client makes an informed decision about what remains hers.", "lenses": [{"insight": "A rule can be inherited and still be chosen; freedom comes from conscious ownership.", "prompt": "If no one were grading this choice, what would you still choose?"}, {"insight": "A rule can be inherited and still be chosen; freedom comes from conscious ownership.", "prompt": "If no one were grading this choice, what would you still choose?"}, {"insight": "A rule can be inherited and still be chosen; freedom comes from conscious ownership.", "prompt": "If no one were grading this choice, what would you still choose?"}, {"insight": "A rule can be inherited and still be chosen; freedom comes from conscious ownership.", "prompt": "If no one were grading this choice, what would you still choose?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.png"}, {"kind": "question", "title": "Checkpoint 3 Â· Respecting context", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client questions a family expectation that has also given her belonging. Which response is strongest?", "options": ["Your family is controlling; reject the expectation", "What has this expectation given you, what does it cost now, and what do you want to choose?", "Family expectations should never be questioned"], "correct": 1, "feedback": ["This imposes the coach's judgment and may disrespect culture and relationship.", "Correct. The question holds benefit, cost, belonging, and agency together.", "This removes the client's right to examine her own life."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client questions a family expectation that has also given her belonging. Which response is strongest?", "audio": "audio_scene_15.mp3", "image": "assets_scene_15.png"}, {"kind": "teaching", "title": "Alignment is the distance between values and behavior", "kicker": "THE INTEGRITY GAP", "body": ["Stated value", "Current pattern", "Real-world consequence", "Repairing action"], "narration": "An alignment gap appears when repeated behavior does not express a stated value. A client values connection but gives every evening to work. She values honesty but agrees while resentment grows. The coach names the gap without turning it into hypocrisy or shame. What does the value mean? What pattern is occurring? What consequence follows? What repairing action is realistic? Alignment is not perfection. It is the willingness to notice, repair, and practice again.", "lenses": [{"insight": "Accountability becomes humane when the gap is treated as information and responsibilityâ€”not a character indictment.", "prompt": "Where is your calendar telling a different story from your stated values?"}, {"insight": "Accountability becomes humane when the gap is treated as information and responsibilityâ€”not a character indictment.", "prompt": "Where is your calendar telling a different story from your stated values?"}, {"insight": "Accountability becomes humane when the gap is treated as information and responsibilityâ€”not a character indictment.", "prompt": "Where is your calendar telling a different story from your stated values?"}, {"insight": "Accountability becomes humane when the gap is treated as information and responsibilityâ€”not a character indictment.", "prompt": "Where is your calendar telling a different story from your stated values?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.png"}, {"kind": "teaching", "title": "Use the Life Alignment Scan", "kicker": "EIGHT AREAS, ONE PATTERN", "body": ["Work and contribution", "Relationships and belonging", "Health and energy", "Rest, play, and inner life"], "narration": "A Life Alignment Scan helps a client see where values receive attention and where they have been crowded out. Review work, close relationships, family, health, home, finances, learning, rest, play, spirituality, and contribution as relevant. This is not a scorecard for a perfectly balanced life. Look for patterns: one role absorbing every resource, one neglected value creating resentment, or one area already providing evidence that change is possible.", "lenses": [{"insight": "The scan is a conversation starter, not a diagnosis or a universal formula for balance.", "prompt": "Which area is asking for honest attention rather than immediate fixing?"}, {"insight": "The scan is a conversation starter, not a diagnosis or a universal formula for balance.", "prompt": "Which area is asking for honest attention rather than immediate fixing?"}, {"insight": "The scan is a conversation starter, not a diagnosis or a universal formula for balance.", "prompt": "Which area is asking for honest attention rather than immediate fixing?"}, {"insight": "The scan is a conversation starter, not a diagnosis or a universal formula for balance.", "prompt": "Which area is asking for honest attention rather than immediate fixing?"}], "audio": "audio_scene_17.mp3", "image": "assets_scene_17.png"}, {"kind": "teaching", "title": "Personal truth is honest self-knowledge", "kicker": "NOT IMPULSE, CERTAINTY, OR LICENSE", "body": ["What I notice", "What I value", "What I need to acknowledge", "What I am responsible for next"], "narration": "Personal truth is not a claim that every feeling must be acted on or that other people must agree. It is honest self-knowledge: what I notice, what matters, what I can no longer pretend not to know, and what responsibility follows. A client may recognize that a role is unsustainable, a relationship needs a conversation, or a neglected interest matters. Coaching helps her test that truth against facts, values, consequences, commitments, and safety.", "lenses": [{"insight": "Truth without responsibility becomes impulse; responsibility without truth becomes self-abandonment.", "prompt": "What do you know about your experience, and what responsibility comes with knowing it?"}, {"insight": "Truth without responsibility becomes impulse; responsibility without truth becomes self-abandonment.", "prompt": "What do you know about your experience, and what responsibility comes with knowing it?"}, {"insight": "Truth without responsibility becomes impulse; responsibility without truth becomes self-abandonment.", "prompt": "What do you know about your experience, and what responsibility comes with knowing it?"}, {"insight": "Truth without responsibility becomes impulse; responsibility without truth becomes self-abandonment.", "prompt": "What do you know about your experience, and what responsibility comes with knowing it?"}], "audio": "audio_scene_18.mp3", "image": "assets_scene_18.png"}, {"kind": "question", "title": "Checkpoint 4 Â· Truth with responsibility", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement best reflects personal truth in coaching?", "options": ["I feel trapped, so I must quit today", "I notice this role is costing my health; I need to gather facts and plan an honest change", "My feelings prove everyone else is wrong"], "correct": 1, "feedback": ["A feeling may be important, but it does not automatically determine an immediate action.", "Correct. The statement includes experience, consequence, facts, and responsible next steps.", "Personal truth does not erase other perspectives or establish untested facts."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement best reflects personal truth in coaching?", "audio": "audio_scene_19.mp3", "image": "assets_scene_19.png"}, {"kind": "teaching", "title": "Emotional courage is appropriately honest action", "kicker": "VULNERABILITY WITH DISCERNMENT", "body": ["Relevant, not exhaustive", "Consensual, not forced", "Timed with care", "Connected to purpose"], "narration": "Courageous honesty is not telling everyone everything. It is sharing what is relevant, with appropriate people, at a thoughtful time, for a clear purpose. A client may need to state a preference, admit uncertainty, ask for help, or name a boundary. The coach explores risk and readiness without rewarding oversharing. Emotional courage includes discernment, consent, context, and the capacity to handle a response that may not be ideal.", "lenses": [{"insight": "Vulnerability is useful when it serves truth and connectionâ€”not when it becomes a performance or bypasses safety.", "prompt": "What is the smallest honest thing that needs to be said to the right person?"}, {"insight": "Vulnerability is useful when it serves truth and connectionâ€”not when it becomes a performance or bypasses safety.", "prompt": "What is the smallest honest thing that needs to be said to the right person?"}, {"insight": "Vulnerability is useful when it serves truth and connectionâ€”not when it becomes a performance or bypasses safety.", "prompt": "What is the smallest honest thing that needs to be said to the right person?"}, {"insight": "Vulnerability is useful when it serves truth and connectionâ€”not when it becomes a performance or bypasses safety.", "prompt": "What is the smallest honest thing that needs to be said to the right person?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.png"}, {"kind": "teaching", "title": "Differentiate preference, need, request, and boundary", "kicker": "CLEARER LANGUAGE, CLEANER ACTION", "body": ["Preference Â· what I would like", "Need Â· what supports wellbeing", "Request Â· what I ask another to do", "Boundary Â· what I will do"], "narration": "Clients often call every desire a boundary or every need a demand. Clarify four categories. A preference describes what the client would like. A need names what supports wellbeing or integrity. A request asks another person for a specific behavior while leaving room for an answer. A boundary states what the client will do to protect a limit. Precise language reduces confusion and helps personal truth become relationally responsible.", "lenses": [{"insight": "A boundary controls the client's participation; it does not control another adult's internal state or behavior.", "prompt": "Is this something you prefer, need, request, or will take responsibility to limit?"}, {"insight": "A boundary controls the client's participation; it does not control another adult's internal state or behavior.", "prompt": "Is this something you prefer, need, request, or will take responsibility to limit?"}, {"insight": "A boundary controls the client's participation; it does not control another adult's internal state or behavior.", "prompt": "Is this something you prefer, need, request, or will take responsibility to limit?"}, {"insight": "A boundary controls the client's participation; it does not control another adult's internal state or behavior.", "prompt": "Is this something you prefer, need, request, or will take responsibility to limit?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.png"}, {"kind": "teaching", "title": "Truth needs translation", "kicker": "INSIGHT â†’ LANGUAGE â†’ ACTION â†’ REVIEW", "body": ["Name the insight", "Choose clean words", "Take a proportionate step", "Review impact and learning"], "narration": "A breakthrough that never changes language or behavior may feel meaningful but remain incomplete. Translate insight into clean words, a proportionate action, and a review point. If a client values connection, she might protect one technology-free dinner. If she values creativity, she may schedule ninety minutes for unfinished work. If she acknowledges resentment, she may prepare a specific request. The action should fit the truth without demanding a total life reconstruction overnight.", "lenses": [{"insight": "The next step should be small enough to complete and meaningful enough to generate evidence.", "prompt": "What would make this insight visible before our next conversation?"}, {"insight": "The next step should be small enough to complete and meaningful enough to generate evidence.", "prompt": "What would make this insight visible before our next conversation?"}, {"insight": "The next step should be small enough to complete and meaningful enough to generate evidence.", "prompt": "What would make this insight visible before our next conversation?"}, {"insight": "The next step should be small enough to complete and meaningful enough to generate evidence.", "prompt": "What would make this insight visible before our next conversation?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.png"}, {"kind": "teaching", "title": "Case study Â· Meet Elena", "kicker": "SUCCESSFUL, DEPENDABLE, AND QUIETLY DISCONNECTED", "body": ["Forty-two-year-old operations leader", "Caregiver and family problem-solver", "Praised for reliability", "Says, â€œMy life belongs to everyone elseâ€"], "narration": "Elena is forty-two, leads operations for a growing company, supports an aging parent, and is the person her family calls when something goes wrong. She is proud of her competence and loves her family. Yet she feels resentful, exhausted, and disconnected from creativity and friendship. She says, my life belongs to everyone else. She does not want to abandon responsibility. She wants to understand where devotion ended and automatic self-erasure began.", "lenses": [{"insight": "Do not force Elena to choose between being caring and being herself. Explore how both might become more honest.", "prompt": "What parts of this life are freely chosen, and which parts feel compulsory?"}, {"insight": "Do not force Elena to choose between being caring and being herself. Explore how both might become more honest.", "prompt": "What parts of this life are freely chosen, and which parts feel compulsory?"}, {"insight": "Do not force Elena to choose between being caring and being herself. Explore how both might become more honest.", "prompt": "What parts of this life are freely chosen, and which parts feel compulsory?"}, {"insight": "Do not force Elena to choose between being caring and being herself. Explore how both might become more honest.", "prompt": "What parts of this life are freely chosen, and which parts feel compulsory?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.png"}, {"kind": "teaching", "title": "Elena's identity constellation", "kicker": "WHAT REMAINS WHEN THE ROLES QUIET", "body": ["Leader Â· organized and decisive", "Daughter Â· devoted and vigilant", "Friend Â· humorous and curious", "Artist Â· observant and underused"], "narration": "Elena's map shows more than overload. As a leader she is organized and decisive. As a daughter she is devoted and vigilant. With friends she is humorous and curious. As an artist she is observant, patient, and almost entirely absent from her current schedule. The coach does not tell Elena to paint. The coach helps her notice that creativity represents aliveness and attentionâ€”qualities she misses across her whole life.", "lenses": [{"insight": "An abandoned interest may point to a value without becoming the prescribed solution.", "prompt": "What quality came alive in that part of you, and where else could it live now?"}, {"insight": "An abandoned interest may point to a value without becoming the prescribed solution.", "prompt": "What quality came alive in that part of you, and where else could it live now?"}, {"insight": "An abandoned interest may point to a value without becoming the prescribed solution.", "prompt": "What quality came alive in that part of you, and where else could it live now?"}, {"insight": "An abandoned interest may point to a value without becoming the prescribed solution.", "prompt": "What quality came alive in that part of you, and where else could it live now?"}], "audio": "audio_scene_24.mp3", "image": "assets_scene_24.png"}, {"kind": "teaching", "title": "Elena's values tension", "kicker": "CARE Â· RELIABILITY Â· CREATIVITY Â· FREEDOM", "body": ["Care without self-erasure", "Reliability without overfunctioning", "Creativity without perfection", "Freedom with responsibility"], "narration": "Elena does not lack values; she has values in conflict. Care and reliability have dominated because they bring approval and prevent immediate problems. Creativity and freedom feel selfish because their benefits are less visible to others. The coaching task is not to replace care with freedom. It is to help Elena define care without self-erasure, reliability without overfunctioning, creativity without perfection, and freedom that includes responsible communication.", "lenses": [{"insight": "The strongest plan redesigns the expression of existing values instead of declaring some values bad.", "prompt": "How could care include you rather than require your disappearance?"}, {"insight": "The strongest plan redesigns the expression of existing values instead of declaring some values bad.", "prompt": "How could care include you rather than require your disappearance?"}, {"insight": "The strongest plan redesigns the expression of existing values instead of declaring some values bad.", "prompt": "How could care include you rather than require your disappearance?"}, {"insight": "The strongest plan redesigns the expression of existing values instead of declaring some values bad.", "prompt": "How could care include you rather than require your disappearance?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.png"}, {"kind": "question", "title": "Checkpoint 5 Â· Coach Elena", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "What is the strongest first challenge for Elena?", "options": ["Stop helping your family for thirty days", "You say care matters, and you also describe resentment. What form of care could be sustainable for you?", "Your family is taking advantage of you"], "correct": 1, "feedback": ["This prescribes a dramatic action without understanding responsibilities or safety.", "Correct. It honors care, names the gap, and invites a client-owned definition.", "The coach does not have enough evidence to assign motive or blame."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. What is the strongest first challenge for Elena?", "audio": "audio_scene_26.mp3", "image": "assets_scene_26.png"}, {"kind": "teaching", "title": "From resentment to information", "kicker": "A SIGNAL, NOT A VERDICT", "body": ["What am I repeatedly agreeing to?", "What expectation remains unspoken?", "What choice am I avoiding?", "What repair is mine to make?"], "narration": "Resentment can signal an unspoken expectation, repeated overcommitment, unequal responsibility, or a choice the client has not acknowledged. It does not automatically prove exploitation, and it should not be dismissed as negativity. Ask what Elena keeps agreeing to, what she hopes others will notice without being told, what conversation she is avoiding, and what repair is hers. This returns agency without making her responsible for everyone else's behavior.", "lenses": [{"insight": "Emotion becomes useful information when it is explored without being promoted to unquestionable fact.", "prompt": "What is resentment asking you to notice, request, or stop volunteering?"}, {"insight": "Emotion becomes useful information when it is explored without being promoted to unquestionable fact.", "prompt": "What is resentment asking you to notice, request, or stop volunteering?"}, {"insight": "Emotion becomes useful information when it is explored without being promoted to unquestionable fact.", "prompt": "What is resentment asking you to notice, request, or stop volunteering?"}, {"insight": "Emotion becomes useful information when it is explored without being promoted to unquestionable fact.", "prompt": "What is resentment asking you to notice, request, or stop volunteering?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.png"}, {"kind": "teaching", "title": "Elena's first alignment experiment", "kicker": "SMALL ENOUGH TO LIVE, LARGE ENOUGH TO MATTER", "body": ["One protected two-hour block", "One responsibility renegotiated", "One honest conversation", "One weekly review"], "narration": "Elena chooses a four-part experiment. She protects one two-hour block for unstructured creative work. She asks a sibling to own one recurring caregiving task. She tells her partner that constant availability is creating resentment and requests a weekly planning conversation. At week's end, she reviews guilt, relief, family responses, and what she learned. The coach helps her prepare for discomfort without treating discomfort as evidence the action was wrong.", "lenses": [{"insight": "Alignment experiments create new evidence about capacity, relationships, and self-trust.", "prompt": "What discomfort are you willing to carry in service of a more honest life?"}, {"insight": "Alignment experiments create new evidence about capacity, relationships, and self-trust.", "prompt": "What discomfort are you willing to carry in service of a more honest life?"}, {"insight": "Alignment experiments create new evidence about capacity, relationships, and self-trust.", "prompt": "What discomfort are you willing to carry in service of a more honest life?"}, {"insight": "Alignment experiments create new evidence about capacity, relationships, and self-trust.", "prompt": "What discomfort are you willing to carry in service of a more honest life?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.png"}, {"kind": "teaching", "title": "When others dislike the client's alignment", "kicker": "DISAPPROVAL IS DATAâ€”NOT AUTOMATIC DIRECTION", "body": ["Listen to impact", "Check commitments", "Distinguish discomfort from danger", "Revise without surrendering agency"], "narration": "When a client changes a familiar pattern, other people may be confused, inconvenienced, hurt, or relieved. The coach should not label every negative response resistance, nor treat disapproval as proof that the client is wrong. Help the client listen for legitimate impact, honor commitments, distinguish discomfort from danger, and revise communication where needed. Integrity includes both self-respect and accountability for how choices affect others.", "lenses": [{"insight": "Client ownership includes the courage to hear feedback without automatically abandoning or defending the choice.", "prompt": "What feedback deserves consideration, and what part belongs to someone else's adjustment?"}, {"insight": "Client ownership includes the courage to hear feedback without automatically abandoning or defending the choice.", "prompt": "What feedback deserves consideration, and what part belongs to someone else's adjustment?"}, {"insight": "Client ownership includes the courage to hear feedback without automatically abandoning or defending the choice.", "prompt": "What feedback deserves consideration, and what part belongs to someone else's adjustment?"}, {"insight": "Client ownership includes the courage to hear feedback without automatically abandoning or defending the choice.", "prompt": "What feedback deserves consideration, and what part belongs to someone else's adjustment?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.png"}, {"kind": "teaching", "title": "Self-validation supports honest choice", "kicker": "ACKNOWLEDGE WITHOUT MAKING EVERY STORY TRUE", "body": ["My feeling is real", "My need is worth hearing", "My interpretation may be incomplete", "My next action remains my responsibility"], "narration": "Self-validation means acknowledging that a feeling and need are understandable. It does not certify every interpretation. Elena can say, it makes sense that I feel guilty because availability has been part of my identity. The guilt does not prove I am doing harm. I can check my commitments and choose responsibly. This stance reduces the demand for immediate reassurance and helps clients tolerate the uncertainty that often accompanies identity change.", "lenses": [{"insight": "Validation creates steadiness; evidence and values still guide the decision.", "prompt": "What can you validate in yourself without deciding the whole story is proven?"}, {"insight": "Validation creates steadiness; evidence and values still guide the decision.", "prompt": "What can you validate in yourself without deciding the whole story is proven?"}, {"insight": "Validation creates steadiness; evidence and values still guide the decision.", "prompt": "What can you validate in yourself without deciding the whole story is proven?"}, {"insight": "Validation creates steadiness; evidence and values still guide the decision.", "prompt": "What can you validate in yourself without deciding the whole story is proven?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.png"}, {"kind": "teaching", "title": "Coach identity change without creating dependency", "kicker": "THE CLIENT AUTHORS THE MEANING", "body": ["Reflect, do not define", "Offer language tentatively", "Ask permission to challenge", "Return every decision"], "narration": "Identity work can make a coach feel powerful. Avoid telling clients who they really are, announcing a hidden purpose, or becoming the person who grants permission to live. Reflect patterns, offer language tentatively, ask permission before challenge, and return decisions. A useful sentence is: I have an observation; would you like to hear it and decide whether it fits? The client remains the authority on lived experience and the owner of action.", "lenses": [{"insight": "A coach helps clients hear themselves more clearlyâ€”not replace their voice with the coach's certainty.", "prompt": "Is my intervention increasing the client's self-trust or dependence on my approval?"}, {"insight": "A coach helps clients hear themselves more clearlyâ€”not replace their voice with the coach's certainty.", "prompt": "Is my intervention increasing the client's self-trust or dependence on my approval?"}, {"insight": "A coach helps clients hear themselves more clearlyâ€”not replace their voice with the coach's certainty.", "prompt": "Is my intervention increasing the client's self-trust or dependence on my approval?"}, {"insight": "A coach helps clients hear themselves more clearlyâ€”not replace their voice with the coach's certainty.", "prompt": "Is my intervention increasing the client's self-trust or dependence on my approval?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.png"}, {"kind": "q
