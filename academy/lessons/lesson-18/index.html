const scenes=[{"kind": "teaching", "title": "Structure protects depth", "kicker": "ROUX LIFE ACADEMY · LESSON 18", "body": ["A clear beginning creates safety", "A purposeful middle creates insight", "A deliberate ending creates follow-through", "Flexibility keeps the client—not the agenda—at the center"], "narration": "An effective coaching session has a recognizable arc, but it is not a script. Structure protects time, attention, ownership, and ethical scope. It helps the coach know what the conversation needs without deciding what the client must conclude. The best structure is stable enough to guide and flexible enough to respond.", "lenses": [{"insight": "A clear beginning creates safety", "prompt": "What does the coach need to establish?"}, {"insight": "A purposeful middle creates insight", "prompt": "What information should shape the next phase?"}, {"insight": "A deliberate ending creates follow-through", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Flexibility keeps the client—not the agenda—at the center", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "THE COMPLETE SESSION ARC", "body": ["Prepare and open", "Agree on focus and outcome", "Explore, uncover, and decide", "Act, review, document, and close"], "narration": "We will build a complete session from pre-session preparation through closure. Along the way, you will practice contracting, time awareness, ROUX sequencing, progress review, emotional pacing, decision support, action planning, referral, documentation, and follow-up. Six decisions let you lead the session rather than merely observe it.", "lenses": [{"insight": "Prepare and open", "prompt": "What does the coach need to establish?"}, {"insight": "Agree on focus and outcome", "prompt": "What information should shape the next phase?"}, {"insight": "Explore, uncover, and decide", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Act, review, document, and close", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Prepare the container before the client arrives", "kicker": "SPACE · ATTENTION · INFORMATION", "body": ["Review only relevant notes", "Protect privacy and minimize distraction", "Check your own state", "Release assumptions about what should happen"], "narration": "Preparation is brief and purposeful. Review the client's agreed goals, prior commitments, and necessary administrative information without rehearsing a conclusion. Secure the physical or virtual space, close unrelated work, notice your own state, and arrive curious. Preparation should support presence rather than predetermine the conversation.", "lenses": [{"insight": "Review only relevant notes", "prompt": "What does the coach need to establish?"}, {"insight": "Protect privacy and minimize distraction", "prompt": "What information should shape the next phase?"}, {"insight": "Check your own state", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Release assumptions about what should happen", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Begin with human connection", "kicker": "ARRIVE BEFORE YOU ASSESS", "body": ["Welcome the client", "Notice readiness", "Reconnect without drifting into social chat", "Respect culture and preferred pace"], "narration": "The opening acknowledges the person before the task. A warm welcome and brief check-in help both people arrive. The coach does not mine casual conversation for pathology or allow fifteen minutes to disappear without purpose. Connection and focus can coexist.", "lenses": [{"insight": "Welcome the client", "prompt": "What does the coach need to establish?"}, {"insight": "Notice readiness", "prompt": "What information should shape the next phase?"}, {"insight": "Reconnect without drifting into social chat", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Respect culture and preferred pace", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Check readiness and immediate conditions", "kicker": "IS COACHING USEFUL RIGHT NOW?", "body": ["Attention and privacy", "Urgent practical needs", "Emotional or physical capacity", "Safety and scope"], "narration": "Before beginning ordinary coaching, notice whether the client can participate. Are they driving, being overheard, acutely ill, intoxicated, severely distressed, or in danger? The coach may pause, reschedule, address safety, or refer. Readiness is not a test of emotional calm; it is a practical and ethical check.", "lenses": [{"insight": "Attention and privacy", "prompt": "What does the coach need to establish?"}, {"insight": "Urgent practical needs", "prompt": "What information should shape the next phase?"}, {"insight": "Emotional or physical capacity", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Safety and scope", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Open responsibly", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client joins from a moving car and says she can talk while driving. What should the coach do?", "options": ["Begin the emotional exercise", "Pause and require a safe, stationary, private condition before continuing", "Ask her to mute between answers"], "correct": 1, "feedback": ["Deep coaching while driving creates avoidable risk.", "Correct. Safety and attention come before the planned session.", "Muting does not solve the safety problem."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client joins from a moving car and says she can talk while driving. What should the coach do?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Reconnect to the larger coaching agreement", "kicker": "WHY ARE WE WORKING TOGETHER?", "body": ["Overall goals", "Roles and limits", "Confidentiality and communication", "What may have changed"], "narration": "A session sits inside a broader agreement. Especially early in an engagement, the coach confirms the purpose, roles, boundaries, confidentiality limits, communication expectations, and how progress will be reviewed. If goals or circumstances have changed, the agreement may need revision rather than silent drift.", "lenses": [{"insight": "Overall goals", "prompt": "What does the coach need to establish?"}, {"insight": "Roles and limits", "prompt": "What information should shape the next phase?"}, {"insight": "Confidentiality and communication", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "What may have changed", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Review the space between sessions", "kicker": "PROGRESS · LEARNING · CHANGE", "body": ["What happened?", "What did the client notice?", "What changed in importance?", "What deserves attention now?"], "narration": "A check-in is not a compliance inspection. Review commitments, relevant events, learning, obstacles, and changes. A completed action may reveal a new concern; an uncompleted action may reveal capacity, fear, poor design, or changed priorities. The review informs today's focus without consuming the entire session.", "lenses": [{"insight": "What happened?", "prompt": "What does the coach need to establish?"}, {"insight": "What did the client notice?", "prompt": "What information should shape the next phase?"}, {"insight": "What changed in importance?", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "What deserves attention now?", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Invite the session agenda", "kicker": "WHAT WOULD BE MOST USEFUL TODAY?", "body": ["Topic", "Importance", "Desired use of time", "Client choice"], "narration": "The client names what they want to bring. When several topics appear, the coach helps differentiate urgency from importance and asks which conversation would create the most useful movement. The coach may offer an observation, but should not choose simply because one topic feels more interesting.", "lenses": [{"insight": "Topic", "prompt": "What does the coach need to establish?"}, {"insight": "Importance", "prompt": "What information should shape the next phase?"}, {"insight": "Desired use of time", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Client choice", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Define a useful session outcome", "kicker": "HOW WILL WE KNOW THIS HELPED?", "body": ["Clarity", "Decision", "Preparation", "Action, experiment, boundary, or referral"], "narration": "A topic is not yet an outcome. A client can discuss work for an hour without knowing what would be useful. The desired outcome might be understanding a pattern, comparing options, preparing a conversation, deciding a next step, or identifying support. The outcome remains revisable with consent.", "lenses": [{"insight": "Clarity", "prompt": "What does the coach need to establish?"}, {"insight": "Decision", "prompt": "What information should shape the next phase?"}, {"insight": "Preparation", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Action, experiment, boundary, or referral", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Make the working agreement explicit", "kicker": "FOCUS · OUTCOME · TIME · PARTNERSHIP", "body": ["Name today's focus", "Confirm the useful outcome", "Acknowledge available time", "Ask how the client wants to be supported"], "narration": "A concise agreement might sound like: today you want to understand why this decision feels stuck and leave with the information you still need. We have about fifty minutes. How would you like me to challenge or support you? This makes the partnership visible and gives the session a shared compass.", "lenses": [{"insight": "Name today's focus", "prompt": "What does the coach need to establish?"}, {"insight": "Confirm the useful outcome", "prompt": "What information should shape the next phase?"}, {"insight": "Acknowledge available time", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "Ask how the client wants to be supported", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Contract the session", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I want to talk about my job.’ What should the coach clarify next?", "options": ["Why the boss is wrong", "What would make the conversation useful by the end of the session", "Which job the client should take"], "correct": 1, "feedback": ["Taking sides narrows the conversation prematurely.", "Correct. A useful outcome turns a broad topic into a working agreement.", "The client retains the decision."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I want to talk about my job.’ What should the coach clarify next?", "audio": n", "kicker": "DO NOT END AT THE BREAKTHROUGH", "body": ["What stands out?", "What changed?", "What remains unfinished?", "What will the client carry forward?"], "narration": "A breakthrough near the end can tempt the coach to stop at emotional intensity. Integration helps the client name learning, unanswered questions, and next care. Insight may need rest rather than immediate action. The closing phase gives the experience a responsible landing.", "lenses": [{"insight": "What stands out?", "prompt": "What does the coach need to establish?"}, {"insight": "What changed?", "prompt": "What information should shape the next phase?"}, {"insight": "What remains unfinished?", "prompt": "How can the session remain purposeful and flexible?"}, {"insight": "What will the client carry forward?", "prompt": "How will ownership and scope be protected?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "question", "title": "Checkpoint 5 · Close responsibly", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "With five minutes left, a client reveals a painful topic outside today's focus but no immediate safety concern. What should the coach do?", "options": ["Begin deep exploration and run over indefinitely", "Acknowledge its importance, check immediate needs, and agree how it will be supported next", "Ignore it to stay on schedule"], "correct": 1, "feedback": ["Starting depth without time to contain it may be irresponsible.", "Correct. Importance, immediate care, boundaries, and next support are all honored.", "Ignoring disclosure damages trust."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. With five minutes left, a client reveals a painful topic outside today's focus but no immediate safety concern. What should the coach do?", "audio": "audio_scene_30.mp3", "image": "assets_scene_30.webp"}, {"kind": "teaching", "title": "Close the session clearly", "kicker": "SUMMARY · ACTION · S const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 18</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 18</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Structuring an Effective Coaching Session';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson18PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
</script><script src="../../academy/lesson-bridge.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/cloud.js"></script>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script>
  <script src="../../academy/guard.js"></script>
</body></html>
