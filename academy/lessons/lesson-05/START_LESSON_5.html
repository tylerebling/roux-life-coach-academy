const scenes=[{"kind": "teaching", "title": "Vulnerability and Emotional Armor", "kicker": "ROUX LIFE ACADEMY Â· LESSON 5", "body": ["Courage includes uncertainty", "Armor tries to create safety", "Trust and pace matter", "Honesty needs boundaries"], "narration": "Welcome to Lesson Five: Vulnerability and Emotional Armor. Clients rarely arrive without protection. They may use perfection, silence, humor, control, constant competence, or emotional distance to reduce the risk of disappointment and judgment. The coach does not rip that protection away. We help the client understand what it does, what it costs, and whether a more flexible response could support the life and relationships she wants.", "lenses": [{"insight": "Protection deserves respect; courage deserves discernment.", "prompt": "What does this client do when being seen begins to feel risky?"}, {"insight": "Protection deserves respect; courage deserves discernment.", "prompt": "What does this client do when being seen begins to feel risky?"}, {"insight": "Protection deserves respect; courage deserves discernment.", "prompt": "What does this client do when being seen begins to feel risky?"}, {"insight": "Protection deserves respect; courage deserves discernment.", "prompt": "What does this client do when being seen begins to feel risky?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.png"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Define useful vulnerability", "Recognize common armor", "Assess trust and readiness", "Design proportionate courage"], "narration": "We will define vulnerability in clear coaching language and separate it from oversharing, disclosure pressure, and emotional performance. You will learn to identify common forms of armor, explore their protective function, assess whether a person or setting has earned trust, and design a proportionate act of courage. Six interactive decisions, Renee's complete case, workbook practice, and a graded quiz will move the ideas into usable coaching skill.", "lenses": [{"insight": "A beginning coach needs both emotional depth and a reliable boundary around the work.", "prompt": "Which part of the courage decision needs clarity first?"}, {"insight": "A beginning coach needs both emotional depth and a reliable boundary around the work.", "prompt": "Which part of the courage decision needs clarity first?"}, {"insight": "A beginning coach needs both emotional depth and a reliable boundary around the work.", "prompt": "Which part of the courage decision needs clarity first?"}, {"insight": "A beginning coach needs both emotional depth and a reliable boundary around the work.", "prompt": "Which part of the courage decision needs clarity first?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.png"}, {"kind": "teaching", "title": "Vulnerability is relevant honesty under uncertainty", "kicker": "A PRACTICAL DEFINITION", "body": ["Something meaningful is at stake", "The outcome cannot be controlled", "The expression is relevant", "The client chooses the risk"], "narration": "Vulnerability is the experience of being honestly seen when something meaningful is at stake and the outcome cannot be guaranteed. In coaching, the expression should be relevant to the client's values and situation. It might mean admitting uncertainty, asking for help, naming a preference, receiving feedback, apologizing, or making a request. The client chooses whether and how to take the risk. The coach provides structure, not emotional pressure.", "lenses": [{"insight": "Courage begins where control ends, but it still includes judgment and choice.", "prompt": "What matters enough here that uncertainty is worth carrying?"}, {"insight": "Courage begins where control ends, but it still includes judgment and choice.", "prompt": "What matters enough here that uncertainty is worth carrying?"}, {"insight": "Courage begins where control ends, but it still includes judgment and choice.", "prompt": "What matters enough here that uncertainty is worth carrying?"}, {"insight": "Courage begins where control ends, but it still includes judgment and choice.", "prompt": "What matters enough here that uncertainty is worth carrying?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.png"}, {"kind": "teaching", "title": "Vulnerability is not maximum disclosure", "kicker": "MORE IS NOT ALWAYS BRAVER", "body": ["Relevance over volume", "Consent over pressure", "Purpose over performance", "Safety over spectacle"], "narration": "Some clients equate courage with telling everything. Some coaches reward dramatic disclosure because it feels like progress. More information is not automatically more honest, wise, or safe. Useful vulnerability is relevant, consensual, purposeful, and suited to the relationship. A client can be courageous by saying one clear sentence. She can also choose privacy. The question is whether the choice serves values rather than automatic fear or a demand to perform openness.", "lenses": [{"insight": "Privacy is a right. Secrecy and avoidance are patterns to explore, not conclusions to impose.", "prompt": "What is the smallest truthful amount this conversation actually needs?"}, {"insight": "Privacy is a right. Secrecy and avoidance are patterns to explore, not conclusions to impose.", "prompt": "What is the smallest truthful amount this conversation actually needs?"}, {"insight": "Privacy is a right. Secrecy and avoidance are patterns to explore, not conclusions to impose.", "prompt": "What is the smallest truthful amount this conversation actually needs?"}, {"insight": "Privacy is a right. Secrecy and avoidance are patterns to explore, not conclusions to impose.", "prompt": "What is the smallest truthful amount this conversation actually needs?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.png"}, {"kind": "question", "title": "Checkpoint 1 Â· Courage or oversharing?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client wants to disclose her entire personal history to a new colleague so she can be â€œfully authentic.â€ What should the coach explore first?", "options": ["How to make the disclosure more dramatic", "The purpose, trust level, relevance, and possible impact of the disclosure", "Why privacy is dishonest"], "correct": 1, "feedback": ["Intensity does not make disclosure appropriate.", "Correct. Courage includes discernment about audience, purpose, pace, and consequence.", "Privacy can be healthy and values-consistent."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client wants to disclose her entire personal history to a new colleague so she can be â€œfully authentic.â€ What should the coach explore first?", "audio": "audio_scene_05.mp3", "image": "assets_scene_05.png"}, {"kind": "teaching", "title": "Armor is a strategy, not an identity", "kicker": "WHAT PROTECTION IS TRYING TO DO", "body": ["Reduce uncertainty", "Prevent judgment", "Preserve belonging", "Maintain control"], "narration": "Emotional armor is any repeated strategy used to reduce the risk of being hurt, judged, rejected, dependent, or out of control. It is not a diagnosis and should not become a label such as she is guarded. Describe what the client does in context. She changes the subject, perfects the answer, jokes when emotion appears, or solves everyone else's problem. Then ask what the strategy attempts to protect and whether its current cost still makes sense.", "lenses": [{"insight": "Describe behavior before interpreting motive.", "prompt": "What becomes less risky when you respond this way?"}, {"insight": "Describe behavior before interpreting motive.", "prompt": "What becomes less risky when you respond this way?"}, {"insight": "Describe behavior before interpreting motive.", "prompt": "What becomes less risky when you respond this way?"}, {"insight": "Describe behavior before interpreting motive.", "prompt": "What becomes less risky when you respond this way?"}], "audio": "audio_scene_06.mp3", "image": "assets_scene_06.png"}, {"kind": "teaching", "title": "Perfectionism can function as armor", "kicker": "IF I CANNOT BE CRITICIZED, I CANNOT BE EXPOSED", "body": ["Overprepare", "Delay completion", "Avoid early feedback", "Tie worth to performance"], "narration": "Perfectionism may look like excellence while functioning as protection. The client overprepares, delays completion, avoids showing unfinished work, or treats correction as a verdict on worth. Do not shame standards or tell the client to stop caring. Explore the line between thoughtful preparation and protection from being seen while learning. A useful experiment may involve sharing a draft, setting a good-enough threshold, or asking for specific feedback before certainty arrives.", "lenses": [{"insight": "The goal is flexible excellence, not careless work.", "prompt": "At what point does preparation stop improving the work and start protecting you from exposure?"}, {"insight": "The goal is flexible excellence, not careless work.", "prompt": "At what point does preparation stop improving the work and start protecting you from exposure?"}, {"insight": "The goal is flexible excellence, not careless work.", "prompt": "At what point does preparation stop improving the work and start protecting you from exposure?"}, {"insight": "The goal is flexible excellence, not careless work.", "prompt": "At what point does preparation stop improving the work and start protecting you from exposure?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.png"}, {"kind": "teaching", "title": "Control can function as armor", "kicker": "CERTAINTY BEFORE PARTICIPATION", "body": ["Plan every outcome", "Manage other people's reactions", "Avoid asking for help", "Withdraw when control is impossible"], "narration": "Control becomes armor when participation depends on certainty. The client may overplan, take responsibility for everyone's reaction, avoid delegation, or withdraw from situations she cannot manage. Control often provides competence and relief, so challenge it respectfully. Ask what she can influence, what belongs to others, and what value she wants to practice when the outcome remains uncertain. Courage may be one request, one delegation, or one honest admission that she does not know.", "lenses": [{"insight": "Distinguish responsible preparation from the impossible task of controlling response.", "prompt": "What can you prepare, and what will remain outside your control?"}, {"insight": "Distinguish responsible preparation from the impossible task of controlling response.", "prompt": "What can you prepare, and what will remain outside your control?"}, {"insight": "Distinguish responsible preparation from the impossible task of controlling response.", "prompt": "What can you prepare, and what will remain outside your control?"}, {"insight": "Distinguish responsible preparation from the impossible task of controlling response.", "prompt": "What can you prepare, and what will remain outside your control?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.png"}, {"kind": "teaching", "title": "Detachment can look like calm", "kicker": "WHEN DISTANCE BECOMES PROTECTION", "body": ["Intellectualize emotion", "Minimize needs", "Exit before repair", "Call indifference strength"], "narration": "Some armor looks quiet and reasonable. The client explains emotion without feeling connected to it, minimizes needs, leaves before repair, or insists she does not care. Do not force a deeper feeling or diagnose avoidance. Reflect the observable pattern and invite choice: I notice the conversation became more factual when disappointment appeared. What is happening for you? The client may need time, privacy, a safer relationship, or a different pace.", "lenses": [{"insight": "Calm can be regulation, temperament, or protection. Stay curious.", "prompt": "What does distance make easierâ€”and what connection does it make harder?"}, {"insight": "Calm can be regulation, temperament, or protection. Stay curious.", "prompt": "What does distance make easierâ€”and what connection does it make harder?"}, {"insight": "Calm can be regulation, temperament, or protection. Stay curious.", "prompt": "What does distance make easierâ€”and what connection does it make harder?"}, {"insight": "Calm can be regulation, temperament, or protection. Stay curious.", "prompt": "What does distance make easierâ€”and what connection does it make harder?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.png"}, {"kind": "question", "title": "Checkpoint 2 Â· Describe, do not label", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client jokes every time sadness enters the conversation. Which response best preserves dignity?", "options": ["You use humor because you are emotionally avoidant", "I notice humor arrived as the sadness came closer. Would you like to stay there, slow down, or move on?", "Stop joking and be vulnerable"], "correct": 1, "feedback": ["This assigns a diagnosis-like identity and motive.", "Correct. It names the observation, offers choice, and does not force depth.", "Forced disclosure violates pace and client ownership."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client jokes every time sadness enters the conversation. Which response best preserves dignity?", "audio": "audio_scene_10.mp3", "image": "assets_scene_10.png"}, {"kind": "teaching", "title": "Overfunctioning can hide need", "kicker": "COMPETENCE AS PROTECTION", "body": ["Solve first", "Never inconvenience anyone", "Give before receiving", "Become indispensable"], "narration": "The highly capable client may protect herself by becoming indispensable. She solves first, gives before receiving, and avoids being the person who needs support. Others praise her reliability, which makes the armor harder to see. Ask what receiving would mean, what she predicts others would think, and what the pattern costs. The alternative is not helplessness. It is interdependence: capable people can still make clear requests and allow appropriate support.", "lenses": [{"insight": "Strength and need can coexist without canceling each other.", "prompt": "What help would you request if needing support did not reduce your worth?"}, {"insight": "Strength and need can coexist without canceling each other.", "prompt": "What help would you request if needing support did not reduce your worth?"}, {"insight": "Strength and need can coexist without canceling each other.", "prompt": "What help would you request if needing support did not reduce your worth?"}, {"insight": "Strength and need can coexist without canceling each other.", "prompt": "What help would you request if needing support did not reduce your worth?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.png"}, {"kind": "teaching", "title": "Humor, cynicism, and preemptive judgment", "kicker": "STRIKE BEFORE BEING STRUCK", "body": ["Make the joke first", "Dismiss what matters", "Predict disappointment", "Avoid visible hope"], "narration": "Humor can connect people, and skepticism can protect good judgment. They become armor when the client consistently jokes first, dismisses what matters, predicts rejection, or criticizes hope before anyone else can. Explore the protective timing. What feeling appeared just before the joke? What would hope make possible, and what would it expose? The coach should not remove humor; help the client gain another option when humor blocks honesty.", "lenses": [{"insight": "The skill is flexibility: choosing humor rather than being required to use it.", "prompt": "What might you say if you kept the warmth but removed the shield?"}, {"insight": "The skill is flexibility: choosing humor rather than being required to use it.", "prompt": "What might you say if you kept the warmth but removed the shield?"}, {"insight": "The skill is flexibility: choosing humor rather than being required to use it.", "prompt": "What might you say if you kept the warmth but removed the shield?"}, {"insight": "The skill is flexibility: choosing humor rather than being required to use it.", "prompt": "What might you say if you kept the warmth but removed the shield?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.png"}, {"kind": "teaching", "title": "Armor has a benefit-cost exchange", "kicker": "HONOR THE PROTECTION; EXAMINE THE PRICE", "body": ["Short-term relief", "Belonging or competence", "Long-term loneliness", "Reduced feedback and growth"], "narration": "Every protective strategy offers something. Perfection may reduce criticism. Detachment may reduce overwhelm. Overfunctioning may secure belonging. Cynicism may soften disappointment. Begin with that benefit so the client does not feel attacked. Then examine the longer-term price: loneliness, resentment, exhaustion, shallow feedback, or relationships that never learn the client's needs. Change becomes more possible when the client sees both protection and cost.", "lenses": [{"insight": "Do not romanticize armor, and do not shame the intelligence that created it.", "prompt": "What does this strategy give you today, and what does it quietly take over time?"}, {"insight": "Do not romanticize armor, and do not shame the intelligence that created it.", "prompt": "What does this strategy give you today, and what does it quietly take over time?"}, {"insight": "Do not romanticize armor, and do not shame the intelligence that created it.", "prompt": "What does this strategy give you today, and what does it quietly take over time?"}, {"insight": "Do not romanticize armor, and do not shame the intelligence that created it.", "prompt": "What does this strategy give you today, and what does it quietly take over time?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.png"}, {"kind": "teaching", "title": "The Armor Map", "kicker": "CUE â†’ FEAR â†’ STRATEGY â†’ RELIEF â†’ COST", "body": ["What happened?", "What outcome felt dangerous?", "What protection appeared?", "What followed later?"], "narration": "Use the Roux Life Armor Map. Identify the cue: feedback, silence, conflict, dependence, or uncertainty. Name the feared outcome: rejection, humiliation, loss of control, burdening someone, or needing too much. Describe the strategy. Record the immediate relief. Then examine the later cost. The map makes the pattern visible without requiring a clinical explanation of its origin. Coaching remains present-focused, practical, and client-owned.", "lenses": [{"insight": "Map sequence and function before asking the client to do something braver.", "prompt": "What did you fear might happen, and how did the armor help in that moment?"}, {"insight": "Map sequence and function before asking the client to do something braver.", "prompt": "What did you fear might happen, and how did the armor help in that moment?"}, {"insight": "Map sequence and function before asking the client to do something braver.", "prompt": "What did you fear might happen, and how did the armor help in that moment?"}, {"insight": "Map sequence and function before asking the client to do something braver.", "prompt": "What did you fear might happen, and how did the armor help in that moment?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.png"}, {"kind": "question", "title": "Checkpoint 3 Â· Honor function", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client overprepares every presentation and feels exhausted. What is the strongest first question?", "options": ["Why are you sabotaging yourself?", "What does the extra preparation protect you from, and when does it stop helping?", "Can you promise to prepare less?"], "correct": 1, "feedback": ["This uses shame and assumes intent.", "Correct. It honors function while locating the point where protection becomes costly.", "Commitment is premature before the pattern is understood."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client overprepares every presentation and feels exhausted. What is the strongest first question?", "audio": "audio_scene_15.mp3", "image": "assets_scene_15.png"}, {"kind": "teaching", "title": "Trust is assessed through behavior", "kicker": "VULNERABILITY IS NOT OWED", "body": ["Reliability", "Respect for boundaries", "Honest response", "Capacity for repair"], "narration": "Clients do not owe vulnerability to every person. Before encouraging disclosure, assess trust through behavior. Does the other person keep commitments, respect privacy, tolerate no, respond without ridicule, and repair harm? Trust can be partial. Someone may be safe for practical help but not intimate disclosure. The coach should not declare a relationship safe from limited information. Help the client review evidence and decide what level of access has been earned.", "lenses": [{"insight": "Trust grows through repeated behavior; title, history, or closeness alone does not guarantee it.", "prompt": "What has this person consistently done with smaller moments of honesty?"}, {"insight": "Trust grows through repeated behavior; title, history, or closeness alone does not guarantee it.", "prompt": "What has this person consistently done with smaller moments of honesty?"}, {"insight": "Trust grows through repeated behavior; title, history, or closeness alone does not guarantee it.", "prompt": "What has this person consistently done with smaller moments of honesty?"}, {"insight": "Trust grows through repeated behavior; title, history, or closeness alone does not guarantee it.", "prompt": "What has this person consistently done with smaller moments of honesty?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.png"}, {"kind": "teaching", "title": "Use the Trust and Readiness Check", "kicker": "PERSON Â· PURPOSE Â· CAPACITY Â· CONSEQUENCE", "body": ["Has trust been earned?", "Why share this now?", "Can the client stay grounded?", "What responses must be considered?"], "narration": "Before a courageous conversation, review four dimensions. Person: what evidence of trust exists? Purpose: what does sharing serve? Capacity: is the client steady enough to speak and receive an imperfect response? Consequence: what practical, relational, workplace, cultural, or safety effects must be considered? The check does not eliminate uncertainty. It prevents vulnerability from becoming an automatic assignment whenever honesty sounds emotionally impressive.", "lenses": [{"insight": "Discernment is part of courage, not evidence of cowardice.", "prompt": "Which part of this decision needs more information before action?"}, {"insight": "Discernment is part of courage, not evidence of cowardice.", "prompt": "Which part of this decision needs more information before action?"}, {"insight": "Discernment is part of courage, not evidence of cowardice.", "prompt": "Which part of this decision needs more information before action?"}, {"insight": "Discernment is part of courage, not evidence of cowardice.", "prompt": "Which part of this decision needs more information before action?"}], "audio": "audio_scene_17.mp3", "image": "assets_scene_17.png"}, {"kind": "teaching", "title": "Boundaries can make vulnerability safer", "kicker": "A DOOR, NOT THE REMOVAL OF EVERY WALL", "body": ["Choose the topic", "Choose the audience", "Choose the timing", "Choose what happens next"], "narration": "A boundary can support connection by defining the conditions under which honesty is possible. The client may choose the topic, audience, timing, setting, and what she will do if the conversation becomes disrespectful. A boundary is not armor simply because it limits access. Healthy boundaries are flexible, values-based, and communicated when possible. Armor is more automatic and often blocks even relationships that have shown themselves trustworthy.", "lenses": [{"insight": "The question is not open or closed. It is intentional access.", "prompt": "What condition would help you be honest without abandoning self-protection?"}, {"insight": "The question is not open or closed. It is intentional access.", "prompt": "What condition would help you be honest without abandoning self-protection?"}, {"insight": "The question is not open or closed. It is intentional access.", "prompt": "What condition would help you be honest without abandoning self-protection?"}, {"insight": "The question is not open or closed. It is intentional access.", "prompt": "What condition would help you be honest without abandoning self-protection?"}], "audio": "audio_scene_18.mp3", "image": "assets_scene_18.png"}, {"kind": "teaching", "title": "Consent and pace belong inside coaching", "kicker": "DO NOT FORCE THE MOMENT", "body": ["Ask permission", "Offer options", "Respect no", "Repair pressure"], "narration": "Emotional depth does not excuse pressure. Ask permission before challenging or inviting a more personal exploration. Offer options: stay here, slow down, move toward action, or pause. Respect no without punishing distance. If the client feels pushed, acknowledge it and repair. A coach can say, I moved faster than was useful. Thank you for telling me. Where would you like to return? This models the safety and accountability the lesson teaches.", "lenses": [{"insight": "A client's refusal is information and a boundary, not a coaching failure.", "prompt": "Would you like a question, a reflection, or more space?"}, {"insight": "A client's refusal is information and a boundary, not a coaching failure.", "prompt": "Would you like a question, a reflection, or more space?"}, {"insight": "A client's refusal is information and a boundary, not a coaching failure.", "prompt": "Would you like a question, a reflection, or more space?"}, {"insight": "A client's refusal is information and a boundary, not a coaching failure.", "prompt": "Would you like a question, a reflection, or more space?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.png"}, {"kind": "question", "title": "Checkpoint 4 Â· Pace and consent", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, â€œI do not want to discuss that today.â€ What should the coach do?", "options": ["Push gently because resistance means the topic matters", "Respect the boundary and ask what focus would be useful instead", "End the coaching relationship"], "correct": 1, "feedback": ["The coach must not treat a boundary as permission to pressure.", "Correct. Respect preserves ownership and allows the client to choose a useful focus.", "One declined topic is not grounds for abandonment."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, â€œI do not want to discuss that today.â€ What should the coach do?", "audio": "audio_scene_20.mp3", "image": "assets_scene_20.png"}, {"kind": "teaching", "title": "Self-validation reduces the demand for reassurance", "kicker": "STEADY ENOUGH TO CHOOSE", "body": ["My feeling is understandable", "My need is worth hearing", "The outcome remains uncertain", "I can choose my next action"], "narration": "Clients may seek certainty before speaking: tell me they will understand; promise I will not look weak. A coach cannot guarantee response. Self-validation helps the client acknowledge that fear and need make sense while accepting uncertainty. I feel exposed because this relationship matters. My request is still legitimate. I can speak clearly and care for myself if the response disappoints me. This creates steadiness without pretending the risk is gone.", "lenses": [{"insight": "Validation supports courage; it does not guarantee comfort or agreement.", "prompt": "What can you offer yourself before asking another person to respond well?"}, {"insight": "Validation supports courage; it does not guarantee comfort or agreement.", "prompt": "What can you offer yourself before asking another person to respond well?"}, {"insight": "Validation supports courage; it does not guarantee comfort or agreement.", "prompt": "What can you offer yourself before asking another person to respond well?"}, {"insight": "Validation supports courage; it does not guarantee comfort or agreement.", "prompt": "What can you offer yourself before asking another person to respond well?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.png"}, {"kind": "teaching", "title": "Build a courage ladder", "kicker": "GRADUATED, CLIENT-OWNED PRACTICE", "body": ["Name a preference", "Make a small request", "Share unfinished work", "Have the larger conversation"], "narration": "Courage can be practiced in graduated steps. The client might begin by naming a preference in a safe relationship, then making one specific request, sharing unfinished work with a trusted colleague, and later addressing a larger conversation. The ladder is not clinical exposure therapy. It is ordinary coaching practice around values and behavior. The client chooses the steps, pace, and conditions. If anxiety or trauma symptoms are severe, refer appropriately.", "lenses": [{"insight": "A useful stretch increases agency without overwhelming capacity.", "prompt": "What is one level braver than automatic protectionâ€”not five levels?"}, {"insight": "A useful stretch increases agency without overwhelming capacity.", "prompt": "What is one level braver than automatic protectionâ€”not five levels?"}, {"insight": "A useful stretch increases agency without overwhelming capacity.", "prompt": "What is one level braver than automatic protectionâ€”not five levels?"}, {"insight": "A useful stretch increases agency without overwhelming capacity.", "prompt": "What is one level braver than automatic protectionâ€”not five levels?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.png"}, {"kind": "teaching", "title": "Prepare language without scripting control", "kicker": "CLEAR WORDS, FLEXIBLE RESPONSE", "body": ["Observation", "Feeling or impact", "Need or value", "Specific request"], "narration": "Preparation can support courage without controlling the outcome. Help the client state an observation, emotional impact, need or value, and specific request. For example: when decisions change without notice, I feel unprepared and concerned about quality. Reliability matters to me. Could we agree on a twenty-four-hour notice when possible? The client can rehearse while remaining responsive to the actual conversation. The script is a support, not a guarantee.", "lenses": [{"insight": "Clean language reduces accusation while keeping the client's experience visible.", "prompt": "What do you want the other person to understand, and what are you asking them to do?"}, {"insight": "Clean language reduces accusation while keeping the client's experience visible.", "prompt": "What do you want the other person to understand, and what are you asking them to do?"}, {"insight": "Clean language reduces accusation while keeping the client's experience visible.", "prompt": "What do you want the other person to understand, and what are you asking them to do?"}, {"insight": "Clean language reduces accusation while keeping the client's experience visible.", "prompt": "What do you want the other person to understand, and what are you asking them to do?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.png"}, {"kind": "teaching", "title": "Case study Â· Meet Renee", "kicker": "COMPOSED, CAPABLE, AND CAREFULLY UNKNOWN", "body": ["Nonprofit executive", "Trusted in crisis", "Minimizes personal needs", "Withdraws after emotional uncertainty"], "narration": "Renee is a nonprofit executive known for calm leadership. She can guide a team through crisis but struggles to tell her partner when she feels hurt or needs support. She gives polished answers, says she is fine, and becomes distant after conflict. She wants greater connection but fears that visible need will make her burdensome and less respected. Your task is not to make Renee disclose. It is to understand the armor and help her choose.", "lenses": [{"insight": "Hold both truths: Renee's competence is real, and the strategy may limit the connection she wants.", "prompt": "When did composure begin to feel necessary in this relationship?"}, {"insight": "Hold both truths: Renee's competence is real, and the strategy may limit the connection she wants.", "prompt": "When did composure begin to feel necessary in this relationship?"}, {"insight": "Hold both truths: Renee's competence is real, and the strategy may limit the connection she wants.", "prompt": "When did composure begin to feel necessary in this relationship?"}, {"insight": "Hold both truths: Renee's competence is real, and the strategy may limit the connection she wants.", "prompt": "When did composure begin to feel necessary in this relationship?"}], "audio": "audio_scene_24.mp3", "image": "assets_scene_24.png"}, {"kind": "teaching", "title": "Renee's Armor Map", "kicker": "CUE â†’ FEAR â†’ STRATEGY â†’ RELIEF â†’ COST", "body": ["Cue Â· partner seems distracted", "Fear Â· â€œMy need will be too muchâ€", "Armor Â· say â€œnothingâ€ and withdraw", "Cost Â· distance confirms disconnection"], "narration": "Renee notices her partner is distracted while she speaks. She fears that asking for attention will sound needy. She says nothing is wrong and withdraws. The immediate relief is that she avoids possible rejection. The later cost is distance, confusion, and a growing belief that her partner does not notice her. The map does not blame Renee for every relationship problem. It reveals a choice point within her influence.", "lenses": [{"insight": "Separate responsibility for communicating need from responsibility for the partner's response.", "prompt": "What becomes possible if your need is named clearly rather than tested silently?"}, {"insight": "Separate responsibility for communicating need from responsibility for the partner's response.", "prompt": "What becomes possible if your need is named clearly rather than tested silently?"}, {"insight": "Separate responsibility for communicating need from responsibility for the partner's response.", "prompt": "What becomes possible if your need is named clearly rather than tested silently?"}, {"insight": "Separate responsibility for communicating need from responsibility for the partner's response.", "prompt": "What becomes possible if your need is named clearly rather than tested silently?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.png"}, {"kind": "teaching", "title": "Assess trust before encouraging openness", "kicker": "WHAT HAS THE RELATIONSHIP EARNED?", "body": ["Partner has respected smaller requests", "Conflict sometimes becomes defensive", "Both have repaired before", "Renee needs a pause plan"], "narration": "Renee's partner has responded well to smaller requests and has participated in repair after conflict, though defensiveness sometimes appears. That evidence suggests a measured conversation may be reasonable. Renee decides she needs a time limit, a quiet setting, and permission to pause if either person becomes overwhelmed. The coach helps her prepare for several possible responses without predicting or controlling the outcome.", "lenses": [{"insight": "A nuanced trust assessment can support courage without promising safety that the coach cannot guarantee.", "prompt": "What evidence supports sharing, and what boundary should travel with the conversation?"}, {"insight": "A nuanced trust assessment can support courage without promising safety that the coach cannot guarantee.", "prompt": "What evidence supports sharing, and what boundary should travel with the conversation?"}, {"insight": "A nuanced trust assessment can support courage without promising safety that the coach cannot guarantee.", "prompt": "What evidence supports sharing, and what boundary should travel with the conversation?"}, {"insight": "A nuanced trust assessment can support courage without promising safety that the coach cannot guarantee.", "prompt": "What evidence supports sharing, and what boundary should travel with the conversation?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.png"}, {"kind": "question", "title": "Checkpoint 5 Â· Coach Renee", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which first action best matches Renee's goal and readiness?", "options": ["Reveal every past hurt in one conversation", "Make one specific request for attention and name why it matters", "Wait silently to see whether her partner notices"], "correct": 1, "feedback": ["Maximum disclosure may overwhelm the purpose and ignore pace.", "Correct. A relevant, specific request creates honest new evidence without demanding total exposure.", "Silent testing repeats the armor and hides the need."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which first action best matches Renee's goal and readiness?", "audio": "audio_scene_27.mp3", "image": "assets_scene_27.png"}, {"kind": "teaching", "title": "Renee's courage experiment", "kicker": "ONE HONEST SENTENCE, ONE REQUEST, ONE REVIEW", "body": ["â€œI felt alone in that momentâ€", "â€œCould we put phones away for ten minutes?â€", "Pause if respect disappears", "Review evidence afterward"], "narration": "Renee chooses one honest sentence and one request: I felt alone when I was talking and your attention moved to your phone. Could we put our phones away for ten minutes and try again? She plans to pause if the conversation becomes disrespectful. Afterward, she will review what she felt, what happened, what she learned about the relationship, and what she wants to practice next. Success is not perfect agreement. Success is honest, boundaried participation.", "lenses": [{"insight": "Measure courage by values-aligned behavior, not by controlling the other person's answer.", "prompt": "What would let you call this courageous even if the response is imperfect?"}, {"insight": "Measure courage by values-aligned behavior, not by controlling the other person's answer.", "prompt": "What would let you call this courageous even if the response is imperfect?"}, {"insight": "Measure courage by values-aligned behavior, not by controlling the other person's answer.", "prompt": "What would let you call this courageous even if the response is imperfect?"}, {"insight": "Measure courage by values-aligned behavior, not by controlling the other person's answer.", "prompt": "What would let you call this courageous even if the response is imperfect?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.png"}, {"kind": "teaching", "title": "Responding to an imperfect answer", "kicker": "COURAGE DOES NOT GUARANTEE REWARD", "body": ["Stay with facts", "Name impact", "Use the boundary", "Seek appropriate support"], "narration": "A client may speak courageously and receive confusion, defensiveness, silence, or rejection. Do not tell her the disclosure was a mistake simply because the response hurt. Also do not romanticize pain as proof of bravery. Review facts, emotional impact, trust evidence, boundary use, and available support. The result may call for repair, a clearer request, more time, a changed level of access, or specialized help.", "lenses": [{"insight": "Courage gathers information about both self and relationship.", "prompt": "What did this response reveal, and what choice now protects dignity and values?"}, {"insight": "Courage gathers information about both self and relationship.", "prompt": "What did this response reveal, and what choice now protects dignity and values?"}, {"insight": "Courage gathers information about both self and relationship.", "prompt": "What did this response reveal, and what choice now protects dignity and values?"}, {"insight": "Courage gathers information about both self and relationship.", "prompt": "What did this response reveal, and what choice now protects dignity and values?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.png"}, {"kind": "teaching", "title": "Repair after protective behavior", "kicker": "OWN IMPACT WITHOUT SHAMING THE STRATEGY", "body": ["Name what happened", "Acknowledge impact", "Explain without excusing", "Practice a different response"], "narration": "Clients can repair when armor harms connection. Renee might say: I told you nothing was wrong and then became distant. I was afraid my need would be too much. That fear explains my response, but it did not make the distance fair or clear. I want to practice telling you sooner. Repair separates explanation from excuse, keeps worth separate from behavior, and creates a concrete alternative for next time.", "lenses": [{"insight": "Accountability is strongest when it includes impact, ownership, and practiceâ€”not self-condemnation.", "prompt": "What needs acknowledgment, and what will you do differently when the cue returns?"}, {"insight": "Accountability is strongest when it includes impact, ownership, and practiceâ€”not self-condemnation.", "prompt": "What needs acknowledgment, and what will you do differently when the cue returns?"}, {"insight": "Accountability is strongest when it includes impact, ownership, and practiceâ€”not self-condemnation.", "prompt": "What needs acknowledgment, and what will you do differently when the cue returns?"}, {"insight": "Accountability is strongest when it includes impact, ownership, and practiceâ€”not self-condemnation.", "prompt": "What needs acknowledgment, and what will you do differently when the cue returns?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.png"}, {"kind": "teaching", "title": "Coach without rescuing or praising exposure", "kicker": "STEADY PRESENCE OVER DRAMA", "body": ["Do not guarantee the outcome", "Do not demand disclosure", "Do not become the only safe person", "Return self-trust"], "narration": "Coaches may feel tempted to reassure, promise a good response, or celebrate disclosure as the breakthrough. Those moves can create dependence or pressure. Instead, acknowledge the courage, review what the client chose, and ask what she learned about herself and the relationship. Encourage a healthy network rather than becoming the only place the client feels understood. The goal is increased discernment, communication, and self-trust.", "lenses": [{"insight": "The client should leave more capable of choosingâ€”not more reliant on the coach's emotional permission.", "prompt": "How will this conversation strengthen the client's own judgment?"}, {"insight": "The client should leave more capable of choosingâ€”not more reliant on the coach's emotional permission.", "prompt": "How will this conversation strengthen the client's own judgment?"}, {"insight": "The client should leave more capable of choosingâ€”not more reliant on the coach's emotional permission.", "prompt": "How will this conversation strengthen the client's own judgment?"}, {"insight": "The client should leave more capable of choosingâ€”not more reliant on the coach's emotional permission.", "prompt": "How will this conversation strengthen the client's own judgment?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.png"}, {"kind": "teaching", "title": "When vulnerability language can become unsafe", "kicker": "DO NOT PRESSURE DISCLOSURE OR CONFRONTATION", "body": ["Coercion or abuse", "Workplace retaliation risk", "Unstable or dangerous person", "Confidential or legal constraints"], "narration": "Do not encourage vulnerable disclosure or confrontation when coercion, abuse, credible retaliation, stalking, violence, severe instability, or legal and workplace risks may be present. Coaching must not frame silence as cowardice or honesty as morally required. Focus on safety, specialized resources, informed options, and professional advice where appropriate. The client's emotional courage may be seeking support privately rather than conf
