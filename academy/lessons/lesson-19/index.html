es treatment.", "lenses": [{"insight": "Immediate risk addressed", "prompt": "What ethical duty is present?"}, {"insight": "Licensed clinical and medical evaluation", "prompt": "What information must be clarified?"}, {"insight": "Coaching paused", "prompt": "What boundary, consultation, or referral is needed?"}, {"insight": "Re-entry considered only when appropriate", "prompt": "How will safety, consent, and dignity be protected?"}], "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Use the ROUX ethical decision pause", "kicker": "RECOGNIZE · OPEN · UNCOVER · EXECUTE", "body": ["Recognize the ethical tension", "Open the facts, duties, and perspectives", "Uncover risk, power, bias, and missing expertise", "Execute the safest accountable next step"], "narration": "When an ethical concern is not an obvious emergency, pause before reacting. Recognize the exact tension instead of reducing it to a feeling. Open the relevant facts, agreements, laws, policies, duties, and client perspective. Uncover power differences, foreseeable harm, personal bias, missing competence, and where consultation is needed. Then execute the safest accountable action, explain it clearly, document the reasoning, and review the result. The ROUX Method does not replace a professional code or legal advice. It gives the coach a disciplined way to slow down and use them well.", "lenses": [{"insight": "Recognize the ethical tension", "prompt": "What ethical duty is present?"}, {"insight": "Open the facts, duties, and perspectives", "prompt": "What information must be clarified?"}, {"insight": "Uncover risk, power, bias, and missing expertise", "prompt": "What boundary, consultation, or referral is needed?"}, {"insight": "Execute the safest accountable next step", "prompt": "How will safety, consent, and dignity be protected?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "The Roux Life ethical standard", " const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 19</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 19</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Scope, Ethics, Referral, and Client Safety';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson19PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
