<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 19 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 19 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build Your Ethical Coaching and Referral Protocol</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Scope statement</strong><small>Define what your coaching provides, excludes, and requires for referral.</small><textarea id="scope" rows="4"></textarea></label><label><strong>2. Informed-consent audit</strong><small>Review roles, fees, communication, privacy, risks, alternatives, records, and complaints.</small><textarea id="consent" rows="4"></textarea></label><label><strong>3. Confidentiality protocol</strong><small>Document privacy practices, exceptions, disclosures, and client explanation.</small><textarea id="confidentiality" rows="4"></textarea></label><label><strong>4. Technology and data map</strong><small>List every system, data type, access point, retention period, and safeguard.</small><textarea id="technology" rows="4"></textarea></label><label><strong>5. Boundary and conflict screen</strong><small>Assess contact, dual roles, gifts, disclosure, incentives, and power.</small><textarea id="boundaries" rows="4"></textarea></label><label><strong>6. Claims and stories audit</strong><small>Remove guarantees, inflated credentials, misleading claims, and unauthorized stories.</small><textarea id="marketing" rows="4"></textarea></label><label><strong>7. Attachment-language practice</strong><small>Rewrite diagnostic labels as tentative pattern, trigger, regulation, communication, and boundary inquiry.</small><textarea id="attachment" rows="4"></textarea></label><label><strong>8. Warning-sign screen</strong><small>Assess functioning, severity, duration, safety, substance use, eating, sleep, abuse, and medical needs.</small><textarea id="warning" rows="4"></textarea></label><label><strong>9. Referral pathways</strong><small>Build routine, urgent, and emergency contacts for clinical, medical, safety, legal, and specialized needs.</small><textarea id="referral" rows="4"></textarea></label><label><strong>10. Referral conversation</strong><small>Write warm, direct language for pause, parallel care, and ending.</small><textarea id="language" rows="4"></textarea></label><label><strong>11. Tasha case consultation</strong><small>Document risk recognition, safety response, referral, consent, notes, and follow-up.</small><textarea id="tasha" rows="4"></textarea></label><label><strong>12. Professional-development plan</strong><small>Choose supervision, education, consultation, legal guidance, and annual review practices.</small><textarea id="competence" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
