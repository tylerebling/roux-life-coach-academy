const scenes=[{"kind": "teaching", "title": "Self-Compassion, Repair, and Resilience", "kicker": "ROUX LIFE ACADEMY Â· LESSON 8", "body": ["Face reality kindly", "Repair what is yours", "Recover in workable steps", "Refer beyond scope"], "narration": "Welcome to Lesson Eight: Self-Compassion, Repair, and Resilience. Setbacks can tempt clients toward self-attack, denial, frantic action, or withdrawal. The Roux Life approach does not demand positivity or celebrate suffering. We help the client acknowledge what happened, respond without contempt, identify realistic responsibility, repair what can be repaired, and build the next workable step. Resilience is not invulnerability. It is the developing capacity to recover, adapt, reconnect, and act with meaning.", "lenses": [{"insight": "Recovery begins with an honest response to reality, not a performance of strength.", "prompt": "What does this client need to acknowledge before movement becomes useful?"}, {"insight": "Recovery begins with an honest response to reality, not a performance of strength.", "prompt": "What does this client need to acknowledge before movement becomes useful?"}, {"insight": "Recovery begins with an honest response to reality, not a performance of strength.", "prompt": "What does this client need to acknowledge before movement becomes useful?"}, {"insight": "Recovery begins with an honest response to reality, not a performance of strength.", "prompt": "What does this client need to acknowledge before movement becomes useful?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.png"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Understand self-compassion", "Build a recovery sequence", "Practice repair", "Develop resilient action"], "narration": "We will define self-compassion in practical coaching language, distinguish it from pity and excuse-making, and explore how pace, needs, support, and self-talk influence recovery. You will learn a structured repair process, examine what rebuilds trust, and use resilience practices that remain within coaching scope. Six interactive decisions, Tasha's complete case, a guided workbook, application exercises, and a graded quiz will support skill development.", "lenses": [{"insight": "Structure helps a beginning coach remain useful when emotion and urgency are high.", "prompt": "Which part of recovery needs attention before action planning?"}, {"insight": "Structure helps a beginning coach remain useful when emotion and urgency are high.", "prompt": "Which part of recovery needs attention before action planning?"}, {"insight": "Structure helps a beginning coach remain useful when emotion and urgency are high.", "prompt": "Which part of recovery needs attention before action planning?"}, {"insight": "Structure helps a beginning coach remain useful when emotion and urgency are high.", "prompt": "Which part of recovery needs attention before action planning?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.png"}, {"kind": "teaching", "title": "Self-compassion has four working elements", "kicker": "AWARENESS Â· KINDNESS Â· COMMON HUMANITY Â· RESPONSIBILITY", "body": ["Notice without exaggerating", "Respond without contempt", "Remember imperfection is human", "Choose responsible action"], "narration": "Self-compassion begins with awareness: this hurts, this is disappointing, or I made a mistake. Kindness means responding without ridicule or cruelty. Common humanity remembers that difficulty and imperfection are part of being human without using that fact to minimize impact. Responsibility asks what action, repair, boundary, or learning is now appropriate. All four elements matter. Kindness without truth becomes avoidance; responsibility without kindness can become punishment.", "lenses": [{"insight": "Compassion is a way of meeting reality, not escaping it.", "prompt": "Which element is missing from the client's current response?"}, {"insight": "Compassion is a way of meeting reality, not escaping it.", "prompt": "Which element is missing from the client's current response?"}, {"insight": "Compassion is a way of meeting reality, not escaping it.", "prompt": "Which element is missing from the client's current response?"}, {"insight": "Compassion is a way of meeting reality, not escaping it.", "prompt": "Which element is missing from the client's current response?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.png"}, {"kind": "teaching", "title": "Compassion is not pity or permission", "kicker": "SOFTNESS AND STANDARDS CAN COEXIST", "body": ["Pity makes the client smaller", "Permission ignores impact", "Compassion preserves dignity", "Accountability preserves values"], "narration": "Pity can position the client as helpless. Excusing can imply that impact does not matter. Self-compassion does neither. It says: This is difficult, I remain worthy of respect, and I can respond responsibly. A coach should not use compassion to talk a client out of appropriate regret. Nor should the coach withhold warmth until the client has suffered enough. The aim is accurate, dignified engagement with what happened.", "lenses": [{"insight": "The client does not need humiliation in order to care about consequences.", "prompt": "What would be both kind and honest here?"}, {"insight": "The client does not need humiliation in order to care about consequences.", "prompt": "What would be both kind and honest here?"}, {"insight": "The client does not need humiliation in order to care about consequences.", "prompt": "What would be both kind and honest here?"}, {"insight": "The client does not need humiliation in order to care about consequences.", "prompt": "What would be both kind and honest here?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.png"}, {"kind": "question", "title": "Checkpoint 1 Â· Compassion or avoidance?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, â€œBeing kind to myself means I should forget the mistake.â€ What is the strongest response?", "options": ["Correct; compassion removes responsibility", "Compassion can help you face the mistake without contempt. What impact and next action still need attention?", "You should punish yourself first"], "correct": 1, "feedback": ["This confuses kindness with avoidance.", "Correct. Compassion and responsibility remain connected.", "Punishment is not a prerequisite for ethical action."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, â€œBeing kind to myself means I should forget the mistake.â€ What is the strongest response?", "audio": "audio_scene_05.mp3", "image": "assets_scene_05.png"}, {"kind": "teaching", "title": "Start with the facts of the setback", "kicker": "WHAT HAPPENED?", "body": ["Observable event", "Relevant context", "Actual impact", "Unknowns remain unknown"], "narration": "Recovery becomes difficult when the client is responding to a vague catastrophe rather than specific facts. Ask what occurred, what was expected, what changed, and what consequences are known. Include relevant context without turning context into excuse. Separate impact from prediction. The client may discover a serious loss, a correctable problem, or several unknowns. A clear starting point reduces both denial and exaggeration.", "lenses": [{"insight": "Accurate facts give compassion and action somewhere solid to stand.", "prompt": "What would a neutral record show?"}, {"insight": "Accurate facts give compassion and action somewhere solid to stand.", "prompt": "What would a neutral record show?"}, {"insight": "Accurate facts give compassion and action somewhere solid to stand.", "prompt": "What would a neutral record show?"}, {"insight": "Accurate facts give compassion and action somewhere solid to stand.", "prompt": "What would a neutral record show?"}], "audio": "audio_scene_06.mp3", "image": "assets_scene_06.png"}, {"kind": "teaching", "title": "Use the Recovery Sequence", "kicker": "PAUSE â†’ ORIENT â†’ SUPPORT â†’ ACT â†’ REVIEW", "body": ["Slow unnecessary urgency", "Return to present facts", "Identify support and capacity", "Choose and review one step"], "narration": "The Roux Life Recovery Sequence begins with a pause long enough to interrupt reactive action. Orient to facts, needs, available resources, and what remains uncertain. Identify support and current capacity. Choose one useful action. Then review its effect and adjust. The sequence is flexible, not a clinical protocol. It helps a coach avoid rushing to solve before the client understands what recovery requires.", "lenses": [{"insight": "The next step becomes clearer when urgency is separated from importance.", "prompt": "What would become visible if the client paused before fixing?"}, {"insight": "The next step becomes clearer when urgency is separated from importance.", "prompt": "What would become visible if the client paused before fixing?"}, {"insight": "The next step becomes clearer when urgency is separated from importance.", "prompt": "What would become visible if the client paused before fixing?"}, {"insight": "The next step becomes clearer when urgency is separated from importance.", "prompt": "What would become visible if the client paused before fixing?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.png"}, {"kind": "teaching", "title": "Name the loss without rushing meaning", "kicker": "NOT EVERYTHING NEEDS A SILVER LINING TODAY", "body": ["Time or opportunity", "Trust or belonging", "Identity expectation", "Energy or confidence"], "narration": "A setback may involve more than a failed goal. The client may have lost time, money, trust, belonging, confidence, or an expected version of the future. Coaches sometimes rush toward lessons and gratitude because grief feels uncomfortable. Slow down. Ask what the client believes was lost and what remains. Meaning can emerge later; it should not be demanded as proof of resilience.", "lenses": [{"insight": "Acknowledgment is movement when denial has kept the client frozen.", "prompt": "What are you asking yourself to be over before you have named it?"}, {"insight": "Acknowledgment is movement when denial has kept the client frozen.", "prompt": "What are you asking yourself to be over before you have named it?"}, {"insight": "Acknowledgment is movement when denial has kept the client frozen.", "prompt": "What are you asking yourself to be over before you have named it?"}, {"insight": "Acknowledgment is movement when denial has kept the client frozen.", "prompt": "What are you asking yourself to be over before you have named it?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.png"}, {"kind": "teaching", "title": "Needs become practical when they are specific", "kicker": "REST Â· INFORMATION Â· SUPPORT Â· SPACE Â· STRUCTURE", "body": ["What is needed now?", "What can wait?", "Who can help?", "What belongs outside coaching?"], "narration": "A client may say, I need to recover, without knowing what that means today. Translate the need into something observable: sleep, food, medical care, information, privacy, a conversation, schedule relief, emotional support, or a professional referral. The coach does not prescribe medical or mental-health care. We help the client identify choices and appropriate resources. Specific needs allow better decisions than a broad demand to feel better.", "lenses": [{"insight": "Needs become actionable when the client can name what support would look like.", "prompt": "What would make the next twenty-four hours more workable?"}, {"insight": "Needs become actionable when the client can name what support would look like.", "prompt": "What would make the next twenty-four hours more workable?"}, {"insight": "Needs become actionable when the client can name what support would look like.", "prompt": "What would make the next twenty-four hours more workable?"}, {"insight": "Needs become actionable when the client can name what support would look like.", "prompt": "What would make the next twenty-four hours more workable?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.png"}, {"kind": "teaching", "title": "Create a minimum viable day", "kicker": "PROTECT THE ESSENTIALS DURING A MANAGEABLE SETBACK", "body": ["One essential responsibility", "Basic care", "One support connection", "One restorative action"], "narration": "During a manageable period of stress, a minimum viable day can protect essential functioning without demanding normal performance. The client identifies one required responsibility, basic care, one support connection, and one restorative action. This is a coaching planning tool, not treatment for severe depression or impairment. If the client cannot meet basic needs, cannot function, or shows serious symptoms, licensed or medical support may be necessary.", "lenses": [{"insight": "Temporary simplicity can create capacity for responsible recovery.", "prompt": "What is essential today, and what can be intentionally postponed?"}, {"insight": "Temporary simplicity can create capacity for responsible recovery.", "prompt": "What is essential today, and what can be intentionally postponed?"}, {"insight": "Temporary simplicity can create capacity for responsible recovery.", "prompt": "What is essential today, and what can be intentionally postponed?"}, {"insight": "Temporary simplicity can create capacity for responsible recovery.", "prompt": "What is essential today, and what can be intentionally postponed?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.png"}, {"kind": "question", "title": "Checkpoint 2 Â· Pace recovery", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client is exhausted after a major setback and wants to rebuild everything tonight. What should the coach do first?", "options": ["Create a twenty-item action plan", "Clarify facts, capacity, essential needs, urgency, and one proportionate next step", "Tell her resilient people never rest"], "correct": 1, "feedback": ["More action can become avoidance or overwhelm.", "Correct. Capacity and proportion should shape the first step.", "Rest and resilience are not opposites."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client is exhausted after a major setback and wants to rebuild everything tonight. What should the coach do first?", "audio": "audio_scene_11.mp3", "image": "assets_scene_11.png"}, {"kind": "teaching", "title": "Compassionate self-talk is specific", "kicker": "TRUTHFUL, WARM, AND USEFUL", "body": ["Name the difficulty", "Avoid identity contempt", "Recognize available choice", "Use the client's natural language"], "narration": "Generic affirmations may feel false when a client is hurting. Build language from facts. This launch disappointed me. I invested deeply, and I am allowed to feel the loss. One outcome does not define my entire future. I can examine what happened and choose the next responsible step. The wording should sound natural to the client rather than like a performance for the coach.", "lenses": [{"insight": "A useful inner response is believable enough to practice.", "prompt": "What sentence would you accept from someone who respected both your pain and your capability?"}, {"insight": "A useful inner response is believable enough to practice.", "prompt": "What sentence would you accept from someone who respected both your pain and your capability?"}, {"insight": "A useful inner response is believable enough to practice.", "prompt": "What sentence would you accept from someone who respected both your pain and your capability?"}, {"insight": "A useful inner response is believable enough to practice.", "prompt": "What sentence would you accept from someone who respected both your pain and your capability?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.png"}, {"kind": "teaching", "title": "The body may to need, competence, trust, and consent.", "prompt": "What are you asking this person to provideâ€”and what are you not asking them to carry?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.png"}, {"kind": "teaching", "title": "Resilience includes flexible expectations", "kicker": "ADAPTATION, NOT LOWERED WORTH", "body": ["Revise the timeline", "Change the method", "Protect the value", "Release one outdated expectation"], "narration": "A resilient client may keep the value while changing the plan. She can revise a timeline, reduce scope, seek help, or choose a different route. This is not always giving up. Ask what remains meaningful, what reality requires, and which expectation belongs to an older version of the situation. Flexibility prevents commitment from becoming rigidity.", "lenses": [{"insight": "The route can change without invalidating the destination or the person.", "prompt": "What can change while the underlying value remains intact?"}, {"insight": "The route can change without invalidating the destination or the person.", "prompt": "What can change while the underlying value remains intact?"}, {"insight": "The route can change without invalidating the destination or the person.", "prompt": "What can change while the underlying value remains intact?"}, {"insight": "The route can change without invalidating the destination or the person.", "prompt": "What can change while the underlying value remains intact?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.png"}, {"kind": "question", "title": "Checkpoint 3 Â· Resilience in action", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which choice best demonstrates resilience?", "options": ["Pretend the setback did not hurt", "Use evidence and support to adapt the plan while preserving the important value", "Repeat the same strategy to prove strength"], "correct": 1, "feedback": ["Denial is not recovery.", "Correct. Resilience includes honest adaptation and continued agency.", "Rigidity can repeat harm rather than demonstrate courage."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which choice best demonstrates resilience?", "audio": "audio_scene_17.mp3", "image": "assets_scene_17.png"}, {"kind": "teaching", "title": "Repair begins with impact", "kicker": "WHAT NEEDS TO BE ADDRESSED?", "body": ["Behavior", "Effect", "Responsibility", "What cannot be undone"], "narration": "Repair begins by identifying what behavior affected another person, system, agreement, or value. The client may feel sorry yet remain vague about impact. Ask what happened, who was affected, what responsibility belongs to the client, and what cannot be undone. Repair is not always available, safe, or welcomed. The client can still practice accountability without forcing contact.", "lenses": [{"insight": "Repair responds to impact; it is not a performance designed to erase guilt.", "prompt": "What specifically needs acknowledgment?"}, {"insight": "Repair responds to impact; it is not a performance designed to erase guilt.", "prompt": "What specifically needs acknowledgment?"}, {"insight": "Repair responds to impact; it is not a performance designed to erase guilt.", "prompt": "What specifically needs acknowledgment?"}, {"insight": "Repair responds to impact; it is not a performance designed to erase guilt.", "prompt": "What specifically needs acknowledgment?"}], "audio": "audio_scene_18.mp3", "image": "assets_scene_18.png"}, {"kind": "teaching", "title": "Use the Repair Path", "kicker": "ACKNOWLEDGE â†’ OWN â†’ OFFER â†’ CHANGE â†’ RELEASE CONTROL", "body": ["Acknowledge behavior and impact", "Own the relevant part", "Offer proportionate repair", "Change behavior and release outcome"], "narration": "The Roux Life Repair Path has five movements. Acknowledge the behavior and impact. Own the relevant responsibility without collapsing into total blame. Offer a proportionate repair. Change the behavior or system that contributed. Release control of forgiveness, trust, and timing. The other person may decline contact or remain disappointed. The client's responsibility is accountable participation, not guaranteed reconciliation.", "lenses": [{"insight": "Repair is credible when language and future behavior agree.", "prompt": "What can the client offer without demanding relief in return?"}, {"insight": "Repair is credible when language and future behavior agree.", "prompt": "What can the client offer without demanding relief in return?"}, {"insight": "Repair is credible when language and future behavior agree.", "prompt": "What can the client offer without demanding relief in return?"}, {"insight": "Repair is credible when language and future behavior agree.", "prompt": "What can the client offer without demanding relief in return?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.png"}, {"kind": "teaching", "title": "A sincere apology is concise", "kicker": "IMPACT BEFORE EXPLANATION", "body": ["I did this", "It affected you this way", "I am sorry", "Here is what I will do"], "narration": "An effective apology names the action, recognizes impact, expresses regret, and identifies repair or change. Explanation may add context, but it should not erase ownership. Avoid if you felt hurt, but I was stressed, or long speeches that make the harmed person comfort the client. The coach can help rehearse clarity without writing a manipulative script.", "lenses": [{"insight": "An apology should carry responsibility, not transfer the emotional burden.", "prompt": "Which sentence owns the behavior without asking the other person to reassure you?"}, {"insight": "An apology should carry responsibility, not transfer the emotional burden.", "prompt": "Which sentence owns the behavior without asking the other person to reassure you?"}, {"insight": "An apology should carry responsibility, not transfer the emotional burden.", "prompt": "Which sentence owns the behavior without asking the other person to reassure you?"}, {"insight": "An apology should carry responsibility, not transfer the emotional burden.", "prompt": "Which sentence owns the behavior without asking the other person to reassure you?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.png"}, {"kind": "teaching", "title": "Restitution should be proportionate", "kicker": "REPAIR IS NOT SELF-PUNISHMENT", "body": ["Correct what can be corrected", "Restore what is possible", "Respect consent", "Avoid dramatic overpayment"], "narration": "Repair may include correcting information, replacing property, refunding a fee, restoring credit, completing an obligation, or changing a process. The action should fit the impact and respect the other person's preferences. Dramatic self-punishment can center the client and create new burdens. Coaches should not provide legal or financial advice outside competence; specialized consequences require qualified guidance.", "lenses": [{"insight": "Proportionate repair serves the harmed party and the relevant value.", "prompt": "What action addresses the impact rather than displaying suffering?"}, {"insight": "Proportionate repair serves the harmed party and the relevant value.", "prompt": "What action addresses the impact rather than displaying suffering?"}, {"insight": "Proportionate repair serves the harmed party and the relevant value.", "prompt": "What action addresses the impact rather than displaying suffering?"}, {"insight": "Proportionate repair serves the harmed party and the relevant value.", "prompt": "What action addresses the impact rather than displaying suffering?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.png"}, {"kind": "teaching", "title": "Repair does not always require contact", "kicker": "CONSENT, SAFETY, AND REALITY MATTER", "body": ["Contact may be unwelcome", "Safety may require distance", "Indirect correction may be possible", "The client can still change"], "narration": "A client may want to contact someone in order to reduce guilt, but contact may be unwanted, unsafe, legally restricted, or disruptive. Explore purpose, consent, consequence, and alternatives. The client may correct a record, change future behavior, write an unsent letter, or make restitution through an appropriate channel. The coach should not push reunion or provide legal advice. Responsible repair respects the other person's boundaries.", "lenses": [{"insight": "Repair is measured by responsibility and changed behavior, not access to another person.", "prompt": "Whose need would this contact serve, and has contact been invited?"}, {"insight": "Repair is measured by responsibility and changed behavior, not access to another person.", "prompt": "Whose need would this contact serve, and has contact been invited?"}, {"insight": "Repair is measured by responsibility and changed behavior, not access to another person.", "prompt": "Whose need would this contact serve, and has contact been invited?"}, {"insight": "Repair is measured by responsibility and changed behavior, not access to another person.", "prompt": "Whose need would this contact serve, and has contact been invited?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.png"}, {"kind": "teaching", "title": "Trust returns through evidence over time", "kicker": "RELIABILITY Â· HONESTY Â· BOUNDARIES Â· REPAIR", "body": ["One apology opens a possibility", "Repeated behavior creates evidence", "The other person chooses access", "Some relationships do not resume"], "narration": "An apology can open a door, but trust is rebuilt through consistent behavior. The client can keep commitments, communicate earlier, respect boundaries, tell the truth, and repair new misses. The other person decides how much access to restore. Some relationships change permanently or end. The coach should not promise reconciliation or pressure the client to keep pursuing someone who has declined contact.", "lenses": [{"insight": "Trust is an outcome of evidence, not a reward the client can demand.", "prompt": "What behavior would make change visible over the next several weeks?"}, {"insight": "Trust is an outcome of evidence, not a reward the client can demand.", "prompt": "What behavior would make change visible over the next several weeks?"}, {"insight": "Trust is an outcome of evidence, not a reward the client can demand.", "prompt": "What behavior would make change visible over the next several weeks?"}, {"insight": "Trust is an outcome of evidence, not a reward the client can demand.", "prompt": "What behavior would make change visible over the next several weeks?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.png"}, {"kind": "teaching", "title": "Resilience needs boundaries", "kicker": "RECOVERY CANNOT DEPEND ON ENDLESS AVAILABILITY", "body": ["Protect time and energy", "Decline unnecessary urgency", "Communicate capacity", "Preserve restorative space"], "narration": "Clients sometimes respond to a setback by becoming endlessly available, accepting every request, or proving worth through overwork. This may look responsible while preventing recovery and recreating the conditions that contributed to the problem. Help the client define capacity, communicate limits, and protect restorative time. Boundaries are not withdrawal when they support sustainable participation and clearer commitments.", "lenses": [{"insight": "A resilient system does not require the client to abandon herself whenever difficulty appears.", "prompt": "What boundary would make responsible follow-through more sustainable?"}, {"insight": "A resilient system does not require the client to abandon herself whenever difficulty appears.", "prompt": "What boundary would make responsible follow-through more sustainable?"}, {"insight": "A resilient system does not require the client to abandon herself whenever difficulty appears.", "prompt": "What boundary would make responsible follow-through more sustainable?"}, {"insight": "A resilient system does not require the client to abandon herself whenever difficulty appears.", "prompt": "What boundary would make responsible follow-through more sustainable?"}], "audio": "audio_scene_24.mp3", "image": "assets_scene_24.png"}, {"kind": "question", "title": "Checkpoint 4 Â· Responsible repair", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client apologizes and asks how to make the other person forgive her. What is the best response?", "options": ["Create a more persuasive apology", "Focus on accountable repair and changed behavior while accepting that forgiveness belongs to the other person", "Tell her forgiveness is guaranteed"], "correct": 1, "feedback": ["Persuasion can turn apology into pressure.", "Correct. The client controls accountability, not another person's response.", "No coach can guarantee forgiveness."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client apologizes and asks how to make the other person forgive her. What is the best response?", "audio": "audio_scene_25.mp3", "image": "assets_scene_25.png"}, {"kind": "teaching", "title": "Tasha's case: the failed launch", "kicker": "REALISTIC COACHING SCENARIO", "body": ["Months of investment", "Low enrollment", "A collaborator felt excluded", "Forced positivity and self-attack"], "narration": "Tasha launched a community program after months of work. Enrollment was low, and her close collaborator felt excluded from a final decision. Tasha alternates between saying everything happens for a reason and calling herself a complete failure. The coach slows the swing between denial and contempt. What happened? What was lost? What impact belongs to Tasha? What support and capacity are available? What requires repair, and what simply requires time?", "lenses": [{"insight": "Recovery starts by holding disappointment and agency in the same conversation.", "prompt": "What truth is Tasha avoiding through positivityâ€”and through punishment?"}, {"insight": "Recovery starts by holding disappointment and agency in the same conversation.", "prompt": "What truth is Tasha avoiding through positivityâ€”and through punishment?"}, {"insight": "Recovery starts by holding disappointment and agency in the same conversation.", "prompt": "What truth is Tasha avoiding through positivityâ€”and through punishment?"}, {"insight": "Recovery starts by holding disappointment and agency in the same conversation.", "prompt": "What truth is Tasha avoiding through positivityâ€”and through punishment?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.png"}, {"kind": "teaching", "title": "Tasha names the loss", "kicker": "A PROGRAM, AN EXPECTATION, AND A SENSE OF MOMENTUM", "body": ["Financial disappointment", "Public visibility", "Strained collaboration", "An imagined future changed"], "narration": "Tasha names several losses: expected income, public confidence, ease with her collaborator, and the future she imagined after launch. The coach does not rush to reframe each loss as a blessing. Naming them allows Tasha to stop fighting an undefined sense of failure. She also identifies what remains: expertise, community relationships, usable content, and the possibility of repair.", "lenses": [{"insight": "A balanced inventory includes both what changed and what remains available.", "prompt": "Which loss deserves acknowledgment before Tasha redesigns the program?"}, {"insight": "A balanced inventory includes both what changed and what remains available.", "prompt": "Which loss deserves acknowledgment before Tasha redesigns the program?"}, {"insight": "A balanced inventory includes both what changed and what remains available.", "prompt": "Which loss deserves acknowledgment before Tasha redesigns the program?"}, {"insight": "A balanced inventory includes both what changed and what remains available.", "prompt": "Which loss deserves acknowledgment before Tasha redesigns the program?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.png"}, {"kind": "teaching", "title": "Tasha separates outcome from worth", "kicker": "THE LAUNCH FAILED TO MEET ITS TARGET", "body": ["Specific result", "Relevant contributing factors", "Identity remains larger", "Learning becomes possible"], "narration": "Tasha replaces I am a failure with a more accurate statement: This launch did not meet its enrollment target, and I excluded my collaborator from a decision that affected her role. Those facts require learning and repair. They do not define my entire ability or worth. The coach helps Tasha use evidence rather than empty praise. Prior community impact and current mistakes can both be true.", "lenses": [{"insight": "Accurate language creates room for responsibility without identity collapse.", "prompt": "What conclusion fits the evidence without becoming either denial or a total verdict?"}, {"insight": "Accurate language creates room for responsibility without identity collapse.", "prompt": "What conclusion fits the evidence without becoming either denial or a total verdict?"}, {"insight": "Accurate language creates room for responsibility without identity collapse.", "prompt": "What conclusion fits the evidence without becoming either denial or a total verdict?"}, {"insight": "Accurate language creates room for responsibility without identity collapse.", "prompt": "What conclusion fits the evidence without becoming either denial or a total verdict?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.png"}, {"kind": "teaching", "title": "Tasha plans repair", "kicker": "ACKNOWLEDGE Â· OWN Â· OFFER Â· CHANGE", "body": ["Name the decision", "Recognize the collaborator's impact", "Ask whether a repair conversation is welcome", "Change decision practices"], "narration": "Tasha drafts a concise message acknowledging that she made a final decision without consulting her collaborator and that this affected trust and role clarity. She asks whether a conversation is welcome and prepares .", "prompt": "What is the smallest experiment that could answer the most important question?"}, {"insight": "Resilient action gathers evidence without wagering the client's entire identity again.", "prompt": "What is the smallest experiment that could answer the most important question?"}, {"insight": "Resilient action gathers evidence without wagering the client's entire identity again.", "prompt": "What is the smallest experiment that could answer the most important question?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.png"}, {"kind": "question", "title": "Checkpoint 5 Â· Tasha's recovery", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which plan best supports Tasha?", "options": ["Relaunch immediately to prove resilience", "Acknowledge loss, attempt repair, test a smaller evidence-gathering experiment, and review capacity", "Abandon all future community work"], "correct": 1, "feedback": ["Urgent repetition may recreate the same problems.", "Correct. The plan integrates compassion, accountability, adaptation, and evidence.", "One setback does not require a permanent identity decision."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which plan best supports Tasha?", "audio": "audio_scene_31.mp3", "image": "assets_scene_31.png"}, {"kind": "teaching", "title": "Review recovery through multiple signals", "kicker": "FUNCTION Â· CONNECTION Â· CHOICE Â· LEARNING", "body": ["Is daily functioning improving?", "Is support available?", "Are choices expanding?", "Is evidence changing the plan?"], "narration": "Recovery is not a single mood score. Review several signals: the client's ability to manage ordinary responsibilities, reconnect appropriately, make choices, use support, learn from evidence, and engage values. Progress may be uneven. A difficult day does not erase movement, and apparent productivity does not prove wellbeing. Significant or worsening impairment requires refe
