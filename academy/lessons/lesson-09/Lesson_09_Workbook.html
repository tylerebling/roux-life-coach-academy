<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 9 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 9 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Map an Attachment Trigger and Build a Dignified Response</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Observable event</strong><small>Describe what a camera, calendar, or message record could show.</small><textarea id="event" rows="4"></textarea></label><label><strong>2. Body signal</strong><small>What physical signal told you that steadiness had changed?</small><textarea id="body" rows="4"></textarea></label><label><strong>3. Story and alternatives</strong><small>Write the first meaning, then two other plausible explanations.</small><textarea id="story" rows="4"></textarea></label><label><strong>4. Protective move</strong><small>What did you feel urged to do, and what did that action promise?</small><textarea id="move" rows="4"></textarea></label><label><strong>5. Relief and cost</strong><small>Compare immediate relief with the longer-term personal and relational cost.</small><textarea id="cost" rows="4"></textarea></label><label><strong>6. Regulation plan</strong><small>Choose two simple present-focused practices before action.</small><textarea id="regulate" rows="4"></textarea></label><label><strong>7. Self-validation</strong><small>Complete: What I feel, what I know, what I assume, and what I need.</small><textarea id="validate" rows="4"></textarea></label><label><strong>8. Uncertainty plan</strong><small>How will you care for yourself while information is incomplete?</small><textarea id="uncertainty" rows="4"></textarea></label><label><strong>9. Clear request</strong><small>Write observation, experience, value or need, and one specific request.</small><textarea id="request" rows="4"></textarea></label><label><strong>10. Self-owned boundary</strong><small>What will you choose if the pattern continues?</small><textarea id="boundary" rows="4"></textarea></label><label><strong>11. Vulnerability experiment</strong><small>Practice one feeling, one need, one pause, and one promised return.</small><textarea id="avoidant" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>What safety, clinical, medical, legal, abuse, addiction, or impairment concern requires qualified support?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
