const scenes=[{"kind": "teaching", "title": "Attachment Patterns, Emotional Safety, and Choice", "kicker": "ROUX LIFE ACADEMY Â· LESSON 9", "body": ["Patterns are lensesâ€”not identities", "Safety changes what is appropriate", "Choice grows when the cycle slows", "Referral protects the client"], "narration": "Welcome to Attachment Patterns, Emotional Safety, and Choice. This lesson is designed for learners who may be new to coaching and new to attachment language. We will move carefully from foundational definitions into practical coaching tools. You will learn how protective relationship patterns form, how triggers unfold, how to support regulation and self-validation, how to communicate and set boundaries, and when the situation requires clinical or safety support instead of coaching.", "lenses": [{"insight": "Listen for how patterns are lensesâ€”not identities shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether safety changes what is appropriate is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate choice grows when the cycle slows into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn referral protects the client into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.png"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Understand four patterns", "Map the trigger cycle", "Practice regulation and communication", "Apply boundaries and scope"], "narration": "Here is the path we will follow. First, we will define attachment as a practical lens rather than a label. Next, we will examine four commonly discussed patterns. Then we will slow down the trigger cycle so that it becomes observable. After that, we will practice regulation, self-validation, uncertainty tolerance, communication, and boundaries. Finally, we will apply the material to realistic coaching situations and identify clear referral red flags.", "lenses": [{"insight": "Listen for how understand four patterns shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether map the trigger cycle is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate practice regulation and communication into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn apply boundaries and scope into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.png"}, {"kind": "teaching", "title": "What does attachment mean here?", "kicker": "A PRACTICAL COACHING LENS", "body": ["Closeness and distance", "Dependence and autonomy", "Conflict and repair", "Uncertainty and meaning"], "narration": "In this course, attachment refers to patterns in how people respond to closeness, distance, dependence, conflict, and emotional uncertainty. These patterns can shape what a person notices, the meaning they assign, and the behavior they use to feel safer. Attachment is not the same as love, compatibility, or character. It is one lens among many. Culture, history, current stress, relationship quality, and real safety conditions all matter.", "lenses": [{"insight": "Listen for how closeness and distance shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether dependence and autonomy is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate conflict and repair into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn uncertainty and meaning into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.png"}, {"kind": "teaching", "title": "Four myths to leave behind", "kicker": "MYTHS THAT CREATE HARM", "body": ["Patterns can change", "Secure people still feel fear", "Avoidance does not prove indifference", "Anxiety does not prove the feared story"], "narration": "Before learning the patterns, we need to remove four common myths. A pattern is not a permanent personality. Secure people still become afraid and need reassurance. Avoidant behavior does not automatically prove that someone lacks care, and anxious feelings do not make every feared conclusion accurate. Coaching becomes harmful when a label replaces curiosity. Use the pattern to generate better questions, not to make final claims about a person.", "lenses": [{"insight": "Listen for how patterns can change shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether secure people still feel fear is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate avoidance does not prove indifference into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn anxiety does not prove the feared story into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.png"}, {"kind": "teaching", "title": "Every pattern has protective logic", "kicker": "BEHAVIOR MAKES SENSE IN CONTEXT", "body": ["Pursuit protects against abandonment", "Withdrawal protects against overwhelm", "Pleasing protects connection", "Control reduces uncertainty briefly"], "narration": "Protective behavior usually makes sense when we understand what it is trying to prevent. Pursuit may try to prevent abandonment. Withdrawal may try to prevent engulfment, shame, or conflict. Pleasing may try to preserve connection. Control may try to reduce uncertainty. Understanding the protective logic does not excuse harmful behavior. It helps the coach respond with compassion and accountability at the same time.", "lenses": [{"insight": "Listen for how pursuit protects against abandonment shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether withdrawal protects against overwhelm is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate pleasing protects connection into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn control reduces uncertainty briefly into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.png"}, {"kind": "question", "title": "Checkpoint 1 Â· Lens or label?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client calls her partner dismissive-avoidant after one disagreement. What is the strongest coaching response?", "options": ["Confirm the label", "Return to observable behavior, context, impact, needs, and choices", "Diagnose both partners"], "correct": 1, "feedback": ["A label cannot replace evidence.", "Correct. Patterns are hypotheses that support better questions.", "Diagnosis is outside coaching scope."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client calls her partner dismissive-avoidant after one disagreement. What is the strongest coaching response?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.png"}, {"kind": "teaching", "title": "The four-pattern map", "kicker": "THE FOUR-PATTERN MAP", "body": ["Secure: connection and autonomy", "Anxious: proximity and reassurance", "Avoidant: distance and self-reliance", "Fearful-avoidant: longing and fear"], "narration": "This four-pattern map offers an orientation. Secure functioning supports both connection and autonomy. Anxious functioning may seek safety through proximity and reassurance. Avoidant functioning may seek safety through distance and self-reliance. Fearful-avoidant functioning may experience longing and fear at the same time. These are tendencies, not boxes. A client may show different responses with different people or under different levels of stress.", "lenses": [{"insight": "Listen for how secure: connection and autonomy shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether anxious: proximity and reassurance is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate avoidant: distance and self-reliance into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn fearful-avoidant: longing and fear into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.png"}, {"kind": "teaching", "title": "Secure functioning", "kicker": "SECURITY IS FLEXIBLE FUNCTIONING", "body": ["Ask directly for support", "Tolerate appropriate space", "Participate in repair", "Leave what remains unsafe"], "narration": "Secure functioning does not mean perfect calm. It means the person can usually remain connected to self and relationship while handling discomfort. They can ask for support, tolerate appropriate space, participate in repair, and name needs without demanding control. Secure functioning also includes the ability to leave relationships that remain unsafe, disrespectful, or incompatible. Security is not endless accommodation. It combines openness with discernment.", "lenses": [{"insight": "Listen for how ask directly for support shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether tolerate appropriate space is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate participate in repair into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn leave what remains unsafe into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.png"}, {"kind": "teaching", "title": "Anxious activation", "kicker": "WHEN DISTANCE FEELS URGENT", "body": ["Scan for signs of distance", "Increase reassurance seeking", "Abandon personal standards", "Practice a dignified pause"], "narration": "Anxious activation often increases attention to signs of distance. A delayed reply, changed tone, or request for space may feel urgent. The client may seek repeated reassurance, check for evidence, send multiple messages, or abandon personal standards to preserve connection. Coaching should not shame these reactions. It can help the client slow the cycle, care for the fear, test interpretations, and choose communication that protects dignity.", "lenses": [{"insight": "Listen for how scan for signs of distance shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether increase reassurance seeking is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate abandon personal standards into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn practice a dignified pause into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.png"}, {"kind": "teaching", "title": "Avoidant protection", "kicker": "WHEN CLOSENESS FEELS RISKY", "body": ["Minimize needs", "Intellectualize emotion", "Withdraw from closeness", "Practice small consensual disclosure"], "narration": "Avoidant protection may appear as intense self-reliance, minimizing needs, intellectualizing emotion, or withdrawing during conflict and closeness. The person may care deeply while experiencing dependence as risky. Coaching can support small, consensual experiments with receiving care, naming one feeling, making one request, and taking space without disappearing. The goal is greater choice, not forced vulnerability.", "lenses": [{"insight": "Listen for how minimize needs shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether intellectualize emotion is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate withdraw from closeness into a need, standard, or choice the client can name.", "prompt": mplexity. In which relationships do you feel steady? Where do you become more likely to pursue? Where do you withdraw or minimize needs? What changes when the relationship is consistent, inconsistent, respectful, or unsafe? This reflection matters because patterns are relational and contextual. Coaches should remain curious about the conditions surrounding the response.", "lenses": [{"insight": "Listen for how responses vary by relationship shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether stress can intensify protection is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate consistency changes the experience into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn curiosity replaces labeling into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.png"}, {"kind": "question", "title": "Checkpoint 2 Â· Identify the coaching need", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client asks for twenty minutes to settle, clearly promises to return, and resumes the conversation on time. What does this best demonstrate?", "options": ["Abandonment", "A regulated pause that protects autonomy and connection", "Clinical avoidance"], "correct": 1, "feedback": ["A time-bound pause with return is not abandonment.", "Correct. Space and connection can coexist.", "Coaches do not diagnose from one behavior."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client asks for twenty minutes to settle, clearly promises to return, and resumes the conversation on time. What does this best demonstrate?", "aud point.", "lenses": [{"insight": "Listen for how camera-level facts shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether time and context is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate words or behavior observed into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn unknowns stay unknown into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.png"}, {"kind": "teaching", "title": "Step 2: Notice the body signal", "kicker": "STEP 2 Â· NOTICE ACTIVATION", "body": ["Tension or racing heart", "Heat or trembling", "Numbness or heaviness", "Urge to pursue, freeze, please, or leave"], "narration": "The body often reacts before the person has words. Common signals include a racing heart, tight chest, clenched jaw, heat, trembling, numbness, heaviness, or a sudden urge to pursue, freeze, please, or leave. Coaches can help clients build a vocabulary for activation without diagnosing it. The question is not, What disorder is this? The question is, What signal tells you that your system no longer feels steady?", "lenses": [{"insight": "Listen for how tension or racing heart shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether heat or trembling is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate numbness or heaviness into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn urge to pursue, freeze, er": "STAY WITH YOURSELF WHILE INFORMATION IS INCOMPLETE", "body": ["Care for yourself while waiting", "Reduce repeated checking", "Set a reasonable time boundary", "Choose if the pattern continues"], "narration": "Tolerating uncertainty means remaining connected to yourself while information is incomplete. It does not mean accepting endless ambiguity or mistreatment. The client can set a reasonable time boundary, reduce repeated checking, return attention to work and relationships, and decide what behavior is acceptable. The question becomes, How will I care for myself while I wait, and what will I choose if the pattern continues?", "lenses": [{"insight": "Listen for how care for yourself while waiting shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether reduce repeated checking is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate set a reasonable time boundary into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn choose if the pattern continues into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.png"}, {"kind": "teaching", "title": "A communication formula", "kicker": "OBSERVATION Â· EXPERIENCE Â· VALUE Â· REQUEST", "body": ["Observable event", "Personal experience", "Value or need", "Specific request"], "narration": "Use a four-part communication formula. State the observable event, name the personal experience, identify the value or need, and make a specific request. For example: When plans changed and I did not hear from you, I noticed I became anxious and started filling in the blanks. Consistent communication matters to me. If plans change, would you send a short message? This is clear without assigning motive.", "lenses": [{"insight": "Listen for how observable event shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether personal experience is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate value or need into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn specific request into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_24.mp3", "image": "assets_scene_24.png"}, {"kind": "teaching", "title": "Request or control?", "kicker": "THREE DIFFERENT ACTIONS", "body": ["Request allows choice", "Control manages another adult", "Boundary governs your participation", "Consequence must be realistic"], "narration": "A request, control, and boundary are different. A request is specific, respectful, and allows choice. Control attempts to manage another adult through demand or punishment. A boundary states what the client will do to protect wellbeing. If plans repeatedly change without communication, the boundary might be choosing not to hold the evening open. Boundaries are about the client's participation, not forcing another person's behavior.", "lenses": [{"insight": "Listen for how request allows choice shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether control manages another adult is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate boundary governs your participation into a need, standard, or choice the client can name.", "prompt": "What part of this onse.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate ask for time without disappearing into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn return when promised into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.png"}, {"kind": "teaching", "title": "When a woman feels emotionally abandoned", "kicker": "COACHING EMOTIONAL ABANDONMENT", "body": ["Validate loneliness", "Clarify repeated behavior", "Strengthen support and standards", "Prepare a request and boundary"], "narration": "A woman who feels emotionally abandoned may describe loneliness inside a relationship, inconsistent contact, dismissal, or carrying emotional responsibility alone. Validate the impact without diagnosing the partner. Clarify observable patterns, name needs and standards, strengthen support beyond the relationship, and prepare a direct request and boundary. Do not reduce the work to becoming less needy. Help her remain connected to her reality, dignity, safety, and choices.", "lenses": [{"insight": "Listen for how validate loneliness shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether clarify repeated behavior is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate strengthen support and standards into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn prepare a request and boundary into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_28.mp3", "im . Roux Life coaching does not ask a client to regulate herself into accepting chronic harm. Regulation helps her see clearly. Standards help her evaluate behavior. A request creates an opportunity for response, and a boundary protects her participation if the pattern continues.", "lenses": [{"insight": "Listen for how name the relationship standard shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether describe evidence over time is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate make a direct request into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn choose a boundary from self-respect into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.png"}, {"kind": "teaching", "title": "Scenario: Maya and the unanswered message", "kicker": "CASE STUDY Â· MAYA", "body": ["No reply since yesterday", "Six messages and repeated checking", "Silence equals abandonment", "Pause before another action"], "narration": "Meet Maya. Her partner has not replied since yesterday. She has sent six messages, checked social media repeatedly, and drafted a breakup text. She says, Silence always means I am being left. The coach's first task is not reassurance, advice, or diagnosis. The first task is to help Maya become steady enough to distinguish the event from the conclusion and choose an action that protects her dignity.", "lenses": [{"insight": "Listen for how no reply since yesterday shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether six messages and repeated checking is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate silence equals abandonment into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn pause before another action into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.png"}, {"kind": "teaching", "title": "Coach the next five minutes", "kicker": "COACH THE NEXT FIVE MINUTES", "body": ["Notice body activation", "Separate fact and assumption", "Pause repeated pursuit", "Choose dignity and assess the pattern"], "narration": "In the next five minutes, the coach can help Maya notice activation, separate facts from assumptions, pause further messages, and choose one clear communication. Ask: What is happening in your body? What do you know? What does another message promise to relieve? What action would protect your dignity even if you do not receive the answer you want? Then assess whether this is an isolated event or a repeated harmful pattern.", "lenses": [{"insight": "Listen for how notice body activation shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether separate fact and assumption is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate pause repeated pursuit into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn choose dignity and assess the pattern into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.png"}, {"ki ["Reassurance without evidence replaces Maya's judgment.", "Correct. The plan combines regulation, dignity, standards, and choice.", "The work is not to shame legitimate needs."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which plan best supports Maya without abandoning her reality?", "audio": "audio_scene_34.mp3", "image": "assets_scene_34.png"}, {"kind": "teaching", "title": "Repairing trust requires behavior", "kicker": "TRUST REQUIRES EVIDENCE", "body": ["Acknowledge impact", "Own relevant behavior", "Offer proportionate repair", "Change behavior over time"], "narration": "Trust is not repaired by insight alone. Repair requires behavior. The person acknowledges impact, takes responsibility, makes a specific repair, changes the repeated behavior, and allows trust to rebuild over time. Coaches can help clients define what evidence of repair would look like. They should not pressure a client to trust faster than the behavior supports or assume that every relationship must be preserved.", "lenses": [{"insight": "Listen for how acknowledge impact shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether own relevant behavior is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate offer proportionate repair into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn change behavior over time into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_35.mp3", "image": "assets_scene_35.png"}, {"kind": "teaching", "title": "Build support beyond one relationship", "kicker": "INTERDEPENDENCE WITHOUT DEPENDENCY", "body": ["Safe personal support", "Community and belonging", "Practical or professional resources", "Emergency and clinical resources when needed"], "narration": "A single relationship should not be required to provide every form of safety, meaning, and support. Help the client identify trusted friends, family, community, practical help, and qualified professionals. This does not excuse a partner's harmful behavior. It reduces isolation and expands choice. Be clear that the coach is not an emergency contact, therapist, or substitute for a broader support system.", "lenses": [{"insight": "Listen for how safe personal support shapes the client's sense of safety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether community and belonging is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate practical or professional resources into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn emergency and clinical resources when needed into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_36.mp3", "image": "assets_scene_36.png"}, {"kind": "teaching", "title": "When coaching must stop or expand", "kicker": "REFERRAL AND SAFETY RED FLAGS", "body": ["Threats or coercive control", "Self-harm or suicide concern", "Severe panic, dissociation, or impairment", "Trauma, addiction, psychiatric, or abuse needs"], "narration": "Attachment language must never hide safety concerns. Threats, stalking, coercive control, violence, self-harm or suicide risk, severe panic, dissociation, major impairment, untreated addiction, acute psychiatric symptoms, or requests for trauma treatment require referral or urgent escalation. Do not describe abuse as two attachment styles that need better communica fety.", "prompt": "What observable evidence supports thisâ€”not just the label?"}, {"insight": "Test whether compassion includes accountability is a fact, interpretation, need, or protective response.", "prompt": "What becomes clearer when the coach slows this element down?"}, {"insight": "Translate uncertainty never requires tolerating harm into a need, standard, or choice the client can name.", "prompt": "What part of this remains within the client's control?"}, {"insight": "Turn agency and scope stay central into one proportionate, client-owned experiment.", "prompt": "What would a dignified next step look like in observable behavior?"}], "audio": "audio_scene_40.mp3", "image": "assets_scene_40.png"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;
