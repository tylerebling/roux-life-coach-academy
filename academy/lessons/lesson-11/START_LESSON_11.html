:root{--ivory:#f7f3f0;--cream:#f2ede7;--sage:#3e4939;--sage2:#273328;--gold:#b89e80;--gold2:#d8c599;--taupe:#ab9e8e;--line:#dfd9ce;--ink:#261f15;--good:#d7e4d1;--bad:#eed1c7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151b16;color:var(--ivory);font-family:Inter,Arial,sans-serif}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:1fr 82px}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 72% 30%,#62705d 0,#334034 32%,#202a22 70%,#151b16 100%)}.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.ambient{position:absolute;width:60vw;height:60vw;border-radius:50%;right:-12vw;top:-22vw;border:1px solid #d8c59955;box-shadow:0 0 0 12vw #d8c5990b,0 0 0 24vw #d8c59908;animation:breathe 14s ease-in-out infinite alternate}.scene{position:absolute;inset:0;padding:5vh 5vw 4vh;display:grid;grid-template-columns:minmax(360px,48%) 1fr;gap:4vw;align-items:center;opacity:0;pointer-events:none}.scene.active{opacity:1;pointer-events:auto}.copy{position:relative;z-index:3;padding:clamp(22px,3vw,48px);border:1px solid #d8c59966;border-radius:30px;background:linear-gradient(140deg,#233027e8,#344137c9);box-shadow:0 28px 70px #0007;backdrop-filter:blur(16px)}.brand,.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gold2)}h1{font:600 clamp(34px,4vw,66px)/1.02 Georgia,serif;margin:16px 0 22px}.rule{height:1px;background:linear-gradient(90deg,var(--gold2),transparent);margin-bottom:18px}.points{display:grid;gap:10px}.point{padding:13px 16px;border-radius:13px;background:#f7f3f0;color:var(--ink);border-left:6px solid var(--gold);opacity:0;transform:translateY(14px)}.scene.active .point{animation:rise .55s cubic-bezier(.16,1,.3,1) forwards}.scene.active .point:nth-child(2){animation-delay:.18s}.scene.active .point:nth-child(3){animation-delay:.36s}.scene.active .point:nth-child(4){animation-delay:.54s}.scene.active .point:nth-child(5){animation-delay:.72s}.visual{position:relative;min-height:65vh;display:grid;place-items:center;overflow:hidden}.viz{position:relative;width:min(640px,100%);height:min(640px,68vh);display:grid;place-items:center}.gold-line{position:absolute;inset:8%;border:3px solid var(--gold2);border-radius:46% 54% 58% 42%;filter:drop-shadow(0 0 18px #d8c59977);animation:morph 9s ease-in-out infinite alternate}.viz-title{position:relative;z-index:2;max-width:86%;font:600 clamp(30px,4vw,62px)/1.08 Georgia,serif;text-align:center;text-shadow:0 8px 24px #0008}.orbit{position:absolute;width:68%;aspect-ratio:1;border-radius:50%;border:1px solid #d8c59977;animation:spin 18s linear infinite}.orbit:after,.orbit:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--gold2);box-shadow:0 0 30px var(--gold2)}.orbit:before{left:7%;top:18%}.orbit:after{right:12%;bottom:12%}.diagram-cards{width:92%;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.diagram-card{min-height:120px;padding:20px;border-radius:22px;background:#f7f3f0ed;color:var(--ink);border:1px solid #d8c599;display:grid;align-content:center;text-align:center;box-shadow:0 20px 45px #0004;opacity:0}.scene.active .diagram-card{animation:cardIn .6s cubic-bezier(.16,1,.3,1) forwards}.scene.active .diagram-card:nth-child(2){animation-delay:.2s}.scene.active .diagram-card:nth-child(3){animation-delay:.4s}.scene.active .diagram-card:nth-child(4){animation-delay:.6s}.loop{width:72%;aspect-ratio:1;border-radius:50%;border:12px solid #d8c59955;position:relative;animation:spin 22s linear infinite}.loop:after{content:"";position:absolute;right:-18px;top:44%;border:18px solid transparent;border-left-color:var(--gold2)}.loop span{position:absolute;inset:22%;display:grid;place-items:center;text-align:center;font:600 28px Georgia,serif;animation:spin 22s linear infinite reverse}.ladder{display:grid;gap:13px;width:78%}.ladder div{padding:16px 22px;background:#f7f3f0;color:var(--ink);border-left:8px solid var(--gold);border-radius:12px;opacity:0}.scene.active .ladder div{animation:slide .55s cubic-bezier(.16,1,.3,1) forwards}.scene.active .ladder div:nth-child(2){animation-delay:.15s}.scene.active .ladder div:nth-child(3){animation-delay:.3s}.scene.active .ladder div:nth-child(4){animation-delay:.45s}.scene.active .ladder div:nth-child(5){animation-delay:.6s}.roux{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}.roux b{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold2);font:600 54px Georgia,serif;background:#273328cc;box-shadow:0 0 0 0 #d8c59900;opacity:0}.scene.active .roux b{animation:rouxIn .8s cubic-bezier(.16,1,.3,1) forwards}.scene.active .roux b:nth-child(2){animation-delay:.2s}.scene.active .roux b:nth-child(3){animation-delay:.4s}.scene.active .roux b:nth-child(4){animation-delay:.6s}.chat{width:88%;display:grid;gap:14px}.bubble{max-width:82%;padding:16px 20px;border-radius:22px;background:#f7f3f0;color:var(--ink);box-shadow:0 15px 35px #0003;opacity:0}.bubble:nth-child(even){justify-self:end;background:var(--gold2)}.scene.active .bubble{animation:rise .55s cubic-bezier(.16,1,.3,1) forwards}.scene.active .bubble:nth-child(2){animation-delay:.35s}.scene.active .bubble:nth-child(3){animation-delay:.7s}.gate{width:72%;height:65%;border:5px solid var(--gold2);border-top-left-radius:160px;border-top-right-radius:160px;position:relative;perspective:900px}.gate:before,.gate:after{content:"";position:absolute;top:0;bottom:0;width:50%;border:2px solid #d8c599aa;background:#273328cc;transform-origin:left center}.gate:before{left:0}.gate:after{right:0;transform-origin:right center}.scene.active .gate:before{animation:openLeft 3s 1s cubic-bezier(.16,1,.3,1) forwards}.scene.active .gate:after{animation:openRight 3s 1s cubic-bezier(.16,1,.3,1) forwards}.question-wrap{position:absolute;inset:5%;display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center;padding:38px;border:1px solid #d8c59988;border-radius:32px;background:linear-gradient(135deg,#26352bed,#3f4c40e8);box-shadow:0 30px 80px #0008}.question-wrap h1{font-size:clamp(34px,3.5vw,58px)}.prompt{font-size:21px;line-height:1.45}.answers{display:grid;gap:12px}.answer{min-height:64px;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:#f7f3f0;color:var(--ink);cursor:pointer;transition:.22s ease}.answer:hover{transform:translateY(-2px);border-color:var(--gold)}.answer.correct{background:var(--good);border-color:#466241}.answer.wrong{background:var(--bad);border-color:#934f42}.feedback{display:none;padding:16px;border-left:6px solid var(--gold2);background:#17231bcc;border-radius:12px;line-height:1.45}.feedback.show{display:block}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:12px 20px;background:#101812;border-top:1px solid #d8c59955}.play{width:54px;height:54px;border-radius:50%;border:1px solid #d8c59999;background:var(--sage);color:white;font-size:21px;cursor:pointer}.meta{display:grid;gap:7px}.top{display:flex;justify-content:space-between;font-size:13px;color:#efe7db}.track{height:7px;border-radius:99px;background:#3d4b3e;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .35s ease}.actions{display:flex;gap:8px}.actions button{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid #f7f3f055;background:transparent;color:white;cursor:pointer}.caption{position:absolute;left:16%;right:16%;bottom:3%;padding:12px 16px;border-radius:12px;background:#000c;text-align:center;display:none;z-index:9}.caption.show{display:block}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(rgba(9,20,14,.45),rgba(5,12,8,.72)),url('assets_scene_01.webp') center/cover no-repeat;text-align:center;padding:30px}.start .gold-line{inset:8%;animation:morph 9s ease-in-out infinite alternate}.start-card{position:relative;z-index:2;max-width:940px}.logo{width:min(520px,72vw);filter:drop-shadow(0 20px 40px #0008);animation:logo 1.6s cubic-bezier(.16,1,.3,1) both}.start h1{font-size:clamp(44px,6vw,86px);margin:12px 0}.start p{font-size:20px;line-height:1.6;max-width:760px;margin:auto;color:#eee6da}.start button{margin-top:28px;padding:15px 28px;border-radius:999px;border:1px solid var(--gold2);background:#f7f3f0;color:var(--ink);font-weight:800;cursor:pointer}@keyframes rise{to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes morph{0%{border-radius:36% 64% 48% 52%;transform:rotate(-4deg) scale(.96)}100%{border-radius:62% 38% 58% 42%;transform:rotate(5deg) scale(1.03)}}@keyframes breathe{to{transform:scale(1.06);opacity:.65}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rouxIn{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:none;box-shadow:0 0 0 14px #d8c59918}}@keyframes openLeft{to{transform:rotateY(-72deg)}}@keyframes openRight{to{transform:rotateY(72deg)}}@keyframes logo{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}@media(max-width:900px){.scene{grid-template-columns:1fr;padding:18px}.copy{padding:22px}.visual{min-height:32vh}.viz{height:32vh}.question-wrap{inset:2%;grid-template-columns:1fr;padding:20px;overflow:auto}.ambient{display:none}.actions button{padding:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.point,.diagram-card,.ladder div,.roux b,.bubble{opacity:1!important;transform:none!important}}

.insight-stack{position:relative;z-index:2;width:min(660px,96%);display:grid;gap:18px;align-self:center}.insight-primary,.insight-card{border:1px solid #d8c59988;box-shadow:0 24px 55px #0005;backdrop-filter:blur(14px)}.insight-primary{padding:30px 32px;border-radius:26px;background:linear-gradient(145deg,#f7f3f0f5,#f2ede7e8);color:var(--ink)}.insight-eyebrow,.insight-card span{display:block;margin-bottom:10px;color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.insight-primary .insight-eyebrow{color:#866f57}.insight-primary h2{margin:0 0 14px;font:600 clamp(27px,2.6vw,42px)/1.08 Georgia,serif}.insight-primary p{margin:0;color:#4d463d;font-size:clamp(16px,1.35vw,20px);line-height:1.55}.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.insight-card{min-height:170px;padding:24px;border-radius:22px;background:#273328e8}.insight-card p{margin:0;color:#f7f3f0;font-size:clamp(15px,1.2vw,18px);line-height:1.48}.scene.active .insight-primary{animation:cardIn .65s cubic-bezier(.16,1,.3,1) both}.scene.active .insight-card{animation:rise .55s .22s cubic-bezier(.16,1,.3,1) both}.scene.active .insight-card:nth-child(2){animation-delay:.42s}@media(max-width:900px){.insight-grid{grid-template-columns:1fr}.insight-card{min-height:auto}.insight-primary{padding:22px}.insight-stack{gap:12px}}
</style><style>#rouxAcademyBridge{display:none!important}</style></head><body><main class="app"><section class="stage" id="stage"><div class="grain"></div><div class="ambient"></div><div class="caption" id="caption"></div></section><footer class="controls"><button class="play" id="play" aria-label="Play or pause narration">â–¶</button><div class="meta"><div class="top"><span id="label">Boundaries</span><span id="counter">1 / 61</span></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="actions"><button id="back">â† Back</button><button id="cc">CC</button><button id="next">Next â†’</button></div></footer></main><div class="start" id="start"><div class="gold-line"></div><div class="start-card"><img class="logo" src="assets_roux_life_logo.webp" alt="Roux Life Coach Academy"><div class="kicker">ROUX LIFE COACH ACADEMY Â· LESSON 11</div><h1>Boundaries</h1><p>Protect Your Peace. Honor Your Needs. Come Home to Yourself.</p><button id="begin">Enter the masterclass</button></div></div><audio id="voice" preload="auto"></audio><script>
const scenes=[{"kind": "teaching", "title": "When did you disappear?", "kicker": "OPENING FILM", "body": ["One more favor", "One more responsibility", "One more yes"], "narration": "Sometimes losing yourself does not happen all at once. There is no single moment you can point to. It happens quietly: one more favor, one more responsibility, one more time you say yes while something inside you is saying no. You become the dependable one, the strong one, the person everyone calls. The cost is easy to miss because care, competence, and love are real. But somewhere along the way, you may stop asking one essential question: what do I need?", "visual": "tangle", "chapter": "Opening", "audio": "audio_scene_01.mp3"}, {"kind": "teaching", "title": "The question beneath the exhaustion", "kicker": "WHAT DO I NEED?", "body": ["Your needs are information", "Capacity is real", "Self-respect belongs in care"], "narration": "At Roux Life, coming home to yourself begins with remembering that your needs matter too. That does not make you selfish. It makes you human. Needs do not automatically dictate a decision, and they do not outrank everyone else's needs. They give you information about your body, values, capacity, safety, and season. Boundaries turn that information into responsible participation. They help you remain present in your own life while staying capable of genuine care for others.", "visual": "mirror", "chapter": "Opening", "audio": "audio_scene_02.mp3"}, {"kind": "teaching", "title": "A line that makes room for you", "kicker": "ROUX LIFE PRESENTS", "body": ["Protect your peace", "Honor your needs", "Come home to yourself"], "narration": "A boundary is not a wall built around your life. It is a line that helps you remain present in your own life. This masterclass is not about becoming cold, cutting everyone off, or controlling other adults. It is about learning where your responsibility ends and another person's begins. You will learn to recognize boundary signals, separate guilt from wrongdoing, communicate with warmth and clarity, tolerate pushback, and keep a limit without losing compassion or abandoning yourself.", "visual": "line-home", "chapter": "Opening", "audio": "audio_scene_03.mp3"}, {"kind": "teaching", "title": "What you will be able to do", "kicker": "MASTERCLASS ROADMAP", "body": ["Define a healthy boundary", "Map the guilt loop", "Use the ROUX Boundary Method", "Practice real conversations"], "narration": "We will move from recognition to practice. First, we will define what a boundary actually controls. Then we will examine why no can feel dangerous, how the body signals overextension, and how resentment can reveal an unspoken expectation. The ROUX Boundary Method will organize the work. You will rehearse family, work, friendship, and relationship language, prepare for pushback, distinguish boundaries from walls, and finish by building a boundary you can actually keep. Safety and referral limits remain visible throughout.", "visual": "roadmap", "chapter": "Opening", "audio": "audio_scene_04.mp3"}, {"kind": "teaching", "title": "A boundary defines your property", "kicker": "CHAPTER 1 Â· WHAT A BOUNDARY IS", "body": ["Thoughts", "Choices", "Values", "Time and energy"], "narration": "Imagine a beautiful piece of property. A line marks what you own and therefore what you are responsible for. Inside an emotional boundary are your words, choices, values, time, energy, body, money, availability, and participation. Outside are other people's opinions, emotions, reactions, choices, and interpretations. You may care deeply about what happens outside your line. You may influence it. But caring and owning are not the same thing. Confusing them creates overresponsibility and resentment.", "visual": "property", "chapter": "What a Boundary Is", "audio": "audio_scene_05.mp3"}, {"kind": "teaching", "title": "Boundary is not control", "kicker": "AN IMPORTANT DISTINCTION", "body": ["Boundary: I will pause an insulting conversation", "Control: You are not allowed to be angry"], "narration": "A boundary controls your participation, not another person's behavior. 'You are not allowed to get angry with me' attempts to control their emotion. 'If this conversation becomes insulting, I will pause and return later' defines your action. 'You have to stop drinking' tries to command another adult. 'I will not remain in situations where alcohol makes me feel unsafe' describes your access and participation. This distinction keeps agency on both sides and prevents boundary language from becoming punishment or coercion.", "visual": "split", "chapter": "What a Boundary Is", "audio": "audio_scene_06.mp3"}, {"kind": "teaching", "title": "The participation test", "kicker": "WHAT WILL I DO?", "body": ["Observable condition", "Self-owned response", "Proportionate follow-through"], "narration": "Test a proposed boundary with three questions. Is the condition observable? Is the response within my control? Is the follow-through proportionate to the value or risk involved? 'When work messages arrive after seven, I will answer the next business day' passes the test. 'My team must respect my personal life' names an understandable hope, but it does not yet tell the client what they will do. Precision transforms frustration into a usable decision.", "visual": "formula", "chapter": "What a Boundary Is", "audio": "audio_scene_07.mp3"}, {"kind": "teaching", "title": "Requests, preferences, and boundaries", "kicker": "NOT EVERY NEED IS A BOUNDARY", "body": ["Preference: what I would like", "Request: what I ask you to consider", "Boundary: how I will participate"], "narration": "Healthy relationships need more than boundaries. A preference says what you would enjoy. A request asks another person to consider a change while preserving their right to choose. A boundary explains how you will participate if a condition occurs. If every preference becomes a boundary, ordinary negotiation becomes impossible. If no need can become a boundary, the client disappears inside accommodation. Mature coaching helps the client name the category accurately before choosing language.", "visual": "layers", "chapter": "What a Boundary Is", "audio": "audio_scene_08.mp3"}, {"kind": "question", "title": "Checkpoint Â· Which statement is a boundary?", "kicker": "ROUX REFLECTION", "prompt": "Which response most clearly defines the speaker's participation?", "options": ["You need to stop being disrespectful", "When I am called names, I will end the call and we can try again tomorrow", "You are not allowed to disappoint me"], "correct": 1, "feedback": ["This is a demand without a self-owned response.", "Correct. The condition and follow-through are observable and within the speaker's control.", "A boundary cannot forbid another person's emotional impact."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Which response most clearly defines the speaker's participation?", "visual": "choice", "chapter": "What a Boundary Is", "audio": "audio_scene_09.mp3"}, {"kind": "teaching", "title": "Why no can feel dangerous", "kicker": "CHAPTER 2 Â· THE GUILT LOOP", "body": ["Belonging", "Approval", "Identity", "Fear of conflict"], "narration": "Many people know the words they want to say. The difficulty is surviving what they predict will happen next. No may feel connected to rejection, selfishness, disloyalty, conflict, or the loss of an identity built around being helpful. The nervous system may react as if belonging itself is at risk. Coaching does not mock that fear or promise that nobody will be disappointed. It helps the client distinguish a present request from an inherited threat and choose from current evidence.", "visual": "no-message", "chapter": "Why No Feels Hard", "audio": "audio_scene_10.mp3"}, {"kind": "teaching", "title": "The guilt loop", "kicker": "REQUEST â†’ DISCOMFORT â†’ YES", "body": ["Immediate relief", "Delayed resentment", "Exhaustion", "Another request"], "narration": "The guilt loop begins with a request. Discomfort appears before the client checks capacity. An automatic yes brings immediate relief because the possibility of disapproval disappears. Later, resentment and exhaustion grow. Because the client delivered help, others reasonably ask again, and the loop repeats. The boundary interrupts the cycle between discomfort and yes. It creates a pause long enough for capacity, values, and choice to enter the decision.", "visual": "guilt-loop", "chapter": "Why No Feels Hard", "audio": "audio_scene_11.mp3"}, {"kind": "teaching", "title": "Selfish or self-respecting?", "kicker": "REFRAME THE BELIEF", "body": ["No can protect a meaningful yes", "Capacity makes commitments honest", "Care without choice becomes resentment"], "narration": "The belief 'If I say no, I am selfish' treats every refusal as moral failure. A more accurate question is: what am I protecting, what impact will this choice have, and what responsibility is genuinely mine? Saying no to one obligation may preserve health, a promise, parenting capacity, focused work, or presence in another relationship. The goal is not self-prioritization at all times. It is honest stewardship of finite resources.", "visual": "reframe", "chapter": "Why No Feels Hard", "audio": "audio_scene_12.mp3"}, {"kind": "teaching", "title": "Disappointment is not automatic wrongdoing", "kicker": "TWO REALITIES CAN COEXIST", "body": ["My limit may be responsible", "Their disappointment may be real", "Neither feeling decides the whole truth"], "narration": "Someone's disappointment deserves empathy, but it does not automatically prove that the client has acted wrongly. Two realities can coexist: the limit may be necessary, and the other person may genuinely dislike its impact. Mature boundaries do not erase that tension. They allow care without immediate reversal. The client can acknowledge inconvenience, listen for legitimate information, repair preventable harm, and still keep a responsible limit.", "visual": "two-realities", "chapter": "Why No Feels Hard", "audio": "audio_scene_13.mp3"}, {"kind": "teaching", "title": "Peace purchased through self-abandonment", "kicker": "A ROUX LIFE BELIEF", "body": ["Silence is not always peace", "Compliance is not always generosity", "Harmony without honesty has a cost"], "narration": "Keeping the peace can become an identity. But peace purchased through self-abandonment is not sustainable peace. It is delayed conflict carried inside the body. Roux Life does not teach unnecessary confrontation. We teach honest participation: naming reality early enough that resentment does not have to speak later through withdrawal, sarcasm, collapse, or an explosion. Sometimes coming home to yourself begins with a small sentence: I cannot do that. That does not work for me. No.", "visual": "gold-statement", "chapter": "Why No Feels Hard", "audio": "audio_scene_14.mp3"}, {"kind": "question", "title": "Checkpoint Â· Conditioned guilt", "kicker": "ROUX REFLECTION", "prompt": "A client communicated early, had no capacity, and still feels guilty because her friend is disappointed. What is the strongest coaching response?", "options": ["Reverse the boundary", "Review behavior, impact, and values while allowing the guilt to be present", "Prove the friend is unreasonable"], "correct": 1, "feedback": ["Discomfort alone does not require reversal.", "Correct. Feelings, evidence, care, and integrity can coexist.", "The coach does not need to judge the friend to support client ownership."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. A client communicated early, had no capacity, and still feels guilty because her friend is disappointed. What is the strongest coaching response?", "visual": "choice", "chapter": "Why No Feels Hard", "audio": "audio_scene_15.mp3"}, {"kind": "teaching", "title": "Your body often knows first", "kicker": "CHAPTER 3 Â· BOUNDARY SIGNALS", "body": ["Tight chest", "Stomach tension", "Dread", "Irritability and exhaustion"], "narration": "The body often notices overextension before the mouth can name it. Tightness, dread, irritation, avoidance, racing thoughts, or unusual exhaustion can be signals worth exploring. They do not automatically prove that someone violated a boundary. They may reflect stress, conflict, grief, a clinical concern, or another need. Coaches do not diagnose bodily sensations. We invite the client to pause, notice, and gather information before committing.", "visual": "body-signals", "chapter": "Boundary Signals", "audio": "audio_scene_16.mp3"}, {"kind": "teaching", "title": "Resentment is information", "kicker": "LISTEN WITHOUT MAKING IT A VERDICT", "body": ["What was expected?", "What was communicated?", "What choice was made?", "What cost followed?"], "narration": "Resentment can reveal an expectation the client never communicated. A grandmother may repeatedly babysit because she loves her grandchildren while becoming exhausted and resentful. Internally, she thinks, 'My daughter should know I am tired.' But another person cannot reliably honor a limit that remains invisible. Resentment does not automatically mean the other person is exploitative. It invites a review of expectations, communication, choice, reciprocity, and capacity.", "visual": "resentment", "chapter": "Boundary Signals", "audio": "audio_scene_17.mp3"}, {"kind": "teaching", "title": "The boundary audit", "kicker": "WHERE DOES THE COST APPEAR?", "body": ["Time", "Emotional labor", "Physical space", "Digital access", "Work and money", "Family and relationships"], "narration": "A boundary audit looks across domains rather than assuming one conversation explains everything. Where does the client routinely say yes and wish they had said no? Where do they feel responsible for managing another person's mood? Where is access treated as automatic? Where are they waiting for someone else to change before allowing themselves to change? The pattern with the highest emotional intensity is not always the best starting point. Begin where the client has enough safety and agency to practice.", "visual": "audit-wheel", "chapter": "Boundary Signals", "audio": "audio_scene_18.mp3"}, {"kind": "teaching", "title": "Capacity is more than calendar space", "kicker": "MAKE INVISIBLE LABOR VISIBLE", "body": ["Fixed responsibilities", "Emotional load", "Health and recovery", "Margin for the unexpected"], "narration": "An empty hour is not always available capacity. A realistic audit includes fixed responsibilities, caregiving, emotional labor, health needs, financial limits, travel, recovery, and margin for the unexpected. Clients who overfunction may count only visible tasks and ignore the nervous-system cost of being constantly accessible. Sustainable commitments leave room for being human. Capacity is not an excuse; it is a condition of honest reliability.", "visual": "capacity", "chapter": "Boundary Signals", "audio": "audio_scene_19.mp3"}, {"kind": "question", "title": "Roux Reflection Â· Locate the signal", "kicker": "ROUX REFLECTION", "prompt": "Where does a client most need curiosity before agreeing?", "options": ["At the first body signal and before the automatic yes", "Only after resentment becomes unbearable", "Only when another person approves the limit"], "correct": 0, "feedback": ["Correct. The pause creates room for evidence and choice.", "Waiting for collapse makes the pattern harder to change.", "A self-owned boundary does not require permission."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Where does a client most need curiosity before agreeing?", "visual": "choice", "chapter": "Boundary Signals", "audio": "audio_scene_20.mp3"}, {"kind": "teaching", "title": "The ROUX Boundary Method", "kicker": "CHAPTER 4 Â· A REPEATABLE PATH", "body": ["Recognize", "Own", "Understand", "Express and protect"], "narration": "The ROUX Boundary Method gives the client a path from signal to action. Recognize what is actually happening. Own what belongs to you and release what does not. Understand the need, value, or standard the boundary will protect. Express the limit and protect it through proportionate follow-through. The method is not a script that overrides judgment. It is a sequence that slows reactivity and restores ownership.", "visual": "roux-build", "chapter": "The ROUX Method", "audio": "audio_scene_21.mp3"}, {"kind": "teaching", "title": "R Â· Recognize", "kicker": "WHAT IS ACTUALLY HAPPENING?", "body": ["Describe observable behavior", "Name frequency and context", "Track impact", "Separate fact from label"], "narration": "Recognition begins with description rather than diagnosis. 'Every Sunday my sister calls and spends an hour criticizing my decisions' gives the coach something workable. 'My sister is toxic' is a conclusion that may hide important detail. Ask what happened, how often, in what context, and with what impact. Recognition does not minimize emotion. It gives emotion a clear relationship to evidence.", "visual": "recognize", "chapter": "The ROUX Method", "audio": "audio_scene_22.mp3"}, {"kind": "teaching", "title": "O Â· Own", "kicker": "WHAT BELONGS TO ME?", "body": ["My response", "My availability", "My words and decisions", "Not their opinion or disappointment"], "narration": "Ownership untangles responsibility. The client owns their response, availability, words, decisions, and follow-through. The other person owns their opinion, anger, disappointment, needs, and choices. This does not mean the client ignores impact. It means they stop trying to perform the impossible job of managing another adult's internal world. Tangled lines begin to separate, and the next decision becomes clearer.", "visual": "own", "chapter": "The ROUX Method", "audio": "audio_scene_23.mp3"}, {"kind": "teaching", "title": "U Â· Understand", "kicker": "WHAT DO I NEED TO PROTECT?", "body": ["Space", "Respect", "Rest", "Safety", "Consistency", "Clarity"], "narration": "A client cannot communicate a boundary clearly if the boundary remains unclear to them. What do they need: space, respect, rest, privacy, safety, consistency, time, or information? What value does that need serve? What is the minimum effective boundary? Understanding prevents vague demands and oversized reactions. It also reveals where a request or negotiation may work better than a firm limit.", "visual": "understand", "chapter": "The ROUX Method", "audio": "audio_scene_24.mp3"}, {"kind": "teaching", "title": "X Â· Express and protect", "kicker": "COMMUNICATE WHAT YOU WILL DO", "body": ["When this happens", "I will do this", "Here is when we can return", "Then follow through"], "narration": "Expression turns insight into observable action. 'When conversations become insulting, I will end the conversation, and we can try again tomorrow if we can speak respectfully.' The language names the condition, the action, and an optional return point. Protection means following through calmly when the condition occurs. The X is not aggression. It is execution: the moment clarity becomes behavior.", "visual": "express", "chapter": "The ROUX Method", "audio": "audio_scene_25.mp3"}, {"kind": "teaching", "title": "Before reacting, ROUX it", "kicker": "THE METHOD IN MOTION", "body": ["Recognize the evidence", "Own responsibility", "Understand the need", "Express the action"], "narration": "The method becomes most useful when it is practiced before a charged conversation. The client can write one sentence for each stage. What do I know? What is mine? What matters? What will I do? If safety is uncertain, the X may be seeking qualified support rather than direct confrontation. ROUX is not a command to be brave at any cost. It is a disciplined way to choose a proportionate next step.", "visual": "roux-loop", "chapter": "The ROUX Method", "audio": "audio_scene_26.mp3"}, {"kind": "question", "title": "Checkpoint Â· ROUX in sequence", "kicker": "ROUX REFLECTION", "prompt": "A client says, 'My manager never respects me.' What should the coach do first?", "options": ["Write the boundary immediately", "Recognize the specific behavior, frequency, context, and impact", "Tell the client to resign"], "correct": 1, "feedback": ["Action before recognition may target the wrong problem.", "Correct. Evidence comes before interpretation and execution.", "The coach does not prescribe a major life decision."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. A client says, 'My manager never respects me.' What should the coach do first?", "visual": "choice", "chapter": "The ROUX Method", "audio": "audio_scene_27.mp3"}, {"kind": "teaching", "title": "The three-sentence boundary", "kicker": "CHAPTER 5 Â· HOW TO SAY IT", "body": ["Acknowledge", "State the boundary", "Offer an alternative only if genuine"], "narration": "A warm boundary can often fit in three sentences. First, acknowledge the request or relationship: 'I understand why you are asking.' Second, state the decision: 'I am not able to do that.' Third, if there is a genuine alternative, offer it: 'Here is what I can do.' The alternative is optional. It should not become a disguised surrender. Brevity reduces the urge to litigate the client's worth.", "visual": "three-sentence", "chapter": "How to Say It", "audio": "audio_scene_28.mp3"}, {"kind": "teaching", "title": "Family: care without automatic compliance", "kicker": "PRACTICE SCENARIO", "body": ["I know Sunday matters to you", "I cannot come early", "We will be there at two"], "narration": "A parent says, 'Everyone is coming Sunday. I need you here early to help.' The client replies, 'I know having everyone together means a lot to you. I cannot come early this Sunday, but we will be there at two.' The parent answers, 'Fine. I will just do everything myself.' Freeze the moment. Pushback does not automatically invalidate the limit. The client can allow the disappointment without rushing to remove it.", "visual": "family-chat", "chapter": "How to Say It", "audio": "audio_scene_29.mp3"}, {"kind": "teaching", "title": "Work: clarify priority and capacity", "kicker": "PRACTICE SCENARIO", "body": ["I can start today", "Completion will be tomorrow", "Which priority should move?"], "narration": "At four forty-five, a manager asks for a project that will take several hours. The client can say, 'I can start this today, but I will not be able to complete it before tomorrow morning. If it must be finished tonight, which current priority should move?' Workplace boundaries must consider role, policy, power, and consequences. Coaches support planning and communication; they do not provide employment-law advice.", "visual": "work-chat", "chapter": "How to Say It", "audio": "audio_scene_30.mp3"}, {"kind": "teaching", "title": "Relationship: pause without abandoning repair", "kicker": "PRACTICE SCENARIO", "body": ["I want to discuss this", "I will not continue while we insult each other", "I can return at seven"], "narration": "A relationship boundary can preserve both dignity and connection: 'I want to talk about this. I do not want us speaking to each other this way. I am going to take space and can return at seven if we are both ready to speak respectfully.' The pause is not punishment when it is time-limited, clearly communicated, and followed by a genuine return. If there is coercion, threat, stalking, or danger, routine communication coaching is not enough.", "visual": "relationship-chat", "chapter": "How to Say It", "audio": "audio_scene_31.mp3"}, {"kind": "teaching", "title": "Friendship: emotional labor needs consent", "kicker": "PRACTICE SCENARIO", "body": ["I care about you", "I do not have capacity tonight", "Can we talk tomorrow?"], "narration": "A friend calls late at night in distress. The client can care without offering unlimited access: 'I love you, and I do not have capacity for a long conversation tonight. Can we talk tomorrow afternoon?' If the friend may be in immediate danger, the response changes toward appropriate emergency support. Capacity language should never become a reason to ignore a credible safety concern.", "visual": "friend-chat", "chapter": "How to Say It", "audio": "audio_scene_32.mp3"}, {"kind": "teaching", "title": "Kindness does not require overexplaining", "kicker": "REMOVE THE COURTROOM DEFENSE", "body": ["Lead with the decision", "Give one honest reason", "Stop when the message is clear"], "narration": "Overexplaining often attempts to prevent disappointment. The client adds reasons until the boundary sounds like a case that can be cross-examined. Remove the excess: 'I am so incredibly sorry, but unfortunately, I do not think...' becomes 'I am not available tonight.' Warmth can remain in tone and context. Clarity is not cruelty, and a concise answer is not evidence of indifference.", "visual": "words-fall", "chapter": "How to Say It", "audio": "audio_scene_33.mp3"}, {"kind": "question", "title": "Checkpoint Â· Choose the clearest response", "kicker": "ROUX REFLECTION", "prompt": "Which response is warm, direct, and least defensive?", "options": ["I am so sorry, and here are twelve reasons I cannot help", "I cannot cover Saturday. I need that time for existing commitments", "Stop asking because you are selfish"], "correct": 1, "feedback": ["Excess explanation can invite unwanted negotiation.", "Correct. The decision and one useful reason are clear.", "A character attack is not a healthy boundary."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Which response is warm, direct, and least defensive?", "visual": "choice", "chapter": "How to Say It", "audio": "audio_scene_34.mp3"}, {"kind": "teaching", "title": "Expect resistance", "kicker": "CHAPTER 6 Â· WHEN PEOPLE PUSH BACK", "body": ["A new pattern changes the system", "Surprise is normal", "Pressure provides information"], "narration": "If someone benefited from the client having no boundaries, a new boundary may feel uncomfortable to them. That does not automatically make them manipulative, narcissistic, or toxic. A system changes when one person changes participation. Surprise, disappointment, questions, or negotiation may be normal. Retaliation, coercion, threats, stalking, and danger require a different response. The coach helps the client assess behavior rather than assign a dramatic label.", "visual": "resistance", "chapter": "Pushback", "audio": "audio_scene_35.mp3"}, {"kind": "teaching", "title": "The pushback ladder", "kicker": "NOTICE THE ESCALATION", "body": ["Question: Why?", "Persuasion: Come on", "Guilt: After all I have done", "Anger and withdrawal"], "narration": "Pushback may move from a question to persuasion, guilt, anger, or withdrawal. The ladder is not a diagnosis. It helps the client notice whether the exchange remains a conversation or has become sustained pressure. The goal is not to win every rung. It is to know when enough information has been exchanged and when continued engagement only rewards pressure with more access.", "visual": "ladder", "chapter": "Pushback", "audio": "audio_scene_36.mp3"}, {"kind": "teaching", "title": "Do not keep inventing new answers", "kicker": "THE CALM REPEAT", "body": ["Acknowledge", "Repeat the limit", "Do not add new defenses", "End if pressure continues"], "narration": "The client says, 'I will not be able to make it.' Pushback arrives. They answer, 'I understand you are disappointed. I still will not be able to make it.' More pressure arrives. They answer, 'I have given you my answer, and I am ending this conversation for now.' Repetition is not aggression when the tone remains respectful. Consistency teaches the boundary more effectively than a perfect explanation.", "visual": "repeat", "chapter": "Pushback", "audio": "audio_scene_37.mp3"}, {"kind": "teaching", "title": "Their reaction is information", "kicker": "NOT AUTOMATICALLY AN INSTRUCTION", "body": ["Listen for legitimate impact", "Repair what belongs to you", "Do not abandon a responsible limit by reflex"], "narration": "Another person's reaction can reveal impact, misunderstanding, incompatibility, or a pattern the client needs to take seriously. It is information. It is not automatically an instruction. The client can listen, reconsider, negotiate, or repair without assuming that intensity determines truth. A reasonable boundary may need refinement. It does not need automatic surrender simply because someone dislikes it.", "visual": "information", "chapter": "Pushback", "audio": "audio_scene_38.mp3"}, {"kind": "question", "title": "Checkpoint Â· Respond to guilt pressure", "kicker": "ROUX REFLECTION", "prompt": "After a clear no, a family member says, 'After everything I have done for you.' What is the strongest next response?", "options": ["Create three new explanations", "Acknowledge the feeling, repeat the limit, and stop defending", "Attack the family member's character"], "correct": 1, "feedback": ["New reasons often extend unwanted negotiation.", "Correct. Care and consistency can coexist.", "Character attacks abandon dignity and clarity."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. After a clear no, a family member says, 'After everything I have done for you.' What is the strongest next response?", "visual": "choice", "chapter": "Pushback", "audio": "audio_scene_39.mp3"}, {"kind": "teaching", "title": "Boundaries without becoming hard", "kicker": "CHAPTER 7 Â· GATES, NOT WALLS", "body": ["A wall eliminates access", "A boundary defines healthy access", "Connection still requires vulnerability"], "narration": "Roux Life does not teach isolation disguised as empowerment. A wall says, 'You will never hurt me again,' and removes all access to prevent uncertainty. A boundary says, 'I can care about you while deciding what access is healthy.' Healthy relationships still require vulnerability, compromise, forgiveness, generosity, and repair. Boundaries are not an excuse to avoid every uncomfortable conversation.", "visual": "wall-gate", "chapter": "Boundaries and Connection", "audio": "audio_scene_40.mp3"}, {"kind": "teaching", "title": "Love without self-erasure", "kicker": "THE RELATIONAL GOAL", "body": ["Not to need nobody", "Not to tolerate everything", "To remain yourself while loving somebody"], "narration": "The goal is not to need nobody. The goal is to stop losing yourself while loving somebody. Interdependence allows two people to have needs, limits, responsibilities, and influence without requiring one person to disappear. A client can be generous without becoming endlessly available. They can forgive without restoring identical access. They can feel compassion without assuming responsibility for every consequence.", "visual": "interdependence", "chapter": "Boundaries and Connection", "audio": "audio_scene_41.mp3"}, {"kind": "teaching", "title": "Five distinctions that protect nuance", "kicker": "DO NOT COLLAPSE THE CATEGORIES", "body": ["Compromise vs self-abandonment", "Forgiveness vs unlimited access", "Compassion vs responsibility", "Privacy vs secrecy", "Discomfort vs danger"], "narration": "Boundary work becomes crude when important categories collapse. Compromise is voluntary adjustment; self-abandonment repeatedly violates one's values or capacity to preserve approval. Forgiveness may release resentment without restoring identical access. Compassion can recognize pain without owning its solution. Privacy protects chosen information; secrecy may conceal what an agreement requires. Discomfort can be growth; danger changes the plan. Coaching depends on these distinctions.", "visual": "distinctions", "chapter": "Boundaries and Connection", "audio": "audio_scene_42.mp3"}, {"kind": "teaching", "title": "Repair and boundaries can coexist", "kicker": "ACCOUNTABILITY WITHOUT SURRENDER", "body": ["Own unnecessary harshness", "Keep the legitimate limit", "Restate with clarity", "Demonstrate better delivery"], "narration": "A client may deliver a necessary boundary harshly. Repair does not require abandoning the limit. They can say, 'My tone was disrespectful, and I am sorry. The limit itself still matters. I want to state it more clearly.' This separates accountability for delivery from responsibility for protecting capacity, consent, or safety. Strong boundaries do not make the client exempt from examining their own impact.", "visual": "repair", "chapter": "Boundaries and Connection", "audio": "audio_scene_43.mp3"}, {"kind": "question", "title": "Checkpoint Â· Wall or boundary?", "kicker": "ROUX REFLECTION", "prompt": "Which statement protects connection without promising unlimited access?", "options": ["You will never hurt me again because I will never need anyone", "I care about you, and I will decide what contact is healthy while trust is rebuilt", "If you loved me, you would agree"], "correct": 1, "feedback": ["This is a wall built around certainty and isolation.", "Correct. Care, discernment, and earned access can coexist.", "Love does not require forced agreement."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Which statement protects connection without promising unlimited access?", "visual": "choice", "chapter": "Boundaries and Connection", "audio": "audio_scene_44.mp3"}, {"kind": "teaching", "title": "The boundary you keep with yourself", "kicker": "CHAPTER 8 Â· SELF-TRUST", "body": ["Work email after seven", "Rest before another obligation", "Stop checking the account", "Spend according to the plan"], "narration": "The person most capable of crossing a personal boundary may sometimes be the client. They say they will not answer work email after seven and reply at ten-thirty. They say rest matters and volunteer for another obligation. They say they will stop checking an ex-partner's social media and reopen the app. These are not reasons for shame. They reveal the place where intention needs environment, friction, support, and follow-through.", "visual": "phone-clock", "chapter": "Boundaries With Yourself", "audio": "audio_scene_45.mp3"}, {"kind": "teaching", "title": "Self-trust is behavioral evidence", "kicker": "ACTIONS BEGIN MATCHING WORDS", "body": ["Make the boundary realistic", "Change the environment", "Expect urges", "Return after a lapse"], "narration": "Self-trust is not built by making dramatic promises. It grows when actions begin matching words often enough to become evidence. A digital boundary may require notification settings, an app timer, or moving the phone. A spending boundary may require removing saved payment information. A rest boundary may require declining before exhaustion. When a lapse occurs, the client returns without turning one moment into proof that change is impossible.", "visual": "mirror-trust", "chapter": "Boundaries With Yourself", "audio": "audio_scene_46.mp3"}, {"kind": "teaching", "title": "Relapse prevention", "kicker": "PLAN FOR THE OLD ROLE TO RETURN", "body": ["Name the trigger", "Prepare the sentence", "Choose support", "Review without shame"], "narration": "Old patterns return under fatigue, urgency, family pressure, loneliness, or fear. Relapse prevention asks when the automatic yes is most likely, what sentence will create a pause, who can support the client, and how they will recover after a lapse. The purpose is not perfect enforcement. It is a reliable return to chosen values. A boundary plan should be sturdy enough for real life and flexible enough to learn.", "visual": "return-path", "chapter": "Boundaries With Yourself", "audio": "audio_scene_47.mp3"}, {"kind": "question", "title": "Checkpoint Â· Build self-trust", "kicker": "ROUX REFLECTION", "prompt": "Which plan is most likely to support a personal digital boundary?", "options": ["Rely on willpower while keeping every notification active", "Define the cutoff, silence notifications, move the device, and plan for urges", "Shame yourself after every lapse"], "correct": 1, "feedback": ["Environment still cues the old behavior.", "Correct. Clarity, friction, and recovery support follow-through.", "Shame makes return harder and provides little useful information."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Which plan is most likely to support a personal digital boundary?", "visual": "choice", "chapter": "Boundaries With Yourself", "audio": "audio_scene_48.mp3"}, {"kind": "teaching", "title": "Build your boundary", "kicker": "CHAPTER 9 Â· YOUR TURN", "body": ["Choose one repeated drain", "Use a manageable example", "Do not begin with a dangerous confrontation"], "narration": "Choose one situation that repeatedly drains you and is safe enough for practice. Do not begin with the most dangerous or clinically complex situation. If setting a limit may increase danger, direct confrontation is not a routine exercise. Seek qualified support. For an appropriate example, describe the situation in observable terms and identify the point where your participation currently becomes automatic.", "visual": "workbook", "chapter": "Build Your Boundary", "audio": "audio_scene_49.mp3"}, {"kind": "teaching", "title": "Step 1 Â· Recognize", "kicker": "WHAT REPEATEDLY HAPPENS?", "body": ["Condition", "Frequency", "Context", "Impact"], "narration": "Write the condition without a character judgment. What happens, how often, in what setting, and what impact follows? Replace 'She never respects me' with 'She calls after ten three nights a week and continues after I say I need sleep.' Precision is not emotional coldness. It creates a boundary that can activate at a clear moment.", "visual": "step-one", "chapter": "Build Your Boundary", "audio": "audio_scene_50.mp3"}, {"kind": "teaching", "title": "Step 2 Â· Own and understand", "kicker": "WHAT IS YOURS, AND WHAT MATTERS?", "body": ["My availability", "Their reaction", "The value I am protecting", "The need beneath the strategy"], "narration": "Separate what belongs to you from what belongs to the other person. Then identify the need or value: sleep, health, respect, safety, privacy, focused work, financial stability, or presence. A strategy is one way to protect the need. When the need is clear, you may discover several workable strategies rather than one rigid demand.", "visual": "step-two", "chapter": "Build Your Boundary", "audio": "audio_scene_51.mp3"}, {"kind": "teaching", "title": "Step 3 Â· Express", "kicker": "COMPLETE THE FORMULA", "body": ["When ____ happens", "I will ____", "We can return ____", "I will follow through by ____"], "narration": "Complete the sentence: 'When this observable condition happens, I will take this action.' Add a return point when it serves connection. Test whether the action is yours to take, whether it is proportionate, and whether you are willing to keep it. A boundary that depends on a threat the client will never enact reduces trust. Choose the minimum effective follow-through.", "visual": "step-three", "chapter": "Build Your Boundary", "audio": "audio_scene_52.mp3"}, {"kind": "teaching", "title": "Step 4 Â· Prepare for the response", "kicker": "TOLERATE WITHOUT ABANDONING", "body": ["What might they say?", "What will guilt tell you?", "What is your calm repeat?", "What support will you use?"], "narration": "Imagine a realistic response without predicting catastrophe. What question, persuasion, disappointment, or guilt statement might appear? What old belief will become loud inside you? Write one calm repeat. Choose a support: a written reminder, a friend, a pause, a coach, or a qualified professional when appropriate. Preparation helps the client carry discomfort without improvising away the boundary.", "visual": "step-four", "chapter": "Build Your Boundary", "audio": "audio_scene_53.mp3"}, {"kind": "question", "title": "Roux Reflection Â· Test the boundary", "kicker": "ROUX REFLECTION", "prompt": "Which draft is most ready for practice?", "options": ["You must finally respect me", "When non-emergency calls come after ten, I will silence my phone and respond the next morning", "Everyone should know my limits"], "correct": 1, "feedback": ["This does not define observable activation or self-owned action.", "Correct. The condition and response are clear, proportionate, and controllable.", "Unspoken expectations cannot guide consistent follow-through."], "narration": "Pause here and choose the response that best protects dignity, ownership, and responsible coaching scope. Which draft is most ready for practice?", "visual": "choice", "chapter": "Build Your Boundary", "audio": "audio_scene_54.mp3"}, {"kind": "teaching", "title": "When boundary work requires more support", "kicker": "SAFETY AND REFERRAL", "body": ["Threats or stalking", "Coercive control", "Self-harm or immediate danger", "Severe impairment or trauma symptoms"], "narration": "Boundary education is not a substitute for safety planning, therapy, medical care, addiction treatment, legal guidance, or emergency response. If setting a limit may increase danger, do not encourage direct confrontation as a routine courage exercise. Threats, stalking, coercive control, self-harm concerns, severe impairment, trauma symptoms, or legal and medical needs require appropriate qualified support. Coaching can remain compassionate while clearly honoring its limits.", "visual": "safety", "chapter": "Safety", "audio": "audio_scene_55.mp3"}, {"kind": "teaching", "title": "The same life, a different participation", "kicker": "FINALE Â· COME HOME TO YOURSELF", "body": ["People will still ask", "Someone may be disappointed", "You still have a choice"], "narration": "Your life does not become peaceful because everyone finally agrees with you. People will still ask things of you. Someone will occasionally be disappointed. Someone may misunderstand you. And there will still be moments when saying yes feels easier. The difference is that you now have another choice. You can pause before disappearing inside the old role. You can recognize what is happening and respond from the person you are choosing to become.", "visual": "final-walk", "chapter": "Finale", "audio": "audio_scene_56.mp3"}, {"kind": "teaching", "title": "Recognize what is happening", "kicker": "R", "body": ["Observe", "Name the pattern", "Gather evidence"], "narration": "Recognize the condition, the signal, the pattern, and the impact. Do not rush from emotion to label. Clarity gives courage a direction.", "visual": "recognize", "chapter": "Finale", "audio": "audio_scene_57.mp3"}, {"kind": "teaching", "title": "Own what belongs to you", "kicker": "O", "body": ["Your words", "Your access", "Your follow-through"], "narration": "Own your response, availability, choices, and repair. Release the impossible assignment of controlling another person's feelings or decisions.", "visual": "own", "chapter": "Finale", "audio": "audio_scene_58.mp3"}, {"kind": "teaching", "title": "Understand what you need", "kicker": "U", "body": ["Your values", "Your capacity", "Your safety"], "narration": "Understand what the boundary serves. Your needs, time, voice, and peace matter. So do the dignity and autonomy of the other person.", "visual": "understand", "chapter": "Finale", "audio": "audio_scene_59.mp3"}, {"kind": "teaching", "title": "Express and protect the boundary", "kicker": "X", "body": ["Say it clearly", "Keep it calmly", "Review it honestly"], "narration": "Express the boundary and protect it through proportionate action. Repair your delivery when necessary. Seek qualified support when the stakes exceed coaching scope.", "visual": "express", "chapter": "Finale", "audio": "audio_scene_60.mp3"}, {"kind": "teaching", "title": "Make room for yourself to live here", "kicker": "COME HOME TO YOURSE
