<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 11 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 11 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Design and Rehearse a Boundary You Can Keep</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Capacity audit</strong><small>List time, energy, money, health, responsibilities, recovery, and margin.</small><textarea id="capacity" rows="4"></textarea></label><label><strong>2. Overextension pattern</strong><small>Describe the request, automatic response, short-term payoff, and longer-term cost.</small><textarea id="pattern" rows="4"></textarea></label><label><strong>3. Inherited boundary rule</strong><small>What did you learn about goodness, loyalty, conflict, or rest?</small><textarea id="belief" rows="4"></textarea></label><label><strong>4. Protected value</strong><small>What health, integrity, consent, reliability, or relationship value needs protection?</small><textarea id="values" rows="4"></textarea></label><label><strong>5. Observable condition</strong><small>State the behavior, timing, frequency, or context without mind reading.</small><textarea id="condition" rows="4"></textarea></label><label><strong>6. Self-owned action</strong><small>What will you do that does not depend on controlling another adult?</small><textarea id="action" rows="4"></textarea></label><label><strong>7. Concise delivery</strong><small>Write a warm, brief, direct boundary statement.</small><textarea id="language" rows="4"></textarea></label><label><strong>8. Guilt tolerance plan</strong><small>How will you validate discomfort and review evidence without reversing automatically?</small><textarea id="guilt" rows="4"></textarea></label><label><strong>9. Calm repeat</strong><small>Write one acknowledgment and one unchanged restatement.</small><textarea id="pushback" rows="4"></textarea></label><label><strong>10. Follow-through</strong><small>When and how will you act if the condition occurs?</small><textarea id="follow" rows="4"></textarea></label><label><strong>11. Tasha case consultation</strong><small>Design her capacity check, first limit, guilt plan, and review point.</small><textarea id="tasha" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>What safety, clinical, medical, legal, abuse, or emergency concern stops ordinary coaching?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
