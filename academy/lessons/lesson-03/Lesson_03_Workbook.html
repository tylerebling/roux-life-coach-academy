<style>html.academy-auth-check body{visibility:hidden}</style><script>document.documentElement.classList.add('academy-auth-check')</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/guard.js"></script><!doctype html><meta charset=utf-8><title>Lesson 3 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 3 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a complete Story Map</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Observable event</strong><small>Describe only what a neutral observer, calendar, message, or camera could confirm.</small><textarea id="event" rows="4"></textarea></label><label><strong>2. Meaning assigned</strong><small>What did you begin to tell yourself the event meant?</small><textarea id="story" rows="4"></textarea></label><label><strong>3. Feeling and urge</strong><small>What did you feel, and what did you want to do immediately?</small><textarea id="emotion" rows="4"></textarea></label><label><strong>4. Protective response</strong><small>What did you actually do or avoid?</small><textarea id="response" rows="4"></textarea></label><label><strong>5. Short-term protection</strong><small>What safety, relief, certainty, or belonging did the response attempt to create?</small><textarea id="function" rows="4"></textarea></label><label><strong>6. Longer-term cost</strong><small>What opportunity, connection, energy, or self-trust did the pattern cost?</small><textarea id="cost" rows="4"></textarea></label><label><strong>7. Evidence that supports the story</strong><small>List only specific evidence.</small><textarea id="evidence_for" rows="4"></textarea></label><label><strong>8. Evidence that widens the picture</strong><small>What facts do not fit, or what remains unknown?</small><textarea id="evidence_wider" rows="4"></textarea></label><label><strong>9. More complete story</strong><small>Write a statement that keeps facts and feelings while restoring agency.</small><textarea id="reframe" rows="4"></textarea></label><label><strong>10. Small evidence-gathering experiment</strong><small>What responsible action could provide new information?</small><textarea id="experiment" rows="4"></textarea></label><label><strong>11. Values anchor</strong><small>Which value do you want the experiment to express?</small><textarea id="values" rows="4"></textarea></label><label><strong>12. Scope check</strong><small>What would indicate a need for clinical, medical, legal, crisis, or other specialized support?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
