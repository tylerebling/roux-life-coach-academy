<script>
const scenes=[{"kind": "teaching", "title": "Stories, Beliefs, and Protective Patterns", "kicker": "ROUX LIFE ACADEMY · LESSON 3", "body": ["Events happen", "We assign meaning", "Meaning shapes emotion", "Emotion influences action"], "narration": "Welcome to Lesson Three: Stories, Beliefs, and Protective Patterns. Human beings do not respond only to events. We respond to what those events mean to us. A delayed reply can become a story about rejection. A mistake can become evidence that we are incapable. A difficult conversation can feel like proof that honesty is dangerous. In this lesson, you will learn to help clients notice those stories without arguing with them, labeling them, or turning coaching into therapy.", "image": "assets_scene_01.webp", "lenses": [{"insight": "A story is an interpretation, not a character defect. Curiosity creates distance without humiliation.", "prompt": "What happened, and what did you begin to tell yourself it meant?"}, {"insight": "A story is an interpretation, not a character defect. Curiosity creates distance without humiliation.", "prompt": "What happened, and what did you begin to tell yourself it meant?"}, {"insight": "A story is an interpretation, not a character defect. Curiosity creates distance without humiliation.", "prompt": "What happened, and what did you begin to tell yourself it meant?"}, {"insight": "A story is an interpretation, not a character defect. Curiosity creates distance without humiliation.", "prompt": "What happened, and what did you begin to tell yourself it meant?"}], "audio": "audio_scene_01.mp3"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Separate event from story", "Understand beliefs and filters", "Recognize protective patterns", "Create a kinder, testable reframe"], "narration": "We will begin by separating observable events from interpretations. Then we will examine how beliefs act like filters, making certain evidence easier to notice and other evidence easier to miss. We will study protective patterns as intelligent attempts to create safety, even when their current cost is high. You will practice clean coaching language, work through Maya's client case, complete six interactive decisions, and finish with an ethical boundary for referral.", "image": "assets_scene_02.webp", "lenses": [{"insight": "A clear roadmap reduces overwhelm and helps a beginning coach know what to listen for next.", "prompt": "Which part of this process does the client need most right now?"}, {"insight": "A clear roadmap reduces overwhelm and helps a beginning coach know what to listen for next.", "prompt": "Which part of this process does the client need most right now?"}, {"insight": "A clear roadmap reduces overwhelm and helps a beginning coach know what to listen for next.", "prompt": "Which part of this process does the client need most right now?"}, {"insight": "A clear roadmap reduces overwhelm and helps a beginning coach know what to listen for next.", "prompt": "Which part of this process does the client need most right now?"}], "audio": "audio_scene_02.mp3"}, {"kind": "teaching", "title": "A story is meaning organized into a conclusion", "kicker": "THE INNER NARRATOR", "body": ["Event · what occurred", "Interpretation · what it means", "Identity verdict · what it says about me", "Prediction · what will happen next"], "narration": "In everyday language, a story is not necessarily false. It is the meaning a person organizes around incomplete information. Imagine a client who presents an idea in a meeting and receives little response. The event is that no one discussed the idea. The interpretation may be, they did not value it. The identity verdict may be, I am not credible. The prediction may be, speaking up again will embarrass me. Coaching helps the client see these layers so one moment does not silently become a permanent rule.", "image": "assets_scene_03.webp", "lenses": [{"insight": "The coach makes layers visible without deciding which interpretation is true.", "prompt": "What do you know, what are you assuming, and what are you predicting?"}, {"insight": "The coach makes layers visible without deciding which interpretation is true.", "prompt": "What do you know, what are you assuming, and what are you predicting?"}, {"insight": "The coach makes layers visible without deciding which interpretation is true.", "prompt": "What do you know, what are you assuming, and what are you predicting?"}, {"insight": "The coach makes layers visible without deciding which interpretation is true.", "prompt": "What do you know, what are you assuming, and what are you predicting?"}], "audio": "audio_scene_03.mp3"}, {"kind": "teaching", "title": "Why the brain creates fast meaning", "kicker": "A NORMAL HUMAN PROCESS", "body": ["Meaning reduces uncertainty", "Past learning supplies a shortcut", "Emotion makes the conclusion feel certain", "Repetition turns a conclusion into a rule"], "narration": "Quick meaning-making is a normal human process. Uncertainty is uncomfortable, so the mind uses memory and pattern recognition to create an explanation. That explanation can be helpful, incomplete, or inaccurate. Strong emotion can make the explanation feel like certainty. When the same interpretation repeats, it begins to operate like a rule: people leave, conflict is unsafe, rest must be earned, or my needs are too much. A coach does not shame this process. The coach slows it down enough for choice to return.", "image": "assets_scene_04.webp", "lenses": [{"insight": "Normalization lowers shame, but it must not be used to minimize impact.", "prompt": "How has this conclusion tried to help you make sense of uncertainty?"}, {"insight": "Normalization lowers shame, but it must not be used to minimize impact.", "prompt": "How has this conclusion tried to help you make sense of uncertainty?"}, {"insight": "Normalization lowers shame, but it must not be used to minimize impact.", "prompt": "How has this conclusion tried to help you make sense of uncertainty?"}, {"insight": "Normalization lowers shame, but it must not be used to minimize impact.", "prompt": "How has this conclusion tried to help you make sense of uncertainty?"}], "audio": "audio_scene_04.mp3"}, {"kind": "question", "title": "Checkpoint 1 · Event or story?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, “My manager did not respond to my proposal, so she thinks I am incompetent.” What should the coach clarify first?", "options": ["Why the manager is emotionally unavailable", "The lack of response and the meaning the client assigned to it", "Which new job the client should pursue"], "correct": 1, "feedback": ["This diagnoses someone who is not present and treats speculation as fact.", "Correct. Separate the observable event from the interpretation before deciding what the event means.", "Action planning is premature because the client has not yet clarified the situation."], "narration": "Pause and choose the response that best protects client dignity and ownership. A client says, “My manager did not respond to my proposal, so she thinks I am incompetent.” What should the coach clarify first?", "image": "assets_scene_05.webp", "audio": "audio_scene_05.mp3"}, {"kind": "teaching", "title": "The Story Map", "kicker": "A FOUR-PART COACHING TOOL", "body": ["Trigger · What happened?", "Story · What did I make it mean?", "Response · What did I feel and do?", "Result · What did that response create?"], "narration": "The Story Map gives a beginner coach a reliable structure. First identify the trigger without adding interpretation. Next ask what meaning the client assigned. Then explore the emotional and behavioral response. Finally, examine the result. For example: my friend canceled dinner; I told myself I am not important; I felt hurt and stopped replying; the friendship became more distant. The map reveals how a protective response may unintentionally create the result the client fears.", "image": "assets_scene_06.webp", "lenses": [{"insight": "Map sequence before searching for causes. Precision makes the pattern coachable.", "prompt": "Walk me through the event, the meaning, your response, and what happened next."}, {"insight": "Map sequence before searching for causes. Precision makes the pattern coachable.", "prompt": "Walk me through the event, the meaning, your response, and what happened next."}, {"insight": "Map sequence before searching for causes. Precision makes the pattern coachable.", "prompt": "Walk me through the event, the meaning, your response, and what happened next."}, {"insight": "Map sequence before searching for causes. Precision makes the pattern coachable.", "prompt": "Walk me through the event, the meaning, your response, and what happened next."}], "audio": "audio_scene_06.mp3"}, {"kind": "teaching", "title": "Facts can be observed; stories must be explored", "kicker": "CLEAN LANGUAGE", "body": ["Fact · camera, calendar, message, or neutral observer", "Story · inferred motive or meaning", "Feeling · emotional information", "Need · what matters underneath"], "narration": "A useful fact is something a neutral observer, calendar, email, or camera could confirm. My colleague interrupted me twice is closer to fact. My colleague wants me to fail is a story about motive. I felt angry and embarrassed names emotional information. I need respect and a chance to finish names what matters. All four belong in the conversation, but they serve different functions. When a coach confuses them, an assumption can become evidence simply because it was spoken with conviction.", "image": "assets_scene_07.webp", "lenses": [{"insight": "Precision protects the client from the coach accidentally confirming an untested conclusion.", "prompt": "What could an observer confirm, and what meaning did you add?"}, {"insight": "Precision protects the client from the coach accidentally confirming an untested conclusion.", "prompt": "What could an observer confirm, and what meaning did you add?"}, {"insight": "Precision protects the client from the coach accidentally confirming an untested conclusion.", "prompt": "What could an observer confirm, and what meaning did you add?"}, {"insight": "Precision protects the client from the coach accidentally confirming an untested conclusion.", "prompt": "What could an observer confirm, and what meaning did you add?"}], "audio": "audio_scene_07.mp3"}, {"kind": "teaching", "title": "Do not debate the client's story", "kicker": "CURIOSITY OVER CORRECTION", "body": ["Avoid · “That is not true”", "Avoid · “You are overthinking”", "Try · “What supports that conclusion?”", "Try · “What else could also be true?”"], "narration": "When a client presents a painful conclusion, direct contradiction often creates defensiveness or dependence. If the coach says, that is not true, the client may feel unseen or may begin relying on the coach for reassurance. Curiosity is stronger. Ask what evidence supports the conclusion, what evidence complicates it, and what other interpretation could fit the same facts. The purpose is not forced positivity. It is to replace automatic certainty with a wider field of information.", "image": "assets_scene_08.webp", "lenses": [{"insight": "A reframe is offered as an option to examine, never as a more attractive story the client must accept.", "prompt": "What evidence supports this story, and what evidence does not fit it?"}, {"insight": "A reframe is offered as an option to examine, never as a more attractive story the client must accept.", "prompt": "What evidence supports this story, and what evidence does not fit it?"}, {"insight": "A reframe is offered as an option to examine, never as a more attractive story the client must accept.", "prompt": "What evidence supports this story, and what evidence does not fit it?"}, {"insight": "A reframe is offered as an option to examine, never as a more attractive story the client must accept.", "prompt": "What evidence supports this story, and what evidence does not fit it?"}], "audio": "audio_scene_08.mp3"}, {"kind": "teaching", "title": "Beliefs are filters, not just sentences", "kicker": "WHAT THE CLIENT EXPECTS TO FIND", "body": ["Belief directs attention", "Attention selects evidence", "Evidence reinforces belief", "The loop becomes familiar"], "narration": "A belief is more than a sentence a client repeats. It is a filter that influences what the person notices, expects, remembers, and avoids. A client who believes my needs burden people may remember every impatient response and overlook moments of care. She may speak indirectly, receive an unclear response, and treat the confusion as confirmation. This does not mean she caused another person's behavior. It means the belief shapes what she can see and what she feels safe enough to try.", "image": "assets_scene_09.webp", "lenses": [{"insight": "Beliefs influence attention and behavior; they do not make the client responsible for other people's harmful choices.", "prompt": "When this belief is active, what evidence becomes loud—and what becomes hard to notice?"}, {"insight": "Beliefs influence attention and behavior; they do not make the client responsible for other people's harmful choices.", "prompt": "When this belief is active, what evidence becomes loud—and what becomes hard to notice?"}, {"insight": "Beliefs influence attention and behavior; they do not make the client responsible for other people's harmful choices.", "prompt": "When this belief is active, what evidence becomes loud—and what becomes hard to notice?"}, {"insight": "Beliefs influence attention and behavior; they do not make the client responsible for other people's harmful choices.", "prompt": "When this belief is active, what evidence becomes loud—and what becomes hard to notice?"}], "audio": "audio_scene_09.mp3"}, {"kind": "question", "title": "Checkpoint 2 · Clean curiosity", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which question helps examine a belief without shaming or reassuring the client?", "options": ["Why do you keep believing something so irrational?", "What experiences taught you this belief, and where does it fit or not fit today?", "Can you promise to stop thinking that way?"], "correct": 1, "feedback": ["The label irrational adds judgment and positions the coach as the authority.", "Correct. It respects the belief's history while testing its present usefulness.", "A promise does not create understanding and may add shame when the thought returns."], "narration": "Pause and choose the response that best protects client dignity and ownership. Which question helps examine a belief without shaming or reassuring the client?", "image": "assets_scene_10.webp", "audio": "audio_scene_10.mp3"}, {"kind": "teaching", "title": "Three belief levels", "kicker": "FROM SITUATION TO IDENTITY", "body": ["Situational · “This conversation may go badly”", "Relational · “People withdraw when I have needs”", "Identity · “I am too much”", "Worldview · “Safety requires self-silencing”"], "narration": "Beliefs can operate at several levels. A situational belief concerns one event. A relational belief predicts how people respond. An identity belief becomes a verdict about the self. A worldview becomes a broad rule for staying safe. Coaches should be especially careful around identity statements. The coach does not replace I am too much with you are perfect. Instead, explore what too much means, where the message came from, how it affects current choices, and whether it deserves authority today.", "image": "assets_scene_11.webp", "lenses": [{"insight": "Move from global identity language toward specific, observable situations and choices.", "prompt": "When you say “I am too much,” what behavior or need are you actually describing?"}, {"insight": "Move from global identity language toward specific, observable situations and choices.", "prompt": "When you say “I am too much,” what behavior or need are you actually describing?"}, {"insight": "Move from global identity language toward specific, observable situations and choices.", "prompt": "When you say “I am too much,” what behavior or need are you actually describing?"}, {"insight": "Move from global identity language toward specific, observable situations and choices.", "prompt": "When you say “I am too much,” what behavior or need are you actually describing?"}], "audio": "audio_scene_11.mp3"}, {"kind": "teaching", "title": "Language that turns behavior into identity", "kicker": "SHAME'S SHORTCUT", "body": ["I made a mistake → I am a failure", "I avoided a conversation → I am weak", "I need reassurance → I am needy", "I changed my mind → I cannot trust myself"], "narration": "Shame compresses behavior into identity. The client moves from I did something to I am something. Once identity becomes the problem, change can feel impossible because every setback appears to reveal the real self. Coaching restores specificity. What exactly happened? What choice did you make? What were you protecting? What skill was missing? What response would better match your values next time? Specific behavior can be understood, repaired, and practiced. A global identity verdict only punishes.", "image": "assets_scene_12.webp", "lenses": [{"insight": "Challenge the verdict without arguing with the emotion beneath it.", "prompt": "What happened that you are turning into a conclusion about who you are?"}, {"insight": "Challenge the verdict without arguing with the emotion beneath it.", "prompt": "What happened that you are turning into a conclusion about who you are?"}, {"insight": "Challenge the verdict without arguing with the emotion beneath it.", "prompt": "What happened that you are turning into a conclusion about who you are?"}, {"insight": "Challenge the verdict without arguing with the emotion beneath it.", "prompt": "What happened that you are turning into a conclusion about who you are?"}], "audio": "audio_scene_12.mp3"}, {"kind": "teaching", "title": "Self-compassion supports accountability", "kicker": "KINDNESS IS NOT EXCUSE-MAKING", "body": ["Name the pain honestly", "Separate worth from behavior", "Take responsibility for impact", "Choose repair or practice"], "narration": "Self-compassion is sometimes misunderstood as lowering standards. In practice, harsh self-judgment often consumes the energy needed for repair. A compassionate response can say: I see why I protected myself, and the impact still matters. I can understand the pattern without pretending it worked. This stance supports accountability because the client can examine behavior without defending an identity. The Roux Life standard is compassion with responsibility: dignity remains intact, impact is named, and learning becomes possible.", "image": "assets_scene_13.webp", "lenses": [{"insight": "Compassion and responsibility belong in the same sentence.", "prompt": "How can you understand why you responded that way while still owning the impact?"}, {"insight": "Compassion and responsibility belong in the same sentence.", "prompt": "How can you understand why you responded that way while still owning the impact?"}, {"insight": "Compassion and responsibility belong in the same sentence.", "prompt": "How can you understand why you responded that way while still owning the impact?"}, {"insight": "Compassion and responsibility belong in the same sentence.", "prompt": "How can you understand why you responded that way while still owning the impact?"}], "audio": "audio_scene_13.mp3"}, {"kind": "teaching", "title": "Protective patterns began as intelligent solutions", "kicker": "HONOR THE FUNCTION BEFORE CHALLENGING THE COST", "body": ["Avoiding reduced immediate risk", "Pleasing protected belonging", "Perfection reduced criticism", "Control reduced uncertainty"], "narration": "A protective pattern is a repeated behavior that attempts to create safety, belonging, predictability, or relief. Avoiding a conversation may reduce immediate conflict. Pleasing may preserve connection. Perfectionism may reduce criticism. Control may reduce uncertainty. The pattern deserves respect for the function it served. Respect does not mean preserving it forever. The coach helps the client ask two questions: what did this protect, and what does it cost now? That sequence lowers shame and opens choice.", "image": "assets_scene_14.webp", "lenses": [{"insight": "Protection is a function, not a diagnosis. Let the client define what the pattern protects.", "prompt": "What does this response make safer in the short term?"}, {"insight": "Protection is a function, not a diagnosis. Let the client define what the pattern protects.", "prompt": "What does this response make safer in the short term?"}, {"insight": "Protection is a function, not a diagnosis. Let the client define what the pattern protects.", "prompt": "What does this response make safer in the short term?"}, {"insight": "Protection is a function, not a diagnosis. Let the client define what the pattern protects.", "prompt": "What does this response make safer in the short term?"}], "audio": "audio_scene_14.mp3"}, {"kind": "question", "title": "Checkpoint 3 · Protection before correction", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client repeatedly cancels networking events and calls herself lazy. What is the strongest first question?", "options": ["Why are you sabotaging your career?", "What becomes safer when you cancel, and what cost follows?", "Which attendance consequence should I assign?"], "correct": 1, "feedback": ["Sabotage is a loaded interpretation and may intensify shame.", "Correct. It explores function and cost without turning the behavior into identity.", "A consequence is premature and puts the coach in a policing role."], "narration": "Pause and choose the response that best protects client dignity and ownership. A client repeatedly cancels networking events and calls herself lazy. What is the strongest first question?", "image": "assets_scene_15.webp", "audio": "audio_scene_15.mp3"}, {"kind": "teaching", "title": "Common protective patterns in coaching", "kicker": "NOTICE WITHOUT LABELING", "body": ["Avoiding · distance from discomfort", "Pleasing · securing approval", "Perfecting · preventing criticism", "Controlling · reducing uncertainty"], "narration": "Common patterns include avoiding, pleasing, perfecting, controlling, overexplaining, staying busy, withdrawing, and intellectualizing. These are descriptions, not diagnoses. The same behavior can serve different functions for different clients. Silence may protect one client from conflict and another from exposure. Productivity may express purpose for one client and help another avoid grief. A coach stays curious about function rather than assuming a universal cause.", "image": "assets_scene_16.webp", "lenses": [{"insight": "Describe what repeats and ask what function it serves. Avoid clinical labels and hidden-cause certainty.", "prompt": "What happens just before this pattern begins, and what relief does it provide?"}, {"insight": "Describe what repeats and ask what function it serves. Avoid clinical labels and hidden-cause certainty.", "prompt": "What happens just before this pattern begins, and what relief does it provide?"}, {"insight": "Describe what repeats and ask what function it serves. Avoid clinical labels and hidden-cause certainty.", "prompt": "What happens just before this pattern begins, and what relief does it provide?"}, {"insight": "Describe what repeats and ask what function it serves. Avoid clinical labels and hidden-cause certainty.", "prompt": "What happens just before this pattern begins, and what relief does it provide?"}], "audio": "audio_scene_16.mp3"}, {"kind": "teaching", "title": "The protection-cost exchange", "kicker": "SHORT-TERM RELIEF · LONG-TERM PRICE", "body": ["Immediate relief", "Reduced exposure", "Lost opportunity", "Reinforced belief"], "narration": "Protective patterns often survive because the short-term reward is immediate while the long-term cost is delayed. Canceling the event reduces anxiety tonight. The cost—less connection, less practice, fewer opportunities—appears later. That cost can then reinforce the original belief: I do not belong. Help the client see the full exchange without forcing change. What relief did the pattern provide? What did it cost? Is that exchange still acceptable? What smaller experiment would preserve enough safety while creating new evidence?", "image": "assets_scene_17.webp", "lenses": [{"insight": "The client decides whether the exchange still serves them; the coach makes the exchange visible.", "prompt": "What are you gaining immediately, and what are you paying over time?"}, {"insight": "The client decides whether the exchange still serves them; the coach makes the exchange visible.", "prompt": "What are you gaining immediately, and what are you paying over time?"}, {"insight": "The client decides whether the exchange still serves them; the coach makes the exchange visible.", "prompt": "What are you gaining immediately, and what are you paying over time?"}, {"insight": "The client decides whether the exchange still serves them; the coach makes the exchange visible.", "prompt": "What are you gaining immediately, and what are you paying over time?"}], "audio": "audio_scene_17.mp3"}, {"kind": "teaching", "title": "Triggers are cues, not commands", "kicker": "MAP THE MOMENT CHOICE NARROWS", "body": ["External cue · words, silence, tone, delay", "Internal cue · memory, sensation, image", "Meaning · danger, rejection, failure", "Protective urge · withdraw, please, control"], "narration": "A trigger is a cue that activates a learned emotional or behavioral response. In coaching, use the word carefully and descriptively. Do not claim that a trigger proves trauma or diagnose its origin. Map what the client noticed: the delayed text, the tight chest, the thought I am being abandoned, and the urge to send five messages or disappear. The goal is practical awareness. When the sequence becomes visible, the client can build a pause between cue and action.", "image": "assets_scene_18.webp", "lenses": [{"insight": "Trigger mapping in coaching supports present awareness; trauma processing belongs with qualified clinicians.", "prompt": "What did you notice first—in the situation, your body, your thoughts, or your urge?"}, {"insight": "Trigger mapping in coaching supports present awareness; trauma processing belongs with qualified clinicians.", "prompt": "What did you notice first—in the situation, your body, your thoughts, or your urge?"}, {"insight": "Trigger mapping in coaching supports present awareness; trauma processing belongs with qualified clinicians.", "prompt": "What did you notice first—in the situation, your body, your thoughts, or your urge?"}, {"insight": "Trigger mapping in coaching supports present awareness; trauma processing belongs with qualified clinicians.", "prompt": "What did you notice first—in the situation, your body, your thoughts, or your urge?"}], "audio": "audio_scene_18.mp3"}, {"kind": "teaching", "title": "The Roux Life Trigger Map", "kicker": "NOTICE · NAME · VALIDATE · CHOOSE", "body": ["Notice the cue", "Name the story and feeling", "Validate the need without confirming the assumption", "Choose a values-aligned response"], "narration": "The Roux Life Trigger Map has four moves. Notice the cue. Name the story and feeling. Validate the underlying need without treating the story as proven fact. Then choose a response aligned with values. A client might say: I noticed the delayed reply; my story was that I am unimportant; I felt anxious; the need for clarity makes sense; instead of escalating, I will wait until tomorrow and ask directly. Self-validation means the feeling and need are understandable. It does not mean every interpretation is accurate.", "image": "assets_scene_19.webp", "lenses": [{"insight": "Validation acknowledges experience; it does not certify an untested conclusion.", "prompt": "What is understandable about your response, and what choice would reflect your values now?"}, {"insight": "Validation acknowledges experience; it does not certify an untested conclusion.", "prompt": "What is understandable about your response, and what choice would reflect your values now?"}, {"insight": "Validation acknowledges experience; it does not certify an untested conclusion.", "prompt": "What is understandable about your response, and what choice would reflect your values now?"}, {"insight": "Validation acknowledges experience; it does not certify an untested conclusion.", "prompt": "What is understandable about your response, and what choice would reflect your values now?"}], "audio": "audio_scene_19.mp3"}, {"kind": "question", "title": "Checkpoint 4 · Validation without confirmation", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which response validates a client without confirming an untested abandonment story?", "options": ["Yes, their silence proves they do not care.", "Your anxiety makes sense given the uncertainty. What do you know, and what do you still need to clarify?", "You should not feel anxious because there may be an innocent explanation."], "correct": 1, "feedback": ["This converts an interpretation into fact.", "Correct. It honors the emotional experience while reopening evidence and choice.", "This argues with the feeling and may increase shame."], "narration": "Pause and choose the response that best protects client dignity and ownership. Which response validates a client without confirming an untested abandonment story?", "image": "assets_scene_20.webp", "audio": "audio_scene_20.mp3"}, {"kind": "teaching", "title": "Create space between feeling and action", "kicker": "REGULATION FOR COACHING—NOT TREATMENT", "body": ["Slow the pace", "Orient to present facts", "Name the feeling", "Choose the next safe action"], "narration": "Coaches can support everyday emotional regulation through pacing, grounding attention in present facts, naming feelings, and selecting a manageable action. The coach is not treating a disorder or conducting trauma processing. A simple pause may include feet on the floor, a slower exhale, and the question: what is true in this moment? If the client is overwhelmed, dissociative, unable to function, or repeatedly destabilized, the coach should pause ordinary work and encourage appropriate licensed care.", "image": "assets_scene_21.webp", "lenses": [{"insight": "Use simple present-focused regulation only within competence and coaching scope.", "prompt": "What would help you become steady enough to choose rather than react?"}, {"insight": "Use simple present-focused regulation only within competence and coaching scope.", "prompt": "What would help you become steady enough to choose rather than react?"}, {"insight": "Use simple present-focused regulation only within competence and coaching scope.", "prompt": "What would help you become steady enough to choose rather than react?"}, {"insight": "Use simple present-focused regulation only within competence and coaching scope.", "prompt": "What would help you become steady enough to choose rather than react?"}], "audio": "audio_scene_21.mp3"}, {"kind": "teaching", "title": "Tolerating uncertainty is a coaching skill", "kicker": "CERTAINTY IS NOT ALWAYS AVAILABLE", "body": ["Name what is known", "Name what is unknown", "Identify what is controllable", "Choose how to live while waiting"], "narration": "Many protective stories promise certainty: if I assume rejection first, I cannot be surprised. Yet certainty purchased through a painful assumption is not reliable clarity. Help the client sort what is known, unknown, and controllable. Then ask how they want to behave while uncertainty remains. The goal is not to enjoy uncertainty. It is to stop making permanent decisions from information the client does not yet have.", "image": "assets_scene_22.webp", "lenses": [{"insight": "Courage may mean carrying an unanswered question without abandoning values.", "prompt": "What do you know, what remains unknown, and who do you want to be while you wait?"}, {"insight": "Courage may mean carrying an unanswered question without abandoning values.", "prompt": "What do you know, what remains unknown, and who do you want to be while you wait?"}, {"insight": "Courage may mean carrying an unanswered question without abandoning values.", "prompt": "What do you know, what remains unknown, and who do you want to be while you wait?"}, {"insight": "Courage may mean carrying an unanswered question without abandoning values.", "prompt": "What do you know, what remains unknown, and who do you want to be while you wait?"}], "audio": "audio_scene_22.mp3"}, {"kind": "teaching", "title": "Reframing is not positive thinking", "kicker": "A MORE COMPLETE STORY", "body": ["Keep the facts", "Include missing evidence", "Preserve emotional truth", "Create room for agency"], "narration": "A useful reframe is not a cheerful replacement for a painful story. It is a more complete interpretation that fits the evidence and returns agency. Instead of, no one values my ideas, the client might say: my idea was not discussed in that meeting; I feel disappointed; I do not yet know why; I can ask for feedback and decide what to do with the response. The emotional truth remains. The certainty softens. A next step becomes visible.", "image": "assets_scene_23.webp", "lenses": [{"insight": "A strong reframe is believable enough to use and specific enough to test.", "prompt": "What is a more complete story that includes both the disappointment and what you do not yet know?"}, {"insight": "A strong reframe is believable enough to use and specific enough to test.", "prompt": "What is a more complete story that includes both the disappointment and what you do not yet know?"}, {"insight": "A strong reframe is believable enough to use and specific enough to test.", "prompt": "What is a more complete story that includes both the disappointment and what you do not yet know?"}, {"insight": "A strong reframe is believable enough to use and specific enough to test.", "prompt": "What is a more complete story that includes both the disappointment and what you do not yet know?"}], "audio": "audio_scene_23.mp3"}, {"kind": "teaching", "title": "Test a story with evidence", "kicker": "THE BELIEF EXPERIMENT", "body": ["Prediction · What do you expect?", "Experiment · What small action tests it?", "Observation · What happened?", "Learning · What changes now?"], "narration": "Rather than debating a belief, design a small experiment. The client predicts what will happen, chooses a low-risk action, observes the result, and updates the story. A client who believes people reject direct requests might make one clear request to a generally safe person. The purpose is not to prove the belief wrong. It is to gather better information. One result does not erase a history, but repeated evidence can loosen a rule that has been operating without review.", "image": "assets_scene_24.webp", "lenses": [{"insight": "Experiments gather information; they do not demand a brave performance or guarantee a positive response.", "prompt": "What small, responsible action could give you new information?"}, {"insight": "Experiments gather information; they do not demand a brave performance or guarantee a positive response.", "prompt": "What small, responsible action could give you new information?"}, {"insight": "Experiments gather information; they do not demand a brave performance or guarantee a positive response.", "prompt": "What small, responsible action could give you new information?"}, {"insight": "Experiments gather information; they do not demand a brave performance or guarantee a positive response.", "prompt": "What small, responsible action could give you new information?"}], "audio": "audio_scene_24.mp3"}, {"kind": "question", "title": "Checkpoint 5 · Reframe or bypass?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is the strongest evidence-based reframe?", "options": ["Everything happens for a reason, so this is good.", "My proposal received no response. I feel dismissed, but I do not know the reason yet. I can request feedback.", "I am amazing, and anyone who disagrees is wrong."], "correct": 1, "feedback": ["This bypasses disappointment and adds a conclusion unsupported by evidence.", "Correct. It keeps the facts and feelings while reducing certainty and restoring agency.", "This replaces one rigid story with another."], "narration": "Pause and choose the response that best protects client dignity and ownership. Which statement is the strongest evidence-based reframe?", "image": "assets_scene_25.webp", "audio": "audio_scene_25.mp3"}, {"kind": "teaching", "title": "Case study · Meet Maya", "kicker": "A HIGH-PERFORMING CLIENT WHO HAS GONE QUIET", "body": ["Director with strong performance reviews", "Idea received no discussion", "Story · “My voice does not matter”", "Pattern · withdraw, overprepare, stop proposing"], "narration": "Maya is a director known for thoughtful work. During a leadership meeting, she proposed a new approach. The group moved on without discussion. Maya concluded that her voice does not matter. Since then, she has stopped offering early ideas, spends hours perfecting presentations, and waits until she is certain no one can criticize her. She wants confidence, but ordinary encouragement has not changed the pattern. Your task is not to convince Maya she is valued. It is to help her understand the story, protection, cost, and choices.", "image": "assets_scene_26.webp", "lenses": [{"insight": "Stay close to Maya's experience without confirming the motive she assigned to the group.", "prompt": "What part of that meeting stayed with you most strongly?"}, {"insight": "Stay close to Maya's experience without confirming the motive she assigned to the group.", "prompt": "What part of that meeting stayed with you most strongly?"}, {"insight": "Stay close to Maya's experience without confirming the motive she assigned to the group.", "prompt": "What part of that meeting stayed with you most strongly?"}, {"insight": "Stay close to Maya's experience without confirming the motive she assigned to the group.", "prompt": "What part of that meeting stayed with you most strongly?"}], "audio": "audio_scene_26.mp3"}, {"kind": "teaching", "title": "Maya's Story Map", "kicker": "EVENT → MEANING → PROTECTION → RESULT", "body": ["Event · no discussion", "Meaning · “I am not credible”", "Protection · silence and perfection", "Result · less visibility and less feedback"], "narration": "Map Maya's sequence. The event was that the group did not discuss the proposal. She interpreted that as evidence she was not credible. She protected herself through silence and overpreparation. The result was less visibility, fewer opportunities for feedback, and more pressure on every future contribution. Notice that this map does not blame Maya for the meeting. It reveals what became hers to influence after the meeting.", "image": "assets_scene_27.webp", "lenses": [{"insight": "Separate responsibility for others' behavior from responsibility for the client's next choice.", "prompt": "Which part of this sequence is within your influence now?"}, {"insight": "Separate responsibility for others' behavior from responsibility for the client's next choice.", "prompt": "Which part of this sequence is within your influence now?"}, {"insight": "Separate responsibility for others' behavior from responsibility for the client's next choice.", "prompt": "Which part of this sequence is within your influence now?"}, {"insight": "Separate responsibility for others' behavior from responsibility for the client's next choice.", "prompt": "Which part of this sequence is within your influence now?"}], "audio": "audio_scene_27.mp3"}, {"kind": "teaching", "title": "Coach Maya without rescuing", "kicker": "ACKNOWLEDGE · CLARIFY · EXPLORE · CHOOSE", "body": ["Acknowledge the disappointment", "Clarify facts and assumptions", "Explore what silence protects", "Choose a values-aligned experiment"], "narration": "A Roux Life response might sound like this: It makes sense that being passed over felt discouraging. What did you make the silence mean about you? What evidence supports that meaning, and what remains unknown? When you overprepare or stay quiet, what are you protecting? What does that protection cost? If courage and contribution mattered more than certainty in one meeting, what would you do? The coach offers structure, not a verdict.", "image": "assets_scene_28.webp", "lenses": [{"insight": "The conversation combines emotional courage with practical ownership.", "prompt": "What would contribution look like if you did not require certainty first?"}, {"insight": "The conversation combines emotional courage with practical ownership.", "prompt": "What would contribution look like if you did not require certainty first?"}, {"insight": "The conversation combines emotional courage with practical ownership.", "prompt": "What would contribution look like if you did not require certainty first?"}, {"insight": "The conversation combines emotional courage with practical ownership.", "prompt": "What would contribution look like if you did not require certainty first?"}], "audio": "audio_scene_28.mp3"}, {"kind": "teaching", "title": "A small courageous experiment", "kicker": "NEW EVIDENCE WITHOUT OVEREXPOSURE", "body": ["Ask one colleague for specific feedback", "Offer one early idea before it is polished", "Prepare one clarifying follow-up question", "Review what happened without self-punishment"], "narration": "Maya chooses a measured experiment. Before the next meeting, she will ask a trusted colleague for specific feedback on how her proposal landed. During the meeting, she will offer one early idea without turning it into a perfect presentation. If the group moves on, she will ask one clarifying question. Afterward, she will review the evidence: what happened, what she felt, what she learned, and what she wants to practice next. Courage is calibrated, not theatrical.", "image": "assets_scene_29.webp", "lenses": [{"insight": "The smallest viable experiment should stretch the pattern without overwhelming the client.", "prompt": "What is the smallest action that would create useful new evidence?"}, {"insight": "The smallest viable experiment should stretch the pattern without overwhelming the client.", "prompt": "What is the smallest action that would create useful new evidence?"}, {"insight": "The smallest viable experiment should stretch the pattern without overwhelming the client.", "prompt": "What is the smallest action that would create useful new evidence?"}, {"insight": "The smallest viable experiment should stretch the pattern without overwhelming the client.", "prompt": "What is the smallest action that would create useful new evidence?"}], "audio": "audio_scene_29.mp3"}, {"kind": "teaching", "title": "When a story involves real harm", "kicker": "DO NOT REFRAME AWAY REALITY", "body": ["Believe reported impact without inventing facts", "Name patterns of disrespect or coercion clearly", "Prioritize safety and appropriate resources", "Do not pressure reconciliation or exposure"], "narration": "Not every painful story is a cognitive distortion. Clients may be responding to discrimination, coercion, abuse, betrayal, or repeated disrespect. Do not use reframing to make an unsafe situation sound acceptable. Explore evidence carefully, respect the client's report, and focus on safety, boundaries, resources, and informed choice. If the situation requires legal, medical, domestic-violence, workplace, or mental-health expertise, support an appropriate referral. Coaching should never pressure a client to confront someone when doing so may increase danger.", "image": "assets_scene_30.webp", "lenses": [{"insight": "Curiosity must never become disbelief or pressure to reinterpret genuine harm.", "prompt": "What support and safety information would help you make an informed choice?"}, {"insight": "Curiosity must never become disbelief or pressure to reinterpret genuine harm.", "prompt": "What support and safety information would help you make an informed choice?"}, {"insight": "Curiosity must never become disbelief or pressure to reinterpret genuine harm.", "prompt": "What support and safety information would help you make an informed choice?"}, {"insight": "Curiosity must never become disbelief or pressure to reinterpret genuine harm.", "prompt": "What support and safety information would help you make an informed choice?"}], "audio": "audio_scene_30.mp3"}, {"kind": "teaching", "title": "Scope boundary · coaching is not trauma treatment", "kicker": "KNOW WHEN TO PAUSE AND REFER", "body": ["No diagnosis", "No memory recovery or exposure treatment", "No coaching through immediate danger", "Refer for severe distress or impairment"], "narration": "Stories and protective patterns may connect to trauma, anxiety, depression, or other clinical concerns. An RLC coach does not diagnose, recover memories, conduct exposure therapy, or promise to heal trauma. Pause and refer when the client describes immediate danger, self-harm, severe impairment, dissociation, uncontrolled panic, active addiction requiring treatment, eating-disorder symptoms, or needs beyond the coach's competence. Referral is not abandonment. It is the professional act of matching the client with the level of care they need.", "image": "assets_scene_31.webp", "lenses": [{"insight": "Name the limit calmly, avoid diagnosis, and help the client connect with qualified support.", "prompt": "What support does this client need that coaching is not qualified to provide?"}, {"insight": "Name the limit calmly, avoid diagnosis, and help the client connect with qualified support.", "prompt": "What support does this client need that coaching is not qualified to provide?"}, {"insight": "Name the limit calmly, avoid diagnosis, and help the client connect with qualified support.", "prompt": "What support does this client need that coaching is not qualified to provide?"}, {"insight": "Name the limit calmly, avoid diagnosis, and help the client connect with qualified support.", "prompt": "What support does this client need that coaching is not qualified to provide?"}], "audio": "audio_scene_31.mp3"}, {"kind": "question", "title": "Checkpoint 6 · Scope and safety", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client becomes unable to function at work, reports frequent panic episodes, and asks coaching to cure them. What is the responsible response?", "options": ["Use stronger accountability so the client pushes through", "Explain the coaching boundary and encourage prompt licensed mental-health or medical support", "Teach the client to ignore bodily sensations"], "correct": 1, "feedback": ["Accountability is not treatment and may increase harm.", "Correct. Significant impairment and requests for treatment require appropriate licensed care.", "Ignoring symptoms is unsafe and outside responsible coaching."], "narration": "Pause and choose the response that best protects client dignity and ownership. A client becomes unable to function at work, reports frequent panic episodes, and asks coaching to cure them. What is the responsible response?", "image": "assets_scene_32.webp", "audio": "audio_scene_32.mp3"}, {"kind": "teaching", "title": "A five-question story conversation", "kicker": "BEGINNER COACHING SEQUENCE", "body": ["What happened?", "What did you make it mean?", "What is the story protecting?", "What evidence widens the picture?"], "narration": "When you are unsure what to ask, use this sequence. What happened? What did you make it mean? What feeling and response followed? What is that response protecting, and what does it cost? What evidence supports or complicates the story? Then ask one final question: what choice would reflect your values now? Do not rush through the sequence. Listen to the answer, reflect what you heard, and ask permission before going deeper.", "image": "assets_scene_33.webp", "lenses": [{"insight": "A sequence is a compass, not a script. Follow the client's meaning rather than racing to the last question.", "prompt": "Which answer needs more space before you ask the next question?"}, {"insight": "A sequence is a compass, not a script. Follow the client's meaning rather than racing to the last question.", "prompt": "Which answer needs more space before you ask the next question?"}, {"insight": "A sequence is a compass, not a script. Follow the client's meaning rather than racing to the last question.", "prompt": "Which answer needs more space before you ask the next question?"}, {"insight": "A sequence is a compass, not a script. Follow the client's meaning rather than racing to the last question.", "prompt": "Which answer needs more space before you ask the next question?"}], "audio": "audio_scene_33.mp3"}, {"kind": "teaching", "title": "Coach language that preserves dignity", "kicker": "CHALLENGE WITHOUT SHAME", "body": ["“May I offer an observation?”", "“How certain are you of that meaning?”", "“What might this response be protecting?”", "“What would a kinder, accurate story include?”"], "narration": "Clean challenge begins with permission and specificity. May I offer an observation? How certain are you of that meaning? What evidence would change your mind? What might this response be protecting? What would a kinder and still accurate story include? These questions neither agree automatically nor attack the client. Tone matters. Ask one question at a time. Allow silence. Reflect the client's words. If the client becomes defensive, slow down and repair rather than pushing harder.", "image": "assets_scene_34.webp", "lenses": [{"insight": "Challenge is useful only when the relationship can hold it and the client retains choice.", "prompt": "Would you like reflection, a question, or a moment to think?"}, {"insight": "Challenge is useful only when the relationship can hold it and the client retains choice.", "prompt": "Would you like reflection, a question, or a moment to think?"}, {"insight": "Challenge is useful only when the relationship can hold it and the client retains choice.", "prompt": "Would you like reflection, a question, or a moment to think?"}, {"insight": "Challenge is useful only when the relationship can hold it and the client retains choice.", "prompt": "Would you like reflection, a question, or a moment to think?"}], "audio": "audio_scene_34.mp3"}, {"kind": "teaching", "title": "Workbook practice · Map your own low-stakes story", "kicker": "GUIDED APPLICATION", "body": ["Choose a manageable event", "Separate facts from meaning", "Identify protection and cost", "Design one evidence-gathering experiment"], "narration": "Choose a recent, low-stakes event for your workbook. Avoid material that feels clinically overwhelming. Write what a neutral observer could confirm. Record the meaning you assigned, the emotion and behavior that followed, the short-term protection, and the longer-term cost. Then write a fuller interpretation that keeps the facts and emotional truth. Finish with one small experiment that gathers information. This self-practice helps you feel the difference between being corrected and being invited into curiosity.", "image": "assets_scene_35.webp", "lenses": [{"insight": "Personal practice builds empathy, but learners should choose material safe for independent reflection.", "prompt": "What story can you examine today without overwhelming yourself?"}, {"insight": "Personal practice builds empathy, but learners should choose material safe for independent reflection.", "prompt": "What story can you examine today without overwhelming yourself?"}, {"insight": "Personal practice builds empathy, but learners should choose material safe for independent reflection.", "prompt": "What story can you examine today without overwhelming yourself?"}, {"insight": "Personal practice builds empathy, but learners should choose material safe for independent reflection.", "prompt": "What story can you examine today without overwhelming yourself?"}], "audio": "audio_scene_35.mp3"}, {"kind": "teaching", "title": "Practice assignment · Coach the pattern, not the person", "kicker": "SKILL REHEARSAL", "body": ["Use descriptive language", "Ask about function", "Explore impact", "Return choice"], "narration": "With a practice partner, listen for one global statement such as I always ruin things or people never stay. Reflect the exact words without endorsing them. Ask for one specific example. Separate the event from the meaning. Explore what the response protected and what it cost. Ask permission to test a fuller story. Finish with a client-owned experiment. The observer should track whether the coach used labels, rushed toward reassurance, or left enough room for the client to think.", "image": "assets_scene_36.webp", "lenses": [{"insight": "Skill rehearsal focuses on process quality, not producing an impressive breakthrough.", "prompt": "Did the client leave with more ownership—or more dependence on the coach?"}, {"insight": "Skill rehearsal focuses on process quality, not producing an impressive breakthrough.", "prompt": "Did the client leave with more ownership—or more dependence on the coach?"}, {"insight": "Skill rehearsal focuses on process quality, not producing an impressive breakthrough.", "prompt": "Did the client leave with more ownership—or more dependence on the coach?"}, {"insight": "Skill rehearsal focuses on process quality, not producing an impressive breakthrough.", "prompt": "Did the client leave with more ownership—or more dependence on the coach?"}], "audio": "audio_scene_36.mp3"}, {"kind": "teaching", "title": "The Roux Life standard", "kicker": "CURIOSITY · DIGNITY · RESPONSIBILITY · SCOPE", "body": ["Stories are explored, not imposed", "Protection is honored, not romanticized", "Reframes are tested, not forced", "Referral protects the client"], "narration": "The Roux Life standard is curiosity with dignity, responsibility, and scope. Stories are explored rather than imposed. Protective patterns are honored for their function without ignoring their cost. Reframes become more complete and testable, not artificially positive. Experiments gather new evidence without demanding performance. Referral protects clients when their needs extend beyond coaching. Continue to the Learning Lab for Maya's case, your workbook, reflection assignments, transcript, downloads, and the twelve-question graded quiz. A passing score is eighty percent.", "image": "assets_scene_37.webp", "lenses": [{"insight": "The goal is not to delete every difficult story. It is to restore awareness, choice, and responsible action.", "prompt": "What will you listen for differently in your next coaching conversation?"}, {"insight": "The goal is not to delete every difficult story. It is to restore awareness, choice, and responsible action.", "prompt": "What will you listen for differently in your next coaching conversation?"}, {"insight": "The goal is not to delete every difficult story. It is to restore awareness, choice, and responsible action.", "prompt": "What will you listen for differently in your next coaching conversation?"}, {"insight": "The goal is not to delete every difficult story. It is to restore awareness, choice, and responsible action.", "prompt": "What will you listen for differently in your next coaching conversation?"}], "audio": "audio_scene_37.mp3"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;

function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}

function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 3</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}

function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 3</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Stories, Beliefs, and Protective Patterns';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson3PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
