<script>
const scenes=[{"kind": "teaching", "title": "Practicing Courage in Real Life", "kicker": "ROUX LIFE ACADEMY · LESSON 6", "body": ["Courage is behavior", "Fear may remain", "Values give direction", "Choice protects ownership"], "narration": "Welcome to Lesson Six: Practicing Courage in Real Life. Courage is often described as a feeling, but clients need a usable definition. Courage is a chosen action in service of something meaningful while uncertainty, discomfort, or possible disappointment remains. The client does not have to feel fearless. She needs enough steadiness to choose. The coach helps her clarify what matters, understand the risk, prepare responsibly, and retain ownership of the action. We do not manufacture dramatic moments or decide which risks another person should take.", "lenses": [{"insight": "Courage becomes useful when it moves from admiration into observable behavior.", "prompt": "What action would make this value visible?"}, {"insight": "Courage becomes useful when it moves from admiration into observable behavior.", "prompt": "What action would make this value visible?"}, {"insight": "Courage becomes useful when it moves from admiration into observable behavior.", "prompt": "What action would make this value visible?"}, {"insight": "Courage becomes useful when it moves from admiration into observable behavior.", "prompt": "What action would make this value visible?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Define proportionate courage", "Map fear and uncertainty", "Prepare courageous communication", "Review evidence and learning"], "narration": "This lesson moves from concept to practice. You will learn to distinguish courage from impulsivity, compliance, emotional performance, and unsafe exposure. You will map the moment when fear begins to organize behavior, develop a courage range instead of demanding one heroic leap, and prepare language for requests, boundaries, visibility, and repair. Six interactive decisions, Elena's workplace case, a guided workbook, practical assignments, and a graded quiz will help you use the material with beginning clients while preserving coaching scope.", "lenses": [{"insight": "A dependable process lowers the coach's need to push or rescue.", "prompt": "Which part of courageous action needs clarity first?"}, {"insight": "A dependable process lowers the coach's need to push or rescue.", "prompt": "Which part of courageous action needs clarity first?"}, {"insight": "A dependable process lowers the coach's need to push or rescue.", "prompt": "Which part of courageous action needs clarity first?"}, {"insight": "A dependable process lowers the coach's need to push or rescue.", "prompt": "Which part of courageous action needs clarity first?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Courage is values-aligned action under uncertainty", "kicker": "A PRACTICAL DEFINITION", "body": ["Something meaningful is at stake", "The outcome is not guaranteed", "The action is chosen", "The risk is considered"], "narration": "Courage includes four elements. Something meaningful is at stake. The outcome cannot be guaranteed. The client chooses the action rather than being pressured into it. And the practical, emotional, relational, cultural, or financial risks have been considered. This definition prevents courage from becoming a slogan. Leaving a job may be courageous, impulsive, necessary, or unsafe depending on context. Staying may also be courageous if it involves a clear boundary or thoughtful plan. The coach explores meaning and consequence rather than praising a particular direction.", "lenses": [{"insight": "The same behavior can have a different meaning in a different context.", "prompt": "What makes this action courageous for this client at this time?"}, {"insight": "The same behavior can have a different meaning in a different context.", "prompt": "What makes this action courageous for this client at this time?"}, {"insight": "The same behavior can have a different meaning in a different context.", "prompt": "What makes this action courageous for this client at this time?"}, {"insight": "The same behavior can have a different meaning in a different context.", "prompt": "What makes this action courageous for this client at this time?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Fear does not disqualify courage", "kicker": "READINESS IS NOT PERFECT COMFORT", "body": ["Fear can carry information", "Anxiety can coexist with choice", "Preparation can support steadiness", "Action can remain small"], "narration": "Clients often wait to feel completely ready. Yet meaningful action may continue to produce a racing heart, self-doubt, or an urge to postpone. The goal is not to erase every feeling. Help the client ask whether the fear contains practical information, an old prediction, or both. Then identify what preparation would create enough steadiness. Courage can be quiet: sending one email, naming one preference, requesting fifteen minutes, showing an unfinished draft, or saying that more time is needed. Small does not mean insignificant.", "lenses": [{"insight": "Readiness means enough capacity and choice—not the total absence of discomfort.", "prompt": "What would help you carry this feeling without letting it make the entire decision?"}, {"insight": "Readiness means enough capacity and choice—not the total absence of discomfort.", "prompt": "What would help you carry this feeling without letting it make the entire decision?"}, {"insight": "Readiness means enough capacity and choice—not the total absence of discomfort.", "prompt": "What would help you carry this feeling without letting it make the entire decision?"}, {"insight": "Readiness means enough capacity and choice—not the total absence of discomfort.", "prompt": "What would help you carry this feeling without letting it make the entire decision?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "question", "title": "Checkpoint 1 · Courage or pressure?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says she is not ready to confront a family member today. Which response best supports courage?", "options": ["If you were truly courageous, you would do it now", "What would help you decide whether the next step is preparation, a smaller action, or no action today?", "Avoidance always grows, so act before thinking"], "correct": 1, "feedback": ["This turns courage into shame and removes ownership.", "Correct. It preserves choice while exploring preparation, proportion, and timing.", "Urgency without context can increase risk and pressure."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says she is not ready to confront a family member today. Which response best supports courage?", "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "teaching", "title": "Comfort and integrity are not the same", "kicker": "WHAT DOES THE CLIENT WANT TO PROTECT?", "body": ["Comfort reduces immediate distress", "Integrity aligns behavior with values", "Both deserve information", "Tradeoffs should be named"], "narration": "A client may say, I just want to feel comfortable. Comfort is a legitimate need, especially after stress. But comfort and integrity are not always identical. Avoiding a request may reduce anxiety tonight while increasing resentment next month. Speaking immediately may feel honest while ignoring timing or safety. Help the client see the tradeoff without making discomfort morally superior. Ask what immediate comfort protects, what value is asking for expression, and what cost each option carries. Courage is an informed choice, not worship of difficulty.", "lenses": [{"insight": "Discomfort is not proof that an action is right; comfort is not proof that avoidance is wise.", "prompt": "Which choice leaves you more able to respect yourself afterward?"}, {"insight": "Discomfort is not proof that an action is right; comfort is not proof that avoidance is wise.", "prompt": "Which choice leaves you more able to respect yourself afterward?"}, {"insight": "Discomfort is not proof that an action is right; comfort is not proof that avoidance is wise.", "prompt": "Which choice leaves you more able to respect yourself afterward?"}, {"insight": "Discomfort is not proof that an action is right; comfort is not proof that avoidance is wise.", "prompt": "Which choice leaves you more able to respect yourself afterward?"}], "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Use the Courage Decision Map", "kicker": "VALUE → FEAR → CHOICE → SUPPORT → ACTION", "body": ["Name the value", "Name the feared outcome", "List real choices", "Design support and action"], "narration": "The Roux Life Courage Decision Map provides a simple sequence. First, identify the value: honesty, dignity, connection, responsibility, creativity, or fairness. Second, name the feared outcome in plain language. Third, list genuine choices, including waiting, gathering information, setting a limit, asking, declining, or leaving. Fourth, identify support and safeguards. Finally, choose a specific action the client owns. The map keeps courage connected to meaning and consequence rather than turning it into a performance for the coach.", "lenses": [{"insight": "A framework should expand the client's choices, not funnel her toward the coach's preferred answer.", "prompt": "Where in this map is the client currently stuck?"}, {"insight": "A framework should expand the client's choices, not funnel her toward the coach's preferred answer.", "prompt": "Where in this map is the client currently stuck?"}, {"insight": "A framework should expand the client's choices, not funnel her toward the coach's preferred answer.", "prompt": "Where in this map is the client currently stuck?"}, {"insight": "A framework should expand the client's choices, not funnel her toward the coach's preferred answer.", "prompt": "Where in this map is the client currently stuck?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Separate possibility from probability", "kicker": "FEAR OFTEN SPEAKS IN CERTAINTIES", "body": ["What could happen?", "What is likely?", "What evidence exists?", "What could the client do next?"], "narration": "Fear often converts a possible outcome into a guaranteed one: If I ask for help, they will think I am incapable. Do not argue the client out of fear. Separate possibility from probability. What could happen? What seems most likely based on evidence? What other responses are possible? If the feared response occurs, what options remain? This is not forced optimism. It is a more complete review of reality. The client learns to prepare for uncertainty without treating the worst prediction as settled fact.", "lenses": [{"insight": "Courage grows when the client can hold risk and possibility in the same picture.", "prompt": "What evidence supports this prediction, and what evidence complicates it?"}, {"insight": "Courage grows when the client can hold risk and possibility in the same picture.", "prompt": "What evidence supports this prediction, and what evidence complicates it?"}, {"insight": "Courage grows when the client can hold risk and possibility in the same picture.", "prompt": "What evidence supports this prediction, and what evidence complicates it?"}, {"insight": "Courage grows when the client can hold risk and possibility in the same picture.", "prompt": "What evidence supports this prediction, and what evidence complicates it?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Locate the controllable part", "kicker": "PARTICIPATION, NOT OUTCOME CONTROL", "body": ["Words and timing", "Preparation and boundary", "Response and recovery", "Other people remain autonomous"], "narration": "Clients often want certainty about another person's response before acting. The coach cannot promise that a manager will approve, a partner will understand, or an audience will applaud. Help the client locate the controllable part: what she says, when and where she says it, the tone she uses, the request she makes, the boundary she maintains, and how she will care for herself afterward. The response belongs to the other person. Courage is measured by intentional participation and learning, not by controlling another adult.", "lenses": [{"insight": "The client owns the action; reality and other people still have a vote.", "prompt": "What can you prepare well without pretending you can control the response?"}, {"insight": "The client owns the action; reality and other people still have a vote.", "prompt": "What can you prepare well without pretending you can control the response?"}, {"insight": "The client owns the action; reality and other people still have a vote.", "prompt": "What can you prepare well without pretending you can control the response?"}, {"insight": "The client owns the action; reality and other people still have a vote.", "prompt": "What can you prepare well without pretending you can control the response?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Build a courage range, not one heroic leap", "kicker": "SMALL · MODERATE · STRETCH", "body": ["Small practice", "Moderate conversation", "Stretch action", "A stop point remains available"], "narration": "Create three versions of the action. A small practice may be writing the request or sharing it with a trusted person. A moderate step may be sending a meeting invitation or naming one concern. A stretch action may be holding the full conversation or presenting the idea publicly. The client chooses the appropriate range based on readiness, consequence, and support. This builds behavioral flexibility. It also prevents the coach from treating the largest possible action as the only authentic one.", "lenses": [{"insight": "Graduated practice makes courage repeatable rather than theatrical.", "prompt": "What is one step beyond habit but still within responsible capacity?"}, {"insight": "Graduated practice makes courage repeatable rather than theatrical.", "prompt": "What is one step beyond habit but still within responsible capacity?"}, {"insight": "Graduated practice makes courage repeatable rather than theatrical.", "prompt": "What is one step beyond habit but still within responsible capacity?"}, {"insight": "Graduated practice makes courage repeatable rather than theatrical.", "prompt": "What is one step beyond habit but still within responsible capacity?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "question", "title": "Checkpoint 2 · Choose proportion", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client wants to speak at a large public meeting but has never shared the concern with anyone. What is the strongest coaching move?", "options": ["Insist on the public statement because courage requires a leap", "Explore the goal, consequences, support, and a graduated practice before she chooses", "Tell her public speaking is outside coaching"], "correct": 1, "feedback": ["The largest action is not automatically the wisest one.", "Correct. Preparation and proportion support ownership without deciding for her.", "Public communication can fit coaching when safety and scope are appropriate."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client wants to speak at a large public meeting but has never shared the concern with anyone. What is the strongest coaching move?", "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "teaching", "title": "A courageous request has four parts", "kicker": "OBSERVATION · IMPACT · VALUE OR NEED · REQUEST", "body": ["Describe without accusation", "Name the effect", "Connect to what matters", "Ask for something specific"], "narration": "A useful request begins with an observable situation rather than a character judgment. Then the client names the impact, identifies the relevant value or need, and makes a specific request. For example: We added two weekly reports this quarter. I am working beyond the agreed schedule and quality is becoming harder to protect. I value reliable work and sustainable expectations. Could we review priorities and remove or reassign one report? This structure supports clarity while leaving room for dialogue.", "lenses": [{"insight": "Clear language reduces mind reading; it does not guarantee agreement.", "prompt": "What could this client request that another person can understand and answer?"}, {"insight": "Clear language reduces mind reading; it does not guarantee agreement.", "prompt": "What could this client request that another person can understand and answer?"}, {"insight": "Clear language reduces mind reading; it does not guarantee agreement.", "prompt": "What could this client request that another person can understand and answer?"}, {"insight": "Clear language reduces mind reading; it does not guarantee agreement.", "prompt": "What could this client request that another person can understand and answer?"}], "audio": "audio_scene_12.mp3", "image": "assets_scene_12.webp"}, {"kind": "teaching", "title": "Observation is not accusation", "kicker": "DESCRIBE WHAT A CAMERA COULD NOTICE", "body": ["Specific event", "Neutral language", "Relevant timeframe", "No hidden verdict"], "narration": "When clients are hurt, their first sentence may contain a conclusion: You never respect me. The coach can honor the emotion while helping them identify observable evidence. What happened, when, and how often? What words or actions would a camera have recorded? Observation does not make the client emotionally flat. It gives the conversation a shared starting point. Compare: You do not care about my work, with: In the last three meetings, my proposal was discussed after I was asked to leave.", "lenses": [{"insight": "Specificity makes courage easier to hear.", "prompt": "What fact can open the conversation without pretending the impact was small?"}, {"insight": "Specificity makes courage easier to hear.", "prompt": "What fact can open the conversation without pretending the impact was small?"}, {"insight": "Specificity makes courage easier to hear.", "prompt": "What fact can open the conversation without pretending the impact was small?"}, {"insight": "Specificity makes courage easier to hear.", "prompt": "What fact can open the conversation without pretending the impact was small?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.webp"}, {"kind": "teaching", "title": "Name impact without assigning motive", "kicker": "THIS IS WHAT HAPPENED FOR ME", "body": ["Practical effect", "Emotional effect", "Relational effect", "No mind reading"], "narration": "Impact explains why the issue matters. The client may name lost time, confusion, resentment, disconnection, fatigue, or reduced trust. Encourage ownership language: I felt dismissed, rather than, You tried to humiliate me. The second statement assigns motive the client cannot know with certainty. Naming impact is not weakness or blame. It gives the other person information and helps the client remain connected to her own experience without turning interpretation into fact.", "lenses": [{"insight": "Impact belongs in the conversation; assumed intent belongs in exploration.", "prompt": "How can you name the effect without claiming to know why the other person acted?"}, {"insight": "Impact belongs in the conversation; assumed intent belongs in exploration.", "prompt": "How can you name the effect without claiming to know why the other person acted?"}, {"insight": "Impact belongs in the conversation; assumed intent belongs in exploration.", "prompt": "How can you name the effect without claiming to know why the other person acted?"}, {"insight": "Impact belongs in the conversation; assumed intent belongs in exploration.", "prompt": "How can you name the effect without claiming to know why the other person acted?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.webp"}, {"kind": "teaching", "title": "Ask clearly enough to receive an answer", "kicker": "A REQUEST IS NOT A TEST", "body": ["Specific behavior", "Reasonable timeframe", "Room for response", "A plan if the answer is no"], "narration": "Indirect requests invite confusion. A client may hope someone will notice exhaustion, infer a need, and volunteer support. Courage may mean asking directly. The request should describe a behavior or decision, include a timeframe when useful, and allow the other person to answer. It should not be a hidden test of love or loyalty. Prepare for yes, no, negotiation, delay, or a request for more information. A clear request protects dignity even when the response is imperfect.", "lenses": [{"insight": "Clarity is kinder than requiring another person to guess correctly.", "prompt": "What exactly are you asking this person to do, decide, or discuss?"}, {"insight": "Clarity is kinder than requiring another person to guess correctly.", "prompt": "What exactly are you asking this person to do, decide, or discuss?"}, {"insight": "Clarity is kinder than requiring another person to guess correctly.", "prompt": "What exactly are you asking this person to do, decide, or discuss?"}, {"insight": "Clarity is kinder than requiring another person to guess correctly.", "prompt": "What exactly are you asking this person to do, decide, or discuss?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.webp"}, {"kind": "teaching", "title": "Boundaries define the client's participation", "kicker": "IF THIS CONTINUES, I WILL…", "body": ["Name the limit", "Choose an action the client controls", "Communicate when appropriate", "Follow through consistently"], "narration": "A boundary is different from a demand. It defines what the client will do to protect time, wellbeing, dignity, or responsibility. If meetings continue after six, I will leave at six and review notes the next morning. The client cannot use a boundary to control another adult: You must stop being angry. Help her choose a realistic action within her authority and consider consequences. Courageous boundaries are clear, proportionate, and connected to values rather than punishment.", "lenses": [{"insight": "A boundary becomes credible through the client's follow-through, not the intensity of the wording.", "prompt": "What action is within your control if the pattern continues?"}, {"insight": "A boundary becomes credible through the client's follow-through, not the intensity of the wording.", "prompt": "What action is within your control if the pattern continues?"}, {"insight": "A boundary becomes credible through the client's follow-through, not the intensity of the wording.", "prompt": "What action is within your control if the pattern continues?"}, {"insight": "A boundary becomes credible through the client's follow-through, not the intensity of the wording.", "prompt": "What action is within your control if the pattern continues?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.webp"}, {"kind": "question", "title": "Checkpoint 3 · Request or demand?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is the clearest client-owned boundary?", "options": ["You are not allowed to criticize me again", "If the conversation includes insults, I will pause it and return when we can speak respectfully", "You need to understand my feelings"], "correct": 1, "feedback": ["This attempts to control another person's future behavior.", "Correct. It names the condition and an action the client controls.", "Understanding may be desired, but it cannot be commanded."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement is the clearest client-owned boundary?", "audio": "audio_scene_17.mp3", "image": "assets_scene_17.webp"}, {"kind": "teaching", "title": "Asking for support is a courage practice", "kicker": "CAPABILITY AND NEED CAN COEXIST", "body": ["Name the task", "Name the support", "Preserve choice", "Receive without apology"], "narration": "Many capable clients believe that needing support will erase competence. They overfunction until resentment or exhaustion appears. Help the client identify a specific task, the support requested, and why it matters. She might ask a colleague to review a proposal, a partner to manage one appointment, or a friend to listen without solving. The request should preserve the other person's choice, and the client can prepare to receive help without excessive apology. Interdependence is not helplessness.", "lenses": [{"insight": "Courage may look like allowing another person to contribute.", "prompt": "What support would make responsible action more sustainable?"}, {"insight": "Courage may look like allowing another person to contribute.", "prompt": "What support would make responsible action more sustainable?"}, {"insight": "Courage may look like allowing another person to contribute.", "prompt": "What support would make responsible action more sustainable?"}, {"insight": "Courage may look like allowing another person to contribute.", "prompt": "What support would make responsible action more sustainable?"}], "audio": "audio_scene_18.mp3", "image": "assets_scene_18.webp"}, {"kind": "teaching", "title": "Being seen before certainty arrives", "kicker": "VISIBILITY WITHOUT PERFECTION", "body": ["Share a draft", "Name an idea", "Ask a question", "Let learning be visible"], "narration": "Visibility can feel dangerous when worth has been tied to polished performance. A client may wait until an idea is flawless before speaking, which prevents feedback and keeps her contribution hidden. Courage practice can involve showing an early draft, asking a question in a meeting, applying before feeling fully qualified, or naming uncertainty alongside preparation. The goal is not careless exposure. It is learning to participate before certainty and perfection are complete.", "lenses": [{"insight": "Visibility is a skill that can be practiced in tolerable, useful doses.", "prompt": "What could you let others see while it is still becoming?"}, {"insight": "Visibility is a skill that can be practiced in tolerable, useful doses.", "prompt": "What could you let others see while it is still becoming?"}, {"insight": "Visibility is a skill that can be practiced in tolerable, useful doses.", "prompt": "What could you let others see while it is still becoming?"}, {"insight": "Visibility is a skill that can be practiced in tolerable, useful doses.", "prompt": "What could you let others see while it is still becoming?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "Tolerating uncertainty requires an anchor", "kicker": "STEADY DOES NOT MEAN CERTAIN", "body": ["Return to the value", "Regulate the body", "Use grounded self-talk", "Choose the next controllable step"], "narration": "Uncertainty often creates repeated checking, reassurance seeking, overexplaining, or postponement. The client needs an anchor rather than a guarantee. She can return to the value, slow her breathing, feel her feet on the floor, name what she knows, and choose the next controllable step. In coaching, regulation practices should remain simple and nonclinical. Persistent panic, severe dysregulation, trauma symptoms, or significant impairment may require licensed support.", "lenses": [{"insight": "The aim is enough steadiness for choice, not a promise that nothing difficult will happen.", "prompt": "What helps you return to the present when your mind races toward every possible outcome?"}, {"insight": "The aim is enough steadiness for choice, not a promise that nothing difficult will happen.", "prompt": "What helps you return to the present when your mind races toward every possible outcome?"}, {"insight": "The aim is enough steadiness for choice, not a promise that nothing difficult will happen.", "prompt": "What helps you return to the present when your mind races toward every possible outcome?"}, {"insight": "The aim is enough steadiness for choice, not a promise that nothing difficult will happen.", "prompt": "What helps you return to the present when your mind races toward every possible outcome?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.webp"}, {"kind": "teaching", "title": "Self-validation before external response", "kicker": "MY EXPERIENCE CAN MATTER BEFORE AGREEMENT", "body": ["Name the feeling", "Name why it makes sense", "Honor the need or value", "Accept uncertainty"], "narration": "Clients sometimes need another person to agree before they allow their own experience to count. Self-validation creates a steadier starting point: I feel nervous because this relationship matters. My need for clarity is legitimate. I can communicate respectfully even if the response is disappointing. This is not declaring the client correct about every interpretation. It is acknowledging the internal experience and values without outsourcing all legitimacy. The client can remain open to new evidence while still treating herself with dignity.", "lenses": [{"insight": "Validation is not a verdict; it is permission to notice and respond responsibly.", "prompt": "What can you recognize as real before anyone else confirms it?"}, {"insight": "Validation is not a verdict; it is permission to notice and respond responsibly.", "prompt": "What can you recognize as real before anyone else confirms it?"}, {"insight": "Validation is not a verdict; it is permission to notice and respond responsibly.", "prompt": "What can you recognize as real before anyone else confirms it?"}, {"insight": "Validation is not a verdict; it is permission to notice and respond responsibly.", "prompt": "What can you recognize as real before anyone else confirms it?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "question", "title": "Checkpoint 4 · Support uncertainty", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client asks, “Can you promise my manager will respect me if I speak up?” What is the best response?", "options": ["Yes, respectful honesty always works", "I cannot promise the response. We can prepare what you control and how you will care for yourself across possible outcomes", "If you are worried, remain silent"], "correct": 1, "feedback": ["No coach can guarantee another person's behavior.", "Correct. It names uncertainty while offering preparation and support.", "Fear deserves exploration, not an automatic instruction to avoid."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client asks, “Can you promise my manager will respect me if I speak up?” What is the best response?", "audio": "audio_scene_22.mp3", "image": "assets_scene_22.webp"}, {"kind": "teaching", "title": "Prepare without scripting humanity out", "kicker": "KEY POINTS, NOT A PERFECT PERFORMANCE", "body": ["Opening sentence", "Two essential facts", "Clear request", "Pause and listen"], "narration": "Over-rehearsal can become another form of control. Help the client prepare an opening sentence, two essential facts, a request, and a boundary or follow-up. Then practice pausing and listening. The conversation may move in an unexpected direction. A flexible outline allows the client to remain present instead of trying to force a memorized speech. Role-play can reveal confusing language, hidden accusations, or places where the client needs more information.", "lenses": [{"insight": "Preparation should support presence, not replace it.", "prompt": "What are the few sentences you want to remember even if the conversation changes?"}, {"insight": "Preparation should support presence, not replace it.", "prompt": "What are the few sentences you want to remember even if the conversation changes?"}, {"insight": "Preparation should support presence, not replace it.", "prompt": "What are the few sentences you want to remember even if the conversation changes?"}, {"insight": "Preparation should support presence, not replace it.", "prompt": "What are the few sentences you want to remember even if the conversation changes?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.webp"}, {"kind": "teaching", "title": "Elena's case: the presenting concern", "kicker": "REALISTIC COACHING SCENARIO", "body": ["Unsustainable workload", "Fear of being judged", "Loyalty to the team", "A request has not been made"], "narration": "Elena says, I need to be more courageous with my manager. She has absorbed two additional reporting responsibilities and now works most weekends. She fears that asking for support will make her appear incapable or ungrateful. She also cares deeply about the team and does not want colleagues to inherit an impossible workload. The coach begins with recognition, not advice. What happened? What matters? What does Elena fear? What options has she considered? The goal is to understand the decision before designing the conversation.", "lenses": [{"insight": "The presenting request for courage contains values, predictions, practical constraints, and relationships.", "prompt": "What does Elena want to protect besides her own comfort?"}, {"insight": "The presenting request for courage contains values, predictions, practical constraints, and relationships.", "prompt": "What does Elena want to protect besides her own comfort?"}, {"insight": "The presenting request for courage contains values, predictions, practical constraints, and relationships.", "prompt": "What does Elena want to protect besides her own comfort?"}, {"insight": "The presenting request for courage contains values, predictions, practical constraints, and relationships.", "prompt": "What does Elena want to protect besides her own comfort?"}], "audio": "audio_scene_24.mp3", "image": "assets_scene_24.webp"}, {"kind": "teaching", "title": "Elena's courage map", "kicker": "VALUE → FEAR → CHOICE → SUPPORT → ACTION", "body": ["Quality and sustainability", "Fear of appearing incapable", "Priorities, resources, or limits", "Prepare evidence and a request"], "narration": "Elena names quality, responsibility, and health as relevant values. Her feared outcome is being labeled incapable. Her choices include continuing silently, requesting priority clarification, proposing reassignment, asking for temporary help, or setting a weekend boundary. She reviews workload evidence and chooses to request a priority meeting. Support includes rehearsing with a trusted mentor and planning recovery time afterward. The action is specific, but it remains Elena's choice. The coach does not decide whether she should stay in the job.", "lenses": [{"insight": "Courage becomes clearer when the client can see more than endure or quit.", "prompt": "Which option best expresses Elena's values while respecting practical reality?"}, {"insight": "Courage becomes clearer when the client can see more than endure or quit.", "prompt": "Which option best expresses Elena's values while respecting practical reality?"}, {"insight": "Courage becomes clearer when the client can see more than endure or quit.", "prompt": "Which option best expresses Elena's values while respecting practical reality?"}, {"insight": "Courage becomes clearer when the client can see more than endure or quit.", "prompt": "Which option best expresses Elena's values while respecting practical reality?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.webp"}, {"kind": "teaching", "title": "Elena's communication plan", "kicker": "OBSERVATION · IMPACT · VALUE · REQUEST", "body": ["Two reports were added", "Weekend work is now routine", "Quality and sustainability matter", "Review priorities and ownership"], "narration": "Elena prepares: Since the two reports were added in April, I have worked most weekends and delayed two process reviews. I want to protect both quality and a sustainable workload. Could we review the current priorities and decide which responsibility should be delayed, reassigned, or resourced differently? She also prepares a boundary if no priorities change: she will document the competing deadlines and stop treating every item as equally urgent. The language is direct without attacking her manager's character.", "lenses": [{"insight": "The plan connects evidence to impact and gives the other person something concrete to discuss.", "prompt": "Where could Elena shorten the message so the request remains easy to hear?"}, {"insight": "The plan connects evidence to impact and gives the other person something concrete to discuss.", "prompt": "Where could Elena shorten the message so the request remains easy to hear?"}, {"insight": "The plan connects evidence to impact and gives the other person something concrete to discuss.", "prompt": "Where could Elena shorten the message so the request remains easy to hear?"}, {"insight": "The plan connects evidence to impact and gives the other person something concrete to discuss.", "prompt": "Where could Elena shorten the message so the request remains easy to hear?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.webp"}, {"kind": "teaching", "title": "Elena's possible responses", "kicker": "YES · NEGOTIATION · DELAY · DISMISSAL", "body": ["Support is approved", "Priorities are negotiated", "More evidence is requested", "The concern is minimized"], "narration": "Courage planning includes several possible responses. If support is approved, Elena clarifies next steps. If priorities are negotiated, she documents decisions. If the manager asks for evidence, she provides a concise workload record. If the concern is minimized, she can restate the request, document the conversation, seek appropriate organizational guidance, or reconsider what she is willing to sustain. The coach helps Elena think through options without presenting legal, human-resources, or clinical advice beyond competence.", "lenses": [{"insight": "Preparing for more than one response reduces the pressure to control the conversation.", "prompt": "What follow-through remains within Elena's authority after each possible response?"}, {"insight": "Preparing for more than one response reduces the pressure to control the conversation.", "prompt": "What follow-through remains within Elena's authority after each possible response?"}, {"insight": "Preparing for more than one response reduces the pressure to control the conversation.", "prompt": "What follow-through remains within Elena's authority after each possible response?"}, {"insight": "Preparing for more than one response reduces the pressure to control the conversation.", "prompt": "What follow-through remains within Elena's authority after each possible response?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.webp"}, {"kind": "teaching", "title": "Review Elena's courage by evidence", "kicker": "ACTION · RESPONSE · IMPACT · LEARNING", "body": ["Did she speak clearly?", "What actually happened?", "What changed?", "What will she adjust?"], "narration": "After the meeting, do not ask only whether Elena got the answer she wanted. Review the action: Did she communicate the observation, impact, value, and request? Review the response without exaggeration. Review practical and emotional impact. Then identify learning. Perhaps the manager was more receptive than predicted, or perhaps the dismissal confirmed a pattern Elena needs to consider. Courage turns uncertainty into evidence. The evidence supports the next decision; it does not prove Elena's worth.", "lenses": [{"insight": "A courageous action can be successful as practice even when the external answer is no.", "prompt": "What does this result teach Elena that she could not know before acting?"}, {"insight": "A courageous action can be successful as practice even when the external answer is no.", "prompt": "What does this result teach Elena that she could not know before acting?"}, {"insight": "A courageous action can be successful as practice even when the external answer is no.", "prompt": "What does this result teach Elena that she could not know before acting?"}, {"insight": "A courageous action can be successful as practice even when the external answer is no.", "prompt": "What does this result teach Elena that she could not know before acting?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.webp"}, {"kind": "question", "title": "Checkpoint 5 · Evaluate courage", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Elena makes a clear request, but her manager says no. How should the coach evaluate the action?", "options": ["The courage attempt failed because the outcome was negative", "Review Elena's values-aligned participation, the response evidence, the impact, and her next choice", "Tell Elena to resign immediately"], "correct": 1, "feedback": ["Outcome alone does not measure the quality of courageous participation.", "Correct. The result becomes evidence for learning and a client-owned next decision.", "The coach should not take ownership of a major employment decision."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Elena makes a clear request, but her manager says no. How should the coach evaluate the action?", "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "teaching", "title": "Use a post-courage recovery plan", "kicker": "AFTER THE ADRENALINE", "body": ["Pause before overinterpreting", "Connect with grounded support", "Record facts", "Restore ordinary rhythm"], "narration": "After a difficult action, the client may replay every sentence and treat temporary discomfort as proof of disaster. Build a recovery plan in advance. She might take a walk, write the facts before interpretations multiply, speak with a trusted person, avoid sending reactive follow-up messages, and return to sleep, food, movement, or another ordinary routine. This is not avoidance. It protects the learning window. If the client experiences severe or persistent symptoms, coaching should not substitute for clinical care.", "lenses": [{"insight": "Recovery helps the client learn from courage instead of being consumed by the emotional aftershock.", "prompt": "What will help you return to evidence after the conversation?"}, {"insight": "Recovery helps the client learn from courage instead of being consumed by the emotional aftershock.", "prompt": "What will help you return to evidence after the conversation?"}, {"insight": "Recovery helps the client learn from courage instead of being consumed by the emotional aftershock.", "prompt": "What will help you return to evidence after the conversation?"}, {"insight": "Recovery helps the client learn from courage instead of being consumed by the emotional aftershock.", "prompt": "What will help you return to evidence after the conversation?"}], "audio": "audio_scene_30.mp3", "image": "assets_scene_30.webp"}, {"kind": "teaching", "title": "Repair is a form of courage", "kicker": "RETURNING AFTER IMPERFECTION", "body": ["Acknowledge impact", "Own the relevant part", "Clarify intention without hiding behind it", "Ask what repair needs"], "narration": "Courage is not limited to initiating conflict. It may mean returning after the client spoke harshly, avoided a conversation, or misunderstood someone. A useful repair names the impact, owns the relevant behavior, and asks what would help. Intention can be explained without erasing impact: I meant to be direct, and I see that my wording was dismissive. I am sorry. Could we revisit the concern? The coach should not script an apology designed to force forgiveness.", "lenses": [{"insight": "Repair offers accountability; it does not control whether trust is restored.", "prompt": "What can you own clearly without demanding immediate reassurance?"}, {"insight": "Repair offers accountability; it does not control whether trust is restored.", "prompt": "What can you own clearly without demanding immediate reassurance?"}, {"insight": "Repair offers accountability; it does not control whether trust is restored.", "prompt": "What can you own clearly without demanding immediate reassurance?"}, {"insight": "Repair offers accountability; it does not control whether trust is restored.", "prompt": "What can you own clearly without demanding immediate reassurance?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.webp"}, {"kind": "teaching", "title": "Receiving feedback takes courage", "kicker": "LISTEN BEFORE DEFENDING", "body": ["Ask for an example", "Separate data from verdict", "Pause", "Choose what to use"], "narration": "Clients may focus on the courage to speak and overlook the courage to listen. Receiving feedback can trigger explanation, collapse, counterattack, or automatic agreement. Help the client prepare to ask for an example, reflect what was heard, request time, and decide what information is useful. Feedback is data, not a complete definition of identity. The client can disagree respectfully, correct facts, or set a limit on abusive delivery. Openness does not require accepting every judgment.", "lenses": [{"insight": "Courageous listening preserves discernment as well as humility.", "prompt": "What would help you hear the useful part without turning feedback into a verdict on your worth?"}, {"insight": "Courageous listening preserves discernment as well as humility.", "prompt": "What would help you hear the useful part without turning feedback into a verdict on your worth?"}, {"insight": "Courageous listening preserves discernment as well as humility.", "prompt": "What would help you hear the useful part without turning feedback into a verdict on your worth?"}, {"insight": "Courageous listening preserves discernment as well as humility.", "prompt": "What would help you hear the useful part without turning feedback into a verdict on your worth?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.webp"}, {"kind": "teaching", "title": "Courage in relationships includes mutuality", "kicker": "SPEAK · LISTEN · NEGOTIATE · REPAIR", "body": ["Express one truth", "Invite the other perspective", "Negotiate what is possible", "Return when repair is needed"], "narration": "A courageous relationship conversation is not a monologue. The client expresses her experience and request, then makes room for another perspective. Both people may have legitimate needs that cannot be perfectly satisfied. Coaching can help the client distinguish compromise from self-abandonment and disagreement from rejection. She may choose to negotiate, pause, maintain a boundary, or gather more information. The coach supports clarity and agency rather than declaring who is right from a one-sided account.", "lenses": [{"insight": "Connection is not created by winning every conversation.", "prompt": "What would it look like to remain honest and curious at the same time?"}, {"insight": "Connection is not created by winning every conversation.", "prompt": "What would it look like to remain honest and curious at the same time?"}, {"insight": "Connection is not created by winning every conversation.", "prompt": "What would it look like to remain honest and curious at the same time?"}, {"insight": "Connection is not created by winning every conversation.", "prompt": "What would it look like to remain honest and curious at the same time?"}], "audio": "audio_scene_33.mp3", "image": "assets_scene_33.webp"}, {"kind": "teaching", "title": "Power and culture shape the risk", "kicker": "COURAGE IS CONTEXTUAL", "body": ["Authority and dependency", "Financial consequence", "Cultural expectations", "Identity and belonging"], "narration": "The same request can carry different consequences depending on authority, employment, finances, immigration status, caregiving, culture, identity, and community expectations. Do not call a client cowardly because she moves carefully in a high-cost system. Explore the real power structure, available protections, trusted resources, and the client's lived knowledge. Coaching questions should expand options without pretending every person faces equal risk. Specialized legal, workplace, advocacy, or community support may be appropriate.", "lenses": [{"insight": "Respect context before prescribing visibility.", "prompt": "What consequence might this coach overlook because it is not part of her own experience?"}, {"insight": "Respect context before prescribing visibility.", "prompt": "What consequence might this coach overlook because it is not part of her own experience?"}, {"insight": "Respect context before prescribing visibility.", "prompt": "What consequence might this coach overlook because it is not part of her own experience?"}, {"insight": "Respect context before prescribing visibility.", "prompt": "What consequence might this coach overlook because it is not part of her own experience?"}], "audio": "audio_scene_34.mp3", "image": "assets_scene_34.webp"}, {"kind": "teaching", "title": "Safety outranks a courage assignment", "kicker": "DO NOT COACH SOMEONE INTO DANGER", "body": ["Credible violence risk", "Coercive control", "Retaliation or stalking", "Crisis and severe impairment"], "narration": "Do not use courage language to pressure confrontation when credible violence, coercive control, stalking, severe retaliation, crisis, or significant impairment is present. Ordinary communication practice may increase danger. The coach should stay calm, avoid diagnosing, clarify immediate safety within competence, and connect the client with appropriate licensed, emergency, domestic-violence, legal, medical, or other specialized resources. Local requirements vary, so coaches need policies and qualified guidance before a crisis occurs.", "lenses": [{"insight": "Choosing safety, delay, privacy, or specialized support can itself be courageous.", "prompt": "What information changes this from a coaching practice into a safety or referral decision?"}, {"insight": "Choosing safety, delay, privacy, or specialized support can itself be courageous.", "prompt": "What information changes this from a coaching practice into a safety or referral decision?"}, {"insight": "Choosing safety, delay, privacy, or specialized support can itself be courageous.", "prompt": "What information changes this from a coaching practice into a safety or referral decision?"}, {"insight": "Choosing safety, delay, privacy, or specialized support can itself be courageous.", "prompt": "What information changes this from a coaching practice into a safety or referral decision?"}], "audio": "audio_scene_35.mp3", "image": "assets_scene_35.webp"}, {"kind": "question", "title": "Checkpoint 6 · Safety before action", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client reports that her partner monitors her phone and has threatened violence if she seeks help. What should the coach do?", "options": ["Assign a direct confrontation to build confidence", "Prioritize immediate safety and connection with appropriate specialized resources", "Tell her fear is emotional armor"], "correct": 1, "feedback": ["Direct confrontation may increase danger.", "Correct. Safety and specialized support take priority over ordinary courage practice.", "This minimizes credible danger and misuses coaching language."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client reports that her partner monitors her phone and has threatened violence if she seeks help. What should the coach do?", "audio": "audio_scene_36.mp3", "image": "assets_scene_36.webp"}, {"kind": "teaching", "title": "Coach courage without becoming the hero", "kicker": "CLIENT OWNERSHIP IS THE STANDARD", "body": ["Ask before challenging", "Offer choices", "Do not seek dramatic breakthroughs", "Let the client define success"], "narration": "A coach can become attached to the moment when a client finally acts. That attachment may lead to pushing, celebrating risk without context, or taking credit for the result. Ask permission before a direct challenge. Offer more than one pathway. Let the client define what responsible courage means. If she chooses to wait, explore what the waiting serves and what information would change the decision. The coach's role is to strengthen discernment and agency, not produce a dramatic story.", "lenses": [{"insight": "The client is the author; the coach protects the quality of the process.", "prompt": "Am I supporting this client's courage—or my need to see action?"}, {"insight": "The client is the author; the coach protects the quality of the process.", "prompt": "Am I supporting this client's courage—or my need to see action?"}, {"insight": "The client is the author; the coach protects the quality of the process.", "prompt": "Am I supporting this client's courage—or my need to see action?"}, {"insight": "The client is the author; the coach protects the quality of the process.", "prompt": "Am I supporting this client's courage—or my need to see action?"}], "audio": "audio_scene_37.mp3", "image": "assets_scene_37.webp"}, {"kind": "teaching", "title": "The Courage Practice Loop", "kicker": "CLARIFY → CHOOSE → PREPARE → ACT → REVIEW", "body": ["Clarify value and reality", "Choose proportion", "Prepare support and words", "Act and review evidence"], "narration": "Bring the lesson together with the Courage Practice Loop. Clarify the value, facts, fear, context, and scope. Choose a proportionate action the client owns. Prepare words, support, boundaries, and recovery. Act when and if the client chooses. Review the evidence, response, impact, and learning. The loop can be repeated. A small action may lead to a larger one, a different boundary, more information, or a referral. Courage becomes a practice of responsible participation rather than a single performance.", "lenses": [{"insight": "Repeated practice builds capability because each action produces new evidence.", "prompt": "Which stage of the loop deserves more attention before this client proceeds?"}, {"insight": "Repeated practice builds capability because each action produces new evidence.", "prompt": "Which stage of the loop deserves more attention before this client proceeds?"}, {"insight": "Repeated practice builds capability because each action produces new evidence.", "prompt": "Which stage of the loop deserves more attention before this client proceeds?"}, {"insight": "Repeated practice builds capability because each action produces new evidence.", "prompt": "Which stage of the loop deserves more attention before this client proceeds?"}], "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Final reflection", "kicker": "FROM KNOWING TO PRACTICING", "body": ["What value needs expression?", "What fear is present?", "What action is proportionate?", "What support and boundary are needed?"], "narration": "Choose one manageable situation from your own life or coaching practice. Name the value asking for expression. Describe the feared outcome without treating it as certain. List at least three choices. Select a proportionate action, the support you need, and the boundary that protects responsible participation. Then decide how you will review evidence afterward. Use a nonclinical example. If the situation involves danger, crisis, severe symptoms, or specialized advice, choose another practice and identify the appropriate referral.", "lenses": [{"insight": "Courage becomes teachable when reflection leads to a specific, owned experiment.", "prompt": "What is your next honest and responsible step?"}, {"insight": "Courage becomes teachable when reflection leads to a specific, owned experiment.", "prompt": "What is your next honest and responsible step?"}, {"insight": "Courage becomes teachable when reflection leads to a specific, owned experiment.", "prompt": "What is your next honest and responsible step?"}, {"insight": "Courage becomes teachable when reflection leads to a specific, owned experiment.", "prompt": "What is your next honest and responsible step?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "Lesson 6 recap", "kicker": "THE ROUX LIFE STANDARD", "body": ["Values before performance", "Proportion before pressure", "Preparation without control", "Evidence after action"], "narration": "Courage is values-aligned action under uncertainty. It can include a request, boundary, question, repair, act of visibility, or decision to seek support. The coach helps the client separate possibility from probability, identify what is controllable, choose a proportionate step, prepare clear language, and review evidence after action. We never guarantee outcomes, force disclosure, ignore power and culture, or coach someone into danger. Complete the learning lab, workbook, application assignment, and twelve-question quiz. A score of at least eighty percent is required.", "lenses": [{"insight": "Clarity, courage, responsibility, and meaningful action belong together.", "prompt": "How will you recognize courage without turning it into pressure?"}, {"insight": "Clarity, courage, responsibility, and meaningful action belong together.", "prompt": "How will you recognize courage without turning it into pressure?"}, {"insight": "Clarity, courage, responsibility, and meaningful action belong together.", "prompt": "How will you recognize courage without turning it into pressure?"}, {"insight": "Clarity, courage, responsibility, and meaningful action belong together.", "prompt": "How will you recognize courage without turning it into pressure?"}], "audio": "audio_scene_40.mp3", "image": "assets_scene_40.webp"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;

const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';

function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 6</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 6</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Practicing Courage in Real Life';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson6PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);

document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};

document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
