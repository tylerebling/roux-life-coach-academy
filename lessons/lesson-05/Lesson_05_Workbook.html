<!doctype html><meta charset=utf-8><title>Lesson 5 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 5 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Courage and Armor Map</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Low-stakes situation</strong><small>Choose a manageable situation involving honest expression.</small><textarea id="situation" rows="4"></textarea></label><label><strong>2. Cue</strong><small>What happened just before protection appeared?</small><textarea id="cue" rows="4"></textarea></label><label><strong>3. Feared outcome</strong><small>What did you fear others would think, feel, or do?</small><textarea id="fear" rows="4"></textarea></label><label><strong>4. Protective strategy</strong><small>What did you do, avoid, perfect, joke about, control, or minimize?</small><textarea id="armor" rows="4"></textarea></label><label><strong>5. Immediate relief</strong><small>What became safer or easier in the moment?</small><textarea id="relief" rows="4"></textarea></label><label><strong>6. Longer-term cost</strong><small>What connection, energy, feedback, or self-trust did the pattern cost?</small><textarea id="cost" rows="4"></textarea></label><label><strong>7. Courage value</strong><small>What value would honest action express?</small><textarea id="value" rows="4"></textarea></label><label><strong>8. Trust evidence</strong><small>What has the person or setting earned through behavior?</small><textarea id="trust" rows="4"></textarea></label><label><strong>9. Readiness and boundary</strong><small>What condition or limit would support steadiness?</small><textarea id="capacity" rows="4"></textarea></label><label><strong>10. Relevant honest words</strong><small>Write one observation, impact, need or value, and request.</small><textarea id="words" rows="4"></textarea></label><label><strong>11. Review plan</strong><small>How will you evaluate evidence, impact, and learning?</small><textarea id="review" rows="4"></textarea></label><label><strong>12. Scope check</strong><small>What would require clinical, crisis, medical, legal, domestic-violence, or other specialized support?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
