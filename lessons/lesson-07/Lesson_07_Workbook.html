<!doctype html><meta charset=utf-8><title>Lesson 7 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 7 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Shame-to-Responsibility Map</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Observable event</strong><small>Describe what happened without identity labels or assumed motives.</small><textarea id="event" rows="4"></textarea></label><label><strong>2. Impact</strong><small>What practical, emotional, relational, or ethical effect occurred?</small><textarea id="impact" rows="4"></textarea></label><label><strong>3. Identity verdict</strong><small>What did the event seem to prove about your whole self?</small><textarea id="verdict" rows="4"></textarea></label><label><strong>4. Critic message</strong><small>Write the exact recurring message.</small><textarea id="critic" rows="4"></textarea></label><label><strong>5. Promised protection</strong><small>What does harshness promise to prevent or secure?</small><textarea id="promise" rows="4"></textarea></label><label><strong>6. Protective response</strong><small>Did you hide, please, perfect, blame, overwork, withdraw, or seek reassurance?</small><textarea id="response" rows="4"></textarea></label><label><strong>7. Longer-term cost</strong><small>What learning, connection, energy, or repair did the response block?</small><textarea id="cost" rows="4"></textarea></label><label><strong>8. Realistic responsibility</strong><small>What behavior and impact are actually yours?</small><textarea id="responsibility" rows="4"></textarea></label><label><strong>9. Repair</strong><small>What apology, restitution, correction, boundary, or system change is appropriate?</small><textarea id="repair" rows="4"></textarea></label><label><strong>10. Compassionate accountability statement</strong><small>Write fact, impact, humanity, responsibility, and next step.</small><textarea id="compassion" rows="4"></textarea></label><label><strong>11. Broader evidence</strong><small>What pattern, context, exceptions, and trend create a fairer conclusion?</small><textarea id="evidence" rows="4"></textarea></label><label><strong>12. Scope check</strong><small>What would require licensed, emergency, medical, legal, addiction, abuse, or other specialized support?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
