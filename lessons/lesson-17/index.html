:hover{background:rgba(39,70,48,.96);transform:translateY(-2px)}

<script>
const scenes=[{"kind": "teaching", "title": "The conversation is the instrument", "kicker": "ROUX LIFE ACADEMY · LESSON 17", "body": ["Presence creates room", "Listening reveals meaning", "Reflection makes patterns audible", "Questions return choice to the client"], "narration": "The coach does not need the most impressive answer in the room. The coach creates a conversation in which the client can notice what is true, examine what matters, and choose responsibly. Presence, listening, reflection, and inquiry work together. Technique without presence feels mechanical; warmth without purpose can remain merely pleasant.", "lenses": [{"insight": "Presence creates room", "prompt": "What is the coach noticing?"}, {"insight": "Listening reveals meaning", "prompt": "What meaning might deserve reflection?"}, {"insight": "Reflection makes patterns audible", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Questions return choice to the client", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Prepare the coach", "Listen beneath content", "Reflect with accuracy", "Ask questions that create movement"], "narration": "We begin with the inner stance of the coach. Then we learn levels of listening, verbal and nonverbal observation, reflection, summarizing, silence, question design, challenge, sequencing, and action. Six decision points let you practice the difference between curiosity and control before applying the full method to Alicia's case.", "lenses": [{"insight": "Prepare the coach", "prompt": "What is the coach noticing?"}, {"insight": "Listen beneath content", "prompt": "What meaning might deserve reflection?"}, {"insight": "Reflect with accuracy", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Ask questions that create movement", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Presence begins before the first question", "kicker": "ARRIVE BEFORE YOU LEAD", "body": ["Settle the body", "Release the need to impress", "Remember the client's agenda", "Choose curiosity over certainty"], "narration": "Presence is the capacity to bring attention to this client in this moment. Before a session, the coach can close other tasks, notice their own state, take a grounded breath, and recall the client's ownership. The goal is not perfect calm. It is enough awareness to avoid making the client's conversation serve the coach's anxiety.", "lenses": [{"insight": "Settle the body", "prompt": "What is the coach noticing?"}, {"insight": "Release the need to impress", "prompt": "What meaning might deserve reflection?"}, {"insight": "Remember the client's agenda", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Choose curiosity over certainty", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Notice the coach's internal noise", "kicker": "SELF-AWARENESS PROTECTS LISTENING", "body": ["Planning the next question", "Comparing with personal experience", "Wanting to rescue", "Reacting to approval or discomfort"], "narration": "Coaches have thoughts and reactions. Professionalism does not require pretending otherwise. It requires noticing when attention shifts toward advice, performance, rescue, or personal history and returning to the client. Persistent activation, bias, or countertransference-like reactions may require supervision, consultation, or referral rather than improvisation.", "lenses": [{"insight": "Planning the next question", "prompt": "What is the coach noticing?"}, {"insight": "Comparing with personal experience", "prompt": "What meaning might deserve reflection?"}, {"insight": "Wanting to rescue", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Reacting to approval or discomfort", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Listen for the client's desired use of time", "kicker": "WHAT WOULD BE USEFUL TODAY?", "body": ["Clarify the focus", "Define a useful outcome", "Check importance and readiness", "Allow the focus to evolve with consent"], "narration": "A session needs direction without rigidity. Asking what would be useful today helps the client define the focus. A useful outcome may be clarity, a decision, preparation, a boundary, an experiment, or accountability. If deeper material emerges, the coach names the shift and checks whether the client wants to follow it.", "lenses": [{"insight": "Clarify the focus", "prompt": "What is the coach noticing?"}, {"insight": "Define a useful outcome", "prompt": "What meaning might deserve reflection?"}, {"insight": "Check importance and readiness", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Allow the focus to evolve with consent", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Establish the focus", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client begins with five unrelated problems. What is the strongest first response?", "options": ["Choose the most serious problem for her", "Ask which conversation would make the time most useful today", "Give rapid advice on all five"], "correct": 1, "feedback": ["The coach should not silently choose the agenda.", "Correct. The client identifies the priority and desired use of time.", "Speed does not create a coherent coaching focus."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client begins with five unrelated problems. What is the strongest first response?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Level one: listen for content", "kicker": "WHAT HAPPENED?", "body": ["People and events", "Sequence and decisions", "Facts and interpretations", "Gaps that need clarification"], "narration": "Content listening tracks the story accurately: who was involved, what occurred, when it happened, and what the client concluded. The coach separates reported facts from interpretations without arguing. Content matters, but staying only at the event level can miss the meaning shaping the client's choice.", "lenses": [{"insight": "People and events", "prompt": "What is the coach noticing?"}, {"insight": "Sequence and decisions", "prompt": "What meaning might deserve reflection?"}, {"insight": "Facts and interpretations", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Gaps that need clarification", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Level two: listen for emotion and energy", "kicker": "HOW IS THIS EXPERIENCED?", "body": ["Named feelings", "Tone and pace", "Activation or withdrawal", "Changes when topics shift"], "narration": "The coach listens to emotion that the client names and to changes in tone, pace, volume, or energy. These are observations, not diagnoses. A softer voice may indicate sadness, caution, fatigue, privacy, or nothing clinically significant. The coach offers what was noticed and lets the client supply meaning.", "lenses": [{"insight": "Named feelings", "prompt": "What is the coach noticing?"}, {"insight": "Tone and pace", "prompt": "What meaning might deserve reflection?"}, {"insight": "Activation or withdrawal", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Changes when topics shift", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Level three: listen for meaning and values", "kicker": "WHY DOES THIS MATTER?", "body": ["What is protected", "What feels threatened", "What the client longs for", "What kind of person they want to be"], "narration": "Meaning listening hears the value beneath the event. Anger about a meeting may carry a need for respect. Anxiety about a choice may reflect responsibility, belonging, or freedom. The coach does not assign values. Questions and reflections help the client name what matters in their own language.", "lenses": [{"insight": "What is protected", "prompt": "What is the coach noticing?"}, {"insight": "What feels threatened", "prompt": "What meaning might deserve reflection?"}, {"insight": "What the client longs for", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What kind of person they want to be", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Level four: listen for patterns", "kicker": "WHAT REPEATS?", "body": ["Repeated words", "Recurring roles", "Familiar turning points", "Predictable protection strategies"], "narration": "Patterns become visible across examples. The client may repeatedly say I have to, take responsibility before being asked, or withdraw when a request might be refused. The coach names the pattern tentatively and specifically. A pattern is a hypothesis for exploration, not a personality diagnosis.", "lenses": [{"insight": "Repeated words", "prompt": "What is the coach noticing?"}, {"insight": "Recurring roles", "prompt": "What meaning might deserve reflection?"}, {"insight": "Familiar turning points", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Predictable protection strategies", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Hear strengths as carefully as struggle", "kicker": "CAPABILITY IS ALSO DATA", "body": ["Existing resources", "Past exceptions", "Values already practiced", "Conditions that support success"], "narration": "Problem-focused listening can make the client sound powerless. Coaches also listen for resourcefulness, courage, support, prior learning, and times the pattern did not occur. Strengths are not generic compliments. They are evidence the client can understand and reuse.", "lenses": [{"insight": "Existing resources", "prompt": "What is the coach noticing?"}, {"insight": "Past exceptions", "prompt": "What meaning might deserve reflection?"}, {"insight": "Values already practiced", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Conditions that support success", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Reflect without diagnosing", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client becomes quiet after describing a promotion. What is the strongest response?", "options": ["You are afraid of success", "I noticed your pace changed when you mentioned the promotion. What is happening for you?", "Clearly you do not want it"], "correct": 1, "feedback": ["This imposes a psychological explanation.", "Correct. It offers an observation and invites the client's meaning.", "Silence alone cannot support that conclusion."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client becomes quiet after describing a promotion. What is the strongest response?", "audio": "audio_scene_12.mp3", "image": "assets_scene_12.webp"}, {"kind": "teaching", "title": "Distinguish observation from interpretation", "kicker": "DESCRIBE BEFORE YOU EXPLAIN", "body": ["Observation: you paused", "Interpretation: you are resisting", "Observation can be checked", "Interpretation must remain tentative"], "narration": "Observation names what could reasonably be seen or heard. Interpretation explains why it occurred. Skilled coaches know the difference. They might say, you used the word trapped three times, rather than, you have commitment issues. This protects accuracy, consent, and dignity.", "lenses": [{"insight": "Observation: you paused", "prompt": "What is the coach noticing?"}, {"insight": "Interpretation: you are resisting", "prompt": "What meaning might deserve reflection?"}, {"insight": "Observation can be checked", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Interpretation must remain tentative", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.webp"}, {"kind": "teaching", "title": "Reflect content concisely", "kicker": "SHOW THAT YOU FOLLOWED", "body": ["Capture the central facts", "Use the client's language", "Remove unnecessary detail", "Invite correction"], "narration": "A content reflection might say: you have two offers, one provides stability and the other provides creative ownership. Concision helps the client see structure. A long reflection can become a speech or subtly rewrite the story. End with space for correction rather than demanding agreement.", "lenses": [{"insight": "Capture the central facts", "prompt": "What is the coach noticing?"}, {"insight": "Use the client's language", "prompt": "What meaning might deserve reflection?"}, {"insight": "Remove unnecessary detail", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Invite correction", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.webp"}, {"kind": "teaching", "title": "Reflect feeling without declaring it", "kicker": "NAME WITH HUMILITY", "body": ["Use tentative language", "Connect feeling to context", "Let the client correct the word", "Do not intensify for drama"], "narration": "A feeling reflection might be: part of this sounds disappointing, and I wonder whether there is also relief. The coach does not insist. Clients may use different emotional language, and culture shapes expression. Reflection is an offer, not an emotional verdict.", "lenses": [{"insight": "Use tentative language", "prompt": "What is the coach noticing?"}, {"insight": "Connect feeling to context", "prompt": "What meaning might deserve reflection?"}, {"insight": "Let the client correct the word", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Do not intensify for drama", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_15.mp3", "image": "assets_scene_15.webp"}, {"kind": "teaching", "title": "Reflect meaning and value", "kicker": "MAKE THE DEEPER TENSION AUDIBLE", "body": ["This is about more than the event", "Two values may compete", "The cost may be identity-based", "The client names what is true"], "narration": "A meaning reflection can bring the underlying tension into focus: you want the opportunity, and you do not want success to require abandoning the kind of parent you want to be. The coach draws only from what the client has provided and leaves room for correction.", "lenses": [{"insight": "This is about more than the event", "prompt": "What is the coach noticing?"}, {"insight": "Two values may compete", "prompt": "What meaning might deserve reflection?"}, {"insight": "The cost may be identity-based", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "The client names what is true", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_16.mp3", "image": "assets_scene_16.webp"}, {"kind": "teaching", "title": "Use summaries to organize complexity", "kicker": "PAST · PRESENT · TENSION · DIRECTION", "body": ["What brought the client here", "What is true now", "What remains unresolved", "What the client may want next"], "narration": "A summary gathers the main threads and returns them in an organized form. It can mark a transition, slow a crowded conversation, or test understanding. A useful summary is selective and transparent. It should not smuggle in the coach's conclusion.", "lenses": [{"insight": "What brought the client here", "prompt": "What is the coach noticing?"}, {"insight": "What is true now", "prompt": "What meaning might deserve reflection?"}, {"insight": "What remains unresolved", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What the client may want next", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_17.mp3", "image": "assets_scene_17.webp"}, {"kind": "question", "title": "Checkpoint 3 · Choose the reflection", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I keep volunteering, then resent everyone.’ Which response best reflects meaning?", "options": ["You need stronger boundaries", "Helping matters to you, and the way you are doing it is creating a cost you no longer want", "Why are you such a people pleaser?"], "correct": 1, "feedback": ["This prescribes before understanding.", "Correct. It holds value and cost without shaming the client.", "The label is judgmental and may be inaccurate."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I keep volunteering, then resent everyone.’ Which response best reflects meaning?", "audio": "audio_scene_18.mp3", "image": "assets_scene_18.webp"}, {"kind": "teaching", "title": "Silence is part of the conversation", "kicker": "DO NOT STEAL THE THINKING SPACE", "body": ["Pause after a meaningful question", "Let emotion settle", "Watch for consent and safety", "Re-enter gently when needed"], "narration": "Coaches often fill silence because they feel responsible for momentum. Yet the client's thinking may be happening in the pause. Silence should not become a performance or pressure tactic. The coach stays present, monitors the client's comfort, and can say, take your time, or ask what would be helpful.", "lenses": [{"insight": "Pause after a meaningful question", "prompt": "What is the coach noticing?"}, {"insight": "Let emotion settle", "prompt": "What meaning might deserve reflection?"}, {"insight": "Watch for consent and safety", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Re-enter gently when needed", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "Ask one question at a time", "kicker": "CLARITY BEFORE CLEVERNESS", "body": ["One purpose", "One sentence", "One decision point", "Enough space for a real answer"], "narration": "Stacked questions force the client to choose which part to answer and often reveal the coach thinking out loud. Instead of asking what do you want, why, what stops you, and when will you act, choose the question most useful now. The next question should emerge from the answer.", "lenses": [{"insight": "One purpose", "prompt": "What is the coach noticing?"}, {"insight": "One sentence", "prompt": "What meaning might deserve reflection?"}, {"insight": "One decision point", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Enough space for a real answer", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_20.mp3", "image": "assets_scene_20.webp"}, {"kind": "teaching", "title": "Open questions expand thinking", "kicker": "WHAT · HOW · IN WHAT WAY", "body": ["Invite description", "Explore meaning", "Compare options", "Imagine responsible action"], "narration": "Open questions cannot be answered with a simple yes or no. What matters most here? How are you making sense of the response? In what way does this option fit your values? Open does not automatically mean powerful; the question still needs purpose, timing, and appropriate scope.", "lenses": [{"insight": "Invite description", "prompt": "What is the coach noticing?"}, {"insight": "Explore meaning", "prompt": "What meaning might deserve reflection?"}, {"insight": "Compare options", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Imagine responsible action", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "teaching", "title": "Closed questions have a legitimate role", "kicker": "CONFIRM · CLARIFY · COMMIT", "body": ["Did that happen before the meeting?", "Is this the goal for today?", "Will you complete the action by Friday?", "Use sparingly and transparently"], "narration": "Closed questions clarify facts, check agreement, and confirm commitments. They become limiting when they dominate exploration or lead toward the coach's preferred answer. Skilled coaching uses the form that fits the purpose rather than treating one type as always superior.", "lenses": [{"insight": "Did that happen before the meeting?", "prompt": "What is the coach noticing?"}, {"insight": "Is this the goal for today?", "prompt": "What meaning might deserve reflection?"}, {"insight": "Will you complete the action by Friday?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Use sparingly and transparently", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.webp"}, {"kind": "teaching", "title": "Avoid advice disguised as a question", "kicker": "A QUESTION MARK DOES NOT CREATE OWNERSHIP", "body": ["Have you tried...?", "Don't you think...?", "Wouldn't it be better...?", "Name advice and ask permission if needed"], "narration": "Questions can conceal recommendations. Wouldn't it be better to talk to your manager announces the coach's answer while pretending to inquire. If information or perspective is relevant, the coach can ask permission, name the temporary role shift, share briefly, and return the choice to the client.", "lenses": [{"insight": "Have you tried...?", "prompt": "What is the coach noticing?"}, {"insight": "Don't you think...?", "prompt": "What meaning might deserve reflection?"}, {"insight": "Wouldn't it be better...?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Name advice and ask permission if needed", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_23.mp3", "image": "assets_scene_23.webp"}, {"kind": "question", "title": "Checkpoint 4 · Improve the question", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which is the strongest coaching question?", "options": ["Don't you think you should leave?", "What information would help you decide whether staying remains a healthy choice?", "Have you tried doing what I did?"], "correct": 1, "feedback": ["This is advice disguised as inquiry.", "Correct. It supports evaluation without directing the outcome.", "The coach's experience may not fit the client's reality."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which is the strongest coaching question?", "audio": "audio_scene_24.mp3", "image": "assets_scene_24.webp"}, {"kind": "teaching", "title": "Use curiosity—not interrogation", "kicker": "TONE · PACE · PERMISSION", "body": ["Explain why a sensitive question matters", "Ask permission when depth increases", "Let the client decline", "Avoid rapid-fire inquiry"], "narration": "Even good questions can feel invasive when delivered quickly or without context. A coach might say, I have a question about what this decision seems to represent; would it be useful to explore that? Permission is especially important around vulnerability, identity, grief, relationships, and other sensitive material.", "lenses": [{"insight": "Explain why a sensitive question matters", "prompt": "What is the coach noticing?"}, {"insight": "Ask permission when depth increases", "prompt": "What meaning might deserve reflection?"}, {"insight": "Let the client decline", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Avoid rapid-fire inquiry", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_25.mp3", "image": "assets_scene_25.webp"}, {"kind": "teaching", "title": "Questions can clarify reality", "kicker": "WHAT IS ACTUALLY TRUE?", "body": ["What happened?", "What evidence supports the conclusion?", "What remains unknown?", "What assumption is being treated as fact?"], "narration": "Reality questions help the client separate event, interpretation, and uncertainty. They should not become courtroom cross-examination. The coach is not trying to disprove emotion. The goal is to create a more accurate field in which the client can choose.", "lenses": [{"insight": "What happened?", "prompt": "What is the coach noticing?"}, {"insight": "What evidence supports the conclusion?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What remains unknown?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What assumption is being treated as fact?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_26.mp3", "image": "assets_scene_26.webp"}, {"kind": "teaching", "title": "Questions can uncover values", "kicker": "WHAT MATTERS ENOUGH TO GUIDE THIS?", "body": ["What are you protecting?", "What value feels honored or compromised?", "What would integrity look like?", "What cost are you willing—or unwilling—to accept?"], "narration": "Values questions move beneath preference. They help clients see why a decision carries weight and what tradeoffs belong to it. Coaches do not force a hierarchy or use values to shame inconsistency. Values guide reflection; they do not remove complexity.", "lenses": [{"insight": "What are you protecting?", "prompt": "What is the coach noticing?"}, {"insight": "What value feels honored or compromised?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What would integrity look like?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What cost are you willing—or unwilling—to accept?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_27.mp3", "image": "assets_scene_27.webp"}, {"kind": "teaching", "title": "Questions can reveal possibility", "kicker": "EXPAND WITHOUT ESCAPING REALITY", "body": ["What else might be true?", "What option has not been considered?", "What would a smaller experiment reveal?", "What support would change the equation?"], "narration": "Possibility questions loosen false binaries and create experiments. They should remain connected to resources, safety, responsibility, and context. Imagination is useful; magical thinking and promises are not. The client decides what is realistic enough to test.", "lenses": [{"insight": "What else might be true?", "prompt": "What is the coach noticing?"}, {"insight": "What option has not been considered?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What would a smaller experiment reveal?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What support would change the equation?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_28.mp3", "image": "assets_scene_28.webp"}, {"kind": "teaching", "title": "Questions can surface protection", "kicker": "WHAT DOES THE CURRENT PATTERN PREVENT?", "body": ["What feels risky?", "What discomfort is avoided?", "What does staying the same provide?", "What would need support?"], "narration": "Patterns often protect the client from rejection, exposure, conflict, uncertainty, grief, or responsibility. Naming protection reduces shame. The coach does not force vulnerability or search for trauma. The purpose is to understand the current choice and identify a tolerable next experiment.", "lenses": [{"insight": "What feels risky?", "prompt": "What is the coach noticing?"}, {"insight": "What discomfort is avoided?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What does staying the same provide?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What would need support?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_29.mp3", "image": "assets_scene_29.webp"}, {"kind": "question", "title": "Checkpoint 5 · Ask with purpose", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I want the promotion, but I keep missing the application deadline.’ What question best explores protection?", "options": ["Why are you sabotaging yourself?", "What becomes more exposed or uncertain if you submit the application?", "Can you promise to apply tonight?"], "correct": 1, "feedback": ["The label assumes motive and creates shame.", "Correct. It explores the function beneath avoidance.", "Commitment before understanding may repeat the pattern."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I want the promotion, but I keep missing the application deadline.’ What question best explores protection?", "audio": "audio_scene_30.mp3", "image": "assets_scene_30.webp"}, {"kind": "teaching", "title": "Challenge begins with earned understanding", "kicker": "CONNECTION BEFORE CONFRONTATION", "body": ["Reflect the client's view", "Ask permission to share an observation", "Name the discrepancy specifically", "Invite the client's interpretation"], "narration": "Challenge is not bluntness for its own sake. The coach first demonstrates understanding, then asks permission and names a specific discrepancy: you say rest matters, and you have accepted three new commitments this week. How do those fit together? The client remains free to disagree.", "lenses": [{"insight": "Reflect the client's view", "prompt": "What is the coach noticing?"}, {"insight": "Ask permission to share an observation", "prompt": "What meaning might deserve reflection?"}, {"insight": "Name the discrepancy specifically", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Invite the client's interpretation", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_31.mp3", "image": "assets_scene_31.webp"}, {"kind": "teaching", "title": "Use immediacy carefully", "kicker": "WHAT IS HAPPENING RIGHT NOW?", "body": ["Notice the live shift", "Describe rather than diagnose", "Check whether exploration is useful", "Stay within coaching scope"], "narration": "Sometimes the coaching relationship displays the pattern. A client apologizes before every answer or asks the coach to approve each choice. The coach may say, I notice you looked to me before naming your preference. Would it be useful to explore that? Immediacy requires humility and careful boundaries.", "lenses": [{"insight": "Notice the live shift", "prompt": "What is the coach noticing?"}, {"insight": "Describe rather than diagnose", "prompt": "What meaning might deserve reflection?"}, {"insight": "Check whether exploration is useful", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Stay within coaching scope", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_32.mp3", "image": "assets_scene_32.webp"}, {"kind": "teaching", "title": "Sequence questions through ROUX", "kicker": "RECOGNIZE · OPEN · UNCOVER · EXECUTE", "body": ["Recognize what is present", "Open honest exploration", "Uncover meaning and pattern", "Execute a client-owned next step"], "narration": "Question sequencing follows the client's needs, not a rigid script. Recognize clarifies the focus and present reality. Open creates safety and permission. Uncover explores values, assumptions, protection, and consequences. Execute translates insight into an action, experiment, boundary, decision, referral, or review.", "lenses": [{"insight": "Recognize what is present", "prompt": "What is the coach noticing?"}, {"insight": "Open honest exploration", "prompt": "What meaning might deserve reflection?"}, {"insight": "Uncover meaning and pattern", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Execute a client-owned next step", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_33.mp3", "image": "assets_scene_33.webp"}, {"kind": "teaching", "title": "Move from insight to action", "kicker": "WHAT WILL CHANGE BECAUSE OF THIS CONVERSATION?", "body": ["Name the learning", "Choose the next step", "Anticipate friction", "Define support and review"], "narration": "A thoughtful conversation can still end without movement. The coach asks what the client wants to carry forward, what action or experiment they choose, when it will occur, what may interfere, and how they will respond. Action should fit readiness and scope; it should not be forced to prove the session worked.", "lenses": [{"insight": "Name the learning", "prompt": "What is the coach noticing?"}, {"insight": "Choose the next step", "prompt": "What meaning might deserve reflection?"}, {"insight": "Anticipate friction", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Define support and review", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_34.mp3", "image": "assets_scene_34.webp"}, {"kind": "teaching", "title": "End with ownership and accurate summary", "kicker": "CLIENT WORDS · CLIENT CHOICE · CLIENT MEANING", "body": ["What stands out?", "What did the client decide?", "What support is needed?", "What will be reviewed next time?"], "narration": "The client should have the final meaning-making voice. A closing summary can reflect the focus, insight, decision, action, and support, then invite correction. Asking what stands out helps the client consolidate learning and prevents the coach from declaring the lesson on their behalf.", "lenses": [{"insight": "What stands out?", "prompt": "What is the coach noticing?"}, {"insight": "What did the client decide?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What support is needed?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What will be reviewed next time?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_35.mp3", "image": "assets_scene_35.webp"}, {"kind": "teaching", "title": "Know when questions must stop", "kicker": "SAFETY AND SCOPE BEFORE CURIOSITY", "body": ["Immediate danger", "Severe distress or impairment", "Trauma treatment needs", "Medical, legal, or clinical expertise"], "narration": "Questions are not harmless simply because they are open. If a client discloses suicidal intent, abuse, severe symptoms, trauma responses, medical risk, or significant impairment, ordinary coaching inquiry must yield to appropriate safety procedures and qualified care. The coach does not explore beyond competence to satisfy curiosity.", "lenses": [{"insight": "Immediate danger", "prompt": "What is the coach noticing?"}, {"insight": "Severe distress or impairment", "prompt": "What meaning might deserve reflection?"}, {"insight": "Trauma treatment needs", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Medical, legal, or clinical expertise", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_36.mp3", "image": "assets_scene_36.webp"}, {"kind": "question", "title": "Checkpoint 6 · Protect scope", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says she has a plan to harm herself tonight. What should the coach do?", "options": ["Ask a powerful question about future goals", "Take the disclosure seriously and follow applicable emergency and safety procedures immediately", "Keep it confidential no matter what"], "correct": 1, "feedback": ["Ordinary coaching must stop when immediate safety is at risk.", "Correct. Safety procedures and emergency support take priority.", "Confidentiality has limits in urgent safety situations, subject to applicable law and policy."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says she has a plan to harm herself tonight. What should the coach do?", "audio": "audio_scene_37.mp3", "image": "assets_scene_37.webp"}, {"kind": "teaching", "title": "Case study: Alicia", "kicker": "THE CLIENT ASKS FOR AN ANSWER", "body": ["Leadership role offers meaningful influence", "Exhaustion is minimized", "Family presence is a chosen value", "The coach hears both vitality and cost"], "narration": "Alicia asks, should I take the role? The coach reflects that she becomes animated describing the work and quiet describing the schedule. With permission, the coach names the tension: this opportunity seems connected to contribution, and the current design may conflict with sustainability and family presence. Alicia recognizes that the decision is not simply yes or no; it includes conditions she can negotiate.", "lenses": [{"insight": "Leadership role offers meaningful influence", "prompt": "What is the coach noticing?"}, {"insight": "Exhaustion is minimized", "prompt": "What meaning might deserve reflection?"}, {"insight": "Family presence is a chosen value", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "The coach hears both vitality and cost", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_38.mp3", "image": "assets_scene_38.webp"}, {"kind": "teaching", "title": "Alicia's question sequence", "kicker": "CLARITY WITHOUT CONTROL", "body": ["What decision is actually yours?", "What values need a voice?", "What conditions would make yes sustainable?", "What conversation will you initiate?"], "narration": "The coach clarifies what is known, what remains negotiable, and what Alicia owns. Questions uncover contribution, health, family, fear of disappointing a sponsor, and assumptions about availability. Alicia decides to request role clarity, staffing support, and travel limits before answering. The coach did not choose the job; the conversation improved the decision.", "lenses": [{"insight": "What decision is actually yours?", "prompt": "What is the coach noticing?"}, {"insight": "What values need a voice?", "prompt": "What meaning might deserve reflection?"}, {"insight": "What conditions would make yes sustainable?", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "What conversation will you initiate?", "prompt": "How will ownership remain with the client?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "The Roux Life conversation standard", "kicker": "PRESENCE · ACCURACY · COURAGE · OWNERSHIP", "body": ["Be fully with the client", "Reflect what is heard—not what is invented", "Ask the question that serves the work", "Return meaning and choice to the client"], "narration": "Roux Life coaching is emotionally intelligent and action-centered. We listen for truth without diagnosing, invite vulnerability without forcing disclosure, challenge without shame, and use questions to create clarity rather than control. The strongest conversation leaves the client more able to hear themselves, choose responsibly, and act with ownership.", "lenses": [{"insight": "Be fully with the client", "prompt": "What is the coach noticing?"}, {"insight": "Reflect what is heard—not what is invented", "prompt": "What meaning might deserve reflection?"}, {"insight": "Ask the question that serves the work", "prompt": "What question would deepen—not direct—the thinking?"}, {"insight": "Return meaning and choice to the client", "prompt": "How will ownership remain with the client?"}], "audio": function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 17</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 17</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Core Coaching Skills and Powerful Questions';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson17PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
</script><script src="../../academy/lesson-bridge.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/cloud.js"></script></body></html>
