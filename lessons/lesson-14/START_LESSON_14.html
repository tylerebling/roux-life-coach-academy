<body><main class="app"><section class="stage" id="stage"><div class="start" id="start"><div class="start-photo"></div><div class="start-vignette"></div><div class="start-card"><img class="intro-logo" src="assets_roux_life_logo.webp" alt="Roux Life Coaching"><div class="intro-line"></div><div class="intro-copy"><h1>Rediscovering Purpose and Direction</h1><p>A practical Roux Life masterclass in finding direction through values, strengths, contribution, season, lived evidence, and small experiments—not pressure for one perfect calling.</p></div><button id="begin">Enter Lesson 14</button></div></div><div class="caption" id="caption"></div></section>

<script>
const scenes=[{"kind": "teaching", "title": "Purpose becomes visible through alignment", "kicker": "ROUX LIFE ACADEMY · LESSON 14", "body": ["Values guide choices", "Strengths shape action", "Contribution connects us", "Daily behavior creates direction"], "narration": "Purpose is not a prize reserved for exceptional people. It becomes visible when what matters, what the client can offer, who or what they care about, and how they live begin to align. Coaching replaces pressure to discover one perfect calling with careful evidence, honest constraints, meaningful experiments, and client-owned decisions.", "lenses": [{"insight": "Gather lived evidence of values guide choices instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect strengths shape action to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate contribution connects us into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn daily behavior creates direction into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Release purpose myths", "Gather direction clues", "Build a purpose map", "Test direction through action"], "narration": "We begin by separating purpose from achievement, role, income, and performance. Then we gather clues from values, strengths, energy, concern, contribution, relationships, and season. Finally, we organize those clues, design experiments, address common obstacles, and apply the process to Naomi's case.", "lenses": [{"insight": "Gather lived evidence of release purpose myths instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect gather direction clues to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate build a purpose map into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn test direction through action into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Purpose is direction—not one destination", "kicker": "A WORKING DEFINITION", "body": ["A pattern of meaning", "Values expressed in action", "Contribution with boundaries", "Direction that can evolve"], "narration": "Purpose can be understood as a continuing direction of meaningful participation. It is how the client chooses to embody values, use strengths, care for people or causes, and meet the responsibilities of a particular season. Because life changes, purpose can change form without becoming false.", "lenses": [{"insight": "Gather lived evidence of a pattern of meaning instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect values expressed in action to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate contribution with boundaries into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn direction that can evolve into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Four myths create unnecessary pressure", "kicker": "PURPOSE IS NOT A PERFORMANCE", "body": ["There is only one calling", "It must be a career", "It should always feel inspiring", "It must impress other people"], "narration": "Purpose pressure tells clients there is one correct path, that work must provide every form of meaning, that aligned living should feel constantly inspiring, or that purpose must be publicly impressive. These myths produce paralysis and comparison. A useful direction can be ordinary, seasonal, difficult, private, and still deeply meaningful.", "lenses": [{"insight": "Gather lived evidence of there is only one calling instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect it must be a career to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate it should always feel inspiring into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn it must impress other people into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Purpose lives in daily alignment", "kicker": "SMALL CHOICES REVEAL THE PATTERN", "body": ["How time is used", "How people are treated", "What receives care", "What the client practices repeatedly"], "narration": "A purpose statement means little if it never reaches behavior. Daily alignment appears in attention, boundaries, workmanship, relationships, service, learning, and recovery. The coach asks how a value would become observable this week. Direction grows through repeated choices, not slogans.", "lenses": [{"insight": "Gather lived evidence of how time is used instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect how people are treated to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate what receives care into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn what the client practices repeatedly into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Release the myth", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement best reflects the Roux Life view of purpose?", "options": ["Everyone has one perfect career calling", "Purpose is an evolving pattern of values, strengths, contribution, and daily action", "Purpose must produce public recognition"], "correct": 1, "feedback": ["One-path pressure can create paralysis.", "Correct. Purpose can evolve across seasons and roles.", "Meaning does not require an audience or prestige."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement best reflects the Roux Life view of purpose?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Purpose changes form across seasons", "kicker": "THE VALUE MAY STAY · THE EXPRESSION MAY CHANGE", "body": ["Learning years", "Caregiving seasons", "Building and leading", "Restoring and mentoring"], "narration": "The same value can take different forms. Contribution may look like study in one season, parenting in another, leadership later, and mentoring after that. Clients often think a former purpose disappeared when its expression no longer fits capacity. Coaching helps distinguish the enduring value from the current strategy.", "lenses": [{"insight": "Gather lived evidence of learning years instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect caregiving seasons to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate building and leading into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn restoring and mentoring into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Meaning and achievement are not identical", "kicker": "SUCCESS CAN BE REAL AND STILL FEEL EMPTY", "body": ["Achievement meets a target", "Meaning connects to values", "Recognition is external", "Fulfillment requires a personal fit"], "narration": "Achievement answers whether a goal was reached. Meaning asks why it mattered and what kind of person the client was while pursuing it. A client may be proud and disconnected, or deeply fulfilled without public recognition. Coaches do not dismiss ambition; they help clients examine what achievement serves.", "lenses": [{"insight": "Gather lived evidence of achievement meets a target instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect meaning connects to values to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate recognition is external into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn fulfillment requires a personal fit into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "A role can carry purpose without containing all of it", "kicker": "YOU ARE MORE THAN THE TITLE", "body": ["Career", "Caregiving", "Community", "Personal practice and relationship"], "narration": "A role can be a powerful vehicle for purpose, but it is not the whole person. If meaning depends on one title, any job change can feel like identity erasure. The client can locate purpose across work, family, friendship, citizenship, faith, creativity, learning, and self-stewardship.", "lenses": [{"insight": "Gather lived evidence of career instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect caregiving to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate community into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn personal practice and relationship into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "Values tell direction what to protect", "kicker": "CHOSEN QUALITIES OF ACTION", "body": ["Integrity", "Courage", "Connection", "Creativity and service"], "narration": "Values are not outcomes. They are qualities the client chooses to practice: honesty, compassion, excellence, freedom, faith, curiosity, or justice. A value becomes useful when translated into behavior. ‘Connection’ might mean one present conversation; ‘courage’ might mean submitting work before certainty.", "lenses": [{"insight": "Gather lived evidence of integrity instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect courage to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate connection into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn creativity and service into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Strengths describe reliable ways of contributing", "kicker": "WHAT DOES THE CLIENT DO WELL?", "body": ["Natural patterns", "Developed skills", "Relational capacities", "Knowledge and lived wisdom"], "narration": "Strengths include more than talent. They may be learned skills, ways of thinking, relational capacities, or wisdom built through experience. The coach asks for evidence: when has the client organized complexity, calmed a room, taught clearly, repaired trust, designed beauty, or persisted responsibly? Strength is not permission for endless unpaid labor.", "lenses": [{"insight": "Gather lived evidence of natural patterns instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect developed skills to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate relational capacities into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn knowledge and lived wisdom into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Role or purpose?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘I lost my job, so I lost my purpose.’ What is the strongest question?", "options": ["Which title should replace it immediately?", "What values and forms of contribution did the role express, and where else could they live?", "Why did you depend on work so much?"], "correct": 1, "feedback": ["A replacement title may rush identity work.", "Correct. It separates the vehicle from the deeper direction.", "Judgment narrows exploration."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘I lost my job, so I lost my purpose.’ W , {"insight": "Translate what evidence changed direction? into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn what needs qualified care? into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_39.mp3", "image": "assets_scene_39.webp"}, {"kind": "teaching", "title": "The Roux Life purpose standard", "kicker": "DIRECTION WITHOUT PRESSURE", "body": ["Meaning is client-defined", "Evidence matters", "Constraints are respected", "Clarity becomes sustainable action"], "narration": "Roux Life coaching does not declare a client's calling or borrow another teacher's branded curriculum. We draw on broad themes of courage, values, empathy, belonging, boundaries, and resilience through original Roux tools. Purpose is client-defined, evidence-informed, season-aware, and translated into sustainable action—with referral when clinical, medical, or safety needs exceed coaching scope.", "lenses": [{"insight": "Gather lived evidence of meaning is client-defined instead of searching for a perfect label.", "prompt": "Where has this already appeared?"}, {"insight": "Connect evidence matters to the client's chosen values and present season.", "prompt": "Why does this matter now?"}, {"insight": "Translate constraints are respected into contribution that respects capacity and consent.", "prompt": "Who benefits, and at what sustainable cost?"}, {"insight": "Turn clarity becomes sustainable action into a small experiment that produces new evidence.", "prompt": "What could the client test before deciding permanently?"}], "audio": "audio_scene_40.mp3", "image": "assets_scene_40.webp"}];let index=0,captionOn=false,answered=false,manualConcept=-1,manualUntil=0;
const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 14</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 14</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Rediscovering Purpose and Direction';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson14PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
</script><script src="../../academy/lesson-bridge.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script src="../../academy/cloud.js"></script></body></html>
