<!doctype html><meta charset=utf-8><title>Lesson 14 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 14 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Create Your Roux Life Purpose and Direction Map</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Purpose myths</strong><small>Which beliefs about one calling, career, inspiration, or recognition create pressure?</small><textarea id="myths" rows="4"></textarea></label><label><strong>2. Values in action</strong><small>Choose five values and one recent behavior that demonstrates each.</small><textarea id="values" rows="4"></textarea></label><label><strong>3. Strength evidence</strong><small>List skills, relational capacities, knowledge, and lived wisdom with examples.</small><textarea id="strengths" rows="4"></textarea></label><label><strong>4. Energy patterns</strong><small>Record activities, focus, satisfaction, cost, and recovery needs.</small><textarea id="energy" rows="4"></textarea></label><label><strong>5. Recurring concern</strong><small>What people, problems, questions, or possibilities keep holding attention?</small><textarea id="concern" rows="4"></textarea></label><label><strong>6. Contribution and recipient</strong><small>What can you offer, who benefits, and what boundaries protect sustainability?</small><textarea id="contribution" rows="4"></textarea></label><label><strong>7. Season and constraints</strong><small>Name health, money, caregiving, access, time, and current responsibilities.</small><textarea id="season" rows="4"></textarea></label><label><strong>8. Five-part purpose map</strong><small>Connect values, strengths, contribution, season, and constraints.</small><textarea id="map" rows="4"></textarea></label><label><strong>9. Direction experiment</strong><small>Define the question, small action, timing, evidence, and review date.</small><textarea id="experiment" rows="4"></textarea></label><label><strong>10. Ninety-day theme</strong><small>Choose one direction, two weekly practices, one experiment, support, and measures.</small><textarea id="theme" rows="4"></textarea></label><label><strong>11. Naomi case consultation</strong><small>Build her evidence map, options, boundaries, experiment, and review.</small><textarea id="naomi" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>Identify hopelessness, impairment, self-harm, trauma, substance, burnout, or medical concerns.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
