const scenes=[{"kind": "teaching", "title": "Boundaries create room for an honest life", "kicker": "ROUX LIFE ACADEMY · LESSON 11", "body": ["Capacity deserves truth", "Limits protect what matters", "Discomfort can be tolerated", "Follow-through creates trust"], "narration": "Healthy boundaries help a person live in alignment with real capacity and chosen values. They clarify what the client will accept, offer, protect, and do. A boundary is not proof that care has ended. Often it is the structure that keeps care from becoming resentment, exhaustion, or self-abandonment. The goal is clarity without control and compassion without overextension.", "lenses": [{"insight": "Look for observable evidence of capacity deserves truth before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate limits protect what matters from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate discomfort can be tolerated into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn follow-through creates trust into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_01.mp3", "image": "assets_scene_01.webp"}, {"kind": "teaching", "title": "Your learning journey", "kicker": "LESSON ROADMAP", "body": ["Recognize overextension", "Distinguish boundary types", "Communicate and tolerate guilt", "Follow through with scope"], "narration": "This lesson begins with the purpose of boundaries and the signs that capacity has been exceeded. You will distinguish requests, preferences, boundaries, controls, and ultimatums. Then you will practice concise language, guilt tolerance, pushback, negotiation, follow-through, repair, and application across work, family, friendship, romantic, and digital settings.", "lenses": [{"insight": "Look for observable evidence of recognize overextension before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate distinguish boundary types from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate communicate and tolerate guilt into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn follow through with scope into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "A boundary defines participation", "kicker": "WHAT A BOUNDARY DOES", "body": ["Clarifies responsibility", "Protects time and energy", "Supports consent and safety", "Guides the client's next action"], "narration": "A boundary answers a practical question: how will I participate when this condition is present? It may protect time, attention, money, physical space, emotional labor, privacy, or safety. It does not control another adult's thoughts or choices. The client names the condition and the action they will take. This keeps responsibility where it belongs.", "lenses": [{"insight": "Look for observable evidence of clarifies responsibility before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate protects time and energy from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate supports consent and safety into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn guides the client's next action into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Four myths that create boundary guilt", "kicker": "MYTHS TO RELEASE", "body": ["No means selfish", "Love requires unlimited access", "Disappointment means harm", "A good boundary needs agreement"], "narration": "Many clients learned that goodness means availability, that love requires sacrifice without limit, or that another person's disappointment proves wrongdoing. These beliefs make ordinary boundary discomfort feel like moral failure. A boundary does not need approval to be valid. It does need clarity, proportionality, and responsible follow-through.", "lenses": [{"insight": "Look for observable evidence of no means selfish before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate love requires unlimited access from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate disappointment means harm into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn a good boundary needs agreement into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Overextension has recognizable evidence", "kicker": "NOTICE THE COST BEFORE THE CRISIS", "body": ["Chronic resentment", "Promises made from fear", "Recovery time disappears", "Important commitments are neglected"], "narration": "Overextension is not simply being busy. It appears when commitments repeatedly exceed capacity and begin damaging health, integrity, relationships, or essential responsibilities. Clients may feel resentment, dread, numbness, irritability, or a constant wish to escape. The coach helps identify the pattern without diagnosing or shaming the client's coping strategy.", "lenses": [{"insight": "Look for observable evidence of chronic resentment before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate promises made from fear from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate recovery time disappears into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn important commitments are neglected into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Boundary or control?", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "Which statement is a self-owned boundary?", "options": ["You must stop calling after nine", "If a non-emergency call comes after nine, I will respond the next morning", "You are not allowed to need me"], "correct": 1, "feedback": ["This directs another adult's behavior.", "Correct. It names the condition and the client's action.", "A boundary does not erase another person's needs."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. Which statement is a self-owned boundary?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "The boundary map", "kicker": "CAPACITY · VALUE · CONDITION · ACTION", "body": ["Assess real capacity", "Name the protected value", "Define the observable condition", "Choose a self-owned action"], "narration": "The Roux boundary map begins with capacity: what time, energy, health, money, and attention are actually available? Next comes value: what is the client protecting? Then the condition: what observable event activates the limit? Finally, action: what will the client do? This order prevents vague declarations and punitive consequences.", "lenses": [{"insight": "Look for observable evidence of assess real capacity before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate name the protected value from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate define the observable condition into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn choose a self-owned action into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Request, boundary, control, or ultimatum?", "kicker": "IMPORTANT DISTINCTIONS", "body": ["Request invites choice", "Boundary governs participation", "Control directs another adult", "Ultimatum uses pressure or threat"], "narration": "A request asks for a behavior and permits an honest response. A boundary states what the client will do. Control attempts to manage another adult. An ultimatum uses fear, punishment, or the threat of losing basic respect to force compliance. Some serious decisions have firm conditions, but the coach should still examine safety, proportionality, and ownership.", "lenses": [{"insight": "Look for observable evidence of request invites choice before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate boundary governs participation from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate control directs another adult into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn ultimatum uses pressure or threat into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_08.mp3", "image": "assets_scene_08.webp"}, {"kind": "teaching", "title": "Yes, no, not now, or another way", "kicker": "EXPAND THE RESPONSE OPTIONS", "body": ["A wholehearted yes", "A clear no", "A time-bound not now", "An alternative offer"], "narration": "Clients often experience only two choices: comply or reject. Healthy boundaries expand the menu. A client can say yes freely, no clearly, not now with a realistic time, or offer another form of support. An alternative is optional, not a fee the client must pay for saying no. The response should fit capacity and values.", "lenses": [{"insight": "Look for observable evidence of a wholehearted yes before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate a clear no from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate a time-bound not now into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn an alternative offer into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_09.mp3", "image": "assets_scene_09.webp"}, {"kind": "teaching", "title": "The body often notices first", "kicker": "EARLY BOUNDARY SIGNALS", "body": ["Tight jaw or chest", "Immediate urgency", "Dread or heaviness", "Automatic yes before reflection"], "narration": "Before the mind forms a reason, the body may signal that capacity or consent has changed. Tightness, heat, heaviness, shallow breathing, or urgent agreement can be useful information. Coaches do not diagnose bodily signals. They help the client pause, notice, and gather more information before making a commitment.", "lenses": [{"insight": "Look for observable evidence of tight jaw or chest before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate immediate urgency from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate dread or heaviness into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn automatic yes before reflection into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_10.mp3", "image": "assets_scene_10.webp"}, {"kind": "teaching", "title": "Audit capacity honestly", "kicker": "TIME · ENERGY · MONEY · RECOVERY", "body": ["List fixed responsibilities", "Estimate emotional labor", "Protect recovery needs", "Leave margin for the unexpected"], "narration": "A capacity audit makes invisible labor visible. The client lists fixed responsibilities, relational and emotional labor, health needs, financial limits, and necessary recovery. Capacity is not every empty square on a calendar. A sustainable plan includes margin. The coach helps the client compare what is promised with what is realistically available.", "lenses": [{"insight": "Look for observable evidence of list fixed responsibilities before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate estimate emotional labor from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate protect recovery needs into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn leave margin for the unexpected into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_11.mp3", "image": "assets_scene_11.webp"}, {"kind": "question", "title": "Checkpoint 2 · Respond from capacity", "kicker": "INTERACTIVE COACHI e client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_13.mp3", "image": "assets_scene_13.webp"}, {"kind": "teaching", "title": "Healthy guilt or conditioned guilt?", "kicker": "CHECK THE EVIDENCE", "body": ["Was a value actually violated?", "Was preventable harm caused?", "Is repair appropriate?", "Or is disapproval simply uncomfortable?"], "narration": "Not all guilt should be dismissed. Healthy guilt can signal that the client broke a promise, acted carelessly, or violated a chosen value. Conditioned guilt appears because someone is disappointed or because the client departed from an old role. The difference is examined through behavior, impact, responsibility, and values—not intensity alone.", "lenses": [{"insight": "Look for observable evidence of was a value actually violated? before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate was preventable harm caused? from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate is repair appropriate? into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn or is disapproval simply uncomfortable? into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_14.mp3", "image": "assets_scene_14.webp"}, {"kind": "teaching", "title": "Inherited rules shape present limits", "kicker": "FAMILY AND CULTURAL MESSAGES", "body": ["Good people always help", "Family comes before self", "Rest must be earned", "Conflict means disloyalty"], "narration": "Clients may carry rules that once protected belonging. Questioning these rules requires humility and cultural respect. The coach does not declare family or community values unhealthy. Instead, the client examines what the rule protects, what it cost se here and choose the response that best preserves client dignity, ownership, and coaching scope. A client feels guilty because her friend is disappointed, but she communicated early and respectfully and had no capacity to help. What is the strongest coaching focus?", "audio": "audio_scene_18.mp3", "image": "assets_scene_18.webp"}, {"kind": "teaching", "title": "Build a boundary in four parts", "kicker": "CONDITION · IMPACT · ACTION · RETURN", "body": ["Name the situation", "Briefly state why it matters", "State the self-owned action", "Clarify return or review when useful"], "narration": "A concise boundary can include four parts: the observable condition, a brief impact or value, the action the client will take, and—when appropriate—a return or review point. For example: ‘When a conversation becomes insulting, I cannot stay engaged. I will pause and can revisit it tomorrow afternoon if we can speak respectfully.’", "lenses": [{"insight": "Look for observable evidence of name the situation before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate briefly state why it matters from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate state the self-owned action into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn clarify return or review when useful into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_19.mp3", "image": "assets_scene_19.webp"}, {"kind": "teaching", "title": "Make the condition observable", "kicker": "REMOVE MIND READING", "body": ["Specific behavior", "Time or frequency", "Relevant context", "Clear activation point"], "narration": "‘When you disrespect me’ invites debate about motive and definition. ‘When I am called names or shouted over’ identifies behavior at will the client do in observable behavior?"}], "audio": "audio_scene_21.mp3", "image": "assets_scene_21.webp"}, {"kind": "teaching", "title": "Deliver less explanation, more clarity", "kicker": "WARM · BRIEF · DIRECT", "body": ["Lead with the decision", "Use one honest reason", "Avoid a courtroom defense", "Stop after the message is clear"], "narration": "Overexplaining often tries to prevent disappointment. It can turn a limit into a negotiation the client did not intend to open. A warm boundary leads with the decision, gives one useful reason if desired, and stops. ‘I cannot take that on this week. I need the available time for my existing commitments.’ Clarity is not cruelty.", "lenses": [{"insight": "Look for observable evidence of lead with the decision before interpreting motive.", "prompt": "What happened, how often, and with what impact?"}, {"insight": "Separate use one honest reason from fear, habit, and inherited expectation.", "prompt": "What does the client know—and what are they predicting?"}, {"insight": "Translate avoid a courtroom defense into a value, need, or standard the client can own.", "prompt": "What matters enough to protect?"}, {"insight": "Turn stop after the message is clear into one proportionate action the client can actually keep.", "prompt": "What will the client do in observable behavior?"}], "audio": "audio_scene_22.mp3", "image": "assets_scene_22.webp"}, {"kind": "teaching", "title": "The calm repeat", "kicker": "WHEN THE ANSWER IS ALREADY CLEAR", "body": ["Acknowledge the response", "Repeat the limit", "Do not add new defenses", "End the exchange if pressure continues"], "narration": "Pushback can lure clients into producing new reasons. The calm repeat acknowledges feeling and restates the boundary: ‘I understand this is frustrating. I am still not available Saturday.’ If pressure continues, the client may end the conversation and return later. Repetition is not aggression when the message remains respectful.", "lenses": [{"ins const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';

function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 11</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 11</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Healthy Boundaries Without Guilt';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson11PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
