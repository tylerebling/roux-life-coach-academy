<!doctype html><meta charset=utf-8><title>Lesson 8 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 8 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Recovery, Repair, and Resilience Plan</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Setback facts</strong><small>What happened? Separate observations from predictions.</small><textarea id="facts" rows="4"></textarea></label><label><strong>2. Impact and loss</strong><small>What changed practically, emotionally, relationally, or financially?</small><textarea id="impact" rows="4"></textarea></label><label><strong>3. Current needs</strong><small>What rest, information, support, space, care, or structure is needed?</small><textarea id="needs" rows="4"></textarea></label><label><strong>4. Compassionate response</strong><small>Write awareness, kindness, common humanity, and responsibility.</small><textarea id="compassion" rows="4"></textarea></label><label><strong>5. Current capacity</strong><small>What is essential, possible, and intentionally postponed?</small><textarea id="capacity" rows="4"></textarea></label><label><strong>6. Support map</strong><small>Name person, role, request, and boundary.</small><textarea id="support" rows="4"></textarea></label><label><strong>7. Realistic responsibility</strong><small>What impact is yours to acknowledge?</small><textarea id="responsibility" rows="4"></textarea></label><label><strong>8. Repair path</strong><small>Write acknowledge, own, offer, change, and release control.</small><textarea id="repair" rows="4"></textarea></label><label><strong>9. Adaptation</strong><small>What timeline, method, scope, expectation, or system should change?</small><textarea id="adapt" rows="4"></textarea></label><label><strong>10. Recovery experiment</strong><small>Choose a small evidence-gathering next step.</small><textarea id="experiment" rows="4"></textarea></label><label><strong>11. Review signals</strong><small>Track functioning, connection, choice, learning, and support.</small><textarea id="review" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>What would require licensed, emergency, medical, legal, abuse, addiction, or other specialized care?</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
