<!doctype html><meta charset=utf-8><title>Lesson 15 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 15 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Values-Based Roux Life Roadmap</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Ownership test</strong><small>Who wants this goal, why now, and what responsibility does the client choose?</small><textarea id="ownership" rows="4"></textarea></label><label><strong>2. Values and protected standards</strong><small>What matters, and what must not be sacrificed during pursuit?</small><textarea id="values" rows="4"></textarea></label><label><strong>3. Outcome and measures</strong><small>Define observable result, time frame, quality, experience, and impact.</small><textarea id="outcome" rows="4"></textarea></label><label><strong>4. Present-state baseline</strong><small>Record current behavior, resources, strengths, constraints, and previous attempts.</small><textarea id="baseline" rows="4"></textarea></label><label><strong>5. Backward milestones</strong><small>Sequence major checkpoints and dependencies from outcome to first step.</small><textarea id="milestones" rows="4"></textarea></label><label><strong>6. Active action horizon</strong><small>Choose one milestone and two or three visible actions.</small><textarea id="actions" rows="4"></textarea></label><label><strong>7. Capacity design</strong><small>Budget time, energy, recovery, caregiving, and margin.</small><textarea id="capacity" rows="4"></textarea></label><label><strong>8. Obstacle and contingency plan</strong><small>List likely friction and a proportionate response for each.</small><textarea id="obstacles" rows="4"></textarea></label><label><strong>9. Support architecture</strong><small>Identify encouragement, practical help, expertise, resources, and accountability.</small><textarea id="support" rows="4"></textarea></label><label><strong>10. Accountability and review</strong><small>Choose measures, check-in rhythm, recovery response, and decision date.</small><textarea id="review" rows="4"></textarea></label><label><strong>11. Danielle case consultation</strong><small>Redesign her outcome, scope, milestones, capacity, support, and review.</small><textarea id="danielle" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>Identify medical, clinical, legal, financial, safety, or technical needs beyond coaching.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
