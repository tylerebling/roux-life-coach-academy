 coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect define outcome and baseline to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate build milestones and actions into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use plan obstacles, support, and review to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_02.mp3", "image": "assets_scene_02.webp"}, {"kind": "teaching", "title": "Start with ownership—not technique", "kicker": "WHOSE GOAL IS THIS?", "body": ["Client desire", "External expectation", "Coach preference", "Chosen responsibility"], "narration": "A perfectly written goal is useless if the client does not own it. Clients may pursue what a partner, parent, employer, culture, or coach expects. The coach asks what the client genuinely wants, what responsibility they freely accept, and what consequence they understand. Coaching should never manipulate compliance.", "lenses": [{"insight": "Confirm that client desire belongs to the client rather than the coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect external expectation to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate coach preference into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use chosen responsibility to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_03.mp3", "image": "assets_scene_03.webp"}, {"kind": "teaching", "title": "Test goal integrity before planning", "kicker": "MEANING · COST · TIMING · FIT", "body": ["Why does it matter?", "What will it require?", "Why now?", "Does it fit this season?"], "narration": "Goal integrity asks whether the outcome connects to values, whether the client accepts the likely cost, whether timing makes sense, and whether the goal fits current health, responsibility, money, access, and energy. A goal can be worthwhile and still be wrong for this season or require a smaller form.", "lenses": [{"insight": "Confirm that why does it matter? belongs to the client rather than the coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect what will it require? to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate why now? into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use does it fit this season? to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_04.mp3", "image": "assets_scene_04.webp"}, {"kind": "teaching", "title": "Values make the goal worth living", "kicker": "OUTCOME AND WAY OF BEING", "body": ["What the client wants", "How they want to pursue it", "What must not be sacrificed", "Who they want to become through practice"], "narration": "Two clients may pursue the same outcome for different reasons. A promotion may express contribution for one and approval-seeking for another. Values shape both the destination and the manner of pursuit. The roadmap should protect health, integrity, family, learning, or other chosen values rather than postponing them until success.", "lenses": [{"insight": "Confirm that what the client wants belongs to the client rather than the coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect how they want to pursue it to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate what must not be sacrificed into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use who they want to become through practice to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_05.mp3", "image": "assets_scene_05.webp"}, {"kind": "question", "title": "Checkpoint 1 · Test ownership", "kicker": "INTERACTIVE COACHING DECISION", "prompt": "A client says, ‘My family expects me to become a lawyer, but I am not sure I want it.’ What should the coach do first?", "options": ["Build the law-school timeline", "Explore ownership, values, consequences, and alternatives before planning", "Convince the family"], "correct": 1, "feedback": ["Planning before ownership may strengthen the wrong goal.", "Correct. The client needs clarity before commitment.", "The coach should not manage the family through the client."], "narration": "Pause here and choose the response that best preserves client dignity, ownership, and coaching scope. A client says, ‘My family expects me to become a lawyer, but I am not sure I want it.’ What should the coach do first?", "audio": "audio_scene_06.mp3", "image": "assets_scene_06.webp"}, {"kind": "teaching", "title": "Separate outcome, process, and identity goals", "kicker": "THREE LEVELS OF CHANGE", "body": ["Outcome: what changes", "Process: what is practiced", "Identity: what evidence is built", "Each level needs different measures"], "narration": "An outcome goal might be completing a certification. A process goal might be studying four hours weekly. An identity direction might be becoming someone who follows through on learning commitments. Outcomes can depend on outside factors; processes are more controllable. Coaches help clients measure each without turning identity into a rigid label.", "lenses": [{"insight": "Confirm that outcome: what changes belongs to the client rather than the coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect process: what is practiced to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate identity: what evidence is built into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use each level needs different measures to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_07.mp3", "image": "assets_scene_07.webp"}, {"kind": "teaching", "title": "Define success in observable language", "kicker": "MAKE THE FINISH LINE DISCUSSABLE", "body": ["Specific result", "Relevant quality", "Time frame", "Evidence of completion"], "narration": "‘Be healthier,’ ‘find balance,’ or ‘grow my business’ may be meaningful but cannot yet guide action. The client defines what would be different, by how much, by when, and how they will know. The measure should serve learning, not create false precision or replace professional medical, financial, or legal advice.", "lenses": [{"insight": "Confirm that specific result belongs to the client rather than the coach, family, or culture.", "prompt": "Who wants this—and why now?"}, {"insight": "Connect relevant quality to observable evidence, values, and present reality.", "prompt": "What would make this meaningful and measurable?"}, {"insight": "Translate time frame into a step that fits actual capacity and constraints.", "prompt": "What can be completed in real life?"}, {"insight": "Use evidence of completion to create learning, support, and responsible revision rather than shame.", "prompt": "How will the client respond when the plan meets friction?"}], "audio": "audio_scene_08. const stage=document.getElementById('stage'),voice=document.getElementById('voice'),caption=document.getElementById('caption');
const PLAY_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.6v12.8L18.5 12 8 5.6Z"/></svg>';
const PAUSE_ICON='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
function setPlaybackControl(isPlaying){const button=document.getElementById('toggle');button.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;button.setAttribute('aria-label',isPlaying?'Pause narration':'Play narration')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nodeLabel(x){let clean=String(x);if(clean.includes('·'))return clean.split('·')[0].trim();if(clean.includes(':'))return clean.split(':')[0].trim();let words=clean.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);return words.slice(0,Math.min(4,words.length)).join(' ').toUpperCase()}
function teaching(s){let body=s.body||[];return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><article class="content"><div class="brand">ROUX LIFE ACADEMY · LESSON 15</div><div class="kicker">${esc(s.kicker)}</div><h1 class="title">${esc(s.title)}</h1><div class="rule"></div><div class="cards">${body.slice(0,4).map((x,i)=>`<button class="card" data-concept="${i}" aria-label="Explore concept ${i+1}"><span class="marker"></span><b>${esc(x)}</b></button>`).join('')}</div></article><aside class="diagram" aria-label="Coach application"><div class="diagram-inner"><section class="lens-panel"><span class="lens-label">COACH’S LENS</span><p class="lens-insight">Listen for the professional judgment beneath this concept.</p><p class="lens-support">Translate the idea into something the coach can notice and use.</p></section></div><div class="concept-focus"><span class="focus-label">TRY THIS IN SESSION</span><div class="focus-text">A practical coaching question will appear as the concept is introduced.</div></div></aside>`}
function legacy(s){return teaching(s)}
function quiz(s){answered=false;let answers=s.options.map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('');return `<div class="photo" style="background-image:url('${s.image}')"></div><div class="veil"></div><section class="question-panel"><div><div class="brand">ROUX LIFE ACADEMY · LESSON 15</div><div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="rule"></div><div class="prompt">${esc(s.prompt)}</div></div><div class="answers">${answers}<div class="feedback" id="feedback"></div><button class="continue" id="continue">Continue lesson →</button></div></section>`}
function activateConcept(i,s,manual=false){let cards=[...document.querySelectorAll('.card')];cards.forEach((el,j)=>{el.classList.toggle('revealed',j<=i);el.classList.toggle('is-active',j===i)});let lens=document.querySelector('.lens-panel'),insight=document.querySelector('.lens-insight'),focus=document.querySelector('.concept-focus'),text=document.querySelector('.focus-text'),data=s.lenses?.[i];if(lens&&insight&&focus&&text&&data&&lens.dataset.active!==String(i)){lens.dataset.active=String(i);lens.classList.remove('show');focus.classList.remove('show');requestAnimationFrame(()=>{insight.textContent=data.insight;text.textContent=data.prompt;lens.classList.add('show');focus.classList.add('show')})}if(manual){manualConcept=i;manualUntil=Date.now()+5000}}
function syncConcepts(forceAll=false){let s=scenes[index];if(!s||s.kind==='question'||!s.body?.length)return;if(Date.now()<manualUntil&&manualConcept>=0){activateConcept(manualConcept,s);return}let n=Math.min(4,s.body.length),ratio=voice.duration&&isFinite(voice.duration)?voice.currentTime/voice.duration:0,active=forceAll?n-1:Math.floor((ratio-.04)/(.84/n));active=Math.max(-1,Math.min(n-1,active));if(active>=0)activateConcept(active,s)}
function bindConceptCards(s){document.querySelectorAll('.card').forEach((card,i)=>card.onclick=()=>activateConcept(i,s,true))}
function render(autoplay=true){let s=scenes[index];manualConcept=-1;manualUntil=0;stage.querySelectorAll(':scope > :not(#start):not(#caption)').forEach(x=>x.remove());stage.insertAdjacentHTML('afterbegin',s.kind==='question'?quiz(s):(s.kind==='legacy'?legacy(s):teaching(s)));document.getElementById('counter').textContent=`${index+1} / ${scenes.length}`;document.getElementById('label').textContent=s.title||'Values-Based Goals and Practical Roadmaps';document.getElementById('fill').style.width=`${((index+1)/scenes.length)*100}%`;caption.textContent=s.narration||'';caption.classList.toggle('show',captionOn&&s.kind!=='question');voice.src=s.audio;voice.load();setPlaybackControl(false);if(s.kind==='question')bindAnswers(s);else bindConceptCards(s);if(autoplay)voice.play().then(()=>setPlaybackControl(true)).catch(()=>{})}
function bindAnswers(s){document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let i=Number(b.dataset.i),ok=i===s.correct;b.classList.add('selected',ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let f=document.getElementById('feedback'),detail=String(s.feedback[i]).replace(/^Correct\.\s*/,'');f.innerHTML=`<strong>${ok?'Correct':'Not quite'}.</strong> ${esc(detail)}`;f.classList.add('show');document.getElementById('continue').classList.add('show')});document.getElementById('continue').onclick=()=>advance()}
function advance(){if(index<scenes.length-1){index++;render(true)}else{voice.pause();localStorage.setItem('rouxLesson15PresentationComplete','true');window.location.href='LEARNING_LAB.html'}}
voice.ontimeupdate=()=>syncConcepts(false);voice.onloadedmetadata=()=>syncConcepts(false);
voice.onended=()=>{syncConcepts(true);setPlaybackControl(false);if(scenes[index].kind!=='question')setTimeout(advance,700)};
document.getElementById('begin').onclick=()=>{document.getElementById('start').remove();render(true)};
document.getElementById('toggle').onclick=()=>{if(voice.paused){voice.play();setPlaybackControl(true)}else{voice.pause();setPlaybackControl(false)}};
document.getElementById('next').onclick=()=>advance();document.getElementById('back').onclick=()=>{if(index>0){index--;render(true)}};
document.getElementById('captions').onclick=()=>{captionOn=!captionOn;caption.classList.toggle('show',captionOn&&scenes[index].kind!=='question')};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='ArrowLeft'&&index>0){index--;render(true)}if(e.key===' '){e.preventDefault();document.getElementById('toggle').click()}});
