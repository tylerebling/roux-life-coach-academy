<!doctype html><meta charset=utf-8><title>Lesson 12 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 12 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Prepare and Practice One Difficult Conversation</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Conflict pattern inventory</strong><small>Describe how you typically avoid, accommodate, attack, overexplain, withdraw, or falsely agree.</small><textarea id="pattern" rows="4"></textarea></label><label><strong>2. Observable facts</strong><small>List only what a camera or accurate record could capture.</small><textarea id="fact" rows="4"></textarea></label><label><strong>3. Meaning and assumptions</strong><small>What story did you add? What evidence supports or complicates it?</small><textarea id="story" rows="4"></textarea></label><label><strong>4. Feeling and impact</strong><small>Name emotion and practical impact without using either as proof of motive.</small><textarea id="feeling" rows="4"></textarea></label><label><strong>5. Need or value</strong><small>What reliability, respect, rest, inclusion, autonomy, safety, or connection matters?</small><textarea id="need" rows="4"></textarea></label><label><strong>6. Clean request</strong><small>Write one specific, observable, time-bound request that permits an honest response.</small><textarea id="request" rows="4"></textarea></label><label><strong>7. First-minute script</strong><small>Combine shared purpose, fact, impact, value, and request.</small><textarea id="opening" rows="4"></textarea></label><label><strong>8. Response rehearsal</strong><small>Prepare for yes, no, maybe, emotion, silence, and a counter-request.</small><textarea id="responses" rows="4"></textarea></label><label><strong>9. Pause language</strong><small>Write a respectful pause with a clear reason and return point.</small><textarea id="pause" rows="4"></textarea></label><label><strong>10. Repair plan</strong><small>Own behavior, acknowledge impact, offer repair, and name changed practice.</small><textarea id="repair" rows="4"></textarea></label><label><strong>11. Maya case consultation</strong><small>Map her facts, story, need, request, response plan, and client-owned boundary.</small><textarea id="maya" rows="4"></textarea></label><label><strong>12. Safety and referral threshold</strong><small>Identify power, abuse, danger, clinical, medical, legal, or crisis conditions that change the coaching plan.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
