<!doctype html><meta charset=utf-8><title>Lesson 6 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 6 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Design a Real-Life Courage Practice</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. The real-life situation</strong><small>Choose a manageable, nonclinical situation where a value needs expression.</small><textarea id="situation" rows="4"></textarea></label><label><strong>2. Observable facts</strong><small>What would a camera or neutral record show?</small><textarea id="facts" rows="4"></textarea></label><label><strong>3. Value at stake</strong><small>What quality of living or relationship matters here?</small><textarea id="value" rows="4"></textarea></label><label><strong>4. Feared outcome</strong><small>What do you predict may happen? Separate possibility from certainty.</small><textarea id="fear" rows="4"></textarea></label><label><strong>5. Genuine choices</strong><small>List at least three: act, wait, gather information, request, decline, set a boundary, or seek support.</small><textarea id="choices" rows="4"></textarea></label><label><strong>6. Courage range</strong><small>Design a small, moderate, and stretch version.</small><textarea id="range" rows="4"></textarea></label><label><strong>7. Context and power</strong><small>What practical, cultural, relational, financial, or safety consequences matter?</small><textarea id="power" rows="4"></textarea></label><label><strong>8. Support and safeguards</strong><small>What preparation, person, resource, timing, or recovery plan would help?</small><textarea id="support" rows="4"></textarea></label><label><strong>9. Communication plan</strong><small>Write the observation, impact, value or need, and specific request.</small><textarea id="words" rows="4"></textarea></label><label><strong>10. Client-owned boundary</strong><small>What will you do if a limit is crossed or the pattern continues?</small><textarea id="boundary" rows="4"></textarea></label><label><strong>11. Chosen action</strong><small>What will you do, when, and how will you know it is complete?</small><textarea id="action" rows="4"></textarea></label><label><strong>12. Evidence review</strong><small>Afterward, record action, response, impact, learning, and next choice.</small><textarea id="review" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
