<!doctype html><meta charset=utf-8><title>Lesson 10 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 10 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build a Clear, Connected, and Boundaried Conversation</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Five-layer listening map</strong><small>Record the words, emotion, meaning, need, and possible request.</small><textarea id="layers" rows="4"></textarea></label><label><strong>2. Useful session focus</strong><small>What would the client like to understand, decide, prepare, or practice?</small><textarea id="focus" rows="4"></textarea></label><label><strong>3. Connection bid</strong><small>Identify one bid, the response, and the meaning assigned to it.</small><textarea id="bid" rows="4"></textarea></label><label><strong>4. Need and strategies</strong><small>Name the need and at least three possible strategies.</small><textarea id="need" rows="4"></textarea></label><label><strong>5. Defensiveness cycle</strong><small>Map trigger, identity threat, protective move, payoff, and cost.</small><textarea id="defense" rows="4"></textarea></label><label><strong>6. Regulation and return plan</strong><small>Choose an activation signal, pause practice, and return time.</small><textarea id="regulate" rows="4"></textarea></label><label><strong>7. Observation rewrite</strong><small>Convert one accusation into camera-level behavior.</small><textarea id="observe" rows="4"></textarea></label><label><strong>8. Roux clear request</strong><small>Write observation, experience, value or need, and a specific request.</small><textarea id="request" rows="4"></textarea></label><label><strong>9. Self-owned boundary</strong><small>Name the condition, your action, and how you will follow through calmly.</small><textarea id="boundary" rows="4"></textarea></label><label><strong>10. Repair plan</strong><small>Write acknowledgment, ownership, requested repair, and changed behavior.</small><textarea id="repair" rows="4"></textarea></label><label><strong>11. Elena case consultation</strong><small>Design Elena&#x27;s next ten minutes of coaching and one communication experiment.</small><textarea id="elena" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>List the safety, clinical, medical, legal, abuse, or emergency signs that stop ordinary coaching.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
