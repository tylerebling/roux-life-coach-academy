<!doctype html><meta charset=utf-8><title>Lesson 13 Workbook</title><style>body{max-width:1000px;margin:40px auto;font:17px Arial}textarea{width:100%;min-height:100px}label{display:block;margin:25px 0}</style><h1>Lesson 13 Workbook</h1><section id=workbook><div class="eyebrow">GUIDED WORKBOOK</div><h2>Build Your Transition Map and Next-Step Plan</h2><p>Your work saves in this browser. Choose a manageable, nonclinical example.</p><div class="grid"><label><strong>1. Four-part change inventory</strong><small>List what ended, began, remained, and is still unknown.</small><textarea id="inventory" rows="4"></textarea></label><label><strong>2. Visible and invisible loss</strong><small>Name roles, routines, places, relationships, imagined futures, and identity changes.</small><textarea id="loss" rows="4"></textarea></label><label><strong>3. Both truths</strong><small>What opportunity, relief, pain, gratitude, fear, or grief coexist?</small><textarea id="both" rows="4"></textarea></label><label><strong>4. Identity continuity</strong><small>Which qualities, values, skills, and relationships remain yours?</small><textarea id="identity" rows="4"></textarea></label><label><strong>5. Uncertainty story</strong><small>Name the feared prediction and evidence that supports or complicates it.</small><textarea id="prediction" rows="4"></textarea></label><label><strong>6. Four uncertainty circles</strong><small>Sort control, influence, preparation, and what must be tolerated.</small><textarea id="circles" rows="4"></textarea></label><label><strong>7. Decision horizon</strong><small>What does today, this week, and the next review date require?</small><textarea id="horizon" rows="4"></textarea></label><label><strong>8. Portable values</strong><small>Choose two values and one behavior that demonstrates each.</small><textarea id="anchor" rows="4"></textarea></label><label><strong>9. Temporary structure</strong><small>Design one daily anchor, three priorities, and a weekly review.</small><textarea id="structure" rows="4"></textarea></label><label><strong>10. Identity experiment</strong><small>Choose a small action, evidence to observe, and a review date.</small><textarea id="experiment" rows="4"></textarea></label><label><strong>11. Elena case consultation</strong><small>Map her gains, losses, continuity, uncertainty circles, support, and experiments.</small><textarea id="elena" rows="4"></textarea></label><label><strong>12. Referral threshold</strong><small>Identify grief, trauma, safety, impairment, substance, medical, or psychiatric concerns beyond coaching.</small><textarea id="scope" rows="4"></textarea></label></div><p><button onclick="saveWork()">Save workbook</button><button onclick="window.print()">Print / Save PDF</button></p></section>
